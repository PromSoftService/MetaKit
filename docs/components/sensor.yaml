component: Sensor
status: complete

intro: >-
  Sensor преобразует значение аналогового входа ПЛК в понятную инженерную
  величину: давление, температуру, уровень, расход или другой непрерывный
  параметр. Компонент также контролирует исправность сигнала и сглаживает
  измерение перед передачей на HMI или в регулятор.

use_cases:
  - Датчик 4–20 мА или 0–10 В подключён к аналоговому входу ПЛК.
  - Аналоговый модуль возвращает число в собственной шкале, а проекту нужны бары, градусы, проценты или м³/ч.
  - Нужно обнаруживать ошибку канала, обрыв или выход электрического сигнала за допустимые границы.
  - Значение датчика шумит и перед отображением или регулированием его нужно усреднить.

not_for:
  - Дискретные датчики и концевые выключатели — для них не требуется аналоговое масштабирование.
  - Быстродействующие защиты, которым нельзя ждать усреднения; для защиты используйте исходное или отдельно обработанное значение.
  - Сигналы, уже полностью преобразованные другим компонентом, если не нужны коррекция, диагностика и фильтрация Sensor.

how_it_works:
  - title: 1. Значение ПЛК — Raw
    text: >-
      Raw — число, полученное от аналогового модуля. Например, вход 0–20 мА
      может возвращать значения от 0 до 10000. Для датчика 4–20 мА рабочему
      диапазону тогда соответствуют примерно 2000–10000.
  - title: 2. Электрическая величина — EV
    text: >-
      Компонент переводит Raw в электрическую шкалу датчика. Для токового
      датчика это обычно 4–20 мА, для датчика напряжения — 0–10 В. По EV
      контролируются обрыв и недопустимо высокий сигнал.
  - title: 3. Физическая величина — FV
    text: >-
      Затем EV переводится в инженерную шкалу. Например, 4–20 мА могут
      соответствовать давлению 0–10 бар. После дополнительной коррекции
      результат поступает в фильтр и становится итоговым значением компонента.

quick_start:
  - Задайте уникальный SensId и понятный SensComment.
  - В Raw укажите REAL-переменную, содержащую текущее значение аналогового входа.
  - Укажите границы Raw, которые соответствуют нижней и верхней границам электрического сигнала.
  - Задайте электрическую шкалу EV и паспортную физическую шкалу FV датчика.
  - Подключите ChErr к сигналу диагностики аналогового канала, если модуль его предоставляет.
  - Настройте границы контроля сигнала и фильтрацию, затем используйте отфильтрованное значение и обязательно учитывайте ошибку датчика.

examples:
  - title: Датчик давления 4–20 мА, 0–10 бар
    scenario: >-
      Аналоговый вход ПЛК имеет шкалу 0–10000 для сигнала 0–20 мА. Поэтому
      4 мА соответствуют значению 2000, а 20 мА — 10000. Датчик измеряет
      давление от 0 до 10 бар.
    parameters:
      - [SensId, PT101, Префикс всех тегов датчика]
      - [Raw, AI_PT101, REAL-переменная аналогового входа]
      - [SensComment, Давление в напорном коллекторе, Текст для HMI и сообщения]
      - [SensRawMin, '2000.0', Значение АЦП при 4 мА]
      - [SensRawMax, '10000.0', Значение АЦП при 20 мА]
      - [SensEVMin, '4.0', Нижняя точка электрической шкалы]
      - [SensEVMax, '20.0', Верхняя точка электрической шкалы]
      - [SensFVXMin, '4.0', 4 мА соответствует нижней точке давления]
      - [SensFVXMax, '20.0', 20 мА соответствует верхней точке давления]
      - [SensFVYMin, '0.0', Нижняя граница — 0 бар]
      - [SensFVYMax, '10.0', Верхняя граница — 10 бар]
      - [SensEVLL, '3.0', Ниже 3 мА считаем обрывом]
      - [SensEVHH, '21.0', Выше 21 мА считаем неисправностью]
      - [SensLimitFilterTime, '3', Ошибка должна сохраняться 3 секунды]
      - [SensFilterPeriod, '1', Брать одно значение каждую секунду]
      - [SensFilterCount, '3', Усреднять три последних значения]
    result: >-
      При Raw = 6000 компонент получает EV = 12 мА и FV = 5 бар. На HMI
      передаётся сглаженное значение. При сигнале ниже 3 мА или выше 21 мА
      после заданной задержки формируется предупреждение об ошибке датчика.

  - title: Температура уже приходит в десятых долях градуса
    scenario: >-
      Модуль возвращает 235 для температуры 23,5 °C. Двухступенчатое
      масштабирование не требуется: достаточно коэффициента 0,1.
    parameters:
      - [SensId, TT201, Префикс тегов температуры]
      - [Raw, AI_TT201, REAL-переменная со значением 235]
      - [SensComment, Температура обратной воды, Текст для HMI]
      - [SensEnScale, 'false', Отключить Raw → EV → FV]
      - [SensK, '0.1', Преобразовать десятые доли в градусы]
      - [SensAdd, '0.0', Дополнительное смещение не требуется]
    result: >-
      Компонент формирует 23,5 °C. Диагностика ChErr и последующая фильтрация
      продолжают работать независимо от отключённого масштабирования.

parameters:
  $Sensor:
    description: Название функционального блока внутри компонента. Используется в автоматически сформированных комментариях.
    example: Датчик аналоговый
  SensId:
    description: Уникальный идентификатор датчика и префикс создаваемых тегов. Используйте короткое устойчивое обозначение по проекту или KKS.
    example: PT101
  Raw:
    description: REAL-переменная с текущим значением аналогового входа. Это источник измерения, а не номер аппаратного канала.
    example: AI_PT101
  SensComment:
    description: Понятное человеку название измерения. Попадает в комментарии тегов и текст предупреждения.
    example: Давление в напорном коллекторе
  SensRawMin:
    description: Значение АЦП, которое соответствует SensEVMin. Для входа 0–10000 и датчика 4–20 мА укажите 2000.
    example: '2000.0'
  SensRawMax:
    description: Значение АЦП, которое соответствует SensEVMax. Для входа 0–10000 и верхней точки 20 мА укажите 10000.
    example: '10000.0'
  SensEVMin:
    description: Нижняя граница электрического сигнала датчика, соответствующая SensRawMin; обычно 4 мА или 0 В.
    example: '4.0'
  SensEVMax:
    description: Верхняя граница электрического сигнала датчика, соответствующая SensRawMax; обычно 20 мА или 10 В.
    example: '20.0'
  SensEVZP:
    description: Порог электрического сигнала, ниже которого итоговое физическое значение принудительно заменяется на SensFVZP.
    example: '4.0'
  SensFVZP:
    description: Безопасное или нулевое физическое значение при ошибке датчика и при EV ниже SensEVZP.
    example: '0.0'
  SensFVXMin:
    description: Нижняя электрическая точка для преобразования EV в физическую величину. Может быть уточнена калибровкой с HMI.
    example: '4.0'
  SensFVXMax:
    description: Верхняя электрическая точка для преобразования EV в физическую величину. Может быть уточнена калибровкой с HMI.
    example: '20.0'
  SensFVYMin:
    description: Физическое значение, соответствующее SensFVXMin; например 0 бар или −50 °C.
    example: '0.0'
  SensFVYMax:
    description: Физическое значение, соответствующее SensFVXMax; например 10 бар или 150 °C.
    example: '10.0'
  SensFVLimit:
    description: Ограничивать рассчитанное значение диапазоном SensFVYMin…SensFVYMax. Включайте, если выход за паспортную шкалу не должен отображаться.
    example: 'true'
  SensEnScale:
    description: Включает преобразование Raw → EV → FV. Отключите, если модуль уже возвращает инженерное значение и нужны только K, Add, диагностика и фильтр.
    example: 'true'
  SensK:
    description: Множитель финальной коррекции. После масштабирования значение умножается на SensK.
    example: '1.0'
  SensAdd:
    description: Смещение финальной коррекции, прибавляемое после умножения на SensK.
    example: '0.0'
  ChErr:
    description: Булево выражение ошибки аппаратного аналогового канала. Если отдельной диагностики нет, оставьте FALSE.
    example: AI_PT101_ERROR
  SensChannelBypass:
    description: Отключает учёт ChErr. Используйте только когда диагностика канала отсутствует или временно выведена из работы.
    example: 'false'
  SensEVLL:
    description: Нижняя диагностическая граница EV. Для датчика 4–20 мА обычно задают около 3 мА для обнаружения обрыва.
    example: '3.0'
  SensEVHH:
    description: Верхняя диагностическая граница EV. Для датчика 4–20 мА обычно задают около 21 мА.
    example: '21.0'
  SensLimitBypass:
    description: Отключает контроль SensEVLL и SensEVHH. FALSE означает, что контроль электрических границ включён.
    example: 'false'
  SensLimitFilterTime:
    description: Сколько секунд EV должен непрерывно находиться за аварийной границей до фиксации ошибки.
    example: '3'
  SensAutoReset:
    description: Автоматически снимать ошибку после восстановления сигнала. При FALSE потребуется общий сброс аварий.
    example: 'true'
  SensFilterPeriod:
    description: Интервал в секундах между выборками для скользящего среднего.
    example: '1'
  SensFilterCount:
    description: Количество последних выборок в среднем. Чем больше значение, тем спокойнее показание и тем медленнее реакция.
    example: '3'

hmi:
  default:
    - name: Измеренное значение
      source: '|SensId|_SensFilter_Inst.out_fY'
      storage: View + Trend
      description: Итоговое сглаженное значение в физической шкале. Это основной тег для экрана и обычного регулирования.
    - name: Электрическое значение
      source: '|SensId|_Sensor_Inst.out_fEV'
      storage: View
      description: Рассчитанный ток или напряжение. Полезно при диагностике и наладке датчика.
    - name: Ошибка датчика
      source: '|SensId|_Sensor_Inst.out_bError'
      storage: View + Wrn
      description: Общий признак ошибки канала или выхода EV за допустимые границы. По умолчанию формирует предупреждение.
    - name: Калибровка нижней точки
      source: '|SensId|_Sensor_Inst.inout_bCalibrateFV_fXMin'
      storage: View
      description: Команда с HMI записать текущее EV в SensFVXMin.
    - name: Калибровка верхней точки
      source: '|SensId|_Sensor_Inst.inout_bCalibrateFV_fXMax'
      storage: View
      description: Команда с HMI записать текущее EV в SensFVXMax.
  settings_note: >-
    Все строки Conf компонента имеют HMI = 1. Поэтому операторская система
    получает настройки шкал, коррекции, диагностики и фильтра. Права на их
    изменение должны определяться проектом HMI.
  optional:
    - name: Физическое значение до фильтра
      source: '|SensId|_Sensor_Inst.out_fFV'
      description: Полезно для быстрой диагностики или защит, которым не подходит задержка скользящего среднего.
    - name: Ошибка аппаратного канала
      source: '|SensId|_Sensor_Inst.out_Channel_bError'
      description: Позволяет отличить ChErr модуля от ошибки по электрическим границам.
    - name: Нижняя электрическая граница
      source: '|SensId|_Sensor_Inst.out_FV_bLL'
      description: Показывает, что EV ниже SensEVLL; обычно трактуется как обрыв.
    - name: Верхняя электрическая граница
      source: '|SensId|_Sensor_Inst.out_FV_bHH'
      description: Показывает, что EV выше SensEVHH; обычно трактуется как неисправность или превышение диапазона.

diagnostics:
  - level: Предупреждение
    signal: '|SensId|_Sensor_Inst.out_bError'
    message: '<SensComment>. Датчик аналоговый. Ошибка датчика'
    condition: Ошибка аппаратного канала либо EV ниже SensEVLL или выше SensEVHH после заданной выдержки.
    reset: Автоматически при SensAutoReset = true; иначе общим сбросом после устранения причины.
  - level: Технологические границы
    signal: SensLim
    message: Настраивается отдельным Sys-компонентом SensLim
    condition: LL, L, H и HH по физическому значению измерения.
    reset: Не создаются компонентом Sensor автоматически; добавляйте SensLim только когда это требуется техническим заданием.

common_mistakes:
  - Использовать шкалу всего модуля 0–10000 как SensRawMin/SensRawMax для датчика 4–20 мА. Если 0 соответствует 0 мА, нижняя рабочая точка 4 мА будет около 2000.
  - Передавать в регулятор только значение и не учитывать out_bError. При ошибке Sensor выдаёт SensFVZP, и регулятор может принять это безопасное значение за реальное измерение.
  - Ставить слишком большое SensFilterCount в быстром контуре. Показание станет плавным, но реакция заметно запоздает.
  - Путать диагностические границы EV с технологическими пределами давления или температуры. EV контролирует исправность электрического сигнала, а технологические LL/L/H/HH задаются через SensLim.
  - Оставлять SensLimitBypass = false при неприменимых границах 3 и 21 для сигнала другого типа. Для 0–10 В задайте соответствующие границы либо отключите контроль.
