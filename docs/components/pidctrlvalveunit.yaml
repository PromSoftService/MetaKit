component: PidCtrlValveUnit
slug: pidctrlvalveunit
source: yaml/UnitsTmpls/PidCtrlValveUnit.yaml
kind: Unit
title: Регулирующий клапан с PID
category: Готовые контуры
summary: Поддерживает давление, температуру или уровень аналоговым клапаном с собственным PID и ручным заданием
  положения.
description: 'PidCtrlValveUnit — готовая связка CControlValve, CPID, аналогового выхода, CascadeUnit и сообщений.
  CControlValve выбирает режим и разрешает регулирование; PID получает сглаженное измерение Sensor и вычисляет
  положение. В Auto контур следует StartCmd и поддерживает уставку. При переходе в Manual клапан разрешает
  регулирование сразу, PID автоматически переходит в ручной режим, а оператор вводит положение числом. Ошибка
  Sensor, потеря питания и общий экстренный останов передаются в блокировку CControlValve; Manual их не
  отменяет. Концевики здесь информационные: компонент не контролирует физическое время хода как CValve.'
use_cases:
- Клапан с позиционером 4–20 мА должен поддерживать технологическую величину по Sensor.
- Оператору нужно задавать положение вручную без отдельного включения клапана, а при возврате в Auto передавать
  управление собственному PID.
not_for:
- Клапан принимает две дискретные команды движения — используйте PiddValveUnit.
- Положение уже рассчитывается внешним алгоритмом и собственный PID не нужен.
- 'Нужна диагностика незавершённого хода по концевикам: CControlValve не выполняет эти проверки.'
diagram:
  lanes:
  - - Sensor PT101
    - Собственный PID
    - Шкала OUT
    - AO клапана
  - - StartCmd / режим
    - CControlValve
    - Разрешение PID
  - - Manual клапана
    - Ручной режим PID
    - 'HMI положения

      задание оператора'
  - - PID.out_fYS
    - 'HMI регулирования

      итоговое задание'
  - - Ошибка Sensor / питание
    - Запрет CControlValve
    - HMI блокировки
  - - Фильтр аварий
    - HMI аварий
  - - Фильтр предупреждений
    - HMI предупреждений
application:
  intro: Клапан подпитки CV101 поддерживает 3 бар по Sensor PT101. Позиционер принимает 4–20 мА, модуль
    AO использует код 0–10000 на 0–20 мА. Подключите готовый Sensor и свой AO_CV101, затем согласуйте диапазоны
    ниже.
  result: В Auto PID рассчитывает положение. В Manual оператор задаёт, например, 35 % через PID.inout_fYManual;
    отдельного пуска CControlValve не требуется. Фактический процент открытия подтверждается только отдельной
    обратной связью, не out_bState.
parameter_groups:
- title: Назовите контур и выберите родителя
  intro: В проекте уже должен быть CabinetController, отдельно или внутри General. Этот Unit содержит
    собственные CControlValve, PID, аналоговый выход и группы сообщений; Sensor подключается отдельно.
  items:
  - key: Id
    default: _ID_
    example: CV101
    description: Уникальное имя всего контура, например CV101. По нему создаются CtrlValve, CascadeUnit,
      две группы сообщений и индивидуальные настройки AO.
  - key: Comment
    default: Комментарий
    example: Клапан подпитки
    description: Понятное название контура, например «Клапан подпитки». Используется для подписей внутренних
      блоков и выходного сигнала.
  - key: Parent
    default: CabinetController_Inst
    example: CabinetController_Inst
    description: Имя CabinetController или вышестоящего CascadeUnit. Отсюда берутся питание, экстренный
      останов, сброс аварий и наработки. Автоматическую команду StartCmd задайте отдельно.
- title: Подключите запрос автоматической работы
  intro: 'В примере подпитка разрешена при запущенном шкафе и запросе bMakeupDemand. Manual не требует отдельного
    пуска клапана: оператор выбирает режим и задаёт положение числом.'
  items:
  - key: StartCmd
    default: 'false'
    example: CabinetController_Inst.out_bWorkAndPower AND bMakeupDemand
    description: Запрос автоматического регулирования. TRUE разрешает работу собственного PID через CControlValve;
      FALSE снимает автоматическое разрешение. В Manual клапан включается самим выбором режима, а положение
      задаёт оператор через PID.
- title: Подключите выбор режима
  intro: При разрешённом Remote оператор выбирает Auto или Manual. В Manual запрос CControlValve включается
    сразу, а PID автоматически переходит на числовое задание оператора. Отдельная кнопка ручного включения
    для этого не нужна.
  items:
  - key: $CtrlValve
    default: Регулирующий клапан
    example: Регулирующий клапан
    description: Подпись внутреннего блока режимов и разрешения. Сам CControlValve не рассчитывает аналоговое
      положение.
  - key: CtrlValveLocal
    default: 'false'
    example: DI_CV101_LOCAL
    description: Сигнал аппаратного выбора Local. Он имеет приоритет над дистанционным режимом. Этот Unit
      не создаёт местный пост и не подключает местное аналоговое задание.
  - key: CtrlValveRemote
    default: 'true'
    example: DI_CV101_REMOTE
    description: Разрешение дистанционного управления. При TRUE и отсутствии Local режим Auto/Manual выбирается
      с HMI.
- title: Укажите имеющиеся концевики
  intro: Если позиционер не выдаёт крайние контакты, передайте false. В текущем CControlValve эти входы
    информационные и не контролируют время движения.
  items:
  - key: CtrlValveStateOpen
    default: _DI_
    example: 'false'
    description: Информационный концевик полностью открытого положения. В текущем CControlValve он не участвует
      в контроле движения, времени хода или разрешении регулирования. При отсутствии контакта можно передать
      false.
  - key: CtrlValveStateClose
    default: _DI_
    example: 'false'
    description: Информационный концевик полностью закрытого положения. Он не превращает CControlValve в
      отсечной CValve с контролем полного хода. При отсутствии контакта можно передать false.
- title: Оставьте неиспользуемые поля конфигурации пустыми
  intro: В актуальном файле поля CtrlValveConf остались без соответствующих настроек. Они не выбирают шкалу
    AO и не создают параметров положения.
  items:
  - key: CtrlValveConf
    default: ''
    example: ''
    description: 'В актуальном файле это поле присутствует, но в таблице данных и вызове CControlValve не
      используется: собственных конфигурационных настроек CControlValve здесь нет. Оставьте пустым; шкала
      выхода выбирается через OutConf.'
  - key: CtrlValveConfComment
    default: ''
    example: ''
    description: В актуальном шаблоне не используется для создаваемых настроек. Оставьте пустым; комментарии
      AO задаются отдельно.
- title: Определите данные для верхнего каскада
  intro: Готовность, режим, состояние разрешения, внешняя авария и наработка уже передаются из собственного
    CControlValve. Числовое состояние — «неизвестно», поскольку этот ФБ не измеряет физическое положение.
  items:
  - key: $CasUnit
    default: Элемент каскада
    example: Элемент каскада
    description: Подпись уже встроенного интерфейса агрегата. Импортировать второй CascadeUnit в этот контур
      не нужно.
  - key: Power
    default: '0.0'
    example: '0.0'
    description: Мощность/производительность для верхнего каскада, не положение, отправляемое на AO. Оставьте
      0.0, если контроль мощности верхнего Cascade выключен.
- title: Подключите технологический датчик
  intro: Для подпитки Sensor PT101 уже должен выдавать давление в барах. Ошибка измерения запрещает CControlValve
    независимо от Auto/Manual; ручной режим не отменяет эту защиту.
  items:
  - key: $PID
    default: Регулятор
    example: Регулятор
    description: Подпись собственного аналогового регулятора. Именно CPID рассчитывает положение клапана;
      CControlValve ведёт режимы и разрешение.
  - key: SensId
    default: _ID_
    example: PT101
    description: Id существующего Sensor, например PT101. Unit получает его сглаженное физическое измерение
      и ошибку. Ошибка подаётся в экстренный останов CControlValve и снимает разрешение PID, не только создаёт
      сообщение.
- title: Выберите настройки своего PID
  intro: Пустые поля создают индивидуальный набор CV101. Задайте уставку и коэффициенты ниже; ручной режим
    PID уже связан с CControlValve и не требует отдельной команды в параметрах.
  items:
  - key: PIDConf
    default: ''
    example: ''
    description: 'Необязательное имя общих настроек PID. Пусто — настройки по Id Unit. Оно не выбирает электрическую
      шкалу AO: для неё есть отдельный OutConf.'
  - key: PIDConfComment
    default: ''
    example: ''
    description: Понятная подпись общих настроек регулятора. При пустом поле используются Comment Unit и
      $PID. Для одного общего PIDConf значения настроек и комментарий должны быть одинаковыми.
- title: Подключите аналоговый выход
  intro: В AO преобразуется итоговый PID.out_fYS. Инженерная шкала берётся из PID_fYMin/Max, электрическая
    — из отдельного OUT. В примере 0–20 мА кодируются числами 0–10000, а приводу нужны 4–20 мА. Проверьте
    шкалу своего модуля.
  items:
  - key: $Out
    default: Аналоговый выход
    example: Аналоговый выход
    description: Подпись отдельной группы аналогового выхода. Она отделяет электрическую шкалу выходного
      модуля от технологического задания.
  - key: OutRaw
    default: _AO_
    example: AO_CV101
    description: Имя выходной переменной аналогового канала, например AO_CV101. В текущем шаблоне результат
      преобразуется REAL_TO_INT и записывается сюда как целое число. Это не номер канала и не измеренный
      ток.
  - key: OutRawMin
    default: ADC_4_IN_0_20
    example: '2000.0'
    description: Код выходного модуля для нижней точки электрического сигнала. Если модуль выдаёт 0–20 мА
      при коде 0–10000, для нижних 4 мА укажите 2000.0. Начальное значение попадает в настройку OUT_fRawMin,
      которую можно менять с HMI.
  - key: OutRawMax
    default: ADC_MAX_VALUE
    example: '10000.0'
    description: Код модуля для верхней точки электрического сигнала. В том же примере 20 мА соответствуют
      10000.0. Не вводите 20 вместо 10000, если выходной канал ожидает код, а не миллиамперы.
- title: Выберите индивидуальную или общую шкалу AO
  intro: Для одного привода оставьте поля пустыми. Совместно используйте только действительно одинаковые
    электрические шкалы; физическая переменная OutRaw у каждого привода остаётся своя.
  items:
  - key: OutConf
    default: ''
    example: ''
    description: Необязательное имя общего набора электрических настроек AO. Пусто — настройки по Id Unit.
      Для общего имени должны совпадать OutRawMin/Max и комментарий. Не зависит от PIDConf, EngConf или
      CtrlValveConf.
  - key: OutConfComment
    default: ''
    example: ''
    description: Понятная подпись общих настроек AO. Пусто — Comment агрегата и $Out. Для одинакового OutConf
      используйте одинаковый комментарий и одинаковые начальные значения шкалы.
- title: Подключите внешнюю аварию
  intro: Встроенный фильтр аварий уже подключён к внешней аварии механизма. Ниже канал 1; каналы 2–8 заполняются
    аналогично. Для каждого можно задать задержку и шунт в настройках.
  items:
  - key: $Flts
    default: Аварии
    example: Аварии
    description: 'Подпись группы в комментариях к коду. Категория сообщений уже задана шаблоном: Flt для
      аварий, Wrn для предупреждений.'
  - key: FltComment
    default: аварии
    example: Клапан CV101
    description: Общий контекст сообщений этой группы, например «Клапан CV101». Внешние причины используют
      это поле и текст своей строки, поэтому не оставляйте всем агрегатам безликое «аварии».
  - key: FltId1
    default: _ID_
    example: DRIVE_FAULT
    description: Короткое имя первой причины. Для других мест используются такие же поля с номерами 2–8.
      Пустой Id исключает соответствующий канал и его настройки; неиспользуемые идентификаторы нужно очистить.
  - key: FltComment1
    default: авария
    example: Неисправность привода
    description: Текст, объясняющий оператору конкретную причину, а не имя входа ПЛК. Он добавляется к общему
      комментарию группы.
  - key: FltIn1
    default: _DI_
    example: DI_CV101_FAULT
    description: 'BOOL-сигнал или выражение: TRUE означает активную причину. Проверьте полярность контакта.
      Для остальных каналов задаются независимые сигналы.'
- title: Задайте контроль и сброс аварии
  intro: Для неисправности привода контроль постоянный, а снятие — после устранения причины и общего сброса
    Unit. Экстренный останов не следует заменять задержанной аварией фильтра.
  items:
  - key: FltEnable1
    default: 'true'
    example: 'true'
    description: Когда проверять именно эту причину. true — постоянно; условие процесса ограничивает контроль
      нужным этапом. Это не разрешение всего Unit.
  - key: FltAutoReset1
    default: 'false'
    example: 'false'
    description: false сохраняет сработавшую причину до устранения неисправности и сброса. true позволяет
      снять её автоматически после исчезновения входного условия.
- title: Добавьте предупреждение без останова
  intro: Встроенный фильтр предупреждений формирует сообщения, но его общий выход не включён в останов механизма.
    В примере сообщаем о необходимости обслуживания. Неиспользуемые места 2–8 исключите пустыми Id.
  items:
  - key: $Wrns
    default: Предупреждения
    example: Предупреждения
    description: 'Подпись группы в комментариях к коду. Категория сообщений уже задана шаблоном: Flt для
      аварий, Wrn для предупреждений.'
  - key: WrnComment
    default: предупреждения
    example: Клапан CV101
    description: Общий контекст сообщений этой группы, например «Клапан CV101». Внешние причины используют
      это поле и текст своей строки, поэтому не оставляйте всем агрегатам безликое «предупреждения».
  - key: WrnId1
    default: _ID_
    example: SERVICE
    description: Короткое имя первой причины. Для других мест используются такие же поля с номерами 2–8.
      Пустой Id исключает соответствующий канал и его настройки; неиспользуемые идентификаторы нужно очистить.
  - key: WrnComment1
    default: предупреждение
    example: Требуется обслуживание
    description: Текст, объясняющий оператору конкретную причину, а не имя входа ПЛК. Он добавляется к общему
      комментарию группы.
  - key: WrnIn1
    default: _DI_
    example: bCV101MaintenanceDue
    description: 'BOOL-сигнал или выражение: TRUE означает активную причину. Проверьте полярность контакта.
      Для остальных каналов задаются независимые сигналы.'
- title: Задайте контроль и сброс предупреждения
  intro: Пусть сообщение об обслуживании исчезает после того, как внешняя логика снимет bMaintenanceDue.
    Для канала в примере задержка равна нулю, шунт выключен.
  items:
  - key: WrnEnable1
    default: 'true'
    example: 'true'
    description: Когда проверять именно эту причину. true — постоянно; условие процесса ограничивает контроль
      нужным этапом. Это не разрешение всего Unit.
  - key: WrnAutoReset1
    default: 'true'
    example: 'true'
    description: true снимает предупреждение после исчезновения причины. false оставляет его до сброса.
      Этот выбор не превращает предупреждение в аварийную блокировку.
example:
  title: Подпитка 3 бар и ручное положение 35 %
  scenario: Задайте SP = 3.0 бар, YMin = 0.0 и YMax = 100.0. Для приведённого модуля OutRawMin = 2000.0,
    OutRawMax = 10000.0. Ti оставьте 0.0 по реализации CPID; Kp, Td, DB и SR настройте на процессе. В Manual
    установите ручное задание 35.0.
  result: В принятой шкале 35 % дают код AO 4800, то есть 9,6 мА. Это электрическое задание, не измеренное
    положение клапана. При снятом автоматическом разрешении предусмотрено PID_fOffValue; его физический
    смысл следует согласовать с позиционером. Ошибка Sensor снимает разрешение PID через CControlValve и
    запрещает работу независимо от режима.
settings:
- key: …_PID_fSP
  default: '0.0'
  description: 'Значение, которое нужно поддерживать: например 4.5 бар или 70 °C. Единицы должны совпадать
    с измерением Sensor; сюда не вводят процент открытия клапана.'
- key: …_PID_fDB
  default: '0.0'
  description: Небольшое допустимое отклонение около уставки в единицах измерения. Помогает не реагировать
    на мелкий шум; слишком широкая зона ухудшает точность.
- key: …_PID_fSR
  default: '3.0'
  description: Период пересчёта регулятора, секунды. Это не период задачи ПЛК. Выбирайте с учётом быстродействия
    процесса и задержки фильтра Sensor.
- key: …_PID_fKp
  default: '1.0'
  description: Насколько сильно изменять управление при ошибке измерения. Больший модуль даёт более резкую
    реакцию; слишком большое усиление вызывает колебания. Настраивается на реальном процессе.
- key: …_PID_fTi
  default: '0.0'
  description: 'Параметр классической интегральной части. Руководство текущего CPID требует оставить 0.0:
    конечный выход out_fYS уже накапливает регулирующее воздействие.'
- key: …_PID_fTd
  default: '0.0'
  description: Усиление реакции на скорость изменения ошибки через дифференциальное время, секунды. 0.0
    отключает эту часть. Шумный датчик делает слишком большую настройку нежелательной.
- key: …_PID_fYMin
  default: '0.0'
  description: Нижняя инженерная точка выхода, обычно 0 %. Она соответствует минимальному электрическому
    сигналу секции аналогового выхода.
- key: …_PID_fYMax
  default: '100.0'
  description: Верхняя инженерная точка выхода, обычно 100 %. Она соответствует максимальному электрическому
    сигналу. Это не число АЦП/ЦАП.
- key: …_PID_fYLoLimit
  default: '0.0'
  description: Минимальное разрешённое задание при регулировании. Например, 10 % не позволяет регулятору
    задавать меньшее открытие, но полная инженерная шкала остаётся 0–100 %. Выбирайте по технологии клапана.
- key: …_PID_fYHiLimit
  default: '100.0'
  description: Максимум, разрешённый при регулировании. Например, 90 % ограничивает доступную производительность
    при сохранении полной шкалы выхода 0–100 %.
- key: …_PID_fOffValue
  default: '0.0'
  description: 'Задание при отключённом автоматическом расчёте. Выбирайте по механизму: 0 % не всегда означает
    безопасное физическое положение или полностью отключённый привод.'
- key: …_OUT_fRawMin
  default: ADC_4_IN_0_20
  description: Число, которое нужно записать в AO для минимального электрического сигнала. Например, 2000
    соответствует 4 мА у модуля 0–20 мА → 0–10000. Берите значение из настройки реального модуля вывода.
- key: …_OUT_fRawMax
  default: ADC_MAX_VALUE
  description: Число AO для максимального электрического сигнала. Для того же примера 20 мА соответствуют
    10000. Настройка относится к выходному каналу, а не к уставке PID.
- key: …_Flts_SgnlsFltr_<Id причины>_bBypass
  default: 'false'
  description: 'Шунт одной причины аварии: true исключает её из обработки. Создаётся только для непустого
    Id соответствующего канала. Общий индикатор шунта помогает не забыть отключённую проверку.'
- key: …_Flts_SgnlsFltr_<Id причины>_diDelay
  default: '0'
  description: Сколько секунд причина аварии должна оставаться активной до срабатывания. 0 — без дополнительной
    выдержки. У каждого из каналов 1–8 своя настройка; отключённый пустым Id канал её не создаёт.
- key: …_Wrns_SgnlsFltr_<Id причины>_bBypass
  default: 'false'
  description: 'Шунт одной причины предупреждения: true исключает её из обработки. Создаётся только для
    непустого Id соответствующего канала. Общий индикатор шунта помогает не забыть отключённую проверку.'
- key: …_Wrns_SgnlsFltr_<Id причины>_diDelay
  default: '0'
  description: Сколько секунд причина предупреждения должна оставаться активной до срабатывания. 0 — без
    дополнительной выдержки. У каждого из каналов 1–8 своя настройка; отключённый пустым Id канал её не
    создаёт.
