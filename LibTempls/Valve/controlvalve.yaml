  text: "// |CtrlValId| - |CtrlValComment|. |$CtrlVal|\n|CtrlValId|_CtrlValve_Inst(\n    in_bLocalControl := |CtrlValLocal|,\n    in_bRemoteControl := |CtrlValRemote|,\n    in_bStart := false\n        OR ((|CtrlValId|_CtrlValve_Inst.out_iMode = VALVEMODEAUTO) AND (|CtrlValStartCmd|))\n        OR (|CtrlValId|_CtrlValve_Inst.out_iMode = VALVEMODEMANUAL),\n    in_bEmergencyStop := false\n        OR CabinetController_Inst.out_bEmergencyStop\n        OR NOT CabinetController_Inst.out_bPowerControl\n        OR |CtrlValEStopExtra|,\n    in_bExternalFault := |CtrlValExtFault|,\n    in_bStateOpen := |CtrlValStateOpen|,\n    in_bStateClose := |CtrlValStateClose|,\n    in_bFaultReset := CabinetController_Inst.out_bFaultReset,\n    in_bWorktimeReset := CabinetController_Inst.out_bWorktimeReset,\n    inout_iRemoteMode := View.|CtrlValId|_CtrlValve_Inst_inout_iRemoteMode,\n    inout_bStart := View.|CtrlValId|_CtrlValve_Inst_inout_bStart,\n    inout_bFaultReset := View.|CtrlValId|_CtrlValve_Inst_inout_bFaultReset,\n    inout_bWorktimeReset := View.|CtrlValId|_CtrlValve_Inst_inout_bWorktimeReset\n);\n//\n//\n//\n//\n"
