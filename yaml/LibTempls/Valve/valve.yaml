code:
  format: template-text
  language: st-template
  text: "// |ValId| - |ValComment|. |$Val|\n|ValId|_Valve_Inst(\n    in_bLocalControl := |ValLocal|,\n    in_bRemoteControl := |ValRemote|,\n    in_bEnableAutoControl := true\n        AND |ValEnAutoCtrlExtra|,\n    in_bEmergencyStop := false\n        OR CabinetController_Inst.out_bEmergencyStop\n        OR |ValEStopExtra|,\n    in_bPowerControl := true\n        AND CabinetController_Inst.out_bPowerControl\n        AND |ValPowerCtrlExtra|,\n    in_bNO := Conf.%\"|ValConf|\" if \"|ValConf|\"!=\"\" else \"|ValId|\"%_Valve_bNO,\n    in_bExternalFault := |ValExtFault|,\n    in_bEnableFaultCtrl := Conf.%\"|ValConf|\" if \"|ValConf|\"!=\"\" else \"|ValId|\"%_Valve_bEnableFaultCtrl,\n    in_bOpen := false\n        OR ((|ValId|_Valve_Inst.out_iMode = VALVEMODEAUTO) AND (|ValOpenCmd|))\n        OR ((|ValId|_Valve_Inst.out_iMode = VALVEMODEMANUAL) AND (View.|ValId|_Valve_Inst_inout_bOpen)),\n    in_bClose := false\n        OR ((|ValId|_Valve_Inst.out_iMode = VALVEMODEAUTO) AND (|ValCloseCmd|))\n        OR ((|ValId|_Valve_Inst.out_iMode = VALVEMODEMANUAL) AND (View.|ValId|_Valve_Inst_inout_bClose)),\n    in_bEnableCheckState := Conf.%\"|ValConf|\" if \"|ValConf|\"!=\"\" else \"|ValId|\"%_Valve_bEnableCheckState,\n    in_bStateOpen := |ValStateOpen|,\n    in_bStateClose := |ValStateClose|,\n    in_diChangeStateDelay := Conf.%\"|ValConf|\" if \"|ValConf|\"!=\"\" else \"|ValId|\"%_Valve_diChangeStateDelay,\n    in_diFullTime := Conf.%\"|ValConf|\" if \"|ValConf|\"!=\"\" else \"|ValId|\"%_Valve_diFullTime,\n    in_bFullTimeCtrlBypass := Conf.%\"|ValConf|\" if \"|ValConf|\"!=\"\" else \"|ValId|\"%_Valve_bFullTimeCtrlBypass,\n    in_bFaultReset := CabinetController_Inst.out_bFaultReset,\n    in_bWorktimeReset := CabinetController_Inst.out_bWorktimeReset,\n    out_bOpen => |ValOpenOut|,\n    out_bClose => |ValCloseOut|,\n    inout_iRemoteMode := View.|ValId|_Valve_Inst_inout_iRemoteMode,\n    inout_bOpen := View.|ValId|_Valve_Inst_inout_bOpen,\n    inout_bClose := View.|ValId|_Valve_Inst_inout_bClose,\n    inout_bFaultReset := View.|ValId|_Valve_Inst_inout_bFaultReset,\n    inout_bWorktimeReset := View.|ValId|_Valve_Inst_inout_bWorktimeReset\n);\n//\n//\n//\n//"
