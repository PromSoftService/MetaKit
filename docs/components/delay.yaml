component: Delay
slug: delay
source: yaml/LibTempls/Signals/delay.yaml
kind: Lib
title: Задержка сигнала
category: Обработка сигналов
summary: Выдаёт TRUE, только если входное условие непрерывно удерживалось заданное время.
description: Delay нужен, чтобы не реагировать на короткую помеху или дать процессу время установиться.
  Пока вход FALSE, выход выключен. При TRUE начинается отсчёт; если условие исчезло раньше срока, срабатывания
  не будет. После срабатывания снятие входа сразу снимает выход — задержки выключения здесь нет. Для запоминания
  аварии до ручного сброса используйте SignalsFilter.
use_cases:
- Нужно подтвердить, что условие непрерывно сохраняется заданное время, например насос работает при низком
  давлении.
- Краткий дребезг или помеха не должны превращаться в устойчивую команду.
not_for:
- 'Нужно запомнить аварию до ручного сброса: используйте SignalsFilter.'
- 'Нужна задержка выключения: Delay снимает выход сразу при снятии входа.'
- 'Нужен повторяющийся импульс: это Pulse либо Timer.'
diagram:
  lanes:
  - - Условие TRUE
    - 'Непрерывная выдержка

      например 8 секунд'
    - 'out_bQ

      подтверждённое условие'
  - - 'Вход FALSE

      или reset'
    - Немедленный сброс
    - out_bQ = FALSE
application:
  intro: После пуска насоса низкое давление допустимо кратковременно. Подайте в DelayEn условие «насос
    работает И давление ниже 1 бар». В настройках задайте время 8 и множитель 1000, то есть 8 секунд.
  result: out_bQ появится только при непрерывно низком давлении в течение 8 секунд. Внешний алгоритм может
    использовать его как подтверждённое условие; сам Delay не создаёт защиту двигателя автоматически.
parameter_groups:
- title: Назовите операцию
  intro: Импортируйте компонент и укажите, какую задачу он выполняет. Идентификатор отличает этот экземпляр
    от остальных операций того же типа.
  items:
  - key: $Delay
    default: Задержка сигнала
    example: Задержка сигнала
    description: Название типа операции в комментариях. Обычно оставляют исходную подпись; на времена
      и условия работы она не влияет.
  - key: DelayId
    default: _ID_
    example: LOW_PRESSURE
    description: Уникальное имя этой операции, например LOW_PRESSURE. По нему создаётся экземпляр LOW_PRESSURE_Delay_Inst
      и его отдельные теги.
  - key: DelayComment
    default: Комментарий
    example: Подтверждение низкого давления
    description: 'Понятное назначение операции: Подтверждение низкого давления. Этот текст используется
      в комментариях настроек и доступных тегов.'
- title: Подключите условие работы
  intro: После пуска насоса низкое давление допустимо кратковременно. Подайте в DelayEn условие «насос
    работает И давление ниже 1 бар». В настройках задайте время 8 и множитель 1000, то есть 8 секунд.
    Сам вход разрешения не настраивает выдержки времени — они задаются отдельно в таблице настроек ниже.
    В примере дополнительно убедитесь, что PT101 исправен; обработку ошибки Sensor в цепи защиты задаёт
    ваш контур. В текущем шаблоне общий reset подключён к сбросу наработки CabinetController.
  items:
  - key: DelayEn
    default: 'true'
    example: P101_Engine_Inst.out_bState AND (PT101_SensFilter_Inst.out_fY < 1.0)
    description: Условие, которое должно непрерывно держаться до срабатывания. Например, работа насоса
      AND низкое давление. При FALSE таймер и выход немедленно сбрасываются.
- title: Выберите набор настроек
  intro: Для первого экземпляра оставьте оба поля пустыми. Числа из примера задайте в соответствующих
    настройках после импорта; исходные значения шаблона перечислены ниже отдельно.
  items:
  - key: DelayConf
    default: ''
    example: ''
    description: Необязательное имя общего набора настроек. Пусто — настройки по DelayId. Общее имя задавайте
      только если все использующие его операции должны иметь одинаковые времена и правила.
  - key: DelayConfComment
    default: ''
    example: ''
    description: Название совместно используемых настроек. При пустом поле подпись строится из DelayComment
      и названия типа операции.
example:
  title: 'Низкое давление: короткий провал и устойчивая причина'
  scenario: При времени 8 и множителе 1000 условие должно держаться 8 секунд. Если давление восстановилось
    через 3 секунды, out_bQ не включится. Если причина держится 9 секунд, выход включится после восьмой.
  result: После восстановления давления out_bQ сразу выключится. Если сообщение должно оставаться до сброса,
    сформируйте его через SignalsFilter или другую логику фиксации; Delay такой памяти не предоставляет.
settings:
- key: …_Delay_diTime
  default: '1'
  description: Число единиц выдержки. При множителе 1000 значение 8 означает 8 секунд, при 60000 значение
    8 означает 8 минут.
- key: …_Delay_diMultiplier
  default: '1000'
  description: 'Длительность одной единицы в миллисекундах: 1000 — секунда, 60000 — минута. Полное время
    равно diTime × diMultiplier.'
hmi: []
optional_hmi:
- tag: Delay.out_bQ
  description: Подтверждённое условие после выдержки. По умолчанию отдельная строка HMI не выбрана; её
    можно добавить для диагностики. Для аварии с фиксацией нужен иной алгоритм, не просто этот тег.
common_mistakes:
- Ожидать фиксации аварии после исчезновения входа. Delay сразу снимает выход; для памяти аварии нужен
  SignalsFilter.
- 'Забыть множитель времени: 8 при 1000 — восемь секунд, при 60000 — восемь минут.'
- Проверять низкое давление без ошибки Sensor. Недостоверное или замещённое число нельзя считать настоящим
  низким давлением.
- Подключить out_bQ к физическому выходу в обход режимов и защит механизма. Delay только подготавливает
  условие.
