component: FltsWrns
slug: fltswrns
source: yaml/SysTmpls/FltsWrns.yaml
kind: Sys
title: Общие аварии и предупреждения
category: Системные компоненты
summary: Два общепроектных CSignalsFilter для независимой обработки аварий и предупреждений.
description: Два общепроектных CSignalsFilter для независимой обработки аварий и предупреждений. Компонент формирует два общих
  признака и отдельные сообщения с индивидуальными задержками, шунтами и режимами сброса.
use_cases:
- Проекту нужны централизованные списки внешних аварий и предупреждений.
- В проекте нужно независимо собрать до восьми аварий и до восьми предупреждений, не создавая отдельный блок для каждой группы.
not_for:
- Sys-компонент предназначен для уровня проекта; не импортируйте его повторно для каждого механизма.
diagram:
  lanes:
  - - Flt1…Flt8
    - 'CSignalsFilter

      аварии'
    - 'HMI аварий

      Flt'
  - - Wrn1…Wrn8
    - 'CSignalsFilter

      предупреждения'
    - 'HMI предупреждений

      Wrn'
application:
  intro: В проекте нужно независимо собрать до восьми аварий и до восьми предупреждений, не создавая отдельный блок для каждой
    группы. Ниже показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: Компонент формирует два общих признака и отдельные сообщения с индивидуальными задержками, шунтами и режимами сброса.
parameter_groups:
- title: Аварии
  items:
  - key: $Flts
    default: Аварии
    example: Аварии
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: FltBlockId
    default: Flts
    example: Flts
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: FltComment
    default: Аварии
    example: Аварии
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
- title: Строки 1–8
  items:
  - key: FltId1…FltId8
    default: _ID_
    example: FLTSWRNS
    description: Короткий идентификатор сигнала. Если оставить пустым, эта строка не создаётся. Одинаково применяется к строкам
      1–8.
  - key: FltComment1…FltComment8
    default: авария
    example: авария
    description: Текст причины, который увидит оператор в списке сообщений. Одинаково применяется к строкам 1–8.
  - key: FltIn1…FltIn8
    default: _DI_
    example: DI_FLTIN1
    description: Булево выражение контролируемой причины. Одинаково применяется к строкам 1–8.
  - key: FltEnable1…FltEnable8
    default: 'true'
    example: 'true'
    description: Разрешение обработки конкретного сигнала. Одинаково применяется к строкам 1–8.
  - key: FltAutoReset1…FltAutoReset8
    default: 'false'
    example: 'false'
    description: Автоматически снять зафиксированный сигнал после исчезновения причины. Одинаково применяется к строкам 1–8.
- title: Предупреждения
  items:
  - key: $Wrns
    default: Предупреждения
    example: Предупреждения
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: WrnBlockId
    default: Wrns
    example: Wrns
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: WrnComment
    default: Предупреждения
    example: Предупреждения
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
- title: Строки 1–8
  items:
  - key: WrnId1…WrnId8
    default: _ID_
    example: FLTSWRNS
    description: Короткий идентификатор сигнала. Если оставить пустым, эта строка не создаётся. Одинаково применяется к строкам
      1–8.
  - key: WrnComment1…WrnComment8
    default: предупреждение
    example: предупреждение
    description: Текст причины, который увидит оператор в списке сообщений. Одинаково применяется к строкам 1–8.
  - key: WrnIn1…WrnIn8
    default: _DI_
    example: DI_WRNIN1
    description: Булево выражение контролируемой причины. Одинаково применяется к строкам 1–8.
  - key: WrnEnable1…WrnEnable8
    default: 'true'
    example: 'true'
    description: Разрешение обработки конкретного сигнала. Одинаково применяется к строкам 1–8.
  - key: WrnAutoReset1…WrnAutoReset8
    default: 'true'
    example: 'true'
    description: Автоматически снять зафиксированный сигнал после исчезновения причины. Одинаково применяется к строкам 1–8.
