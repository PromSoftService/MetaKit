component: General
slug: general
source: yaml/SysTmpls/general.yaml
kind: Sys
title: Общая инфраструктура проекта
category: Системные компоненты
summary: CabinetController, общие аварии и предупреждения в правильной последовательности вызовов.
description: CabinetController, общие аварии и предупреждения в правильной последовательности вызовов. Остальные Unit-компоненты
  могут использовать CabinetController_Inst как родителя и получать единые команды шкафа.
use_cases:
- Создаётся стандартная общепроектная часть MetaGen.
- Один системный компонент создаёт контроллер шкафа, общий блок аварий и общий блок предупреждений в правильной последовательности
  вызовов.
not_for:
- Sys-компонент предназначен для уровня проекта; не импортируйте его повторно для каждого механизма.
diagram:
  lanes:
  - - Пуск / Стоп / E-Stop
    - 'CabinetController

      контроллер шкафа'
    - 'HMI шкафа

      состояние'
  - - Flt1…Flt8
    - 'CSignalsFilter

      аварии'
    - 'HMI аварий

      Flt'
  - - Wrn1…Wrn8
    - 'CSignalsFilter

      предупреждения'
    - 'HMI предупреждений

      Wrn'
application:
  intro: Один системный компонент создаёт контроллер шкафа, общий блок аварий и общий блок предупреждений в правильной последовательности
    вызовов. Ниже показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: Остальные Unit-компоненты могут использовать CabinetController_Inst как родителя и получать единые команды шкафа.
