component: CascadeUnit
slug: cascadeunit
source: yaml/LibTempls/Cascade/cascadeunit.yaml
kind: Lib
title: Интерфейс элемента каскада
category: Каскады
summary: Подключает один механизм или небольшой контур к общему каскаду.
description: 'CascadeUnit — связующее звено между вашим механизмом и каскадом. В него передают готовность,
  режим, фактическое состояние, аварию, наработку и мощность. Каскад по этим данным выбирает участников
  и передаёт команды, а CascadeUnit предоставляет общий для всех механизмов набор сигналов. Сам он не
  проверяет пускатель, не управляет концевиками и не заменяет Engine или Valve. В готовых Unit-компонентах
  это звено уже есть. Важно: это адаптер сигналов, а не канал связи и не автоматическая связка по одинаковому
  Id. Команду от верхнего Cascade передают в CasUnitStartCmd явно; выход адаптера затем явно используют
  в команде механизма.'
use_cases:
- Вы собираете собственный агрегат из Lib-компонентов и хотите представить его верхнему Cascade единым
  набором состояний.
- В агрегате несколько механизмов, но каскаду нужна одна согласованная готовность, авария и наработка.
not_for:
- 'Готовый Unit уже содержит CascadeUnit: второй адаптер с тем же Id добавлять не нужно.'
- 'Самостоятельный контроль пуска двигателя, концевиков или времени движения: эти проверки принадлежат
  Engine/Valve.'
- 'Автоматическая настройка межконтроллерного обмена: CascadeUnit лишь предоставляет программный интерфейс.'
diagram:
  lanes:
  - - 'Engine / Valve

      состояния агрегата'
    - 'CascadeUnit

      единый интерфейс'
    - 'Cascade

      выбор участников'
  - - 'Команда Cascade

      out_UnitN_bCmd'
    - CasUnitStartCmd
    - out_bStart
    - 'Механизм

      режимы и защиты'
  - - Состояния адаптера
    - 'HMI агрегата

      готовность и работа'
application:
  intro: Вы собрали собственный насосный контур из Engine и дополнительной логики. Добавьте CascadeUnit
    с CasUnitId = P101, передайте в него выходы P101_Engine_Inst и включите P101 в список участников Cascade.
  result: Верхний каскад сможет видеть, доступен ли насос для автоматической работы, и передавать ему
    команду. Физический пуск по-прежнему должен проходить через Engine и его защиты.
parameter_groups:
- title: Назовите агрегат и выберите родителя
  intro: Добавьте адаптер только если у собственного агрегата его ещё нет. Готовые Unit-компоненты уже
    содержат CascadeUnit. Родитель передаёт общие сигналы, не физические команды механизма.
  items:
  - key: $CasUnit
    default: Элемент каскада
    example: Элемент каскада
    description: Подпись элемента каскада в комментариях. Сам блок не является физическим двигателем или
      клапаном.
  - key: CasUnitId
    default: _ID_
    example: P101
    description: Уникальное имя агрегата, например P101. Именно это имя перечисляют в CasUnitIdN верхнего
      Cascade; в проекте должен получиться P101_CascadeUnit_Inst.
  - key: CasUnitComment
    default: Комментарий
    example: Насос повышения давления №1
    description: Название агрегата для HMI, например «Насос повышения давления №1». Полезно описывать
      весь агрегат, если внутри него несколько механизмов.
  - key: CasUnitParent
    default: CabinetController_Inst
    example: CabinetController_Inst
    description: Имя существующего CabinetController или верхнего CascadeUnit. Отсюда приходят питание,
      аварийный останов и общие сбросы. Автоматическую команду пуска задают отдельно через CasUnitStartCmd.
- title: Подключите команду и готовность
  intro: В примере первый насос запускается выходом первого места каскада BOOST. Готовность берём от Engine.
    Затем в собственном контуре нужно использовать P101_CascadeUnit_Inst.out_bStart как автоматическую
    команду Engine; Lib-компоненты не связываются одним совпадением Id.
  items:
  - key: CasUnitStartCmd
    default: 'false'
    example: BOOST_Cascade_Inst.out_Unit1_bCmd
    description: Команда работы этому агрегату. Для первого насоса каскада BOOST укажите BOOST_Cascade_Inst.out_Unit1_bCmd.
      После адаптера итоговую команду out_bStart нужно использовать в автоматическом пуске своего механизма.
  - key: CasUnitEn
    default: 'true'
    example: P101_Engine_Inst.out_bEnableAutoControl
    description: Готовность агрегата к использованию каскадом. Для насоса можно передать P101_Engine_Inst.out_bEnableAutoControl,
      дополнив необходимыми проектными разрешениями. TRUE не означает уже работающий насос.
  - key: CasUnitMode
    default: 'true'
    example: P101_Engine_Inst.out_iMode = ENGINEMODEAUTO
    description: BOOL-признак автоматического режима агрегата. Для Engine — сравнение out_iMode с ENGINEMODEAUTO.
      Не передавайте сюда числовой код режима напрямую.
- title: Передайте реальное состояние и аварию
  intro: 'Каскаду нужны три разные вещи: диагностическое состояние, фактическая работа и неисправность.
    Передайте выходы своего механизма, а не заменяйте их одним сигналом команды.'
  items:
  - key: CasUnitState
    default: '0'
    example: P101_Engine_Inst.out_iState
    description: Числовое состояние агрегата для диагностики, например out_iState двигателя. Это не команда
      запуска и не BOOL-факт работы.
  - key: CasUnitStateBool
    default: 'false'
    example: P101_Engine_Inst.out_bState
    description: 'Фактическая работа агрегата, например подтверждённый P101_Engine_Inst.out_bState. Не
      подменяйте командой пуска: каскад отдельно считает подключённые и реально работающие устройства.'
  - key: CasUnitFault
    default: 'false'
    example: P101_Engine_Inst.out_bFault
    description: Общая авария агрегата. TRUE показывает, что его нельзя считать исправным участником.
      Если агрегат состоит из нескольких блоков, соберите действительно запрещающие причины.
- title: Передайте наработку и мощность
  intro: Наработка участвует в выборе и ротации. Мощность нужна только если верхний каскад действительно
    использует её контроль; в примере он выключен и оставлена заглушка 0.0.
  items:
  - key: CasUnitWorktime
    default: '0'
    example: P101_Engine_Inst.out_diWorktime
    description: Наработка агрегата для выбора и чередования, например out_diWorktime двигателя. Используйте
      одинаковые единицы у всех участников; для CEngine наружная наработка — часы.
  - key: CasUnitPower
    default: '0.0'
    example: '0.0'
    description: Текущая мощность/производительность в согласованной шкале, например проценты частотного
      задания. 0.0 допустим как заглушка только когда верхний каскад не использует контроль мощности.
example:
  title: Собственный насосный агрегат P101
  scenario: Engine P101 управляет пускателем. CascadeUnit P101 получает его готовность, режим Auto, состояние,
    аварию и часы работы. Верхний Cascade BOOST перечисляет P101 первым, поэтому в CasUnitStartCmd передаётся
    BOOST_Cascade_Inst.out_Unit1_bCmd.
  result: В собранном контуре автоматический пуск Engine задаётся P101_CascadeUnit_Inst.out_bStart, а
    останов — соответствующим снятием команды. Верхний каскад видит состояние P101 и выдаёт ему запрос;
    адаптер и совпадение Id сами не записывают команду в Engine.
settings: []
hmi:
- tag: CascadeUnit.out_bEnable
  description: Готовность агрегата для каскада после его входных условий. Это доступность, не приказ пуска
    и не подтверждение работы.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CascadeUnit.out_bPowerControl
  description: Информация о питании, полученная от родителя. Используется внутренними механизмами и диагностикой
    агрегата.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CascadeUnit.out_bEmergencyStop
  description: Экстренный останов, переданный в агрегат. Внутренние механизмы должны использовать его
    в своих предусмотренных запретах.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CascadeUnit.out_bMode
  description: Агрегат находится в автоматическом режиме. Не является переключателем режима с HMI.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CascadeUnit.out_iState
  description: 'Переданное числовое состояние агрегата. Расшифровка зависит от механизма: двигатель и
    клапан имеют разные состояния.'
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CascadeUnit.out_bState
  description: Переданный факт работы агрегата. Для насоса обычно подтверждённая работа Engine; отличайте
    его от команды out_bStart.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CascadeUnit.out_bFault
  description: Общая неисправность агрегата для каскада и HMI. Конкретные причины следует показывать по
    соответствующим блокам и сообщениям.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CascadeUnit.out_bStart
  description: Команда агрегату на работу. Её следует использовать в автоматической логике внутреннего
    механизма; адаптер сам не записывает физический DO.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CascadeUnit.out_diWorktime
  description: Наработка, переданная механизмом. Адаптер не измеряет её заново; важны единые единицы у
    всех участников.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CascadeUnit.out_fPower
  description: Переданная мощность или производительность. По умолчанию выведена на HMI и в Trend. Нулевой
    заполнитель не является измеренной мощностью.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: Да
- tag: CascadeUnit.inout_bFaultReset
  description: Сброс аварий конкретного агрегата с HMI. Он объединяется с общим сбросом от родителя; внутренние
    механизмы должны получать соответствующий выход адаптера.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CascadeUnit.inout_bWorktimeReset
  description: Сервисный сброс наработки агрегата. Не связан автоматически с обычным запуском или остановом.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi: []
common_mistakes:
- 'Подключить фактическую работу вместо готовности: остановленный резервный насос тогда никогда не станет
  доступен для выбора.'
- Считать одинаковые Id автоматическим соединением всех блоков. В Lib-компонентах связи входов и выходов
  заполняются явно.
- Передать числовой режим Engine в BOOL CasUnitMode без сравнения с ENGINEMODEAUTO.
- Передать команду пуска как фактическую работу и потерять различие между подключённым и реально работающим
  агрегатом.
- Включить контроль мощности каскада, оставив у участников CasUnitPower = 0.0.
