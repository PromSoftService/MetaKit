component: VfdGroupPidCascade
slug: vfdgrouppidcascade
source: yaml/UnitsTmpls/vfdgrouppidcascade.yaml
kind: Unit
title: Каскад двигателей с общим PID
category: Готовые контуры
summary: Выбирает работающие насосы и рассчитывает одно общее задание частоты для всей группы ПЧ.
description: 'VfdGroupPidCascade объединяет две задачи. Cascade решает, сколько исправных доступных насосов
  подключить, кого оставить в резерве и когда чередовать участников по наработке. Общий PID плавно меняет
  задание всех двигателей, использующих групповой выход. Каждый двигатель добавляется отдельным VfdGroupEngineUnit:
  у него собственные пуск, ручное управление, защиты и AO. CasPV подаётся прямо как измерение или выражение;
  CasPVErr запрещает автоматическую работу группы. PID разрешён при включённой группе, исправном PV и хотя
  бы одном подключённом участнике — это ещё не подтверждение физического пуска. Сам компонент не содержит
  CascadeUnit, фильтров аварий или выходов ПЧ.'
use_cases:
- Несколько насосов с индивидуальными ПЧ работают на один коллектор и должны получать общее частотное задание.
- Нужны резервирование и ротация вместе с изменением числа работающих насосов по давлению.
- 'Для регулирования используется вычисленный перепад: можно передать REAL-выражение PV и объединённую ошибку
  источников.'
not_for:
- Каждому насосу нужен независимый регулятор по собственному измерению — используйте отдельные PidEngineUnit.
- Нужно только выбирать дискретные агрегаты без общего аналогового регулятора — достаточно Cascade.
- 'Нужен запрет всех ручных двигателей при CasPVErr: данный параметр запрещает группу, а индивидуальные
  Manual-двигатели не проверяют его напрямую.'
- 'Нужно использовать эту группу как Parent с выходами питания и EStop: собственного CascadeUnit у неё нет.'
diagram:
  lanes:
  - - CasPV + ошибка
    - 'Cascade

      состав и ротация'
    - StartCmd участников
    - Engine → пуск ПЧ
  - - Тот же CasPV
    - 'Общий PID

      частотное задание'
    - GroupId участников
    - Индивидуальные AO
  - - CascadeUnit участников
    - Готовность / работа
    - Cascade
  - - Общий PID
    - 'HMI группы

      задание / Manual'
  - - Статистика Cascade
    - 'HMI состава

      можно добавить'
application:
  intro: Группа BOOST содержит P101, P102 и P103. В норме работает минимум один насос, при недостатке давления
    можно подключить второй, третий остаётся доступным резервом. Sensor PT101 измеряет давление. Общий PID
    держит 4,5 бар, а каскад меняет состав за пределами 4,3–4,7 бар.
  result: Все работающие автоматические участники используют BOOST_PID_Inst.out_fYS, но каждый масштабирует
    его в свой AO. Для связей нужны и GroupId, и StartCmd. Резервирование не гарантирует нужное число реально
    работающих насосов при недостатке исправных агрегатов или неверной обратной связи.
parameter_groups:
- title: Назовите насосную группу
  intro: Добавьте один VfdGroupPidCascade и отдельный VfdGroupEngineUnit на каждый насос. Групповой компонент
    создаёт Cascade и PID, но не собственный CascadeUnit и не физические выходы ПЧ.
  items:
  - key: Id
    default: _ID_
    example: BOOST
    description: Уникальное имя всей группы, например BOOST. Создаёт BOOST_Cascade_Inst и BOOST_PID_Inst.
      Именно BOOST указывают в GroupId каждого двигателя; конфигурационные псевдонимы между компонентами
      не передаются.
  - key: Comment
    default: Комментарий
    example: Насосы повышения давления
    description: Понятное название группы, например «Насосы повышения давления». По нему подписываются все
      настройки общего PID и индивидуальные настройки каскада.
- title: Подключите общее разрешение и сброс
  intro: 'Укажите разрешение работы явно: одного Parent недостаточно. Двигатели получают своё питание и
    экстренные запреты от своих Parent; данный групповой компонент не заменяет этот интерфейс.'
  items:
  - key: Parent
    default: CabinetController_Inst
    example: CabinetController_Inst
    description: 'Источник сброса наработки: CabinetController или существующий CascadeUnit. В этом компоненте
      он используется для сброса таймера чередования и истории PID. Пуск, питание и EStop автоматически
      отсюда не берутся — общее разрешение задаётся в Enable.'
  - key: Enable
    default: 'true'
    example: CabinetController_Inst.out_bWorkAndPower AND bBoostDemand
    description: Общее разрешение работы каскада и PID. Например, шкаф запущен, питание есть и нужна насосная
      группа. Ошибка CasPVErr запрещает их дополнительно. По умолчанию true, поэтому связь с разрешением
      установки нужно задать явно.
- title: Подключите измерение и его достоверность
  intro: Для BOOST используем давление в барах от Sensor PT101. Для вычисленного перепада можно передать
    разность двух сглаженных измерений и OR обеих ошибок. Отдельный Sensor здесь автоматически не создаётся.
  items:
  - key: CasPV
    default: '0.0'
    example: PT101_SensFilter_Inst.out_fY
    description: Текущее физическое измерение или REAL-выражение, общее для каскада и PID. Например, сглаженное
      давление PT101 или разность двух давлений. Уставки должны использовать те же единицы. Это не Id датчика
      и не сырой код AI.
  - key: CasPVErr
    default: 'false'
    example: PT101_Sensor_Inst.out_bError
    description: TRUE, если CasPV недостоверен. Для одного Sensor — его out_bError; для разности двух измерений
      — OR ошибок обоих датчиков. Причина выключает автоматический каскад и снимает разрешение PID; отдельного
      сообщения этим параметром не создаётся.
- title: Перечислите двигатели и замкните командные связи
  intro: В примере три установленных насоса. У каждого задайте GroupId = BOOST, собственный Id и команду
    соответствующего места в StartCmd. В Parent двигателя оставьте CabinetController или его реальный CascadeUnit,
    не BOOST_Cascade_Inst.
  items:
  - key: UnitId1
    default: _ID_
    example: P101
    description: Id первого готового участника, например P101. По этому Id каскад читает его CascadeUnit.
      В StartCmd самого P101 отдельно передайте BOOST_Cascade_Inst.out_Unit1_bCmd, а GroupId задайте BOOST.
  - key: UnitId2
    default: ''
    example: P102
    description: Id второго участника, например P102. Его StartCmd должен получать out_Unit2_bCmd. Совпадение
      номера состояния и номера команды обязательно; GroupId у всех участников общий.
  - key: UnitId3
    default: ''
    example: P103
    description: Id третьего участника, например P103. Используется третье место и out_Unit3_bCmd. Места
      4–16 заполняются аналогично; пустой Id исключает место из списка.
- title: Настройте каскад и общий PID
  intro: 'В настройках ниже минимум 1 и максимум 2 позволяют одному или двум насосам работать, оставляя
    третий резервным. Для строго одного рабочего задайте минимум = максимум = 1. Реальное CasPV сохраняется:
    оно нужно общему PID. Cascade_fSP/Hys задают, когда менять состав группы, а PID_fSP — какое давление
    удерживать частотой работающих насосов. Это разные настройки; настройки PID всегда создаются по Id группы.'
  items:
  - key: $Cas
    default: Каскад
    example: Каскад
    description: Подпись части, выбирающей работающих участников. Каскад меняет число включённых механизмов,
      а не рассчитывает их частоту.
  - key: CasConf
    default: ''
    example: ''
    description: 'Необязательное имя общего набора внутренних настроек каскада: числа участников, границ,
      задержек и ротации. Пусто — настройки по Id группы. Не влияет на префикс настроек PID, читаемых двигателями.'
  - key: CasConfComment
    default: ''
    example: ''
    description: Понятное название общих настроек каскада. При пустом поле используются Comment этой группы
      и $Cas. Для одного общего CasConf значения и комментарий должны совпадать.
example:
  title: 'Три насоса: один обязательный, второй по нагрузке'
  scenario: Укажите минимум 1, максимум 2; Cascade_fSP = 4.5 и Cascade_fHys = 0.2. PID_fSP = 4.5, инженерная
    шкала выхода 0–100 %. Ниже 4,3 бар каскад может добавить второй доступный насос, выше 4,7 бар — убрать
    лишний, сохраняя минимум. Задержки подключения и отключения подберите по реакции системы; быстрый первый
    пуск в шаблоне включён.
  result: 'Для фиксированного «один рабочий, остальные резервные» измените только минимум/максимум на 1/1.
    Не заменяйте CasPV нулём: общий PID продолжает нуждаться в давлении. При CasPVErr автоматический каскад
    снимает команды и PID получает запрет; индивидуальный ручной двигатель может продолжать работу по своей
    логике и защитам.'
settings:
- key: …_Cascade_iWorkCount
  default: '1'
  description: Минимальное число подключённых агрегатов при разрешённой группе и наличии исправных доступных
    участников. Это не общее количество оборудования и не гарантированное число реально вращающихся насосов.
- key: …_Cascade_iMaxWorkCount
  default: '1'
  description: Верхний предел подключённых агрегатов. Например, минимум 2 и максимум 3 дают два постоянных
    участника и возможность добавить третий по процессу.
- key: …_Cascade_fSP
  default: '0.0'
  description: 'Уставка изменения числа участников, в единицах CasPV. Добавление возможно ниже SP − Hys,
    снятие лишнего — выше SP + Hys. Не является уставкой самого PID: PID_fSP задаётся отдельно.'
- key: …_Cascade_fHys
  default: '0.0'
  description: Разнос границ добавления и снятия агрегата относительно SP. Не даёт каскаду часто менять
    состав из-за небольших колебаний.
- key: …_Cascade_diConnectionDelay
  default: '1'
  description: Выдержка условия перед добавлением очередного агрегата, секунды. Даёт уже работающим участникам
    время повлиять на процесс.
- key: …_Cascade_diDisconnectionDelay
  default: '1'
  description: Выдержка условия перед снятием лишнего агрегата, секунды. Помогает избежать частых включений
    и отключений при переменной нагрузке.
- key: …_Cascade_bPowerControlEnable
  default: 'false'
  description: Дополнительно учитывать фактическую мощность участников при смене состава. Включайте только
    если каждый Power содержит осмысленное значение в согласованной шкале.
- key: …_Cascade_fPowerLoLimit
  default: '0.0'
  description: Нижний порог мощности текущего основного агрегата для разрешения снятия участника при включённом
    контроле мощности. Шкала должна совпадать с Power всех участников.
- key: …_Cascade_fPowerHiLimit
  default: '0.0'
  description: Верхний порог мощности текущего основного агрегата для разрешения добавления участника при
    включённом контроле мощности. Не включайте проверку с фиктивными нулевыми мощностями.
- key: …_Cascade_diSwitchPeriod
  default: '36'
  description: Период чередования по наработке, часы. По умолчанию 36 часов. Ноль или отрицательное значение
    отключает ротацию; это не выдержка подключения в секундах.
- key: <Id>_PID_fSP
  default: '0.0'
  description: Технологическая уставка общего PID, например 4,5 бар. По ней регулируется частота участников.
    Создаётся всегда по Id группы; в примере BOOST_PID_fSP.
- key: <Id>_PID_fDB
  default: '0.0'
  description: Небольшое допустимое отклонение около уставки в единицах измерения. Помогает не реагировать
    на мелкий шум; слишком широкая зона ухудшает точность.
- key: <Id>_PID_fSR
  default: '3.0'
  description: Период пересчёта регулятора, секунды. Это не период задачи ПЛК. Выбирайте с учётом быстродействия
    процесса и задержки фильтра Sensor.
- key: <Id>_PID_fKp
  default: '1.0'
  description: Насколько сильно изменять управление при ошибке измерения. Больший модуль даёт более резкую
    реакцию; слишком большое усиление вызывает колебания. Настраивается на реальном процессе.
- key: <Id>_PID_fTi
  default: '0.0'
  description: 'Параметр классической интегральной части. Руководство текущего CPID требует оставить 0.0:
    конечный выход out_fYS уже накапливает регулирующее воздействие.'
- key: <Id>_PID_fTd
  default: '0.0'
  description: Усиление реакции на скорость изменения ошибки через дифференциальное время, секунды. 0.0
    отключает эту часть. Шумный датчик делает слишком большую настройку нежелательной.
- key: <Id>_PID_fYMin
  default: '0.0'
  description: Нижняя инженерная точка общего задания, обычно 0 %. Её каждый VfdGroupEngineUnit читает по
    GroupId для входной шкалы своего AO.
- key: <Id>_PID_fYMax
  default: '100.0'
  description: Верхняя инженерная точка общего задания, обычно 100 %. Это не электрический код AO; физические
    выходные шкалы настраиваются у двигателей.
- key: <Id>_PID_fYLoLimit
  default: '0.0'
  description: Минимум, разрешённый именно при регулировании. Например, можно не опускать работающий насос
    ниже 25 %, не меняя полную шкалу 0–100 %.
- key: <Id>_PID_fYHiLimit
  default: '100.0'
  description: Максимум, разрешённый при регулировании. Например, 90 % ограничивает доступную производительность
    при сохранении полной шкалы выхода 0–100 %.
- key: <Id>_PID_fOffValue
  default: '0.0'
  description: 'Задание выключенного состояния общего PID и значение, которое участники выбирают при неработающем
    Engine. Обычно 0 %, но физический сигнал зависит от индивидуального OUT: 0 % может соответствовать 4
    мА, а не нулевому току.'
hmi:
- tag: PID.out_fY
  description: Расчётный шаг изменения общего воздействия. Диагностическое число, не готовая частота. HMI
    включено, Trend по умолчанию не выбран.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: PID.out_fYS
  description: Итоговое общее задание в инженерной шкале, обычно проценты. Его читают участники через GroupId;
    у двигателя в собственном Manual используется другое, индивидуальное значение.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: PID.inout_bYManual
  description: Ручной режим общего PID. Позволяет задавать одно фиксированное воздействие группе, но не
    переключает двигатели в Manual и не отключает автоматический подбор состава Cascade.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: PID.inout_fYManual
  description: Ручное задание общего PID, например 55 %. Относится к двигателям, использующим групповой
    выход. Не заменяет индивидуальное VFD_fManualValue ручного двигателя.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi:
- tag: PID.out_fYS
  description: Можно включить Trend у существующей строки общего задания и сопоставлять его с давлением.
    По умолчанию в этом компоненте Trend PID не выбран.
- tag: Cascade.out_iReadyCount
  description: Число доступных участников. Помогает понять, хватает ли исправного резерва; по умолчанию
    отдельной строки HMI каскада нет.
- tag: Cascade.out_iConnectedCount
  description: Число участников, которым выданы команды. По этому числу разрешается общий PID; это не обязательно
    фактически работающие насосы.
- tag: Cascade.out_iWorkingCount
  description: Число работающих участников по переданным состояниям. Сравнивайте с ConnectedCount, чтобы
    отличать команду от подтверждения.
- tag: Cascade.out_UnitN_bCmd
  description: Команда места 1–16. Можно показать для диагностики связей с StartCmd. Не является аварией
    сама по себе.
- tag: Источник ошибки CasPVErr
  description: Диагностику исходных датчиков или вычисленного измерения показывают отдельно. Групповой компонент
    не создаёт автоматическое сообщение Flt/Wrn/Alm о CasPVErr.
common_mistakes:
- Заполнить UnitId1…16 и ожидать автоматического соединения команд. StartCmd каждого участника должен получить
  выход его места, а GroupId — Id группы.
- Подставить CasConf в GroupId или ожидать PIDConf. Настройки общего PID всегда принадлежат Id этой группы.
- Для фиксированного числа участников подать CasPV = 0.0. Этот же PV используется PID, поэтому укажите минимум
  = максимум = N и сохраните реальное измерение.
- Считать Cascade_fSP и PID_fSP одним тегом. Первая уставка меняет состав, вторая регулирует частоту; согласуйте
  их явно.
- 'Считать Parent разрешением работы: здесь он предоставляет только сбросы, а Enable по умолчанию true.'
- Ожидать пуска PID только после физического подтверждения насосов. Проверяется ConnectedCount, то есть
  выданные команды, а не WorkingCount.
- Включить контроль мощности с Power = 0.0 у всех участников. Нужны осмысленные значения в одной шкале.
- Перевести общий PID в Manual и ожидать фиксации состава группы. Cascade продолжает свои условия подключения
  и ротации.
- Считать CasPVErr жёстким остановом всех ручных насосов. Такая связь в стандартном VfdGroupEngineUnit напрямую
  не задана.
