component: General
slug: general
source: yaml/SysTmpls/general.yaml
kind: Sys
title: Общая инфраструктура проекта
category: Системные компоненты
summary: 'Создаёт общую логику шкафа: пуск, останов, питание, сбросы и две группы общих сообщений.'
description: 'General — стартовый системный компонент проекта. В нём уже есть CabinetController и по одному
  фильтру общих аварий и предупреждений, каждый на восемь причин. CabinetController вызывается первым и
  предоставляет общие состояния и команды остальным компонентам. Общая авария подключена к его входу блокировки;
  предупреждения только сообщаются оператору. Это не означает безусловного аппаратного останова всех приводов:
  механизмы должны использовать соответствующие разрешения шкафа в своих командах. Питание, состояние «шкаф
  запущен» и экстренный останов — разные сигналы. В проекте нужен один General либо отдельно собранная эквивалентная
  логика, но не второй одноимённый CabinetController.'
use_cases:
- Нужна стандартная общая логика проекта с физическими кнопками, HMI и общими сигналами для всех агрегатов.
- Протечка, общая неисправность или другая выбранная причина должна блокировать контроллер шкафа, а предупредительные
  события не должны снимать его работу.
not_for:
- 'CabinetController уже создан отдельным компонентом: второй экземпляр с фиксированным именем вызовет конфликт.'
- 'Нужна только дополнительная группа сообщений без общешкафной логики: используйте FltsWrns.'
- 'Нужна аппаратная цепь безопасности: программный General не заменяет её проектирование и исполнение.'
diagram:
  lanes:
  - - Кнопки / питание
    - 'CabinetController

      вызывается первым'
    - 'HMI шкафа

      работа / питание'
  - - Общие аварии
    - Фильтр Flts
    - Блокировка CabinetController
  - - Причины Flts
    - HMI аварий
  - - Общие предупреждения
    - Фильтр Wrns
    - HMI предупреждений
  - - Общий сброс
    - Фильтры причин
    - Снятие устранённых аварий
application:
  intro: В котельной есть кнопки пуска, останова, сброса, сигнал питания, общий EStop, датчик протечки и
    контакт двери шкафа. Протечку добавим в общие аварии, открытую дверь — в предупреждения. Неиспользуемые
    каналы исключим пустыми Id.
  result: Оператор получает общие кнопки HMI и понятные причины. Протечка блокирует CabinetController через
    группу General_Flts, дверь только предупреждает. Для агрегатов с автоматической работой от шкафа используйте
    его out_bWorkAndPower в их штатных разрешениях/StartCmd.
parameter_groups:
- title: Подключите общий пуск и останов
  intro: General добавляется один раз. CabinetController вызывается первым внутри компонента, затем обрабатываются
    общие аварии и предупреждения. Отдельный Lib CabinetController рядом не нужен.
  items:
  - key: $General
    default: Общая логика ПЛК
    example: Общая логика ПЛК
    description: Название общей логики в параметрах. General содержит один фиксированный CabinetController_Inst
      и две именованные группы причин; отдельного Id всего General здесь нет.
  - key: CabCtlStart
    default: _DI_
    example: DI_START
    description: Физическая команда пуска шкафа. TRUE означает нажатый пуск; работа также может разрешаться
      кнопкой HMI при выполненных условиях питания и блокировок.
  - key: CabCtlStop
    default: _DI_
    example: NOT DI_STOP_OK
    description: Физическая команда останова. Подайте TRUE именно при останове. Для нормально замкнутой
      кнопки может потребоваться NOT DI_STOP_OK — полярность определяется электрической схемой.
- title: Подключите питание и экстренный останов
  intro: 'Согласуйте полярность контактов: TRUE на PowerOk означает питание есть, TRUE на EStop — останов
    активен. В примере цепь аварийного останова нормально замкнута, поэтому используется NOT.'
  items:
  - key: CabCtlPowerOk
    default: _DI_
    example: DI_POWER_OK
    description: TRUE, когда питание шкафа действительно присутствует. Например, наличие хотя бы одного
      рабочего ввода. Не подменяйте этим команду «шкаф запущен».
  - key: CabCtlEStop
    default: _DI_
    example: NOT DI_ESTOP_OK
    description: Общий сигнал аварийного останова шкафа. TRUE означает, что аварийный останов активен. Подключение
      этого сигнала к механизмам должно соответствовать принятой проектной схеме безопасности.
- title: Подключите общий сброс
  intro: Физическая кнопка и HMI дают общий сброс причин. Импульс сброса для устройств настраивается отдельно.
    Сброс наработки остаётся отдельной сервисной командой, не обычным квитированием.
  items:
  - key: CabCtlFaultReset
    default: _DI_
    example: DI_RESET
    description: Физическая кнопка общего сброса аварий. Уровневый и импульсный варианты сброса формируются
      самим CabinetController; длительность импульса задаётся в настройках.
- title: Назовите группу аварий
  intro: В General общий результат этой группы уже подан в блокировку CabinetController. Это блокировка
    контроллера шкафа, не непосредственная аппаратная команда останова каждого привода.
  items:
  - key: $Flts
    default: Общие аварии
    example: Общие аварии
    description: Подпись группы аварий в комментариях. Обработка и категория сообщений заданы отдельно от
      этой подписи.
  - key: FltBlockId
    default: General_Flts
    example: General_Flts
    description: Уникальное имя всей группы, например General_Flts. По нему создаются экземпляр фильтра
      и настройки его причин. Оно обязательно и не должно совпадать с другой группой в проекте.
  - key: FltComment
    default: Общие аварии
    example: Котельная
    description: Общий контекст всех сообщений, например «Котельная». К нему добавляется текст конкретной
      причины. Это помогает понять, к какому помещению или оборудованию относится событие.
- title: Подключите первую аварийную причину
  intro: В примере контролируем протечку в котельной. Остальные места 2–8 можно заполнить аналогично, а
    неиспользуемые каналы исключить пустыми Id.
  items:
  - key: FltId1
    default: _ID_
    example: LEAK
    description: Короткий идентификатор первой причины. Каналы 2–8 имеют аналогичные поля с собственными
      номерами. Пустой Id исключает только этот канал и его настройки; оставшиеся шаблонные _ID_ нужно заменить
      либо очистить.
  - key: FltComment1
    default: авария
    example: Протечка
    description: Понятный текст именно этой причины. Например, «Протечка в котельной» или «Дверь шкафа открыта».
      Не используйте вместо текста техническое имя DI.
  - key: FltIn1
    default: _DI_
    example: DI_ROOM_LEAK
    description: BOOL-сигнал или выражение, которое TRUE при активной причине. Для нормально замкнутого
      контакта при необходимости задайте инверсию. Это вход фильтра, не выражение столбца Flt/Wrn в таблице
      данных.
- title: Задайте контроль и сброс аварии
  intro: Причина контролируется постоянно. При срабатывании она остаётся до устранения протечки и сброса
    от CabinetController. Индивидуальная задержка и шунт находятся в настройках.
  items:
  - key: FltEnable1
    default: 'true'
    example: 'true'
    description: Когда контролировать эту причину. true — постоянно; false выключает канал; можно передать
      условие этапа процесса. Это вход разрешения фильтра и не то же самое, что значение в столбце категории
      сообщения.
  - key: FltAutoReset1
    default: 'false'
    example: 'false'
    description: false фиксирует аварию до устранения причины и общего сброса. true позволяет снять её после
      исчезновения входного сигнала. Сам сброс не устраняет активную неисправность.
- title: Назовите группу предупреждений
  intro: Эта группа формирует сообщения. Её общий выход не подключён автоматически к останову оборудования;
    нужную технологическую реакцию задают отдельно.
  items:
  - key: $Wrns
    default: Общие предупреждения
    example: Общие предупреждения
    description: Подпись группы предупреждений в комментариях. Обработка и категория сообщений заданы отдельно
      от этой подписи.
  - key: WrnBlockId
    default: General_Wrns
    example: General_Wrns
    description: Уникальное имя всей группы, например General_Wrns. По нему создаются экземпляр фильтра
      и настройки его причин. Оно обязательно и не должно совпадать с другой группой в проекте.
  - key: WrnComment
    default: Общие предупреждения
    example: Шкаф управления
    description: Общий контекст всех сообщений, например «Котельная». К нему добавляется текст конкретной
      причины. Это помогает понять, к какому помещению или оборудованию относится событие.
- title: Подключите предупреждение
  intro: Открытая дверь шкафа должна сообщаться оператору, но не блокировать установку. Задайте её отдельным
    предупредительным каналом.
  items:
  - key: WrnId1
    default: _ID_
    example: DOOR_OPEN
    description: Короткий идентификатор первой причины. Каналы 2–8 имеют аналогичные поля с собственными
      номерами. Пустой Id исключает только этот канал и его настройки; оставшиеся шаблонные _ID_ нужно заменить
      либо очистить.
  - key: WrnComment1
    default: предупреждение
    example: Дверь открыта
    description: Понятный текст именно этой причины. Например, «Протечка в котельной» или «Дверь шкафа открыта».
      Не используйте вместо текста техническое имя DI.
  - key: WrnIn1
    default: _DI_
    example: DI_CABINET_DOOR_OPEN
    description: BOOL-сигнал или выражение, которое TRUE при активной причине. Для нормально замкнутого
      контакта при необходимости задайте инверсию. Это вход фильтра, не выражение столбца Flt/Wrn в таблице
      данных.
- title: Задайте контроль и снятие предупреждения
  intro: Пусть предупреждение снимается после закрытия двери. Краткие колебания контакта можно отфильтровать
    задержкой этого канала; шунт по умолчанию выключен.
  items:
  - key: WrnEnable1
    default: 'true'
    example: 'true'
    description: Когда контролировать эту причину. true — постоянно; false выключает канал; можно передать
      условие этапа процесса. Это вход разрешения фильтра и не то же самое, что значение в столбце категории
      сообщения.
  - key: WrnAutoReset1
    default: 'true'
    example: 'true'
    description: true снимает предупреждение после исчезновения причины. false оставляет его до общего сброса.
      Для сообщения об открытой двери обычно нужен true, чтобы после закрытия сообщение ушло само.
example:
  title: Протечка блокирует шкаф, дверь только предупреждает
  scenario: FltBlockId = General_Flts, FltId1 = LEAK, вход DI_ROOM_LEAK, автосброс false. WrnBlockId = General_Wrns,
    WrnId1 = DOOR_OPEN, вход DI_CABINET_DOOR_OPEN, автосброс true. Для двери можно задать задержку 1 с;
    для протечки оставляем исходную задержку 0.
  result: Протечка фиксирует аварию и блокирует контроллер шкафа. После устранения причины требуется общий
    сброс, а штатное возобновление работы определяется логикой пуска. После закрытия двери предупреждение
    снимается автоматически. Снятие общешкафного разрешения влияет только на те команды механизмов, которые
    с ним действительно связаны.
settings:
- key: CabinetController_diPowerControlFilter
  default: '3'
  description: Сколько секунд уже запущенный шкаф может переждать краткое исчезновение питания, не сбрасывая
    запущенное состояние. Не разрешает первоначальный пуск без питания.
- key: CabinetController_diFaultResetPulse
  default: '1'
  description: Длительность импульса общего сброса, секунды. Нужна устройствам, которым следует подать короткую
    команду reset, например ПЧ.
- key: CabinetController_bStartOnTrig
  default: 'true'
  description: true требует нового фронта команды пуска. Это помогает избежать повторного запуска от постоянно
    удерживаемого сигнала после снятия блокировки.
- key: <FltBlockId>_SgnlsFltr_<FltIdN>_bBypass
  default: 'false'
  description: Шунт отдельной причины группы аварий. true исключает её из обработки; общий out_bBypass показывает,
    что есть отключённые проверки. Создаётся только для непустого Id канала N = 1–8.
- key: <FltBlockId>_SgnlsFltr_<FltIdN>_diDelay
  default: '0'
  description: Сколько секунд причина группы аварий должна непрерывно оставаться активной до срабатывания.
    0 — без дополнительной выдержки. Для каждого включённого по Id канала своя настройка.
- key: <WrnBlockId>_SgnlsFltr_<WrnIdN>_bBypass
  default: 'false'
  description: Шунт отдельной причины группы предупреждений. true исключает её из обработки; общий out_bBypass
    показывает, что есть отключённые проверки. Создаётся только для непустого Id канала N = 1–8.
- key: <WrnBlockId>_SgnlsFltr_<WrnIdN>_diDelay
  default: '0'
  description: Сколько секунд причина группы предупреждений должна непрерывно оставаться активной до срабатывания.
    0 — без дополнительной выдержки. Для каждого включённого по Id канала своя настройка.
hmi:
- tag: in_bBlock
  description: 'Общая блокировка от обработанных аварий FltBlock. В General отдельного параметра CabCtlBlock
    нет: вход уже связан с этой группой.'
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: out_bPowerControl
  description: Питание шкафа сейчас присутствует. Этот индикатор не означает, что оператор запустил установку.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: out_bWorking
  description: Оператор разрешил работу шкафа, и запущенное состояние сохраняется. Во время допустимого
    краткого провала питания оно может ещё оставаться TRUE.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: out_bWorkAndPower
  description: Шкаф запущен И питание сейчас есть. Это более строгое разрешение для механизмов, которым
    требуется текущее питание.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: out_bEmergencyStop
  description: Общий аварийный останов, объединяющий предусмотренные физический и HMI-источники. Это состояние
    запрета, не команда сброса.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: inout_bStart
  description: Экранная команда общего пуска. Блок принимает её при допустимых питании и блокировках, а
    не безусловно включает всё оборудование.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: inout_bStop
  description: Экранная команда обычного останова шкафа. Реакция отдельных механизмов определяется их связями
    и режимами.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: inout_bEmergencyStop
  description: Экранная команда аварийного останова. Не заменяет предусмотренную аппаратную цепь безопасности.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: inout_bFaultReset
  description: Общий сброс аварий с HMI. Активные неисправности сначала устраняют; сброс не делает повреждённый
    привод исправным.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: inout_bWorktimeReset
  description: Общая сервисная команда сброса наработки, передаваемая подключённым механизмам. Не объединяйте
    с обычным сбросом аварий.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: FltBlock.out_bQ
  description: Есть хотя бы одна обработанная авария. В General этот результат блокирует CabinetController.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: WrnBlock.out_bQ
  description: Есть хотя бы одно предупреждение. В штатном компоненте оно не включено в блокировку оборудования.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: FltBlock.out_bBypass
  description: В группе аварий шунтирована хотя бы одна проверка. Полезный индикатор для контроля обходов
    при обслуживании.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: WrnBlock.out_bBypass
  description: Есть шунт в группе предупреждений. Это отдельный диагностический итог, не готовое сообщение
    по умолчанию.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: FltBlock.out_Signal1_bQ … out_Signal8_bQ
  description: Отдельные аварии. Непустой FltIdN создаёт строку HMI и сообщение Flt при TRUE; комментарий
    состоит из FltComment и FltCommentN. При пустом Id строка отсутствует.
  hmi: Да
  flt: 'true'
  wrn: —
  alm: —
  trend: —
- tag: WrnBlock.out_Signal1_bQ … out_Signal8_bQ
  description: Отдельные предупреждения. Непустой WrnIdN создаёт HMI и сообщение Wrn при TRUE; текст берётся
    из WrnComment и WrnCommentN. При пустом Id строка отсутствует.
  hmi: Да
  flt: —
  wrn: 'true'
  alm: —
  trend: —
optional_hmi:
- tag: Строки отдельных причин
  description: 'При необходимости измените категорию в таблице данных. Flt/Wrn/Alm содержат выражения: true
    означает сообщение по активному выходу, false — по противоположному состоянию, пусто — категория не
    задана. Это не флаги HMI/Conf/Trend 1/0.'
common_mistakes:
- Добавить General вместе с отдельным CabinetController и получить два экземпляра с одним фиксированным
  именем.
- Считать общий Flts прямым EStop каждого привода. Он подключён к блокировке CabinetController; остальные
  компоненты должны использовать его разрешения в своих командах.
- Не инвертировать нормально замкнутый контакт останова при схеме, где TRUE должно означать останов.
- Считать out_bWorking доказательством текущего питания. Для питания есть out_bPowerControl, для обоих условий
  — out_bWorkAndPower.
- Оставить _ID_ и _DI_ у неиспользуемых причин. Очистите Id каналов, которые не требуются.
- Поставить false в столбец Flt/Wrn как выключенную галочку. Категории сообщений используют выражения; для
  отсутствующей категории поле оставляют пустым.
- Путать FltEnableN/AutoResetN с категорией Flt. Первые управляют обработкой причины внутри фильтра, категория
  задаёт формирование сообщения.
