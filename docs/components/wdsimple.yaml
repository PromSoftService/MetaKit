component: WDSimple
slug: wdsimple
source: yaml/LibTempls/WatchDog/WDSimple.yaml
kind: Lib
title: Простой WatchDog
category: Связь
summary: Проверяет, что принимаемое контрольное слово продолжает меняться.
description: 'WDSimple подходит для одностороннего контроля: SCADA или другое устройство периодически
  меняет слово, а ПЛК следит, не застыло ли оно. Ответное слово не требуется. Постоянные ноль или единица
  не подтверждают живую связь: источник должен регулярно обновлять значение. Этот вариант удобен, когда
  нельзя установить на другой стороне WDSlave, но можно передавать счётчик или переключающийся бит в WORD.'
use_cases:
- Нужен односторонний контроль, что SCADA или устройство продолжает менять контрольное слово.
- Сообщение о потере связи должно быть отдельной диагностикой, не встроенной в алгоритм двигателя или
  клапана.
not_for:
- 'Создание сетевого протокола, Modbus-соединения или адресов обмена: watchdog использует уже передаваемые
  слова.'
- 'Проверка правильности технологического числа: меняющийся heartbeat не доказывает достоверность всех
  давлений и температур.'
- 'Автоматический аварийный останов механизмов при потере связи: сам этот шаблон не добавляет такую связь.'
diagram:
  lanes:
  - - WORD от SCADA
    - 'Контроль обновлений

      таймаут'
    - out_bConn
    - 'HMI связи

      TRUE/ FALSE'
  - - out_bConn = FALSE
    - 'Wrn = FALSE

      задать в таблице данных'
    - 'HMI предупреждений

      понятный текст'
application:
  intro: SCADA каждую секунду изменяет контрольное слово, которое ПЛК получает в RX_SCADA_WD. Передайте
    RX_SCADA_WD в WDSimpleIn и задайте таймаут 10 секунд. В Comment укажите MAIN, в ConnMsg — «Отсутствует связь со SCADA».
  result: Пока значение обновляется вовремя, связь считается исправной. После остановки обновлений появляется
    состояние потери связи. Это диагностика обмена, а не проверка достоверности всех данных SCADA.
parameter_groups:
- title: Назовите контроль связи
  intro: Создайте отдельный экземпляр для пары MAIN — SCADA. Сам сетевой обмен должен быть уже настроен
    независимо от MetaKit.
  items:
  - key: $WDSimple
    default: Простой WatchDog
    example: Простой WatchDog
    description: Подпись типа контроля связи. Она не настраивает протокол обмена и не выбирает физическое
      устройство.
  - key: WDSimpleId
    default: _ID_
    example: MAIN_SCADA
    description: Уникальное имя этого контроля связи, например MAIN_SCADA. Для каждого партнёра нужен
      отдельный экземпляр.
  - key: WDSimpleComment
    default: Комментарий
    example: MAIN
    description: Имя текущего шкафа или понятный контекст сообщения. В примере MAIN; к нему добавляется
      текст ConnMsg.
- title: Подключите контрольные слова
  intro: Источник, например SCADA, должен регулярно менять передаваемое WORD-слово. Обратное слово этому
    варианту не требуется.
  items:
  - key: WDSimpleIn
    default: _WD_IN_
    example: RX_SCADA_WD
    description: Принимаемое WORD-слово от партнёра. Оно должно реально обновляться по настроенному обмену.
      Постоянный ноль или переменная, которую локально меняет сам ПЛК, не проверяют связь со SCADA.
- title: Выберите временные настройки
  intro: Для отдельной связи оставьте поля пустыми. Таймаут задайте с запасом относительно периода изменения
    слова и реального времени обмена, чтобы краткая задержка сети не создавала ложную потерю связи.
  items:
  - key: WDSimpleConf
    default: ''
    example: ''
    description: Необязательное имя общих временных настроек watchdog. Пусто — настройки по WDSimpleId.
      Общее имя допустимо для связей с одинаковыми требованиями к периоду и таймауту.
  - key: WDSimpleConfComment
    default: ''
    example: ''
    description: Понятное имя совместно используемых временных настроек. Если отдельная подпись не нужна,
      оставьте пустым.
- title: Настройте сообщение именно о потере
  intro: out_bConn означает исправную связь при TRUE. Чтобы предупреждение появлялось при FALSE, задайте
    соответствующее условие Wrn в его строке данных. Одного изменения текста ниже недостаточно для создания
    сообщения.
  items:
  - key: WDSimpleConnMsg
    default: Связь установлена
    example: Отсутствует связь со SCADA
    description: Текст состояния связи, добавляемый к Comment. Для предупреждения по потере задайте «Отсутствует
      связь со SCADA» и у строки out_bConn в таблице данных выберите Wrn со значением FALSE. По умолчанию
      категория сообщения у этой строки пуста.
example:
  title: MAIN контролирует SCADA
  scenario: SCADA каждую секунду изменяет контрольное слово, которое ПЛК получает в RX_SCADA_WD. Передайте
    RX_SCADA_WD в WDSimpleIn. В настройках измените таймаут с исходных 5 на 10 секунд.
  result: После прекращения обновления
    дольше таймаута out_bConn станет FALSE. При настроенном Wrn = FALSE появится «MAIN. Отсутствует связь
    со SCADA». До настройки категории есть только состояние HMI, не готовое предупреждение. Потеря связи
    сама по себе не меняет алгоритмы механизмов.
settings:
- key: …_WDSimple_diTimeout
  default: '5'
  description: Допустимое время без ожидаемого обновления обмена, секунды. По умолчанию 5. Выберите с запасом
    относительно частоты обновлений партнёра; значение должно соответствовать требованиям конкретной связи.
hmi:
- tag: WDSimple.out_bConn
  description: 'Состояние связи: TRUE — обмен подтверждён, FALSE — связь не подтверждена или потеряна.
    HMI включено, Flt/Wrn/Alm по умолчанию пустые. Для сообщения о потере задайте Wrn = FALSE и текст
    ConnMsg.'
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: WDSimple.out_bInit
  description: Признак первичного обновления/инициализации входного сигнала. Помогает отличить ещё не
    начавшийся обмен; текущую исправность связи определяйте по out_bConn.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi:
- tag: WDSimple.out_bConn
  description: Строка уже выведена на HMI. При необходимости назначьте сообщение о FALSE, а не создавайте
    дубликат тега. Trend можно включить для истории состояния связи.
common_mistakes:
- Менять контрольное слово локально в ПЛК вместо получения его от SCADA. Такая проверка покажет обновления
  даже при отсутствии реального обмена.
- Передавать неизменяемую константу вместо слова, которое периодически меняет партнёр.
- Задать таймаут меньше нормального интервала обновления с учётом сети и получить ложные потери.
- Назвать ConnMsg «Связь установлена» и ожидать предупреждение о потере. Текст и условие сообщения должны
  соответствовать FALSE на out_bConn.
- Считать наличие HMI=1 готовым предупреждением. В исходном шаблоне Flt/Wrn/Alm у связи не заполнены.
- Использовать heartbeat как доказательство достоверности всех данных партнёра. Он контролирует свежесть
  обмена, а не их технологический смысл.
