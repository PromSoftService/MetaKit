component: Timer
slug: timer
source: yaml/LibTempls/Signals/timer.yaml
kind: Lib
title: Таймер
category: Обработка сигналов
summary: Индивидуальный CTimer с управлением временем и состоянием отсчёта.
description: Индивидуальный CTimer с управлением временем и состоянием отсчёта. CTimer считает периоды, показывает текущий
  и оставшийся цикл и формирует признак завершения.
use_cases:
- Алгоритму требуется самостоятельный таймер MetaLib.
- Во время технологической операции требуется отсчитать заданное количество одинаковых периодов и отображать оставшееся число
  циклов.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - Разрешение
    - 'CTimer

      периоды и счётчик'
    - 'HMI таймера

      готово / осталось'
application:
  intro: Во время технологической операции требуется отсчитать заданное количество одинаковых периодов и отображать оставшееся
    число циклов. Ниже показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: CTimer считает периоды, показывает текущий и оставшийся цикл и формирует признак завершения.
parameter_groups:
- title: Циклический таймер
  items:
  - key: $Timer
    default: Циклический таймер
    example: Циклический таймер
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: TimerId
    default: _ID_
    example: TIMER
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: TimerComment
    default: Комментарий
    example: Периодический звуковой сигнал
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
  - key: TimerEn
    default: 'true'
    example: 'true'
    description: Дополнительное разрешение работы соответствующего блока.
  - key: TimerConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: TimerConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
example:
  title: Периодический звуковой сигнал
  scenario: Во время технологической операции требуется отсчитать заданное количество одинаковых периодов и отображать оставшееся
    число циклов.
  result: CTimer считает периоды, показывает текущий и оставшийся цикл и формирует признак завершения.
settings:
- key: …_Timer_diPeriod
  default: '60'
  description: Период
- key: …_Timer_diCount
  default: '1'
  description: Количество периодов
hmi:
- tag: Timer.out_bQ
  description: Таймер отработал
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Timer.out_diCurPeriod
  description: Текущий период
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Timer.out_diRemainingPeriods
  description: Осталось периодов
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi: []
common_mistakes:
- Оставить служебные значения _ID_, _DI_, _DO_ или _AO_ вместо реальных тегов проекта.
- Не проверить классы сообщений и доступность настроек на HMI после генерации проекта.
