component: FltsWrns
slug: fltswrns
source: yaml/SysTmpls/FltsWrns.yaml
kind: Sys
title: Общие аварии и предупреждения
category: Системные компоненты
summary: Добавляет отдельные группы из восьми аварий и восьми предупреждений с задержками, шунтами и сбросом.
description: 'FltsWrns нужен, когда в проекте появилась дополнительная группа причин: помещение, вспомогательное
  оборудование или собственный контур. Для каждой причины задаются вход, разрешение, текст и способ снятия.
  Задержка и шунт создаются в настройках. Аварийные и предупредительные строки уже имеют категории Flt и
  Wrn; общий выход каждой группы показывает наличие срабатываний. В отличие от General и готовых Unit, этот
  компонент не подключает аварии к блокировке шкафа или механизма. Общий сброс берётся от существующего
  CabinetController_Inst. Значение столбца сообщения не определяет технологический останов — это отдельная
  связь программы.'
use_cases:
- Нужны дополнительные сообщения котельной, помещения или оборудования, не относящиеся к одному стандартному
  Unit.
- В собственном контуре требуется готовая обработка нескольких причин с общей индикацией и независимыми
  текстами.
- Нужно разделить фиксируемые аварии и автоматически снимаемые текущие предупреждения.
not_for:
- Нужен общий пуск/останов шкафа вместе с блокировкой от аварий — используйте General.
- Нужно анализировать числовые пределы аналогового Sensor — рассмотрите SensLim с учётом его описанных ограничений.
- 'Ожидается автоматический останов оборудования только от добавления строки Flt: сам этот компонент такого
  соединения не создаёт.'
diagram:
  lanes:
  - - Аварийные причины
    - 'Фильтр Flts

      задержки / фиксация'
    - HMI аварий
  - - Предупредительные причины
    - 'Фильтр Wrns

      задержки / автоснятие'
    - HMI предупреждений
  - - Общий сброс шкафа
    - Обе группы
    - Снятие устранённых причин
  - - Общий out_bQ
    - 'Внешняя логика

      если её подключить'
application:
  intro: Для котельной заведём ROOM_Flts с причиной протечки и ROOM_Wrns с причиной открытой двери шкафа.
    У каждой группы своё имя. Неиспользуемые места 2–8 исключите пустыми идентификаторами, а используемые
    входы подключите с правильной полярностью.
  result: Протечка появляется как авария, дверь — как предупреждение. При необходимости остановить оборудование
    от ROOM_Flts_SgnlsFltr_Inst.out_bQ используйте этот выход в штатном входе нужного компонента; сам факт
    сообщения Flt ещё не блокирует установку.
parameter_groups:
- title: Назовите группу аварий
  intro: 'Создайте отдельные имена ROOM_Flts и ROOM_Wrns. CabinetController_Inst уже должен существовать:
    от него приходит общий сброс. Сам компонент содержит только две группы причин и не создаёт контроллер
    шкафа.'
  items:
  - key: $Flts
    default: Аварии
    example: Аварии
    description: Подпись группы аварий в комментариях. Обработка и категория сообщений заданы отдельно от
      этой подписи.
  - key: FltBlockId
    default: Flts
    example: ROOM_Flts
    description: Уникальное имя всей группы, например ROOM_Flts. По нему создаются экземпляр фильтра и настройки
      его причин. Оно обязательно и не должно совпадать с другой группой в проекте.
  - key: FltComment
    default: Аварии
    example: Котельная
    description: Общий контекст всех сообщений, например «Котельная». К нему добавляется текст конкретной
      причины. Это помогает понять, к какому помещению или оборудованию относится событие.
- title: Подключите первую аварийную причину
  intro: В примере контролируем протечку в котельной. Остальные места 2–8 можно заполнить аналогично, а
    неиспользуемые каналы исключить пустыми Id.
  items:
  - key: FltId1
    default: _ID_
    example: LEAK
    description: Короткий идентификатор первой причины. Каналы 2–8 имеют аналогичные поля с собственными
      номерами. Пустой Id исключает только этот канал и его настройки; оставшиеся шаблонные _ID_ нужно заменить
      либо очистить.
  - key: FltComment1
    default: авария
    example: Протечка
    description: Понятный текст именно этой причины. Например, «Протечка в котельной» или «Дверь шкафа открыта».
      Не используйте вместо текста техническое имя DI.
  - key: FltIn1
    default: _DI_
    example: DI_ROOM_LEAK
    description: BOOL-сигнал или выражение, которое TRUE при активной причине. Для нормально замкнутого
      контакта при необходимости задайте инверсию. Это вход фильтра, не выражение столбца Flt/Wrn в таблице
      данных.
- title: Задайте контроль и сброс аварии
  intro: Причина контролируется постоянно. При срабатывании она остаётся до устранения протечки и сброса
    от CabinetController. Индивидуальная задержка и шунт находятся в настройках.
  items:
  - key: FltEnable1
    default: 'true'
    example: 'true'
    description: Когда контролировать эту причину. true — постоянно; false выключает канал; можно передать
      условие этапа процесса. Это вход разрешения фильтра и не то же самое, что значение в столбце категории
      сообщения.
  - key: FltAutoReset1
    default: 'false'
    example: 'false'
    description: false фиксирует аварию до устранения причины и общего сброса. true позволяет снять её после
      исчезновения входного сигнала. Сам сброс не устраняет активную неисправность.
- title: Назовите группу предупреждений
  intro: Эта группа формирует сообщения. Её общий выход не подключён автоматически к останову оборудования;
    нужную технологическую реакцию задают отдельно.
  items:
  - key: $Wrns
    default: Предупреждения
    example: Предупреждения
    description: Подпись группы предупреждений в комментариях. Обработка и категория сообщений заданы отдельно
      от этой подписи.
  - key: WrnBlockId
    default: Wrns
    example: ROOM_Wrns
    description: Уникальное имя всей группы, например ROOM_Wrns. По нему создаются экземпляр фильтра и настройки
      его причин. Оно обязательно и не должно совпадать с другой группой в проекте.
  - key: WrnComment
    default: Предупреждения
    example: Шкаф управления
    description: Общий контекст всех сообщений, например «Котельная». К нему добавляется текст конкретной
      причины. Это помогает понять, к какому помещению или оборудованию относится событие.
- title: Подключите предупреждение
  intro: Открытая дверь шкафа должна сообщаться оператору, но не блокировать установку. Задайте её отдельным
    предупредительным каналом.
  items:
  - key: WrnId1
    default: _ID_
    example: DOOR_OPEN
    description: Короткий идентификатор первой причины. Каналы 2–8 имеют аналогичные поля с собственными
      номерами. Пустой Id исключает только этот канал и его настройки; оставшиеся шаблонные _ID_ нужно заменить
      либо очистить.
  - key: WrnComment1
    default: предупреждение
    example: Дверь открыта
    description: Понятный текст именно этой причины. Например, «Протечка в котельной» или «Дверь шкафа открыта».
      Не используйте вместо текста техническое имя DI.
  - key: WrnIn1
    default: _DI_
    example: DI_CABINET_DOOR_OPEN
    description: BOOL-сигнал или выражение, которое TRUE при активной причине. Для нормально замкнутого
      контакта при необходимости задайте инверсию. Это вход фильтра, не выражение столбца Flt/Wrn в таблице
      данных.
- title: Задайте контроль и снятие предупреждения
  intro: Пусть предупреждение снимается после закрытия двери. Краткие колебания контакта можно отфильтровать
    задержкой этого канала; шунт по умолчанию выключен.
  items:
  - key: WrnEnable1
    default: 'true'
    example: 'true'
    description: Когда контролировать эту причину. true — постоянно; false выключает канал; можно передать
      условие этапа процесса. Это вход разрешения фильтра и не то же самое, что значение в столбце категории
      сообщения.
  - key: WrnAutoReset1
    default: 'true'
    example: 'true'
    description: true снимает предупреждение после исчезновения причины. false оставляет его до общего сброса.
      Для сообщения об открытой двери обычно нужен true, чтобы после закрытия сообщение ушло само.
example:
  title: Фиксируемая протечка и текущая открытая дверь
  scenario: Для протечки оставьте FltAutoReset1 = false и задержку 0. Для двери задайте WrnAutoReset1 =
    true и задержку 1 с. Полсекунды открытого контакта двери не должны создавать срабатывание фильтра, а
    длительное открытие даст предупреждение.
  result: После закрытия двери предупреждение снимается само. Авария протечки остаётся до устранения причины
    и общего сброса CabinetController. Выход ROOM_Flts_SgnlsFltr_Inst.out_bQ можно использовать как общую
    внешнюю аварию выбранного механизма; это отдельная проектная связь, а не встроенное поведение FltsWrns.
settings:
- key: <FltBlockId>_SgnlsFltr_<FltIdN>_bBypass
  default: 'false'
  description: Шунт отдельной причины группы аварий. true исключает её из обработки; общий out_bBypass показывает,
    что есть отключённые проверки. Создаётся только для непустого Id канала N = 1–8.
- key: <FltBlockId>_SgnlsFltr_<FltIdN>_diDelay
  default: '0'
  description: Сколько секунд причина группы аварий должна непрерывно оставаться активной до срабатывания.
    0 — без дополнительной выдержки. Для каждого включённого по Id канала своя настройка.
- key: <WrnBlockId>_SgnlsFltr_<WrnIdN>_bBypass
  default: 'false'
  description: Шунт отдельной причины группы предупреждений. true исключает её из обработки; общий out_bBypass
    показывает, что есть отключённые проверки. Создаётся только для непустого Id канала N = 1–8.
- key: <WrnBlockId>_SgnlsFltr_<WrnIdN>_diDelay
  default: '0'
  description: Сколько секунд причина группы предупреждений должна непрерывно оставаться активной до срабатывания.
    0 — без дополнительной выдержки. Для каждого включённого по Id канала своя настройка.
hmi:
- tag: FltBlock.out_bQ
  description: Есть хотя бы одна обработанная авария. Сам FltsWrns не передаёт этот сигнал в останов двигателя
    или шкафа.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: WrnBlock.out_bQ
  description: Есть хотя бы одно предупреждение. В штатном компоненте оно не включено в блокировку оборудования.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: FltBlock.out_bBypass
  description: В группе аварий шунтирована хотя бы одна проверка. Полезный индикатор для контроля обходов
    при обслуживании.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: WrnBlock.out_bBypass
  description: Есть шунт в группе предупреждений. Это отдельный диагностический итог, не готовое сообщение
    по умолчанию.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: FltBlock.out_Signal1_bQ … out_Signal8_bQ
  description: Отдельные аварии. Непустой FltIdN создаёт строку HMI и сообщение Flt при TRUE; комментарий
    состоит из FltComment и FltCommentN. При пустом Id строка отсутствует.
  hmi: Да
  flt: 'true'
  wrn: —
  alm: —
  trend: —
- tag: WrnBlock.out_Signal1_bQ … out_Signal8_bQ
  description: Отдельные предупреждения. Непустой WrnIdN создаёт HMI и сообщение Wrn при TRUE; текст берётся
    из WrnComment и WrnCommentN. При пустом Id строка отсутствует.
  hmi: Да
  flt: —
  wrn: 'true'
  alm: —
  trend: —
optional_hmi:
- tag: Строки отдельных причин
  description: 'При необходимости можно изменить категорию или добавить Alm в таблице данных. Это выражения,
    не флаги 1/0: true даёт сообщение при активном BOOL-выходе, false задаёт противоположное состояние,
    пустое поле означает отсутствие категории.'
- tag: FltBlock.out_bBypass / WrnBlock.out_bBypass
  description: Общие индикаторы шунтов уже выведены на HMI. Можно назначить им отдельные предупредительные
    сообщения, если нужно явно сообщать об отключённых проверках.
common_mistakes:
- Повторить FltBlockId или WrnBlockId другой группы и получить одноимённые экземпляры/настройки.
- Считать категорию Flt автоматической блокировкой оборудования. Общий выход нужно использовать в соответствующем
  входе механизма или логике шкафа.
- Путать разрешение FltEnableN/WrnEnableN с выражением категории в таблице данных. false в разрешении выключает
  обработку канала; false в Flt/Wrn означает другое условие сообщения.
- Использовать HMI = true вместо принятого флага 1. HMI/Conf/Trend — флаги 1/0; Flt/Wrn/Alm — выражения.
- Оставить заполненные шаблонные Id у неиспользуемых каналов. Пустой Id исключает канал и его настройки.
- Ожидать снятия фиксируемой аварии, пока физическая причина активна. Сброс не исправляет неисправность.
- Не создать CabinetController_Inst, от которого текущий шаблон получает общий сброс.
