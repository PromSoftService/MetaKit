component: TwoStep
slug: twostep
source: yaml/LibTempls/Regulators/TwoStep.yaml
kind: Lib
title: Двухпозиционный регулятор
category: Регуляторы
summary: Индивидуальный CTwoStep с выходами нагрева и охлаждения и настройками сообщений.
description: Индивидуальный CTwoStep с выходами нагрева и охлаждения и настройками сообщений. CTwoStep формирует независимые
  признаки нагрева и охлаждения; ненужное направление можно не использовать.
use_cases:
- Управление выполняется дискретным включением нагрева либо охлаждения по уставке и гистерезису.
- Нагрев включается ниже уставки с учётом гистерезиса и отключается после достижения заданной температуры.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - PV + SP + Hys
    - 'CTwoStep

      сравнение'
    - 'Выход

      Нагрев'
  - - PV + SP + Hys
    - 'CTwoStep

      сравнение'
    - 'Выход

      Охлаждение'
  - - out_bHeating
    - Сообщение режима
    - 'HMI предупреждений

      Heating'
  - - out_bCooling
    - Сообщение режима
    - 'HMI предупреждений

      Cooling'
application:
  intro: Нагрев включается ниже уставки с учётом гистерезиса и отключается после достижения заданной температуры. Ниже показаны
    параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: CTwoStep формирует независимые признаки нагрева и охлаждения; ненужное направление можно не использовать.
parameter_groups:
- title: Двухпозиционный регулятор
  items:
  - key: $TwoStep
    default: Двухпозиционный регулятор
    example: Двухпозиционный регулятор
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: TwoStepId
    default: _ID_
    example: TS101
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: TwoStepComment
    default: Комментарий
    example: Регулятор температуры
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
  - key: TwoStepEnExtra
    default: 'true'
    example: 'true'
    description: Дополнительное разрешение работы соответствующего блока.
  - key: TwoStepConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: TwoStepConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
- title: Группа параметров 2
  items:
  - key: TwoStepSensId
    default: _ID_
    example: TWOSTEP
    description: Id компонента Sensor, от которого берутся значение и ошибка датчика.
  - key: TwoStepInput
    default: 'true'
    example: 'true'
    description: Регулируемое значение, которое сравнивается с уставкой двухпозиционного регулятора.
  - key: TwoStepLo
    default: 'false'
    example: 'false'
    description: Выходная команда двухпозиционного регулятора для выбранного направления управления.
  - key: TwoStepHi
    default: 'false'
    example: 'false'
    description: Выходная команда двухпозиционного регулятора для выбранного направления управления.
  - key: TwoStepHeatingMsg
    default: Нагрев
    example: Нагрев
    description: Текст сообщения при активном выходе Нагрев.
  - key: TwoStepCoolingMsg
    default: Охлаждение
    example: Охлаждение
    description: Текст сообщения при активном выходе Охлаждение.
example:
  title: Поддержание температуры нагревателем
  scenario: Нагрев включается ниже уставки с учётом гистерезиса и отключается после достижения заданной температуры.
  result: CTwoStep формирует независимые признаки нагрева и охлаждения; ненужное направление можно не использовать.
settings:
- key: …_TwoStep_fSP
  default: '0.0'
  description: Уставка
- key: …_TwoStep_fHys
  default: '0.0'
  description: Гистерезис
hmi: []
optional_hmi: []
common_mistakes:
- Оставить служебные значения _ID_, _DI_, _DO_ или _AO_ вместо реальных тегов проекта.
- Не проверить классы сообщений и доступность настроек на HMI после генерации проекта.
