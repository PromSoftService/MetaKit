component: Valve
slug: valve
source: yaml/LibTempls/Valve/valve.yaml
kind: Lib
title: Дискретный клапан
category: Исполнительные механизмы
summary: Управляет клапаном или задвижкой с отдельными командами открытия и закрытия.
description: 'Valve предназначен для привода, у которого есть два направления движения: открыть и закрыть.
  Компонент выбирает команды по режиму управления, контролирует концевики, выдерживает паузу перед реверсом
  и при необходимости следит за временем полного хода. Оператор видит режим, положение и причину незавершённого
  движения. При аварии поведение зависит от настроек нормального положения и аварийного управления: нельзя
  считать, что любой клапан всегда автоматически закроется. В Auto движения запрашивает проектный алгоритм,
  в Manual — оператор с HMI. Local имеет аппаратный приоритет, но отдельные местные кнопки в этом шаблоне
  не подключены. Экстренный останов и отсутствие питания снимают оба выхода и имеют приоритет даже над
  аварийным переводом в нормальное положение.'
use_cases:
- Задвижка или клапан имеет два дискретных направления движения и концевики открытого/закрытого положения.
- 'Нужно собрать собственный контур: внешняя логика выбирает момент открытия и закрытия, а Valve отвечает
  за привод, ручные команды и диагностику.'
- Требуются пауза реверса, сообщение о незавершённом ходе и заданное поведение при внешней аварии.
not_for:
- 'Аналоговый позиционер с заданием 0–100 % по 4–20 мА: для него нужны ControlValve и соответствующая
  аналоговая логика либо готовый PidCtrlValveUnit.'
- 'Самостоятельное регулирование температуры или давления: Valve выполняет команды, но не рассчитывает
  их по датчику. Для готового импульсного контура используйте PiddValveUnit.'
- 'Полностью готовый местный пост через ПЛК: ValLocal выбирает режим, но параметры местных кнопок в текущем
  Lib-шаблоне отсутствуют.'
diagram:
  lanes:
  - - 'Команды

      Открыть / Закрыть'
    - 'CValve

      режимы и реверс'
    - 'Выходы

      Open / Close'
  - - 'Концевики

      Open / Close'
    - 'Контроль хода

      и состояния'
    - 'HMI клапана

      положение / режим'
  - - 'Внешняя авария

      и E-Stop'
    - 'CValve

      out_bFault'
    - 'HMI аварий

      Flt'
application:
  intro: Задвижку V101 нужно открывать при запросе воды и закрывать при его снятии. Подключите два концевика
    DI_V101_OPEN/DI_V101_CLOSE и два выхода DO_V101_OPEN/DO_V101_CLOSE. В настройках задайте паспортное
    время хода и допустимую паузу реверса.
  result: В автомате задвижка следует запросам, в ручном — кнопкам HMI. Если включён контроль хода и крайнее
    положение не достигнуто вовремя, формируется отдельная авария открытия или закрытия.
parameter_groups:
- title: Назовите клапан
  intro: Импортируйте Valve и задайте его имя. В проекте нужен CabinetController_Inst — отдельно либо
    в General; от него приходят общие питание, аварийный останов и сбросы.
  items:
  - key: $Val
    default: Клапан
    example: Клапан
    description: Название типа блока в комментариях, обычно «Клапан». Не влияет на направление движения
      или нормальное положение.
  - key: ValId
    default: _ID_
    example: V101
    description: Уникальное имя клапана, например V101. По нему создаются теги и экземпляр V101_Valve_Inst.
      Не используйте одно имя для двух разных приводов.
  - key: ValComment
    default: Комментарий
    example: Клапан подачи воды
    description: Название оборудования для HMI и сообщений, например «Клапан подачи воды». По нему оператор
      должен узнать клапан без расшифровки Id.
- title: Задайте автоматическое движение
  intro: Клапан примера открывается, когда шкаф запущен и есть запрос воды, и закрывается при снятии запроса.
    Для промежуточной остановки должны быть сняты обе команды; это отдельное состояние, не команда закрытия.
  items:
  - key: ValOpenCmd
    default: 'false'
    example: CabinetController_Inst.out_bWorkAndPower AND bWaterDemand
    description: Запрос открытия в автоматическом режиме. TRUE просит двигаться в сторону открытия; конечную
      команду определяет CValve с учётом концевиков и блокировок.
  - key: ValCloseCmd
    default: 'false'
    example: NOT (CabinetController_Inst.out_bWorkAndPower AND bWaterDemand)
    description: Отдельный запрос закрытия в автоматическом режиме. Для простого «работать — открыто,
      не работать — закрыто» задайте условие, противоположное ValOpenCmd. Снятый запрос открытия сам по
      себе не означает закрытие.
  - key: ValEnAutoCtrlExtra
    default: 'true'
    example: 'true'
    description: Дополнительное разрешение именно автоматического управления. false запрещает автоматические
      команды, но не является общим аварийным остановом всех режимов.
- title: Подключите режимы и питание привода
  intro: Подключите переключатель местного/дистанционного управления и, если есть, отдельный контакт питания
    привода. Manual выбирается с HMI в дистанционном режиме. Для местного поста через ПЛК потребуются
    собственные связи кнопок — этот шаблон их не содержит.
  items:
  - key: ValLocal
    default: 'false'
    example: DI_V101_LOCAL
    description: 'Сигнал переключателя «Местное». Local имеет приоритет над дистанционным выбором. В данном
      Lib-шаблоне нет отдельных параметров местных кнопок: ValOpenCmd/ValCloseCmd подаются только в Auto.'
  - key: ValRemote
    default: 'true'
    example: DI_V101_REMOTE
    description: Разрешение дистанционного управления. При TRUE и отсутствии Local оператор выбирает Auto
      или Manual с HMI. При FALSE без Local получается Off.
  - key: ValPowerCtrlExtra
    default: 'true'
    example: DI_V101_POWER_OK
    description: 'Дополнительный признак наличия питания именно этого привода. Он объединяется через AND
      с питанием шкафа. false снимает команды: без питания аварийное движение также не разрешается.'
- title: Подключите концевики и выходы
  intro: 'Каждому направлению нужен свой выход и своё подтверждение крайнего положения. Проверьте их соответствие
    при наладке: команда «Открыть» должна вести к концевику «Открыт», а не наоборот.'
  items:
  - key: ValStateOpen
    default: _DI_
    example: DI_V101_OPEN
    description: Концевик «Полностью открыт». TRUE означает достигнутое крайнее положение, а не команду
      открытия. При включённом контроле концевиков он снимает команду дальнейшего открытия.
  - key: ValStateClose
    default: _DI_
    example: DI_V101_CLOSE
    description: Концевик «Полностью закрыт». Подключайте с такой полярностью, чтобы TRUE означало достигнутое
      закрытое положение. Два концевика одновременно дают недостоверное состояние.
  - key: ValOpenOut
    default: _DO_
    example: DO_V101_OPEN
    description: Имя дискретного выхода движения на открытие, например DO_V101_OPEN. Это итоговая команда
      блока, уже прошедшая проверки режима и защит.
  - key: ValCloseOut
    default: _DO_
    example: DO_V101_CLOSE
    description: Имя отдельного выхода движения на закрытие, например DO_V101_CLOSE. Пауза перед сменой
      направления задаётся в настройках CValve.
- title: Разделите аварию и экстренный останов
  intro: 'Внешняя авария может потребовать движения в нормальное положение, если это специально разрешено
    настройками. Экстренный останов и потеря питания имеют более высокий приоритет: обе команды будут
    сняты.'
  items:
  - key: ValExtFault
    default: 'false'
    example: DI_V101_FAULT
    description: Внешняя авария привода или технологическая авария, переданная клапану. После её фиксации
      обычные команды блокируются; возможный перевод в нормальное положение зависит от bEnableFaultCtrl
      и bNO.
  - key: ValEStopExtra
    default: 'false'
    example: 'false'
    description: Дополнительный экстренный останов клапана. TRUE снимает обе команды движения, независимо
      от Auto/Manual/Local и настройки аварийного перевода.
- title: Выберите набор настроек привода
  intro: Для отдельного V101 оставьте поля пустыми. В настройках ниже задайте реальные время хода, реверс
    и поведение при аварии. Общий набор допустим для клапанов с одинаковой механикой и одинаковой аварийной
    логикой.
  items:
  - key: ValConf
    default: ''
    example: ''
    description: Необязательное имя общего набора настроек однотипных клапанов. Пусто — настройки индивидуальные
      по ValId. Не объединяйте приводы с разным временем хода или разным аварийным положением.
  - key: ValConfComment
    default: ''
    example: ''
    description: 'Понятное название совместно используемых настроек. Если ValConf не нужен, оставьте пустым:
      используются ValComment и $Val.'
example:
  title: Клапан подачи воды с аварийным закрытием
  scenario: Если по проекту клапан при внешней аварии должен закрываться, задайте bNO = false и bEnableFaultCtrl
    = true. Для привода с паспортным ходом 30 секунд выберите подходящее время diFullTime с запасом после
    проверки и снимите bFullTimeCtrlBypass. Не используйте исходный шаблонный 1 с как паспортное время
    вашего привода.
  result: В нормальном Auto запрос открывает клапан до концевика, его снятие вызывает закрытие. При внешней
    аварии блок направляет клапан к нормальному закрытому положению, если питание есть и нет жёсткой блокировки.
    При EStop или отсутствии питания команды снимаются — обещать физическое закрытие в этих условиях нельзя.
settings:
- key: …_Valve_bNO
  default: 'false'
  description: 'Нормальное положение клапана: false — закрыто, true — открыто. Это целевое направление
    для аварийного перевода, а не фактическое положение концевика.'
- key: …_Valve_bEnableFaultCtrl
  default: 'false'
  description: Разрешает перевод в нормальное положение при аварии. При false авария снимает обычные команды.
    Проверьте совместно с bNO и возможностями реального привода.
- key: …_Valve_bEnableCheckState
  default: 'false'
  description: true учитывает концевики и снимает команду соответствующего направления после достижения
    крайнего положения. При false команда может удерживаться даже при сработавшем концевике; выбирайте
    это только для схем, которым такое поведение действительно требуется.
- key: …_Valve_diChangeStateDelay
  default: '1'
  description: Минимальная пауза между противоположными направлениями, секунды. Защищает привод от мгновенного
    реверса; пауза без обеих команд также учитывается.
- key: …_Valve_diFullTime
  default: '90'
  description: Допустимое время полного движения, секунды. Задайте по паспорту и проверке привода с запасом.
    При включённом контроле превышение создаёт аварию открытия или закрытия.
- key: …_Valve_bFullTimeCtrlBypass
  default: 'false'
  description: true отключает ограничение времени хода. Чтобы реально обнаруживать незавершённое движение,
    задайте diFullTime и снимите этот шунт.
hmi:
- tag: Valve.out_iMode
  description: Текущий режим Off, Local, Manual или Auto. Показывает действующий источник управления,
    а не положение клапана.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Valve.out_iState
  description: 'Состояние клапана: открыт, закрыт, открывается, закрывается или положение неизвестно.
    Это не процент открытия. При двух активных концевиках состояние недостоверно.'
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Valve.out_bOpenFault
  description: Клапан не завершил открытие за разрешённое время при включённом контроле хода. По умолчанию
    формирует отдельную аварию Flt.
  hmi: —
  flt: Да
  wrn: —
  alm: —
  trend: —
- tag: Valve.out_bCloseFault
  description: Клапан не завершил закрытие за разрешённое время при включённом контроле хода. По умолчанию
    формирует отдельную аварию Flt.
  hmi: —
  flt: Да
  wrn: —
  alm: —
  trend: —
- tag: Valve.out_bFault
  description: Общая авария клапана. Используйте для общего индикатора; сообщения открытия/закрытия и
    внешняя диагностика объясняют причину.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Valve.out_bEnableAutoControl
  description: Клапан доступен для автоматического управления. TRUE не подтверждает крайнее положение
    и не означает, что клапан открыт.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Valve.out_bBlocked
  description: Команды заблокированы текущими условиями. Полезно показывать рядом с ручными кнопками,
    чтобы оператор понимал, почему привод не движется.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Valve.out_diWorktime
  description: 'Время активности выходов открытия или закрытия, в часах. Это наработка движения: время
    простоя в открытом положении не считается движением привода.'
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Valve.inout_iRemoteMode
  description: Выбор дистанционного режима Auto/Manual на HMI. Аппаратное местное управление и жёсткие
    блокировки имеют более высокий приоритет.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Valve.inout_bOpen
  description: Ручная команда открытия. В Manual блок принимает её вместо автоматического запроса, но
    концевики, реверс и аварийные ограничения сохраняются.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Valve.inout_bClose
  description: Ручная команда закрытия. Противоположные ручные команды обрабатываются как взаимоисключающие;
    блок сам контролирует допустимость направления.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Valve.inout_bFaultReset
  description: Сброс аварий клапана после устранения причин. Не является командой движения и не отключает
    активный экстренный останов.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Valve.inout_bWorktimeReset
  description: Обнуление счётчика наработки движения. Отдельная сервисная команда, не обычное квитирование
    сообщения.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi:
- tag: Valve.out_bOpen
  description: 'Итоговая команда движения на открытие. Полезна для диагностики отдельно от состояния «Открыт»:
    команда может уже идти, а концевик ещё не достигнут.'
- tag: Valve.out_bClose
  description: Итоговая команда движения на закрытие. Вместе с командой открытия и состоянием помогает
    увидеть паузу реверса и этап движения.
common_mistakes:
- Снять ValOpenCmd и ожидать автоматического закрытия. Для закрытия нужна отдельная команда ValCloseCmd.
- Назначить один и тот же сигнал обоим концевикам. Два крайних положения одновременно означают недостоверное
  состояние, а не готовность.
- 'Ожидать аварии полного хода при включённом bFullTimeCtrlBypass. В шаблоне этот шунт включён по умолчанию:
  для контроля задайте реальное время и отключите шунт.'
- Считать bNO описанием текущего концевика. Это выбор нормального положения для аварийного перевода.
- Путать внешнюю аварию и экстренный останов. Авария может вызвать движение в нормальное положение; EStop
  и потеря питания снимают оба выхода.
- Ожидать мгновенного реверса с открытия на закрытие. Между направлениями выдерживается diChangeStateDelay.
- Считать ValLocal подключением кнопок местного поста. В шаблоне внешние команды формируются только в
  Auto и Manual; Local сам по себе их не добавляет.
