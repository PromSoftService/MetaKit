  language: st-template
  text: "// |SensId| - |SensComment|. |$Sensor|\n|SensId|_Sensor_Inst(\n    in_fRawMin := Conf.|SensId|_Sensor_fRawMin,\n    in_fRawMax := Conf.|SensId|_Sensor_fRawMax,\n    in_EV_fMin := Conf.|SensId|_Sensor_EV_fMin,\n    in_EV_fMax := Conf.|SensId|_Sensor_EV_fMax,\n    in_EV_fZP := Conf.|SensId|_Sensor_EV_fZP,\n    in_FV_fZP := Conf.|SensId|_Sensor_FV_fZP,\n    inout_FV_fXMin := Conf.|SensId|_Sensor_FV_fXMin,\n    inout_FV_fXMax := Conf.|SensId|_Sensor_FV_fXMax,\n    in_FV_fYMin := Conf.|SensId|_Sensor_FV_fYMin,\n    in_FV_fYMax := Conf.|SensId|_Sensor_FV_fYMax,\n    in_FV_bLimit := Conf.|SensId|_Sensor_FV_bLimit,\n    in_bEnableScale := |SensEnScale|,\n    in_fK := Conf.|SensId|_Sensor_fK,\n    in_fAdd := Conf.|SensId|_Sensor_fAdd,\n    in_Channel_bError := |ChErr|,\n    in_Channel_bErrorBypass := |SensChannelBypass|,\n    in_Channel_diErrorFilterTime := 0,\n    in_EV_fLL := Conf.|SensId|_Sensor_EV_fLL,\n    in_EV_fHH := Conf.|SensId|_Sensor_EV_fHH,\n    in_EV_bLimitBypass := Conf.|SensId|_Sensor_EV_bLimitBypass,\n    in_EV_diLimitFilterTime := Conf.|SensId|_Sensor_EV_diLimitFilterTime,\n    in_fRaw := |Raw|,\n    in_bReset := CabinetController_Inst.out_bFaultReset,\n    in_bAutoReset := |SensAutoReset|,\n    inout_bCalibrateFV_fXMin := View.|SensId|_Sensor_Inst_inout_bCalibrateFV_fXMin,\n    inout_bCalibrateFV_fXMax := View.|SensId|_Sensor_Inst_inout_bCalibrateFV_fXMax\n);\n//\n//\n//\n//\n\n// |SensId| - |SensComment|. Фильтр\n|SensId|_SensFilter_Inst(\n    in_fSignal := |SensId|_Sensor_Inst.out_fFV,\n    in_diPeriod := Conf.|SensId|_SensFilter_diPeriod,\n    in_iCount := Conf.|SensId|_SensFilter_iCount\n);\n//\n//\n//\n//"
