component: SwitchCtrl
slug: switchctrl
source: yaml/LibTempls/Ctrl/switchctrl.yaml
kind: Lib
title: Переключающее управление
category: Управление сигналами
summary: Организует пуск и останов двух связанных устройств в нужной последовательности.
description: 'SwitchCtrl выдаёт номер стадии 0, 1 или 2. При пуске сначала наступает стадия 1, после выдержки
  — 2. При останове сначала снимается стадия 2, а через выдержку — стадия 1. Так можно открыть клапан
  перед насосом и закрыть его позже останова насоса. Блок отсчитывает время, но не проверяет, что клапан
  действительно открылся: если нужно подтверждение концевиком, его проверяют отдельно.'
use_cases:
- Перед насосом нужно открыть клапан и выдержать паузу, а при останове закрыть клапан позже насоса.
- Два действия имеют заранее заданную временную последовательность без отдельных условий перехода.
not_for:
- 'Следующую стадию можно запускать только после подтверждения концевиком: одной выдержки SwitchCtrl для
  такого требования недостаточно.'
- 'Нужна произвольная многошаговая программа: здесь только состояния 0, 1, 2.'
- 'Нужна проверка исправности двигателей и клапанов: эти проверки принадлежат отдельным механизмам.'
diagram:
  lanes:
  - - Пуск
    - 'Стадия 1

      клапан'
    - Пауза 3 секунды
    - 'Стадия 2

      клапан + насос'
  - - Останов
    - 'Стадия 1

      насос уже выключен'
    - Пауза 3 секунды
    - 'Стадия 0

      клапан закрывается'
application:
  intro: Для промывки подайте bWashStart в SwitchCtrlEn и задайте задержку 3 секунды. Используйте условие
    out_iState >= 1 как команду клапану и out_iState = 2 как команду насосу.
  result: Клапан получает пуск первым, насос — через 3 секунды. При останове насос выключается первым,
    затем закрывается клапан. Оба условия должны идти в штатные блоки механизмов.
parameter_groups:
- title: Назовите операцию
  intro: Импортируйте компонент и укажите, какую задачу он выполняет. Идентификатор отличает этот экземпляр
    от остальных операций того же типа.
  items:
  - key: $SwitchCtrl
    default: Контроль переключения
    example: Контроль переключения
    description: Название типа операции в комментариях. Обычно оставляют исходную подпись; на времена
      и условия работы она не влияет.
  - key: SwitchCtrlId
    default: _ID_
    example: WASH
    description: Уникальное имя этой операции, например WASH. По нему создаётся экземпляр WASH_SwitchCtrl_Inst
      и его отдельные теги.
  - key: SwitchCtrlComment
    default: Комментарий
    example: Последовательность промывки
    description: 'Понятное назначение операции: Последовательность промывки. Этот текст используется в
      комментариях настроек и доступных тегов.'
- title: Подключите условие работы
  intro: Для промывки подайте bWashStart в SwitchCtrlEn и задайте задержку 3 секунды. Используйте условие
    out_iState >= 1 как команду клапану и out_iState = 2 как команду насосу. Сам вход разрешения не настраивает
    выдержки времени — они задаются отдельно в таблице настроек ниже.
  items:
  - key: SwitchCtrlEn
    default: 'true'
    example: bWashStart
    description: Запрос пуска двухступенчатой последовательности. TRUE ведёт к стадии 2 через 1; FALSE
      возвращает к 0 через 1 с настроенной задержкой.
- title: Выберите набор настроек
  intro: Для первого экземпляра оставьте оба поля пустыми. Числа из примера задайте в соответствующих
    настройках после импорта; исходные значения шаблона перечислены ниже отдельно.
  items:
  - key: SwitchCtrlConf
    default: ''
    example: ''
    description: Необязательное имя общего набора настроек. Пусто — настройки по SwitchCtrlId. Общее имя
      задавайте только если все использующие его операции должны иметь одинаковые времена и правила.
  - key: SwitchCtrlConfComment
    default: ''
    example: ''
    description: Название совместно используемых настроек. При пустом поле подпись строится из SwitchCtrlComment
      и названия типа операции.
example:
  title: Клапан перед насосом, насос перед закрытием
  scenario: При diDelay = 3 команда клапану задаётся условием WASH_SwitchCtrl_Inst.out_iState >= 1, команда
    насосу — WASH_SwitchCtrl_Inst.out_iState = 2. Эти условия передаются в автоматические запросы Valve
    и Engine.
  result: 'Пуск: клапан, затем через три секунды насос. Останов: насос, затем через три секунды снятие
    запроса клапана. Если требуется подтверждение открытого положения перед насосом, его проверка должна
    дополнительно участвовать в разрешении насоса.'
settings:
- key: …_SwitchCtrl_diDelay
  default: '1'
  description: Пауза между стадиями, секунды. Одна и та же выдержка используется при переходе к полной
    работе и при обратном останове.
hmi: []
optional_hmi:
- tag: SwitchCtrl.out_iState
  description: Номер стадии 0, 1 или 2. Можно добавить на HMI, чтобы показать ход последовательности.
    Номер не подтверждает физическую готовность насоса или клапана.
common_mistakes:
- Считать прохождение задержки подтверждением открытого клапана. SwitchCtrl не получает концевик и не
  может это проверить.
- 'Подключить насос к out_iState >= 1 вместо = 2: тогда насос начнёт работу одновременно с первой стадией.'
- 'Ожидать мгновенного выключения первой стадии после снятия разрешения: блок специально выдерживает обратную
  паузу.'
- Использовать обычное снятие SwitchCtrlEn как единственную цепь экстренного останова. Аварийные запреты
  должны действовать в самих механизмах независимо от последовательности.
