component: Sensor
slug: sensor
source: yaml/LibTempls/Sensor/Sensor.yaml
kind: Lib
title: Аналоговый датчик
category: Датчики
summary: Превращает число аналогового входа ПЛК в давление, температуру, уровень или другую измеряемую
  величину.
description: 'Sensor предназначен для обработки аналоговых датчиков. Например, модуль ввода сообщает число
  6000, а оператору нужно видеть 5 бар. Компонент сначала переводит число ПЛК в электрический сигнал —
  миллиамперы или вольты, затем в единицы измерения датчика. Он также проверяет исправность канала и допустимый
  диапазон электрического сигнала, а отдельный фильтр сглаживает колебания показаний. На выходе доступны
  и диагностические значения, и готовое сглаженное измерение. Проверка высокого или низкого давления по
  технологическому заданию — другая задача: для неё к Sensor добавляют SensLim.'
use_cases:
- Датчик давления, уровня, расхода или температуры выдаёт 4–20 мА либо 0–10 В, а аналоговый модуль ПЛК
  возвращает число в собственной шкале.
- На экране и в алгоритме нужны понятные единицы — бары, градусы, проценты или м³/ч — вместе с признаком
  исправности измерения.
- Показания немного колеблются, и перед отображением или плавным регулированием их нужно сгладить.
- Измерение уже приходит в физических единицах, но нужны поправка, диагностика или сглаживание. В этом
  случае масштабирование можно отключить и отдельно настроить применимые проверки.
not_for:
- 'Концевые выключатели и дискретные датчики уровня: их TRUE/FALSE не нужно переводить в аналоговую шкалу.'
- 'Самостоятельное управление насосом или клапаном: Sensor только подготавливает измерение и его диагностику.
  Реакцию оборудования на ошибку задаёт контур управления.'
- 'Технологические сообщения «давление выше 8 бар» или «уровень ниже 20 %»: для них к этому датчику добавляют
  SensLim. Границы 3 и 21 мА в Sensor проверяют электрический сигнал.'
diagram:
  lanes:
  - - 'Raw

      число входа ПЛК'
    - 'Электрическая шкала

      EV, например 12 мА'
    - 'HMI диагностики

      ток или напряжение'
  - - 'EV

      ток или напряжение'
    - 'Физическая шкала

      FV, например 5 бар'
    - 'Сглаживание

      среднее последних точек'
    - 'HMI измерения

      out_fY, бары'
  - - 'ChErr и границы EV

      ошибка канала / 3–21 мА'
    - 'Контроль ошибки

      выдержка для границ EV'
    - 'HMI предупреждений

      out_bError'
application:
  intro: Датчик давления 4–20 мА измеряет 0–10 бар. Аналоговый вход ПЛК представляет 0–20 мА числами от
    0 до 10000. Значит, рабочему диапазону датчика соответствуют Raw от 2000 до 10000.
  result: При устойчивом Raw = 6000 получаются 12 мА и 5 бар. После сглаживания out_fY также установится
    на 5 бар. Если ток остаётся за пределами 3–21 мА дольше заданной задержки, появляется ошибка датчика;
    число при этом нельзя считать достоверным измерением.
parameter_groups:
- title: Подключите сигнал
  intro: В таблице параметров MetaPlatform укажите идентификатор датчика, REAL-переменную аналогового
    входа и понятный комментарий. Если модуль выдаёт отдельную ошибку канала, подключите и её.
  items:
  - key: SensId
    default: _ID_
    example: PT101
    description: Уникальный идентификатор этого датчика, например PT101. Он становится префиксом создаваемых
      тегов. В другом компоненте по значению PT101 можно выбрать измерение и ошибку именно этого датчика.
  - key: Raw
    default: _IN_
    example: AI_PT101
    description: Имя REAL-переменной с текущим числом аналогового входа ПЛК, например AI_PT101. Это имя
      сигнала, а не номер канала. Если драйвер даёт целое число, преобразование в REAL выполните до передачи
      в Sensor.
  - key: SensComment
    default: Комментарий
    example: Давление в коллекторе
    description: Понятное название измерения, например «Давление в коллекторе». Оно попадёт в комментарии
      тегов и текст сообщения об ошибке. Пишите название так, чтобы оператор понял, о каком датчике речь.
  - key: ChErr
    default: 'FALSE'
    example: AI_PT101_ERROR
    description: 'BOOL-сигнал диагностики аналогового модуля: TRUE означает неисправность канала. Если
      модуль не предоставляет такого бита, задайте FALSE; электрические границы при этом можно продолжать
      контролировать.'
- title: Переведите число ПЛК в миллиамперы
  intro: 'В нашем примере 4 мА соответствуют числу 2000, а 20 мА — числу 10000. Запишите эти две пары.
    Компонент сможет рассчитать ток для любого промежуточного числа: например, из Raw = 6000 получатся
    12 мА. Значения 2000 и 10000 относятся к выбранной шкале модуля, а не ко всем ПЛК.'
  items:
  - key: SensRawMin
    default: ADC_4_IN_0_20
    example: '2000.0'
    description: Какое число выдаёт аналоговый вход в нижней рабочей точке датчика. Для модуля 0–20 мА
      → 0–10000 ток 4 мА даёт 2000. Не ставьте здесь 0 только потому, что физическая шкала давления начинается
      с нуля.
  - key: SensRawMax
    default: ADC_MAX_VALUE
    example: '10000.0'
    description: Какое число выдаёт тот же вход в верхней рабочей точке. В примере 20 мА соответствуют
      10000. Обе границы Raw берутся из настройки или документации конкретного модуля ввода.
  - key: SensEVMin
    default: '4.0'
    example: '4.0'
    description: Электрический сигнал, которому соответствует SensRawMin. Для примера это 4.0 мА. Так
      компонент узнаёт, что число 2000 нужно показать как 4 мА.
  - key: SensEVMax
    default: '20.0'
    example: '20.0'
    description: Электрический сигнал, которому соответствует SensRawMax. В примере 20.0 мА. Для датчика
      напряжения вместо миллиампер используйте вольты и согласуйте всю электрическую шкалу.
  - key: SensEnScale
    default: 'true'
    example: 'true'
    description: true включает оба пересчёта Raw → электрический сигнал → физическая величина. false используйте
      только если Raw уже содержит готовую величину; тогда остаётся коррекция коэффициентом и смещением.
- title: Получите давление в барах
  intro: 'Теперь задайте паспорт датчика: при 4 мА он измеряет 0 бар, при 20 мА — 10 бар. Электрические
    точки X и физические точки Y образуют ещё две пары. Поэтому 12 мА, то есть середина электрического
    диапазона, превращаются в 5 бар.'
  items:
  - key: SensFVXMin
    default: '4.0'
    example: '4.0'
    description: Нижняя электрическая точка преобразования в физическую величину. Для паспортной шкалы
      4–20 мА оставьте 4.0. Точка может изменяться при калибровке.
  - key: SensFVXMax
    default: '20.0'
    example: '20.0'
    description: Верхняя электрическая точка того же преобразования. Для датчика 4–20 мА — 20.0. Она соответствует
      физическому максимуму SensFVYMax.
  - key: SensFVYMin
    default: '0.0'
    example: '0.0'
    description: Что реально измеряет датчик при нижней электрической точке. Если 4 мА означают 0 бар,
      задайте 0.0. Для температуры или уровня здесь будут их собственные единицы.
  - key: SensFVYMax
    default: '100.0'
    example: '10.0'
    description: 'Что измеряет датчик при верхней электрической точке. Для датчика 0–10 бар задайте 10.0:
      тогда 12 мА превращаются в 5 бар. Это паспортный диапазон датчика, а не аварийная уставка.'
  - key: SensFVLimit
    default: 'false'
    example: 'false'
    description: true не даёт результату выйти за границы физической шкалы. false позволяет увидеть выход
      за диапазон. Ограничение числа не заменяет диагностику исправности датчика.
- title: Настройте диагностику датчика
  intro: Для токового датчика 4–20 мА оставим допустимый электрический диапазон 3–21 мА. Помеха короче
    трёх секунд не должна формировать ошибку по этим границам. Ошибка аппаратного канала ChErr проверяется
    отдельно и без этой выдержки. Оба шунта оставляем выключенными.
  items:
  - key: SensEVLL
    default: '3.0'
    example: '3.0'
    description: Нижняя граница допустимого электрического сигнала. Для 4–20 мА значение 3.0 позволяет
      отличить рабочий минимум от возможного обрыва. Это миллиамперы, не бары.
  - key: SensEVHH
    default: '21.0'
    example: '21.0'
    description: Верхняя граница допустимого электрического сигнала, например 21.0 мА. Превышение означает
      неисправность или выход токового сигнала за допустимый диапазон, а не обязательно высокое давление.
  - key: SensLimitFilterTime
    default: '0'
    example: '3'
    description: Сколько секунд ток должен непрерывно быть за диагностической границей, прежде чем зафиксируется
      ошибка. 3 отсеивает кратковременную помеху; 0 означает без дополнительной выдержки. Эта выдержка
      относится только к выходу за электрические границы; вход ChErr в текущем шаблоне обрабатывается
      без дополнительной задержки.
  - key: SensLimitBypass
    default: 'false'
    example: 'false'
    description: true отключает диагностику по SensEVLL/SensEVHH. Обычно false. Не используйте шунт как
      способ скрыть неправильно настроенную шкалу.
  - key: SensChannelBypass
    default: 'false'
    example: 'false'
    description: true игнорирует вход ChErr. Обычно оставляют false. Это отключение диагностики аппаратного
      канала, а не всех проверок Sensor.
  - key: SensAutoReset
    default: 'true'
    example: 'true'
    description: true снимает зафиксированную ошибку после восстановления сигнала. При false после устранения
      причины потребуется общий сброс аварий.
- title: Задайте замещение и поправки
  intro: 'Для обычного исправного датчика поправки не нужны: оставьте множитель 1.0 и добавку 0.0. Значение
    0 бар используется как нулевое/замещающее, но при ошибке его нельзя принимать за настоящее отсутствие
    давления. Эти параметры не заменяют проверку out_bError.'
  items:
  - key: SensEVZP
    default: '4.0'
    example: '4.0'
    description: Ниже этой электрической точки используется замещающее значение SensFVZP. Для обычного
      датчика 4–20 мА нулевая точка — 4.0 мА. Не путайте её с границей диагностики обрыва 3 мА.
  - key: SensFVZP
    default: '0.0'
    example: '0.0'
    description: 'Замещающее физическое значение в зоне нуля электрического сигнала и при ошибке датчика.
      Обычно 0.0, но нужное значение выбирают по процессу. Оно не становится достоверным измерением: в
      алгоритме всегда учитывайте out_bError, а на HMI помечайте датчик неисправным.'
  - key: SensK
    default: '1.0'
    example: '1.0'
    description: Множитель для коррекции физического результата. Обычно 1.0. Если модуль уже выдаёт температуру
      в десятых градуса, при отключённом масштабировании 0.1 превращает 253 в 25.3 °C.
  - key: SensAdd
    default: '0.0'
    example: '0.0'
    description: Поправка, прибавляемая после умножения на SensK. Обычно 0.0; например, +0.2 исправляет
      постоянное занижение на 0.2 бар после проверки эталоном.
- title: Сгладьте показания
  intro: Возьмём одну новую точку в секунду и усредним три последние точки. На HMI и в обычный регулятор
    передавайте out_fY из SensFilter. Число меняется спокойнее, но появляется задержка реакции — не увеличивайте
    усреднение без необходимости. Служебную подпись $Sensor можно оставить без изменения.
  items:
  - key: SensFilterPeriod
    default: '1'
    example: '1'
    description: Интервал между новыми выборками для сглаживания, в секундах. 1 означает одну новую точку
      в секунду, а не усреднение каждого цикла ПЛК.
  - key: SensFilterCount
    default: '3'
    example: '3'
    description: Сколько последних выборок участвует в среднем. При периоде 1 с и количестве 3 усредняются
      три последние точки. Большее число успокаивает показания, но замедляет реакцию.
  - key: $Sensor
    default: Датчик аналоговый
    example: Датчик аналоговый
    description: Подпись типа измерительного блока, добавляемая к комментарию датчика. Обычно оставляют
      «Датчик аналоговый»; менять её для подключения сигнала не требуется.
example:
  title: Проверьте результат на трёх точках
  scenario: При устойчивом Raw = 2000 ожидаются 4 мА и 0 бар; при Raw = 6000 — 12 мА и 5 бар; при Raw
    = 10000 — 20 мА и 10 бар. После каждого изменения дождитесь обновления сглаженного значения. Если
    середина шкалы не совпадает, сначала проверьте две пары Raw/EV, затем две пары EV/FV.
  result: Показания физических единиц смотрите в SensFilter.out_fY, ток петли — в Sensor.out_fEV, достоверность
    — в Sensor.out_bError. Это три разных задачи. При отключении датчика проверьте появление ошибки; замещённое
    или ещё не успевшее измениться сглаженное число не должно восприниматься как нормальное давление.
settings:
- key: …_Sensor_fRawMin
  default: ADC_4_IN_0_20
  description: Какое число выдаёт аналоговый вход в нижней рабочей точке датчика. Для модуля 0–20 мА →
    0–10000 ток 4 мА даёт 2000. Не ставьте здесь 0 только потому, что физическая шкала давления начинается
    с нуля. Значение по умолчанию — имя проектной константы; проверьте её числовое значение для своего
    ПЛК.
- key: …_Sensor_fRawMax
  default: ADC_MAX_VALUE
  description: Какое число выдаёт тот же вход в верхней рабочей точке. В примере 20 мА соответствуют 10000.
    Обе границы Raw берутся из настройки или документации конкретного модуля ввода. Значение по умолчанию
    — имя проектной константы; проверьте её числовое значение для своего ПЛК.
- key: …_Sensor_EV_fMin
  default: '4.0'
  description: Электрический сигнал, которому соответствует SensRawMin. Для примера это 4.0 мА. Так компонент
    узнаёт, что число 2000 нужно показать как 4 мА.
- key: …_Sensor_EV_fMax
  default: '20.0'
  description: Электрический сигнал, которому соответствует SensRawMax. В примере 20.0 мА. Для датчика
    напряжения вместо миллиампер используйте вольты и согласуйте всю электрическую шкалу.
- key: …_Sensor_EV_fZP
  default: '4.0'
  description: Ниже этой электрической точки используется замещающее значение SensFVZP. Для обычного датчика
    4–20 мА нулевая точка — 4.0 мА. Не путайте её с границей диагностики обрыва 3 мА.
- key: …_Sensor_FV_fZP
  default: '0.0'
  description: 'Число, подставляемое в зоне нуля или при ошибке датчика, до дальнейшей обработки результата.
    Обычно 0.0, но его смысл нужно выбрать по процессу. Замещённое число не становится достоверным измерением:
    учитывайте out_bError.'
- key: …_Sensor_FV_fXMin
  default: '4.0'
  description: Нижняя электрическая точка преобразования в физическую величину. Для паспортной шкалы 4–20
    мА оставьте 4.0. Точка может изменяться при калибровке.
- key: …_Sensor_FV_fXMax
  default: '20.0'
  description: Верхняя электрическая точка того же преобразования. Для датчика 4–20 мА — 20.0. Она соответствует
    физическому максимуму SensFVYMax.
- key: …_Sensor_FV_fYMin
  default: '0.0'
  description: Что реально измеряет датчик при нижней электрической точке. Если 4 мА означают 0 бар, задайте
    0.0. Для температуры или уровня здесь будут их собственные единицы.
- key: …_Sensor_FV_fYMax
  default: '100.0'
  description: 'Что измеряет датчик при верхней электрической точке. Для датчика 0–10 бар задайте 10.0:
    тогда 12 мА превращаются в 5 бар. Это паспортный диапазон датчика, а не аварийная уставка. В исходном
    шаблоне по умолчанию 100.0; для приведённого датчика 0–10 бар задайте SensFVYMax = 10.0.'
- key: …_Sensor_FV_bLimit
  default: 'false'
  description: true не даёт результату выйти за границы физической шкалы. false позволяет увидеть выход
    за диапазон. Ограничение числа не заменяет диагностику исправности датчика.
- key: …_Sensor_fK
  default: '1.0'
  description: Множитель для коррекции физического результата. Обычно 1.0. Если модуль уже выдаёт температуру
    в десятых градуса, при отключённом масштабировании 0.1 превращает 253 в 25.3 °C.
- key: …_Sensor_fAdd
  default: '0.0'
  description: Поправка, прибавляемая после умножения на SensK. Обычно 0.0; например, +0.2 исправляет
    постоянное занижение на 0.2 бар после проверки эталоном.
- key: …_Sensor_EV_fLL
  default: '3.0'
  description: Нижняя граница допустимого электрического сигнала. Для 4–20 мА значение 3.0 позволяет отличить
    рабочий минимум от возможного обрыва. Это миллиамперы, не бары.
- key: …_Sensor_EV_fHH
  default: '21.0'
  description: Верхняя граница допустимого электрического сигнала, например 21.0 мА. Превышение означает
    неисправность или выход токового сигнала за допустимый диапазон, а не обязательно высокое давление.
- key: …_Sensor_EV_bLimitBypass
  default: 'false'
  description: true отключает диагностику по SensEVLL/SensEVHH. Обычно false. Не используйте шунт как
    способ скрыть неправильно настроенную шкалу.
- key: …_Sensor_EV_diLimitFilterTime
  default: '0'
  description: Сколько секунд ток должен непрерывно быть за диагностической границей, прежде чем зафиксируется
    ошибка. 3 отсеивает кратковременную помеху; 0 означает без дополнительной выдержки. Не задерживает
    аппаратную ошибку ChErr. В примере используется 3 секунды, исходное значение шаблона — 0.
- key: …_SensFilter_diPeriod
  default: '1'
  description: Интервал между новыми выборками для сглаживания, в секундах. 1 означает одну новую точку
    в секунду, а не усреднение каждого цикла ПЛК.
- key: …_SensFilter_iCount
  default: '3'
  description: Сколько последних выборок участвует в среднем. При периоде 1 с и количестве 3 усредняются
    три последние точки. Большее число успокаивает показания, но замедляет реакцию.
hmi:
- tag: Sensor.out_fEV
  description: 'Текущий электрический сигнал. В примере это ток в миллиамперах: по нему удобно проверить
    петлю 4–20 мА и правильность первой шкалы. Это ещё не давление.'
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Sensor.out_bError
  description: 'Измерение неисправно: сработала диагностика канала или электрических границ. По умолчанию
    выведено на HMI и формирует предупреждение; для алгоритма TRUE означает «измерению не доверять».'
  hmi: Да
  flt: —
  wrn: Да
  alm: —
  trend: —
- tag: Sensor.inout_bCalibrateFV_fXMin
  description: 'Команда калибровки нижней точки. Подайте на датчик известное нижнее физическое значение
    и выполните команду: текущий электрический сигнал запишется как нижняя точка X. Это действие изменяет
    калибровку, а не просто показывает показание.'
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Sensor.inout_bCalibrateFV_fXMax
  description: Команда калибровки верхней точки. Выполняйте только при известном верхнем физическом значении.
    Текущий электрический сигнал станет верхней точкой X; случайное нажатие нарушит масштабирование.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: SensFilter.out_fY
  description: Готовое сглаженное измерение в физических единицах, в примере — давление в барах. По умолчанию
    доступно HMI и включено в Trend. Вместе с числом используйте признак ошибки Sensor.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: Да
optional_hmi:
- tag: Sensor.out_fFV
  description: Физическое значение до сглаживания. Можно добавить строку в таблицу данных и включить HMI
    или Trend, чтобы при наладке сравнивать исходное и усреднённое давление. Оно также требует проверки
    out_bError.
- tag: Sensor.out_Channel_bError
  description: Отдельная зафиксированная ошибка аппаратного канала. Полезна, когда общего сообщения недостаточно
    и оператору нужно отличить диагностику модуля от выхода токового сигнала за границы.
- tag: Sensor.out_FV_bError
  description: Общий признак ошибки по электрическим границам. Несмотря на FV в имени, этот выход относится
    к диагностике электрического сигнала, а не к технологическим пределам давления.
- tag: Sensor.out_FV_bLL
  description: Сработала нижняя электрическая граница, например ток ниже 3 мА. Можно сформировать отдельное
    сообщение «Ток датчика ниже допустимого». Для предела давления в барах нужен SensLim.
- tag: Sensor.out_FV_bHH
  description: Сработала верхняя электрическая граница, например ток выше 21 мА. Можно вывести отдельную
    диагностику верхнего электрического предела. Не дублируйте общий out_bError без необходимости.
common_mistakes:
- Ввести 0 и 10000 как границы Raw, но сопоставить их с 4 и 20 мА. Если 0 реально означает 0 мА, для рабочего
  минимума 4 мА в данном примере нужно 2000.
- Оставить физический максимум 100.0 из шаблона для датчика 0–10 бар. Вторая шкала должна соответствовать
  паспорту именно этого датчика.
- Оценивать исправность только по числу давления. При ошибке есть замещение, а фильтр некоторое время
  хранит предыдущие точки; проверяйте out_bError независимо от показания.
- Применить границы 3 и 21 к датчику 0–10 В или к уже готовой температуре. Диагностика должна соответствовать
  типу входного сигнала; неприменимую проверку нужно перенастроить или осознанно отключить.
- Увеличить число усредняемых точек, чтобы спрятать нестабильность процесса. Сглаживание уменьшает шум,
  но также задерживает реакцию отображения и регулятора.
- Ожидать аварии «высокое давление» от электрической границы 21 мА. Для технологических пределов добавьте
  SensLim и задайте их в барах.
