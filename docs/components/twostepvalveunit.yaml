component: TwoStepValveUnit
slug: twostepvalveunit
source: yaml/UnitsTmpls/twostepvalveunit.yaml
kind: Unit
title: Клапан с двухпозиционным регулятором
category: Готовые контуры
summary: Открывает и закрывает клапан по двум границам измерения, например управляет наполнением ёмкости.
description: 'TwoStepValveUnit объединяет двухпозиционный регулятор, дискретный клапан, CascadeUnit и сообщения.
  В Auto клапан открыт по выбранному действию Heating или Cooling и закрывается при противоположном действии
  либо снятии StartCmd. Между границами сохраняется предыдущий выбор, что уменьшает частые переключения.
  CValve учитывает режимы, концевики, паузу реверса и свои защиты. В Manual оператор использует кнопки HMI.
  Важная особенность: ошибка Sensor включена в экстренный останов клапана, поэтому снимает обе команды во
  всех режимах; это не команда обязательного закрытия.'
use_cases:
- 'Наполнение ёмкости через клапан: открыть ниже нижней границы, закрыть выше верхней.'
- 'Слив или охлаждение: клапан должен открываться при слишком высоком измерении и закрываться после его
  снижения.'
not_for:
- Нужно плавно удерживать промежуточное положение импульсами — используйте PiddValveUnit.
- Привод принимает аналоговое положение 0–100 % — нужен PidCtrlValveUnit.
- 'При ошибке Sensor обязательно нужно закрыть клапан до конца или сохранить ручное движение: текущий Unit
  подаёт эту ошибку в EStop и снимает обе команды.'
- 'Есть только два дискретных датчика уровня без Sensor: текущий Unit имеет постоянно включённую аналоговую
  ветку и не предоставляет Lo/Hi.'
diagram:
  lanes:
  - - Sensor LT101
    - 'TwoStep

      границы и память'
    - CValve Auto
    - DO открыть / закрыть
  - - Кнопки HMI
    - CValve Manual
    - DO открыть / закрыть
  - - Ошибка Sensor
    - 'EStop CValve

      оба выхода сняты'
  - - Концевики / время хода
    - Состояние клапана
    - HMI положения
  - - Фильтр аварий
    - HMI аварий
  - - Фильтр предупреждений
    - HMI предупреждений
application:
  intro: Клапан V101 наполняет ёмкость, уровень измеряет Sensor LT101. Наполнение разрешает bTankFillingEnabled.
    При падении уровня ниже 40 % клапан должен открыться, при подъёме выше 60 % — закрыться. Подключите
    оба концевика и реальные направления привода.
  result: 'При нормальном измерении Auto работает по границам. Manual даёт отдельные движения с HMI. При
    ошибке LT101 регулятор выключается и CValve получает EStop: команды движения снимаются, но физическое
    закрытие не гарантируется.'
parameter_groups:
- title: Назовите агрегат и выберите родителя
  intro: CabinetController_Inst уже должен быть создан отдельно или в General. Здесь задаются общие для
    внутреннего механизма и сообщений имя и комментарий.
  items:
  - key: Id
    default: _ID_
    example: V101
    description: Уникальное имя всего агрегата, например V101. По нему создаются его Valve, CascadeUnit
      и две группы сообщений. Второй компонент с таким Id создавать нельзя.
  - key: Comment
    default: Комментарий
    example: Клапан наполнения ёмкости
    description: Понятное название всего агрегата, например «Клапан подачи воды». Подписи внутренних блоков
      добавляются к нему автоматически.
  - key: Parent
    default: CabinetController_Inst
    example: CabinetController_Inst
    description: 'Имя существующего CabinetController или вышестоящего CascadeUnit. От родителя берутся
      питание, экстренный останов, сброс аварий и наработки. Автоматическая команда работы и выбранный режим
      родителя сюда сами не переходят: задайте StartCmd отдельно.'
- title: Подключите разрешение контура
  intro: 'StartCmd разрешает TwoStep, а выбранное действие определяет открытие клапана. При снятом StartCmd
    в Auto задаётся закрытие. Экстренный останов — другая ситуация: он снимает обе команды движения.'
  items:
  - key: StartCmd
    default: 'false'
    example: CabinetController_Inst.out_bWorkAndPower AND bTankFillingEnabled
    description: Общее разрешение автоматического контура. При TRUE клапан открывается только по выбранному
      действию TwoStep. При FALSE в Auto задано закрытие. В Manual вместо регулятора используются кнопки
      Valve.
- title: Подключите выбор режима
  intro: Аппаратный Local имеет приоритет. При разрешённом Remote оператор выбирает Auto или Manual с HMI.
    Готовый Unit не содержит отдельных входов местных кнопок.
  items:
  - key: ValveLocal
    default: 'false'
    example: DI_V101_LOCAL
    description: 'Сигнал переключателя «Местное». Local имеет приоритет над дистанционным выбором. В данном
      Unit нет отдельных параметров местных кнопок: автоматические команды StartCmd подаются только в Auto.'
  - key: ValveRemote
    default: 'true'
    example: DI_V101_REMOTE
    description: Разрешение дистанционного управления. При TRUE и отсутствии Local оператор выбирает Auto
      или Manual с HMI. При FALSE без Local получается Off.
- title: Подключите концевики и направления
  intro: Подключите реальные входы и выходы, проверьте полярность и соответствие команд обратной связи.
    Команда не заменяет фактический контакт состояния.
  items:
  - key: ValveStateOpen
    default: _DI_
    example: DI_V101_OPEN
    description: Концевик «Полностью открыт». TRUE означает достигнутое крайнее положение, а не команду
      открытия. При включённом контроле концевиков он снимает команду дальнейшего открытия.
  - key: ValveStateClose
    default: _DI_
    example: DI_V101_CLOSE
    description: Концевик «Полностью закрыт». Подключайте с такой полярностью, чтобы TRUE означало достигнутое
      закрытое положение. Два концевика одновременно дают недостоверное состояние.
  - key: ValveOpenOut
    default: _DO_OPEN_
    example: DO_V101_OPEN
    description: Имя дискретного выхода движения на открытие, например DO_V101_OPEN. Это итоговая команда
      блока, уже прошедшая проверки режима и защит.
  - key: ValveCloseOut
    default: _DO_CLOSE_
    example: DO_V101_CLOSE
    description: Имя отдельного выхода движения на закрытие, например DO_V101_CLOSE. Пауза перед сменой
      направления задаётся в настройках CValve.
- title: Выберите настройки механизма
  intro: Для первого агрегата оставьте Conf-поля пустыми. Значения времён и поведения задайте в настройках
    ниже по реальному оборудованию, а не по имени шаблона.
  items:
  - key: $Valve
    default: Клапан
    example: Клапан
    description: Название внутреннего механизма в комментариях; обычно менять не требуется.
  - key: ValveConf
    default: ''
    example: ''
    description: Необязательное имя общих настроек однотипных клапанов. Пусто — настройки по Id этого Unit.
      Общее имя допустимо только при одинаковых значениях и смысле всех объединяемых настроек.
  - key: ValveConfComment
    default: ''
    example: ''
    description: 'Понятное название общего набора, если заполнен ValveConf. Иначе оставьте пустым: подпись
      формируется из Comment всего Unit и $Valve.'
- title: Определите данные для верхнего каскада
  intro: Готовность, режим, состояние, аварию и наработку Unit уже получает от собственного механизма. Самостоятельно
    задаётся только Power; для простого дискретного агрегата его можно не использовать.
  items:
  - key: $CasUnit
    default: Элемент каскада
    example: Элемент каскада
    description: 'Подпись встроенного интерфейса агрегата. Второй CascadeUnit импортировать не нужно: готовый
      Unit уже содержит его.'
  - key: Power
    default: '0.0'
    example: '0.0'
    description: Мощность или производительность агрегата для верхнего каскада. Это не команда исполнительному
      механизму. Оставьте 0.0, если контроль мощности верхнего Cascade выключен; иначе передайте осмысленное
      значение в общей шкале участников.
- title: Подключите уровень и выберите действие клапана
  intro: В примере клапан V101 наполняет ёмкость по Sensor LT101. Нужны открытие при низком уровне и закрытие
    при высоком, поэтому выбираем нижнее действие Heating.
  items:
  - key: $TwoStep
    default: Двухпозиционный регулятор
    example: Двухпозиционный регулятор
    description: Подпись встроенного двухпозиционного регулятора. Он выбирает включить или выключить механизм
      по двум границам, а не задаёт его частоту.
  - key: SensId
    default: _ID_
    example: LT101
    description: Id готового Sensor, например LT101 с уровнем 0–100 %. Unit использует сглаженное значение
      и ошибку. Ошибка здесь подаётся в экстренный останов CValve и запрещает оба направления, включая ручное
      управление.
  - key: TwoStepCoolingMode
    default: 'false'
    example: 'false'
    description: 'false выбирает нижнее действие: открыть при низком измерении, например для наполнения.
      true выбирает верхнее: открыть при высоком измерении, например для слива. Это не выбор Auto/Manual
      и не переключение физических выходов местами.'
- title: Выберите набор границ переключения
  intro: 'Для наполнения задайте SP = 50.0 и Hys = 10.0: клапан открывается ниже 40 % и закрывается выше
    60 %. Между границами сохраняется прежнее действие. Пустые Conf-поля создают индивидуальные настройки
    V101.'
  items:
  - key: TwoStepConf
    default: ''
    example: ''
    description: Необязательное имя общих настроек SP и Hys. Пусто — настройки по Id Unit. Совместное имя
      используйте, только если несколько контуров должны иметь одинаковые границы переключения.
  - key: TwoStepConfComment
    default: ''
    example: ''
    description: Название общих уставки и гистерезиса. При пустом поле используются Comment всего Unit и
      $TwoStep. Выбранное действие Heating/Cooling задаётся отдельно параметром TwoStepCoolingMode.
- title: Подключите внешнюю аварию
  intro: Встроенный фильтр аварий уже подключён к внешней аварии механизма. Ниже канал 1; каналы 2–8 заполняются
    аналогично. Для каждого можно задать задержку и шунт в настройках.
  items:
  - key: $Flts
    default: Аварии
    example: Аварии
    description: 'Подпись группы в комментариях к коду. Категория сообщений уже задана шаблоном: Flt для
      аварий, Wrn для предупреждений.'
  - key: FltComment
    default: аварии
    example: Клапан V101
    description: Общий контекст сообщений этой группы, например «Клапан V101». Внешние причины используют
      это поле и текст своей строки, поэтому не оставляйте всем агрегатам безликое «аварии».
  - key: FltId1
    default: _ID_
    example: DRIVE_FAULT
    description: Короткое имя первой причины. Для других мест используются такие же поля с номерами 2–8.
      Пустой Id исключает соответствующий канал и его настройки; неиспользуемые идентификаторы нужно очистить.
  - key: FltComment1
    default: авария
    example: Неисправность привода
    description: Текст, объясняющий оператору конкретную причину, а не имя входа ПЛК. Он добавляется к общему
      комментарию группы.
  - key: FltIn1
    default: _DI_
    example: DI_V101_FAULT
    description: 'BOOL-сигнал или выражение: TRUE означает активную причину. Проверьте полярность контакта.
      Для остальных каналов задаются независимые сигналы.'
- title: Задайте контроль и сброс аварии
  intro: Для неисправности привода контроль постоянный, а снятие — после устранения причины и общего сброса
    Unit. Экстренный останов не следует заменять задержанной аварией фильтра.
  items:
  - key: FltEnable1
    default: 'true'
    example: 'true'
    description: Когда проверять именно эту причину. true — постоянно; условие процесса ограничивает контроль
      нужным этапом. Это не разрешение всего Unit.
  - key: FltAutoReset1
    default: 'false'
    example: 'false'
    description: false сохраняет сработавшую причину до устранения неисправности и сброса. true позволяет
      снять её автоматически после исчезновения входного условия.
- title: Добавьте предупреждение без останова
  intro: Встроенный фильтр предупреждений формирует сообщения, но его общий выход не включён в останов механизма.
    В примере сообщаем о необходимости обслуживания. Неиспользуемые места 2–8 исключите пустыми Id.
  items:
  - key: $Wrns
    default: Предупреждения
    example: Предупреждения
    description: 'Подпись группы в комментариях к коду. Категория сообщений уже задана шаблоном: Flt для
      аварий, Wrn для предупреждений.'
  - key: WrnComment
    default: предупреждения
    example: Клапан V101
    description: Общий контекст сообщений этой группы, например «Клапан V101». Внешние причины используют
      это поле и текст своей строки, поэтому не оставляйте всем агрегатам безликое «предупреждения».
  - key: WrnId1
    default: _ID_
    example: SERVICE
    description: Короткое имя первой причины. Для других мест используются такие же поля с номерами 2–8.
      Пустой Id исключает соответствующий канал и его настройки; неиспользуемые идентификаторы нужно очистить.
  - key: WrnComment1
    default: предупреждение
    example: Требуется обслуживание
    description: Текст, объясняющий оператору конкретную причину, а не имя входа ПЛК. Он добавляется к общему
      комментарию группы.
  - key: WrnIn1
    default: _DI_
    example: bV101MaintenanceDue
    description: 'BOOL-сигнал или выражение: TRUE означает активную причину. Проверьте полярность контакта.
      Для остальных каналов задаются независимые сигналы.'
- title: Задайте контроль и сброс предупреждения
  intro: Пусть сообщение об обслуживании исчезает после того, как внешняя логика снимет bMaintenanceDue.
    Для канала в примере задержка равна нулю, шунт выключен.
  items:
  - key: WrnEnable1
    default: 'true'
    example: 'true'
    description: Когда проверять именно эту причину. true — постоянно; условие процесса ограничивает контроль
      нужным этапом. Это не разрешение всего Unit.
  - key: WrnAutoReset1
    default: 'true'
    example: 'true'
    description: true снимает предупреждение после исчезновения причины. false оставляет его до сброса.
      Этот выбор не превращает предупреждение в аварийную блокировку.
example:
  title: 'Клапан наполнения: 40–60 %'
  scenario: Укажите TwoStepCoolingMode = false, SP = 50.0, Hys = 10.0. При исправном LT101 и StartCmd =
    TRUE низкий уровень выбирает открытие, высокий — закрытие. Для привода с ходом 30 с после проверки можно
    задать diFullTime = 35 с и bFullTimeCtrlBypass = false; исходное время 1 с не является паспортной настройкой.
  result: 'Снятие обычного StartCmd вызывает закрытие в Auto. Ошибка датчика действует иначе: блокирует
    оба направления через EStop. Эти два сценария нужно проверять отдельно при наладке. Для слива выберите
    TwoStepCoolingMode = true и проверьте противоположное действие на те же границы.'
settings:
- key: …_Valve_bNO
  default: 'false'
  description: 'Нормальное положение клапана: false — закрыто, true — открыто. Это целевое направление для
    аварийного перевода, а не фактическое положение концевика.'
- key: …_Valve_bEnableFaultCtrl
  default: 'false'
  description: Разрешает перевод в нормальное положение при аварии. При false авария снимает обычные команды.
    Проверьте совместно с bNO и возможностями реального привода.
- key: …_Valve_bEnableCheckState
  default: 'true'
  description: true учитывает концевики и снимает команду соответствующего направления после достижения
    крайнего положения. При false команда может удерживаться даже при сработавшем концевике; выбирайте это
    только для схем, которым такое поведение действительно требуется.
- key: …_Valve_diChangeStateDelay
  default: '1'
  description: Минимальная пауза между противоположными направлениями, секунды. Защищает привод от мгновенного
    реверса; пауза без обеих команд также учитывается.
- key: …_Valve_diFullTime
  default: '1'
  description: Допустимое время полного движения, секунды. Задайте по паспорту и проверке привода с запасом.
    При включённом контроле превышение создаёт аварию открытия или закрытия.
- key: …_Valve_bFullTimeCtrlBypass
  default: 'true'
  description: true отключает ограничение времени хода. Чтобы реально обнаруживать незавершённое движение,
    задайте diFullTime и снимите этот шунт.
- key: …_TwoStep_fSP
  default: '0.0'
  description: Центр диапазона переключения в единицах измерения. Например, при 60 °C и гистерезисе 2 °C
    нижняя и верхняя границы — 58 и 62 °C.
- key: …_TwoStep_fHys
  default: '0.0'
  description: Расстояние от уставки до границ переключения. Между ними сохраняется прежнее действие, поэтому
    механизм не переключается на каждом колебании около уставки.
- key: …_Flts_SgnlsFltr_<Id причины>_bBypass
  default: 'false'
  description: 'Шунт одной причины аварии: true исключает её из обработки. Создаётся только для непустого
    Id соответствующего канала. Общий индикатор шунта помогает не забыть отключённую проверку.'
- key: …_Flts_SgnlsFltr_<Id причины>_diDelay
  default: '0'
  description: Сколько секунд причина аварии должна оставаться активной до срабатывания. 0 — без дополнительной
    выдержки. У каждого из каналов 1–8 своя настройка; отключённый пустым Id канал её не создаёт.
- key: …_Wrns_SgnlsFltr_<Id причины>_bBypass
  default: 'false'
  description: 'Шунт одной причины предупреждения: true исключает её из обработки. Создаётся только для
    непустого Id соответствующего канала. Общий индикатор шунта помогает не забыть отключённую проверку.'
- key: …_Wrns_SgnlsFltr_<Id причины>_diDelay
  default: '0'
  description: Сколько секунд причина предупреждения должна оставаться активной до срабатывания. 0 — без
    дополнительной выдержки. У каждого из каналов 1–8 своя настройка; отключённый пустым Id канал её не
    создаёт.
