- key: …_Valve_diChangeStateDelay
  default: '1'
  description: Задержка смены состояния
- key: …_Valve_diFullTime
  default: '90'
  description: Время полного хода
- key: …_Valve_bFullTimeCtrlBypass
  default: 'false'
  description: Шунт контроля полного хода
