component: PID
slug: pid
source: yaml/LibTempls/Regulators/PID.yaml
kind: Lib
title: PID-регулятор
category: Регуляторы
summary: Плавно изменяет задание частоты, мощности или положения, чтобы держать измеряемую величину около
  уставки.
description: PID сравнивает измерение с уставкой и подбирает аналоговое управляющее воздействие. Например,
  когда давление ниже задания, он увеличивает команду частотному преобразователю насоса. В этой реализации
  конечное задание накапливается в out_fYS; out_fY показывает отдельный расчётный шаг и не является готовым
  положением привода. Шаблон также содержит ручное задание и отдельную шкалу физического аналогового выхода.
  Режимы двигателя, пускатель и защиты исполнительного механизма в него не входят.
use_cases:
- Нужно плавно поддерживать давление, температуру, уровень или расход через аналоговое задание исполнительному
  механизму.
- Вы собираете контур из отдельных Lib-компонентов и сами связываете разрешение PID с состоянием двигателя
  или клапана.
not_for:
- 'Привод принимает только команды «Открыть/Закрыть»: используйте PIDD либо ThreeStep вместе с Valve.'
- 'Нужно только включать насос на нижней границе и выключать на верхней: достаточно TwoStep.'
- 'Нужен готовый насосный контур с режимами двигателя, защитами и AO: удобнее PidEngineUnit.'
diagram:
  lanes:
  - - 'Sensor

      измерение и ошибка'
    - 'PID

      сравнение с SP'
    - 'out_fYS

      например 47 %'
    - 'Шкала AO

      код для ПЧ'
  - - 'PID

      расчётный шаг'
    - out_fY
    - 'HMI диагностики

      шаг и Trend'
  - - 'PID

      итоговое задание'
    - out_fYS
    - 'HMI управления

      задание и Trend'
application:
  intro: Создайте Sensor с SensId = PT101 для давления. В PID укажите PIDId = PIC101, PIDSensId = PT101
    и выход AO_P101. На HMI задайте давление 4.5 бар; инженерная шкала выхода — 0–100 %. Электрическую
    шкалу AO настройте по документации модуля вывода.
  result: 'PID использует сглаженное давление PT101 и отключается при ошибке этого датчика. Итоговый out_fYS
    переводится в число аналогового выхода. По руководству текущего CPID оставьте Ti = 0: накопление out_fYS
    уже даёт интегральное поведение; Kp, Td и период расчёта подбираются при наладке.'
parameter_groups:
- title: Назовите регулятор
  intro: Создайте отдельное имя регулятора PIC101. Sensor PT101 уже должен быть добавлен в проект. CabinetController_Inst
    также используется шаблоном для общего сброса внутреннего состояния.
  items:
  - key: $PID
    default: ПИД-регулятор
    example: ПИД-регулятор
    description: Название типа блока в комментариях. Обычно «ПИД-регулятор»; не требует изменения при
      подключении нового датчика.
  - key: PIDId
    default: _ID_
    example: PIC101
    description: Уникальное имя регулятора, например PIC101. По нему создаётся экземпляр PIC101_PID_Inst;
      это не имя датчика и не имя AO.
  - key: PIDComment
    default: Комментарий
    example: Давление в напорном коллекторе
    description: Понятное назначение контура, например «Давление в напорном коллекторе». Оно используется
      в комментариях настроек и HMI регулятора.
- title: Подключите измерение и разрешение
  intro: В примере PID управляет частотой насоса P101 по давлению PT101. Разрешайте расчёт только когда
    двигатель работает. Ошибку Sensor шаблон проверяет сам.
  items:
  - key: PIDSensId
    default: _ID_
    example: PT101
    description: Id уже созданного Sensor, например PT101. PID берёт его сглаженное измерение и проверяет
      его ошибку. Здесь не указывают полное имя переменной или Id самого регулятора.
  - key: PIDEnExtra
    default: 'true'
    example: P101_Engine_Inst.out_bState
    description: 'Дополнительное разрешение расчёта, например P101_Engine_Inst.out_bState: регулировать
      только при работающем насосе. Ошибка выбранного Sensor уже проверяется отдельно. true не добавляет
      автоматическую связь с состоянием исполнительного механизма.'
- title: Выберите настройки PID
  intro: Для одного контура оставьте поля пустыми. Уставка 4.5 бар, период и коэффициенты задаются в настройках
    ниже, а не как имя датчика или входного канала.
  items:
  - key: PIDConf
    default: ''
    example: ''
    description: Необязательное имя общих настроек PID. Пусто — настройки индивидуальные по PIDId. Одно
      имя допустимо для контуров с одинаковыми уставками, коэффициентами и пределами, которые действительно
      должны изменяться вместе.
  - key: PIDConfComment
    default: ''
    example: ''
    description: Название общего набора настроек PID. При пустом поле используются PIDComment и $PID.
      Не задаёт комментарий шкалы аналогового выхода.
- title: Подключите аналоговый выход
  intro: Предположим, AO имеет шкалу 0–20 мА → 0–10000, а ПЧ принимает 4–20 мА. Тогда 0 % должны давать
    код 2000, а 100 % — 10000. Укажите реальные границы вашего модуля.
  items:
  - key: $Out
    default: Аналоговый выход
    example: Аналоговый выход
    description: Подпись отдельной секции физического аналогового выхода. Шкала выхода не является коэффициентом
      PID.
  - key: OutRaw
    default: _AO_
    example: AO_P101
    description: Имя переменной физического аналогового выхода, например AO_P101. В неё записывается целочисленный
      результат масштабирования. Это не частота в герцах и не процент мощности.
  - key: OutRawMin
    default: ADC_4_IN_0_20
    example: '2000.0'
    description: Число, которое нужно записать в AO для минимального электрического сигнала. Например,
      2000 соответствует 4 мА у модуля 0–20 мА → 0–10000. Берите значение из настройки реального модуля
      вывода.
  - key: OutRawMax
    default: ADC_MAX_VALUE
    example: '10000.0'
    description: Число AO для максимального электрического сигнала. Для того же примера 20 мА соответствуют
      10000. Настройка относится к выходному каналу, а не к уставке PID.
- title: Выберите настройки электрической шкалы
  intro: По умолчанию шкала AO индивидуальная по PIDId. Она не должна зависеть от того, объединены ли
    уставки регуляторов через PIDConf. Общую шкалу задавайте только для одинаковых выходных каналов.
  items:
  - key: OutConf
    default: ''
    example: ''
    description: Необязательное имя общих настроек электрической шкалы AO. Пусто — префиксом будет PIDId,
      независимо от PIDConf. Для общего OutConf границы OutRawMin/Max у всех использующих его компонентов
      должны совпадать.
  - key: OutConfComment
    default: ''
    example: ''
    description: Понятное название общей электрической шкалы, если применяется OutConf. При пустом поле
      комментарий строится от PIDComment и $Out, а не от PIDConfComment.
example:
  title: Проверьте отдельно регулирование и шкалу AO
  scenario: Уставка давления — 4.5 бар. Коэффициенты и период выбирайте при наладке, для текущего CPID
    оставьте Ti = 0. Если итоговое задание out_fYS равно 50 %, шкала 0–100 % → 2000–10000 должна дать
    AO = 6000. Это проверка масштабирования, а не утверждение, что при давлении 4.5 бар насос всегда работает
    на 50 %.
  result: На HMI сравнивайте давление с уставкой и смотрите итоговый out_fYS. Для ручной проверки выберите
    ручной режим PID и задайте разрешённое значение, соблюдая условия безопасной работы механизма. Отдельно
    проверьте поведение при снятом PIDEnExtra и при ошибке Sensor.
settings:
- key: …_PID_fSP
  default: '0.0'
  description: 'Значение, которое нужно поддерживать: например 4.5 бар или 70 °C. Единицы должны совпадать
    с измерением Sensor; сюда не вводят процент открытия клапана.'
- key: …_PID_fDB
  default: '0.0'
  description: Небольшое допустимое отклонение около уставки в единицах измерения. Помогает не реагировать
    на мелкий шум; слишком широкая зона ухудшает точность.
- key: …_PID_fSR
  default: '3.0'
  description: Период пересчёта регулятора, секунды. Это не период задачи ПЛК. Выбирайте с учётом быстродействия
    процесса и задержки фильтра Sensor.
- key: …_PID_fKp
  default: '1.0'
  description: Насколько сильно изменять управление при ошибке измерения. Больший модуль даёт более резкую
    реакцию; слишком большое усиление вызывает колебания. Настраивается на реальном процессе.
- key: …_PID_fTi
  default: '0.0'
  description: 'Параметр классической интегральной части. Руководство текущего CPID требует оставить 0.0:
    конечный выход out_fYS уже накапливает регулирующее воздействие.'
- key: …_PID_fTd
  default: '0.0'
  description: Усиление реакции на скорость изменения ошибки через дифференциальное время, секунды. 0.0
    отключает эту часть. Шумный датчик делает слишком большую настройку нежелательной.
- key: …_PID_fYMin
  default: '0.0'
  description: Нижняя инженерная точка выхода, обычно 0 %. Она соответствует минимальному электрическому
    сигналу секции аналогового выхода.
- key: …_PID_fYMax
  default: '100.0'
  description: Верхняя инженерная точка выхода, обычно 100 %. Она соответствует максимальному электрическому
    сигналу. Это не число АЦП/ЦАП.
- key: …_PID_fYLoLimit
  default: '0.0'
  description: Минимум, разрешённый именно при регулировании. Например, можно не опускать работающий насос
    ниже 25 %, не меняя полную шкалу 0–100 %.
- key: …_PID_fYHiLimit
  default: '100.0'
  description: Максимум, разрешённый при регулировании. Например, 90 % ограничивает доступную производительность
    при сохранении полной шкалы выхода 0–100 %.
- key: …_PID_fOffValue
  default: '0.0'
  description: 'Задание при отключённом автоматическом расчёте. Выбирайте по механизму: 0 % не всегда
    означает безопасное физическое положение или полностью отключённый привод.'
- key: …_OUT_fRawMin
  default: ADC_4_IN_0_20
  description: Число, которое нужно записать в AO для минимального электрического сигнала. Например, 2000
    соответствует 4 мА у модуля 0–20 мА → 0–10000. Берите значение из настройки реального модуля вывода.
- key: …_OUT_fRawMax
  default: ADC_MAX_VALUE
  description: Число AO для максимального электрического сигнала. Для того же примера 20 мА соответствуют
    10000. Настройка относится к выходному каналу, а не к уставке PID.
hmi:
- tag: PID.out_fY
  description: 'Текущий расчётный шаг регулирования: насколько сейчас нужно изменить воздействие. Это
    диагностическое число, а не готовое положение клапана. По умолчанию есть HMI и Trend.'
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: Да
- tag: PID.out_fYS
  description: Накопленное итоговое задание в инженерной шкале, например 47 %. Именно оно масштабируется
    в AO. По умолчанию доступно на HMI и записывается в Trend.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: Да
- tag: PID.inout_bYManual
  description: Выбор ручного задания регулятора с HMI. Самостоятельный Lib PID не привязан автоматически
    к режиму CEngine или CControlValve; нужную связь задают при сборке контура.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: PID.inout_fYManual
  description: 'Задание оператора в ручном режиме, в инженерной шкале PID, например 35 %. Здесь не вводят
    код AO 2000–10000: преобразование делает отдельная секция выхода.'
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi: []
common_mistakes:
- Использовать out_fY как готовое задание частотнику. Для этого аналогового CPID нужен накопленный out_fYS.
- Перенести типовую настройку Ti из другого PID без учёта реализации. Руководство текущего CPID требует
  Ti = 0, потому что out_fYS уже накапливает воздействие.
- Оставить PIDEnExtra = true и считать, что PID автоматически остановится вместе с насосом. Ошибка Sensor
  проверяется, состояние механизма — только если вы его подключили.
- Задать 4 и 20 как OutRawMin/Max, хотя модуль AO ожидает 2000 и 10000. Отличайте электрический ток от
  кода выходного канала.
- Ожидать, что PIDConf выбирает шкалу AO. Электрические настройки выбираются отдельным OutConf, а при
  его отсутствии — PIDId.
- Считать 0 % автоматически безопасным состоянием любого привода. Проверьте OffValue, электрическую шкалу
  и действие самого оборудования.
