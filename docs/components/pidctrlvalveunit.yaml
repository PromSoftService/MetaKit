optional_hmi:
- tag: PID.out_fYS
  description: Можно включить Trend у существующей строки и показывать рядом с трендом регулируемой величины
    Sensor. По умолчанию в этом Unit PID не записывается в Trend.
common_mistakes:
- Считать CtrlValve.out_bState фактическим открытием. Это включённое регулирование; сигнал обратной связи
  положения здесь не создаётся.
- 'Добавить отдельный переключатель PID.inout_bYManual и ожидать независимого выбора: код каждый цикл связывает
  его с режимом CControlValve.'
- Нажимать CtrlValve.inout_bStart как обязательную кнопку ручного запуска. В текущем Unit запрос Manual
  формируется по самому режиму.
- Ожидать обхода ошибки Sensor в Manual. Она включена в экстренный останов CControlValve, а не только в
  запрет Auto.
- Использовать PIDConf или CtrlValveConf для электрической шкалы. Выход имеет собственные OutConf/OutConfComment;
  пусто означает настройки по Id.
- Ожидать аварии времени хода по информационным концевикам CControlValve. Этот ФБ таких проверок не выполняет.
