component: VfdGroupPidCascade
slug: vfdgrouppidcascade
source: yaml/UnitsTmpls/vfdgrouppidcascade.yaml
kind: Unit
title: Каскад двигателей с общим PID
category: Готовые контуры
summary: Универсальный каскад и общий CPID для группы частотно-регулируемых двигателей.
description: Универсальный каскад и общий CPID для группы частотно-регулируемых двигателей. При ошибке PV каскад отключается.
  Количество агрегатов, условия подключения и настройки PID доступны оператору.
use_cases:
- Количество работающих двигателей выбирается каскадом, а их общее задание формирует один PID.
- Каскад выбирает количество работающих насосов, а один PID формирует общее задание скорости для всех включённых частотных
  приводов.
not_for:
- Если состав или связи блоков должны существенно отличаться, соберите собственный компонент из Lib-шаблонов.
diagram:
  lanes:
  - - CasPV + CasPVErr
    - CCascade
    - Общий CPID
    - Двигатели группы
    - 'HMI управления

      режим / команды'
  - - Состояние и защиты
    - Аварии / предупреждения
    - 'HMI сообщений

      Flt / Wrn'
application:
  intro: Каскад выбирает количество работающих насосов, а один PID формирует общее задание скорости для всех включённых частотных
    приводов. Ниже показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: При ошибке PV каскад отключается. Количество агрегатов, условия подключения и настройки PID доступны оператору.
parameter_groups:
- title: Основные параметры
  items:
  - key: Id
    default: _ID_
    example: PGR101
    description: Уникальный идентификатор всего компонента. Используется как префикс экземпляров и тегов.
  - key: Comment
    default: Комментарий
    example: Группа насосов с общим регулированием давления
    description: Понятное человеку название компонента. Попадает в комментарии тегов и тексты HMI.
  - key: Parent
    default: CabinetController_Inst
    example: CabinetController_Inst
    description: Родительский CabinetController или CascadeUnit, от которого компонент получает общее разрешение, режим и
      команды.
  - key: CasPV
    default: '0.0'
    example: '0.0'
    description: Технологический параметр каскада. Можно передать датчик, вычисленное значение или константу 0.0.
  - key: CasPVErr
    default: 'false'
    example: 'false'
    description: Объединённый признак недостоверности CasPV. При TRUE каскад отключается.
  - key: Enable
    default: 'true'
    example: 'true'
    description: Общее разрешение работы компонента. FALSE полностью отключает алгоритм.
- title: Каскад
  items:
  - key: $Cas
    default: Каскад
    example: Каскад
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: CasConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: CasConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
- title: Группа параметров 3
  items:
  - key: UnitId1…UnitId16
    default: _ID_
    example: PGR101
    description: Id подключаемого элемента каскада. Пустая ячейка означает, что соответствующая позиция не используется. Доступно
      16 позиций.
- title: Регулятор
  items:
  - key: $PID
    default: Регулятор
    example: Регулятор
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
example:
  title: Группа насосов с общим регулированием давления
  scenario: Каскад выбирает количество работающих насосов, а один PID формирует общее задание скорости для всех включённых
    частотных приводов.
  result: При ошибке PV каскад отключается. Количество агрегатов, условия подключения и настройки PID доступны оператору.
