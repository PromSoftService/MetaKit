optional_hmi:
- tag: Переменная, переданная в CtrlValveValue
  description: Её можно отдельно вывести в проекте как внешнее задание положения и записывать в Trend. Это
    не созданный данным Unit тег ручного управления и не фактическая обратная связь клапана.
common_mistakes:
- Ожидать, что StartCmd = false, EStop или ExternalFault автоматически изменят AO. В текущем файле масштабирование
  не использует разрешение CControlValve.
- Ожидать ручного поля положения при выборе Manual. Unit включает режимный блок, но собственного ручного
  числового задания не создаёт.
- Считать out_bState реальным открытием клапана или ждать аварии по информационным концевикам. CControlValve
  ведёт разрешение, не положение и время хода.
- Использовать CtrlValveConf как набор настроек AO. Эти поля сейчас не используются; электрические настройки
  имеют отдельный OutConf.
