  alm: —
  trend: —
optional_hmi:
- tag: TwoStep.out_bHeating
  description: Можно добавить строку нижнего действия для диагностики запроса наполнения/нагрева. В отличие
    от Lib TwoStep, в этом Unit штатной строки выхода и Msg-параметра нет; это не подтверждение работы двигателя.
- tag: TwoStep.out_bCooling
  description: Можно добавить строку верхнего действия — откачки/охлаждения. Для сообщения задайте понятный
    комментарий и категорию в таблице данных; выход сам по себе не является аварией.
common_mistakes:
- Считать StartCmd = true немедленной командой двигателя. В Auto дополнительно требуется выбранное действие
  TwoStep.
- Перепутать наполнение и откачку. false выбирает действие при низком значении, true — при высоком.
- Ожидать, что внутри гистерезиса насос обязательно остановлен. TwoStep сохраняет предыдущее действие до
  противоположной границы.
- Передать два дискретных поплавка вместо Sensor. В этом Unit Lo/Hi жёстко выключены, аналоговая ветка включена.
- Ожидать обхода ошибки Sensor ручным режимом. Ошибка включена в экстренный останов CEngine и действует
  также в Manual.
- Считать выход Heating подтверждением фактической работы насоса. Работа определяется CEngine и правильно
  подключённой обратной связью.
- Оставить исходный шунт контроля двигателя true и ожидать диагностики неудачного пуска. Настройте обратную
  связь и снимите шунт.
