component: CabinetController
slug: cabinetcontroller
source: yaml/LibTempls/Cabinet/cabinetcontroller.yaml
kind: Lib
title: Контроллер шкафа управления
category: Инфраструктура проекта
summary: Шаблон единственного общепроектного экземпляра CCabinetController.
description: Шаблон единственного общепроектного экземпляра CCabinetController. Компонент формирует единые признаки работы
  шкафа, питания и аварийного останова для всех подчинённых механизмов.
use_cases:
- Добавляется в проект для формирования общих команд, режимов, сброса аварий и контроля питания.
- Кнопки Пуск, Стоп и Аварийный останов подключены к дискретным входам, а реле контроля фаз формирует признак наличия питания.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - Пуск / Стоп / E-Stop
    - 'CCabinetController

      состояние шкафа'
    - 'HMI шкафа

      работа / питание'
  - - Сброс аварий
    - Импульс сброса
    - Подчинённые Units
application:
  intro: Кнопки Пуск, Стоп и Аварийный останов подключены к дискретным входам, а реле контроля фаз формирует признак наличия
    питания. Ниже показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: Компонент формирует единые признаки работы шкафа, питания и аварийного останова для всех подчинённых механизмов.
