code:
  format: template-text
  language: st-template
  text: "// |PIDDId| - |PIDDComment|. |$PIDD|\n|PIDDId|_PIDD_Inst(\n    in_bEnable := true\n        AND (NOT |PIDDSensId|_Sensor_Inst.out_bError)\n        AND |PIDDEnExtra|,\n    in_fSP := Conf.%\"|PIDDConf|\" if \"|PIDDConf|\"!=\"\" else \"|PIDDId|\"%_PIDD_fSP,\n    in_fPV := |PIDDSensId|_SensFilter_Inst.out_fY,\n    in_fDB := Conf.%\"|PIDDConf|\" if \"|PIDDConf|\"!=\"\" else \"|PIDDId|\"%_PIDD_fDB,\n    in_fSR := Conf.%\"|PIDDConf|\" if \"|PIDDConf|\"!=\"\" else \"|PIDDId|\"%_PIDD_fSR,\n    in_fKp := Conf.%\"|PIDDConf|\" if \"|PIDDConf|\"!=\"\" else \"|PIDDId|\"%_PIDD_fKp,\n    in_fTi := Conf.%\"|PIDDConf|\" if \"|PIDDConf|\"!=\"\" else \"|PIDDId|\"%_PIDD_fTi,\n    in_fTd := Conf.%\"|PIDDConf|\" if \"|PIDDConf|\"!=\"\" else \"|PIDDId|\"%_PIDD_fTd,\n    in_bReset := CabinetController_Inst.out_bWorktimeReset\n);\n//\n//\n//\n//\n"
