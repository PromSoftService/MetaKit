optional_hmi:
- tag: TwoStep.out_bHeating
  description: Можно вывести нижнее действие регулятора для диагностики. По умолчанию оно не включено в
    HMI-набор Unit; это запрос процесса, не фактическое положение клапана.
- tag: TwoStep.out_bCooling
  description: Можно вывести верхнее действие и при необходимости добавить понятный текст сообщения. Штатное
    переключение регулирующего действия само по себе не является аварией.
common_mistakes:
- Ожидать одинаковой реакции на StartCmd = false и Sensor error. Первый задаёт закрытие в Auto, вторая снимает
  оба направления через EStop.
- Перепутать логику наполнения и слива. false выбирает открытие при низком значении, true — при высоком.
- Считать, что внутри гистерезиса клапан обязательно закрыт. TwoStep сохраняет последнее действие до противоположной
  границы.
- Ожидать ручного движения при неисправном Sensor. В отличие от PiddValveUnit, здесь ошибка измерения включена
  в экстренный останов.
- 'Считать CascadeUnit.out_bState концевиком открытия: он означает готовность Auto вместе с разрешением
  контура.'
- Ожидать контроля полного хода с исходным шунтом true. Настройте реальное время и включите контроль отдельно.
