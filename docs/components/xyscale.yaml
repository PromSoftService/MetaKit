component: xyScale
slug: xyscale
source: yaml/LibTempls/Math/xyscale.yaml
kind: Lib
title: Масштабирование XY
category: Математика
summary: Шаблон вызова функции xyScale для линейного преобразования диапазонов.
description: Шаблон вызова функции xyScale для линейного преобразования диапазонов. Функция линейно преобразует шкалу и при
  включённом ограничении не выпускает результат за заданные границы.
use_cases:
- Требуется преобразовать инженерную шкалу в физический аналоговый диапазон или обратно.
- Управляющий сигнал 0–100 % нужно преобразовать в электрическую шкалу аналогового выхода 4–20 мА, представленную числами
  2000–10000.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - 'X

      исходная шкала'
    - 'xyScale

      линейное преобразование'
    - 'Y

      целевая шкала'
application:
  intro: Управляющий сигнал 0–100 % нужно преобразовать в электрическую шкалу аналогового выхода 4–20 мА, представленную числами
    2000–10000. Ниже показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: Функция линейно преобразует шкалу и при включённом ограничении не выпускает результат за заданные границы.
parameter_groups:
- title: Масштабирование
  items:
  - key: $Scale
    default: Масштабирование
    example: Масштабирование
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: ScaleComment
    default: Комментарий
    example: Задание частоты на аналоговый выход
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
  - key: ScaleXMin
    default: '0.0'
    example: '0.0'
    description: Нижняя граница исходной инженерной шкалы X.
  - key: ScaleXMax
    default: '100.0'
    example: '100.0'
    description: Верхняя граница исходной инженерной шкалы X.
  - key: ScaleYMin
    default: ADC_4_IN_0_20
    example: ADC_4_IN_0_20
    description: Нижняя граница результирующей шкалы Y.
  - key: ScaleYMax
    default: ADC_MAX_VALUE
    example: ADC_MAX_VALUE
    description: Верхняя граница результирующей шкалы Y.
  - key: ScaleX
    default: '0.0'
    example: '0.0'
    description: Текущее исходное значение, которое требуется масштабировать.
  - key: ScaleOut
    default: _AO_
    example: AO_SCALEOUT
    description: Переменная, в которую записывается результат преобразования.
  - key: ScaleLimit
    default: 'true'
    example: 'true'
    description: Ограничивать результат заданными границами YMin и YMax.
example:
  title: Задание частоты на аналоговый выход
  scenario: Управляющий сигнал 0–100 % нужно преобразовать в электрическую шкалу аналогового выхода 4–20 мА, представленную
    числами 2000–10000.
  result: Функция линейно преобразует шкалу и при включённом ограничении не выпускает результат за заданные границы.
settings: []
hmi: []
optional_hmi: []
common_mistakes:
- Оставить служебные значения _ID_, _DI_, _DO_ или _AO_ вместо реальных тегов проекта.
- Не проверить классы сообщений и доступность настроек на HMI после генерации проекта.
