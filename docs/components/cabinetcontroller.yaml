component: CabinetController
slug: cabinetcontroller
source: yaml/LibTempls/Cabinet/cabinetcontroller.yaml
kind: Lib
title: Контроллер шкафа управления
category: Инфраструктура проекта
summary: Собирает общие команды и состояния шкафа в одном месте.
description: 'CabinetController — общий источник команд «работать», «остановить», «сбросить аварии» и
  информации о питании шкафа. Он объединяет физические кнопки и команды HMI, чтобы все механизмы получали
  одинаковые общие сигналы. Состояние «шкаф запущен» не равно наличию напряжения: нужен разрешённый пуск.
  Кратковременный провал питания можно переждать, но начать работу без питания нельзя. Обычно в проекте
  нужен один такой компонент. General уже содержит его, поэтому одновременно добавлять General и CabinetController
  не нужно.'
use_cases:
- Нужен общий источник пуска, останова, питания и сбросов для механизмов одного проекта.
- Оператор управляет установкой и физическими кнопками, и с HMI, а краткие провалы питания не должны сразу
  сбрасывать запущенное состояние.
not_for:
- 'General уже присутствует в проекте: второй CabinetController_Inst не нужен.'
- 'Отдельная технологическая программа насоса или клапана: контроллер шкафа формирует общие сигналы, а
  не конкретную последовательность всех механизмов.'
- 'Замена аппаратной системы безопасности программной экранной кнопкой: проектная схема безопасности определяется
  отдельно.'
diagram:
  lanes:
  - - 'Пуск / Стоп

      физические и HMI'
    - 'CabinetController

      питание и блокировки'
    - out_bWorking
    - 'HMI шкафа

      установка запущена'
  - - Текущее питание
    - out_bPowerControl
    - HMI питания
  - - Аварийный останов
    - out_bEmergencyStop
    - HMI запрета
application:
  intro: В шкафу есть кнопки пуска, останова, аварийного останова и сброса, а также контакт наличия напряжения.
    Подключите их к параметрам ниже. Если контакт нормально замкнутый, укажите инверсию так, чтобы TRUE
    означало именно команду останова.
  result: Механизмы получают общие команды из CabinetController_Inst. На HMI раздельно видны питание,
    запущенное состояние шкафа и аварийный останов.
parameter_groups:
- title: Подключите пуск и останов
  intro: В проекте нужен только один CabinetController_Inst. Если уже добавлен General, этот блок в нём
    есть. Ниже пример нормально разомкнутого пуска и нормально замкнутой цепи Stop.
  items:
  - key: $CabCtl
    default: Контроллер шкафа управления
    example: Контроллер шкафа управления
    description: Подпись типа блока. У контроллера шкафа фиксированное имя CabinetController_Inst; отдельный
      Id здесь не задаётся.
  - key: CabCtlStart
    default: _DI_
    example: DI_START
    description: Физическая команда пуска шкафа. TRUE означает нажатый пуск; работа также может разрешаться
      кнопкой HMI при выполненных условиях питания и блокировок.
  - key: CabCtlStop
    default: _DI_
    example: NOT DI_STOP_OK
    description: Физическая команда останова. Подайте TRUE именно при останове. Для нормально замкнутой
      кнопки может потребоваться NOT DI_STOP_OK — полярность определяется электрической схемой.
- title: Подключите питание и запреты
  intro: 'Согласуйте полярность сигналов с электрической схемой: TRUE для PowerOk означает норму, TRUE
    для EStop или Block — запрет. Пример с NOT подходит только к указанным нормально замкнутым контактам.'
  items:
  - key: CabCtlPowerOk
    default: _DI_
    example: DI_POWER_OK
    description: TRUE, когда питание шкафа действительно присутствует. Например, наличие хотя бы одного
      рабочего ввода. Не подменяйте этим команду «шкаф запущен».
  - key: CabCtlEStop
    default: _DI_
    example: NOT DI_ESTOP_OK
    description: Общий сигнал аварийного останова шкафа. TRUE означает, что аварийный останов активен.
      Подключение этого сигнала к механизмам должно соответствовать принятой проектной схеме безопасности.
  - key: CabCtlBlock
    default: 'false'
    example: bPlantBlocked
    description: 'Общий запрет пуска/работы шкафа, например внешняя блокировка установки. Если такого
      условия нет, оставьте false. Это не отдельная причина сообщения: её пояснение на HMI задают в проектной
      диагностике.'
- title: Подключите общий сброс
  intro: Физическая кнопка и кнопка HMI дают общую команду сброса. Импульсный выход сброса для ПЧ настраивается
    отдельно; сброс наработки не следует выполнять обычной кнопкой квитирования.
  items:
  - key: CabCtlFaultReset
    default: _DI_
    example: DI_RESET
    description: Физическая кнопка общего сброса аварий. Уровневый и импульсный варианты сброса формируются
      самим CabinetController; длительность импульса задаётся в настройках.
example:
  title: Провал питания на полсекунды
  scenario: 'Шкаф уже запущен. При фильтре питания 3 секунды контакт PowerOk пропал на 0,5 секунды и восстановился:
    out_bWorking может сохранить запущенное состояние. Но out_bWorkAndPower не подтверждает работу с питанием
    в момент, когда его нет.'
  result: Если питание отсутствует дольше разрешённого фильтра, запущенное состояние снимается; после
    восстановления нужен новый пуск. Фильтр не разрешает первоначальный запуск без питания. Для ПЧ длительность
    импульса общего сброса 1 секунда настраивается независимо.
settings:
- key: …_diPowerControlFilter
  default: '3'
  description: Сколько секунд уже запущенный шкаф может переждать краткое исчезновение питания, не сбрасывая
    запущенное состояние. Не разрешает первоначальный пуск без питания.
- key: …_diFaultResetPulse
  default: '1'
  description: Длительность импульса общего сброса, секунды. Нужна устройствам, которым следует подать
    короткую команду reset, например ПЧ.
- key: …_bStartOnTrig
  default: 'true'
  description: true требует нового фронта команды пуска. Это помогает избежать повторного запуска от постоянно
    удерживаемого сигнала после снятия блокировки.
hmi:
- tag: in_bBlock
  description: Общий запрет работы, переданный CabinetController. Показывает факт блокировки, но её технологическую
    причину нужно пояснить отдельным сообщением проекта.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: out_bPowerControl
  description: Питание шкафа сейчас присутствует. Этот индикатор не означает, что оператор запустил установку.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: out_bWorking
  description: Оператор разрешил работу шкафа, и запущенное состояние сохраняется. Во время допустимого
    краткого провала питания оно может ещё оставаться TRUE.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: out_bWorkAndPower
  description: Шкаф запущен И питание сейчас есть. Это более строгое разрешение для механизмов, которым
    требуется текущее питание.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: out_bEmergencyStop
  description: Общий аварийный останов, объединяющий предусмотренные физический и HMI-источники. Это состояние
    запрета, не команда сброса.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: inout_bStart
  description: Экранная команда общего пуска. Блок принимает её при допустимых питании и блокировках,
    а не безусловно включает всё оборудование.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: inout_bStop
  description: Экранная команда обычного останова шкафа. Реакция отдельных механизмов определяется их
    связями и режимами.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: inout_bEmergencyStop
  description: Экранная команда аварийного останова. Не заменяет предусмотренную аппаратную цепь безопасности.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: inout_bFaultReset
  description: Общий сброс аварий с HMI. Активные неисправности сначала устраняют; сброс не делает повреждённый
    привод исправным.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: inout_bWorktimeReset
  description: Общая сервисная команда сброса наработки, передаваемая подключённым механизмам. Не объединяйте
    с обычным сбросом аварий.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi: []
common_mistakes:
- 'Оставить нормально замкнутый Stop без нужной инверсии: TRUE может постоянно означать останов.'
- Считать out_bWorking наличием напряжения. Для текущего питания есть отдельный out_bPowerControl, для
  совместного условия — out_bWorkAndPower.
- Поставить фильтр питания и ожидать разрешения первого пуска при отсутствующем питании. Фильтр нужен
  только для краткого провала уже работающей установки.
- Импортировать CabinetController вместе с General и получить два одноимённых экземпляра.
- 'Ожидать, что останов шкафа автоматически включён во все пользовательские алгоритмы: общие выходы нужно
  использовать в их разрешениях и командах.'
