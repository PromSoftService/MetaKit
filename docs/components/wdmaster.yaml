component: WDMaster
slug: wdmaster
source: yaml/LibTempls/WatchDog/WDMaster.yaml
kind: Lib
title: Ведущий WatchDog
category: Связь
summary: CWDMaster формирует контрольное слово и контролирует ответ ведомого устройства.
description: CWDMaster формирует контрольное слово и контролирует ответ ведомого устройства. При прекращении обмена формируется
  отдельное предупреждение об отсутствии связи с указанным шкафом.
use_cases:
- Две стороны используют парную схему Master/Slave, а текущая сторона является ведущей.
- Главный ПЛК изменяет контрольное слово и ожидает корректный ответ ведомой стороны в течение заданного времени.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - Контрольное слово
    - 'CWDMaster

      запрос и проверка ответа'
    - 'HMI предупреждений

      нет связи'
application:
  intro: Главный ПЛК изменяет контрольное слово и ожидает корректный ответ ведомой стороны в течение заданного времени. Ниже
    показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: При прекращении обмена формируется отдельное предупреждение об отсутствии связи с указанным шкафом.
parameter_groups:
- title: Ведущий WatchDog
  items:
  - key: $WDMaster
    default: Ведущий WatchDog
    example: Ведущий WatchDog
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: WDMasterId
    default: _ID_
    example: LCC_TO_MCC
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: WDMasterComment
    default: Комментарий
    example: Связь с MCC-01
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
  - key: WDMasterIn
    default: _WD_IN_
    example: MCC_WD_OUT
    description: Входное значение или сигнал, передаваемый в функциональный блок.
  - key: WDMasterOut
    default: _WD_OUT_
    example: LCC_WD_OUT
    description: Выходная переменная, в которую компонент записывает результат.
  - key: WDMasterConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: WDMasterConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
  - key: WDMasterConnMsg
    default: Связь установлена
    example: Связь установлена
    description: Текст нормального состояния связи; сообщение об ошибке формируется как отсутствие связи с партнёром.
example:
  title: Контроль связи главного и удалённого шкафа
  scenario: Главный ПЛК изменяет контрольное слово и ожидает корректный ответ ведомой стороны в течение заданного времени.
  result: При прекращении обмена формируется отдельное предупреждение об отсутствии связи с указанным шкафом.
settings:
- key: …_WDMaster_diPeriod
  default: '1'
  description: Период опроса
- key: …_WDMaster_diTimeout
  default: '5'
  description: Таймаут связи
hmi:
- tag: WDMaster.out_bConn
  description: Настройка функционального блока
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: WDMaster.out_bSync
  description: Синхронизация выполнена
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi: []
common_mistakes:
- Оставить служебные значения _ID_, _DI_, _DO_ или _AO_ вместо реальных тегов проекта.
- Не проверить классы сообщений и доступность настроек на HMI после генерации проекта.
