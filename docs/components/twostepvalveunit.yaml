component: TwoStepValveUnit
slug: twostepvalveunit
source: yaml/UnitsTmpls/twostepvalveunit.yaml
kind: Unit
title: Клапан с двухпозиционным регулятором
category: Готовые контуры
summary: CValve и CTwoStep с CascadeUnit, контролем датчика, авариями и предупреждениями.
description: CValve и CTwoStep с CascadeUnit, контролем датчика, авариями и предупреждениями. CTwoStep формирует требуемое
  направление, CValve выполняет движение, а ошибка датчика запрещает автоматическое управление.
use_cases:
- Клапан открывается или закрывается по двухпозиционному регулированию параметра.
- Клапан открывается при снижении уровня и закрывается после восстановления с учётом гистерезиса.
not_for:
- Если состав или связи блоков должны существенно отличаться, соберите собственный компонент из Lib-шаблонов.
diagram:
  lanes:
  - - PV + PVErr
    - CTwoStep
    - CValve
    - Open / Close
    - 'HMI управления

      режим / команды'
  - - Состояние и защиты
    - Аварии / предупреждения
    - 'HMI сообщений

      Flt / Wrn'
application:
  intro: Клапан открывается при снижении уровня и закрывается после восстановления с учётом гистерезиса. Ниже показаны параметры
    в том же формате ключ/значение, который используется в MetaPlatform.
  result: CTwoStep формирует требуемое направление, CValve выполняет движение, а ошибка датчика запрещает автоматическое управление.
parameter_groups:
- title: Основные параметры
  items:
  - key: Id
    default: _ID_
    example: V101
    description: Уникальный идентификатор всего компонента. Используется как префикс экземпляров и тегов.
  - key: Comment
    default: Комментарий
    example: Клапан подпитки по уровню
    description: Понятное человеку название компонента. Попадает в комментарии тегов и тексты HMI.
  - key: Parent
    default: CabinetController_Inst
    example: CabinetController_Inst
    description: Родительский CabinetController или CascadeUnit, от которого компонент получает общее разрешение, режим и
      команды.
  - key: StartCmd
    default: 'false'
    example: 'false'
    description: Дополнительное условие запуска компонента помимо команды родителя.
- title: Элемент каскада
  items:
  - key: $CasUnit
    default: Элемент каскада
    example: Элемент каскада
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: Power
    default: '0.0'
    example: '0.0'
    description: Текущая мощность элемента, передаваемая в CascadeUnit для контроля и статистики.
- title: Клапан
  items:
  - key: $Valve
    default: Клапан
    example: Клапан
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: ValveConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: ValveConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
- title: Группа параметров 4
  items:
  - key: ValveLocal
    default: 'false'
    example: 'false'
    description: Признак местного режима управления исполнительным механизмом.
  - key: ValveRemote
    default: 'true'
    example: 'true'
    description: Признак дистанционного режима управления исполнительным механизмом.
  - key: ValveStateOpen
    default: _DI_
    example: DI_VALVESTATEOPEN
    description: Дискретный сигнал концевика полностью открытого положения.
  - key: ValveStateClose
    default: _DI_
    example: DI_VALVESTATECLOSE
    description: Дискретный сигнал концевика полностью закрытого положения.
  - key: ValveOpenOut
    default: _DO_OPEN_
    example: DO_VALVEOPENOUT
    description: Физический дискретный выход открытия клапана.
  - key: ValveCloseOut
    default: _DO_CLOSE_
    example: DO_VALVECLOSEOUT
    description: Физический дискретный выход закрытия клапана.
- title: Двухпозиционный регулятор
  items:
  - key: $TwoStep
    default: Двухпозиционный регулятор
    example: Двухпозиционный регулятор
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: TwoStepConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: TwoStepConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
- title: Группа параметров 6
  items:
  - key: SensId
    default: _ID_
    example: V101
    description: Уникальный идентификатор датчика и префикс создаваемых тегов.
  - key: TwoStepCoolingMode
    default: 'false'
    example: 'false'
    description: 'Выбирает используемый выход CTwoStep: охлаждение вместо нагрева.'
- title: Аварии
  items:
  - key: $Flts
    default: Аварии
    example: Аварии
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: FltComment
    default: аварии
    example: аварии
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
- title: Строки 1–8
  items:
  - key: FltId1…FltId8
    default: _ID_
    example: V101
    description: Короткий идентификатор сигнала. Если оставить пустым, эта строка не создаётся. Одинаково применяется к строкам
      1–8.
  - key: FltComment1…FltComment8
    default: авария
    example: авария
    description: Текст причины, который увидит оператор в списке сообщений. Одинаково применяется к строкам 1–8.
  - key: FltIn1…FltIn8
    default: _DI_
    example: DI_FLTIN1
    description: Булево выражение контролируемой причины. Одинаково применяется к строкам 1–8.
  - key: FltEnable1…FltEnable8
    default: 'true'
    example: 'true'
    description: Разрешение обработки конкретного сигнала. Одинаково применяется к строкам 1–8.
  - key: FltAutoReset1…FltAutoReset8
    default: 'false'
    example: 'false'
    description: Автоматически снять зафиксированный сигнал после исчезновения причины. Одинаково применяется к строкам 1–8.
- title: Предупреждения
  items:
  - key: $Wrns
    default: Предупреждения
    example: Предупреждения
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: WrnComment
    default: предупреждения
    example: предупреждения
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
- title: Строки 1–8
  items:
  - key: WrnId1…WrnId8
    default: _ID_
    example: V101
    description: Короткий идентификатор сигнала. Если оставить пустым, эта строка не создаётся. Одинаково применяется к строкам
      1–8.
  - key: WrnComment1…WrnComment8
    default: предупреждение
    example: предупреждение
    description: Текст причины, который увидит оператор в списке сообщений. Одинаково применяется к строкам 1–8.
  - key: WrnIn1…WrnIn8
    default: _DI_
    example: DI_WRNIN1
    description: Булево выражение контролируемой причины. Одинаково применяется к строкам 1–8.
  - key: WrnEnable1…WrnEnable8
    default: 'true'
    example: 'true'
    description: Разрешение обработки конкретного сигнала. Одинаково применяется к строкам 1–8.
  - key: WrnAutoReset1…WrnAutoReset8
    default: 'true'
    example: 'true'
    description: Автоматически снять зафиксированный сигнал после исчезновения причины. Одинаково применяется к строкам 1–8.
