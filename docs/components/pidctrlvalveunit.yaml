component: PidCtrlValveUnit
slug: pidctrlvalveunit
source: yaml/UnitsTmpls/PidCtrlValveUnit.yaml
kind: Unit
title: Регулирующий клапан с PID
category: Готовые контуры
summary: Готовый контур CControlValve и CPID с аналоговым выходом, CascadeUnit, авариями и предупреждениями.
description: Готовый контур CControlValve и CPID с аналоговым выходом, CascadeUnit, авариями и предупреждениями. При ошибке
  датчика или аварии Unit снимает автоматическое управление; в ручном режиме клапан включается и оператор задаёт положение.
use_cases:
- Положение регулирующего клапана определяется индивидуальным PID-регулятором.
- Контур получает уровень от Sensor, PID рассчитывает требуемое положение, а CControlValve разрешает управление аналоговым
  выходом.
not_for:
- Если состав или связи блоков должны существенно отличаться, соберите собственный компонент из Lib-шаблонов.
diagram:
  lanes:
  - - PV + PVErr
    - CPID
    - CControlValve
    - Аналоговый выход
    - 'HMI управления

      режим / команды'
  - - Состояние и защиты
    - Аварии / предупреждения
    - 'HMI сообщений

      Flt / Wrn'
application:
  intro: Контур получает уровень от Sensor, PID рассчитывает требуемое положение, а CControlValve разрешает управление аналоговым
    выходом. Ниже показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: При ошибке датчика или аварии Unit снимает автоматическое управление; в ручном режиме клапан включается и оператор
    задаёт положение.
parameter_groups:
- title: Основные параметры
  items:
  - key: Id
    default: _ID_
    example: CV101
    description: Уникальный идентификатор всего компонента. Используется как префикс экземпляров и тегов.
  - key: Comment
    default: Комментарий
    example: Поддержание уровня регулирующим клапаном
    description: Понятное человеку название компонента. Попадает в комментарии тегов и тексты HMI.
  - key: Parent
    default: CabinetController_Inst
    example: CabinetController_Inst
    description: Родительский CabinetController или CascadeUnit, от которого компонент получает общее разрешение, режим и
      команды.
  - key: StartCmd
    default: 'false'
    example: 'false'
    description: Дополнительное условие запуска компонента помимо команды родителя.
- title: Элемент каскада
  items:
  - key: $CasUnit
    default: Элемент каскада
    example: Элемент каскада
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: Power
    default: '0.0'
    example: '0.0'
    description: Текущая мощность элемента, передаваемая в CascadeUnit для контроля и статистики.
- title: Регулирующий клапан
  items:
  - key: $CtrlValve
    default: Регулирующий клапан
    example: Регулирующий клапан
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: CtrlValveConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: CtrlValveConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
- title: Группа параметров 4
  items:
  - key: CtrlValveLocal
    default: 'false'
    example: 'false'
    description: Признак местного режима управления исполнительным механизмом.
  - key: CtrlValveRemote
    default: 'true'
    example: 'true'
    description: Признак дистанционного режима управления исполнительным механизмом.
  - key: CtrlValveStateOpen
    default: _DI_
    example: DI_CTRLVALVESTATEOPEN
    description: Дискретный сигнал концевика полностью открытого положения.
  - key: CtrlValveStateClose
    default: _DI_
    example: DI_CTRLVALVESTATECLOSE
    description: Дискретный сигнал концевика полностью закрытого положения.
- title: Регулятор
  items:
  - key: $PID
    default: Регулятор
    example: Регулятор
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: PIDConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: PIDConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
- title: Группа параметров 6
  items:
  - key: SensId
    default: _ID_
    example: CV101
    description: Уникальный идентификатор датчика и префикс создаваемых тегов.
- title: Аналоговый выход
  items:
  - key: $Out
    default: Аналоговый выход
    example: Аналоговый выход
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: OutConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: OutConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
- title: Группа параметров 8
  items:
  - key: OutRaw
    default: _AO_
    example: AO_OUTRAW
    description: Переменная физического аналогового выхода, в которую записывается масштабированное значение.
  - key: OutRawMin
    default: ADC_4_IN_0_20
    example: ADC_4_IN_0_20
    description: Код аналогового выхода, соответствующий нижней точке инженерной шкалы.
  - key: OutRawMax
    default: ADC_MAX_VALUE
    example: ADC_MAX_VALUE
    description: Код аналогового выхода, соответствующий верхней точке инженерной шкалы.
- title: Аварии
  items:
  - key: $Flts
    default: Аварии
    example: Аварии
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: FltComment
    default: аварии
    example: аварии
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
- title: Строки 1–8
  items:
  - key: FltId1…FltId8
    default: _ID_
    example: CV101
    description: Короткий идентификатор сигнала. Если оставить пустым, эта строка не создаётся. Одинаково применяется к строкам
      1–8.
  - key: FltComment1…FltComment8
    default: авария
    example: авария
    description: Текст причины, который увидит оператор в списке сообщений. Одинаково применяется к строкам 1–8.
  - key: FltIn1…FltIn8
    default: _DI_
    example: DI_FLTIN1
    description: Булево выражение контролируемой причины. Одинаково применяется к строкам 1–8.
  - key: FltEnable1…FltEnable8
    default: 'true'
    example: 'true'
    description: Разрешение обработки конкретного сигнала. Одинаково применяется к строкам 1–8.
  - key: FltAutoReset1…FltAutoReset8
    default: 'false'
    example: 'false'
    description: Автоматически снять зафиксированный сигнал после исчезновения причины. Одинаково применяется к строкам 1–8.
- title: Предупреждения
  items:
  - key: $Wrns
    default: Предупреждения
    example: Предупреждения
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: WrnComment
    default: предупреждения
    example: предупреждения
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
- title: Строки 1–8
  items:
  - key: WrnId1…WrnId8
    default: _ID_
    example: CV101
    description: Короткий идентификатор сигнала. Если оставить пустым, эта строка не создаётся. Одинаково применяется к строкам
      1–8.
  - key: WrnComment1…WrnComment8
    default: предупреждение
    example: предупреждение
    description: Текст причины, который увидит оператор в списке сообщений. Одинаково применяется к строкам 1–8.
  - key: WrnIn1…WrnIn8
    default: _DI_
    example: DI_WRNIN1
    description: Булево выражение контролируемой причины. Одинаково применяется к строкам 1–8.
  - key: WrnEnable1…WrnEnable8
    default: 'true'
    example: 'true'
    description: Разрешение обработки конкретного сигнала. Одинаково применяется к строкам 1–8.
  - key: WrnAutoReset1…WrnAutoReset8
    default: 'true'
    example: 'true'
    description: Автоматически снять зафиксированный сигнал после исчезновения причины. Одинаково применяется к строкам 1–8.
