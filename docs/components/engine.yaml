component: Engine
slug: engine
source: yaml/LibTempls/Engine/engine.yaml
kind: Lib
title: Двигатель
category: Исполнительные механизмы
summary: Управляет насосом, вентилятором или другим механизмом с одной дискретной командой «Пуск».
description: 'Engine объединяет автоматический пуск, ручные команды оператора, местное управление и контроль
  фактической работы двигателя. Команда на пускатель и сигнал «двигатель работает» — разные вещи: компонент
  выдаёт команду, затем проверяет подтверждение от пускателя или ПЧ. Он учитывает внешнюю аварию и экстренный
  останов, считает наработку и сообщает о неподтверждённом состоянии. Это отдельный блок двигателя для
  сборки собственного контура; готовый контур с местом для дополнительных аварий и связью с каскадом —
  EngineUnit. В Auto запросы приходят от проектного алгоритма, в Manual — от HMI. Local задаётся аппаратным
  переключателем; отдельные местные кнопки этот Lib-шаблон не подключает. Обычные автоматические пуск
  и останов имеют настраиваемые задержки, ручные команды их не ждут, а экстренный останов имеет приоритет
  над обычным управлением.'
use_cases:
- Насос или вентилятор включается одной дискретной командой, а пускатель или ПЧ предоставляет сигнал работы.
- 'Собирается собственный контур из Lib-компонентов: логика определяет, когда работать, а Engine обслуживает
  режимы, команду пуска, обратную связь и наработку.'
- Нужно различать «команда выдана», «работа подтверждена» и «двигатель не запустился», чтобы HMI давала
  оператору понятную диагностику.
not_for:
- 'Плавное регулирование частоты или положения само по себе: Engine не создаёт аналоговый выход. Для насоса
  с индивидуальным PID есть PidEngineUnit.'
- 'Готовый контур с CascadeUnit и восемью дополнительными причинами аварий: если нужны эти связи без собственной
  сборки, используйте EngineUnit.'
- 'Готовый местный пост с кнопками через ПЛК: в текущем шаблоне нет отдельных местных команд. EngLocalControlByPLC
  выбирает поведение CEngine, но не создаёт отсутствующие связи кнопок.'
diagram:
  lanes:
  - - 'Команды

      Auto / Manual / Local'
    - 'CEngine

      режимы и блокировки'
    - 'Пускатель

      out_bStart'
  - - 'Состояние двигателя

      in_bState'
    - 'Контроль пуска

      и наработка'
    - 'HMI двигателя

      режим / работа'
  - - 'Внешняя защита

      и E-Stop'
    - 'CEngine

      out_bFault'
    - 'HMI аварий

      Flt'
application:
  intro: Насос P101 включается по запросу bCirculationDemand. DI_P101_STATE — контакт работающего пускателя,
    DO_P101_START — команда его включения. На HMI оператор выбирает автоматический или ручной режим.
  result: В автомате запрос запускает насос с настроенными выдержками времени. В ручном режиме оператор
    управляет кнопками HMI. Если подтверждение работы не появилось за разрешённое время, на HMI можно
    увидеть причину аварии, а не только общий красный индикатор.
parameter_groups:
- title: Назовите двигатель
  intro: 'Импортируйте Engine в свой компонент. В проекте уже должен существовать CabinetController_Inst,
    например из General: шаблон получает от него питание, аварийный останов и сбросы.'
  items:
  - key: $Eng
    default: Двигатель
    example: Двигатель
    description: Название типа блока в комментариях, обычно «Двигатель». Это подпись для человека, а не
      команда управления.
  - key: EngId
    default: _ID_
    example: P101
    description: Уникальное имя двигателя, например P101. Оно используется в именах его тегов и экземпляра
      P101_Engine_Inst. Для следующего двигателя задайте другой Id.
  - key: EngComment
    default: Комментарий
    example: Насос циркуляционный
    description: Понятное название оборудования, например «Насос циркуляционный». Оно помогает оператору
      понять, какой двигатель отображается на экране и к чему относится авария.
- title: Задайте автоматический пуск и останов
  intro: 'В примере насос работает только когда запущен шкаф и нужен поток циркуляции. Задайте обе команды:
    пуск по запросу и останов при его снятии. Защиту от сухого хода передайте отдельно как экстренный
    останов.'
  items:
  - key: EngStartCmd
    default: 'false'
    example: CabinetController_Inst.out_bWorkAndPower AND bCirculationDemand
    description: Условие автоматического пуска. Например, шкаф запущен И есть запрос циркуляции. Этот
      параметр обрабатывается только в Auto; ручной пуск поступает с HMI.
  - key: EngStopCmd
    default: 'false'
    example: NOT (CabinetController_Inst.out_bWorkAndPower AND bCirculationDemand)
    description: Отдельное условие автоматического останова. Для работы по удерживаемому запросу задайте
      противоположное условие пуску. Снятие EngStartCmd само по себе не заменяет команду EngStopCmd.
  - key: EngEStopExtra
    default: 'false'
    example: DI_P101_DRY_RUN
    description: Дополнительный экстренный останов, например по сухому ходу. TRUE добавляет запрет к общему
      аварийному останову и отсутствию питания шкафа. Это не обычная задержанная команда Stop.
- title: Подключите выбор режима
  intro: Здесь подключаются положения аппаратного переключателя. В Remote выбор Auto/Manual доступен с
    HMI. В приведённом примере Local управляет местная электрическая схема, а ПЛК наблюдает состояние;
    поэтому EngLocalControlByPLC оставлен false.
  items:
  - key: EngLocal
    default: 'false'
    example: DI_P101_LOCAL
    description: Сигнал положения переключателя «Местное». TRUE выбирает Local, который имеет приоритет
      над дистанционным режимом. Сам этот параметр не подключает кнопки местного поста.
  - key: EngRemote
    default: 'true'
    example: DI_P101_REMOTE
    description: Сигнал разрешённого дистанционного управления. При TRUE и отсутствии Local режим Auto/Manual
      выбирается с HMI. Если оба сигнала режима FALSE, механизм находится в Off.
  - key: EngLocalControlByPLC
    default: 'false'
    example: 'false'
    description: 'Выбор поведения самого CEngine в Local. false — местной аппаратурой управляют вне ПЛК,
      блок отслеживает фактическую работу. true — допускается управление через ПЛК. В этом Lib-шаблоне
      отдельные местные кнопки не подключены: EngStartCmd/EngStopCmd формируются только в Auto, поэтому
      одного true недостаточно для реализации местного поста.'
- title: Подключите пускатель и обратную связь
  intro: DO_P101_START включает двигатель, DI_P101_STATE подтверждает его фактическую работу. Эти сигналы
    не взаимозаменяемы. Дополнительно подключите внешнюю аварию, если её предоставляет привод или защита.
  items:
  - key: EngStartOut
    default: _DO_
    example: DO_P101_START
    description: Имя дискретной выходной переменной команды пуска, например DO_P101_START. В неё записывается
      окончательная команда CEngine после режима, задержек и блокировок.
  - key: EngState
    default: 'false'
    example: DI_P101_STATE
    description: Обратная связь «двигатель работает» от пускателя или ПЧ. TRUE должно означать реальную
      работу, а не выданную команду. По этому сигналу подтверждается запуск и контролируется потеря работы.
  - key: EngExtFault
    default: 'false'
    example: DI_P101_FAULT
    description: Внешняя авария двигателя, например неисправность ПЧ или сработавшая защита. TRUE фиксирует
      аварию; после устранения причины требуется сброс. Если отдельного сигнала нет, оставьте false.
- title: Выберите индивидуальные или общие настройки
  intro: Для первого насоса оставьте оба поля пустыми. После генерации у него будут собственные выдержки
    времени. Общий набор имеет смысл только для действительно однотипных двигателей.
  items:
  - key: EngConf
    default: ''
    example: ''
    description: Необязательное имя общего набора настроек двигателей. Пусто — настройки создаются по
      EngId. Одинаковое имя позволяет нескольким двигателям пользоваться одним набором, но значения и
      смысл настроек у них должны совпадать.
  - key: EngConfComment
    default: ''
    example: ''
    description: Название общего набора настроек, если используется EngConf, например «Насосы циркуляции».
      При индивидуальных настройках оставьте пустым — подпись берётся из EngComment и $Eng.
example:
  title: Проверьте насос при наладке
  scenario: 'В Auto включите запрос циркуляции при запущенном шкафе. После задержки пуска должен включиться
    DO_P101_START; только после сигнала DI_P101_STATE и выдержки подтверждения появится состояние работы.
    Затем снимите запрос: EngStopCmd станет TRUE, и после обычной задержки останова команда пуска снимется.'
  result: 'Отдельно проверьте Manual: кнопки HMI должны работать без автоматических задержек, но не обходить
    экстренный останов. При разомкнутой обратной связи и включённом её контроле должна формироваться авария
    состояния. Все испытания выполняйте при безопасных условиях для реального оборудования.'
settings:
- key: …_Engine_diStateControlTime
  default: '1'
  description: Сколько секунд допускается отсутствие подтверждения работы при активной команде пуска.
    После превышения возникает авария состояния. Выберите время с учётом реального запуска ПЧ или пускателя;
    это не задержка до выдачи команды.
- key: …_Engine_diStateConfirmTime
  default: '3'
  description: Сколько секунд фактическое состояние должно сохраняться для подтверждения. Помогает отличить
    устойчивый сигнал работы от дребезга контакта.
- key: …_Engine_diStartDelayTime
  default: '1'
  description: Выдержка перед автоматическим пуском, секунды. Позволяет разнести запуск двигателей; ручной
    пуск использует другую логику и этой задержки не ждёт.
- key: …_Engine_diStopDelayTime
  default: '1'
  description: Выдержка перед обычным автоматическим остановом, секунды. Экстренный останов её не ждёт;
    ручное управление также не использует эту задержку.
- key: …_Engine_bStateControlBypass
  default: 'false'
  description: 'true отключает проверку подтверждения работы. Применяйте только осознанно, например при
    отсутствии обратной связи: команда пуска ещё не доказывает, что двигатель действительно вращается.'
hmi:
- tag: Engine.out_iMode
  description: Фактически выбранный режим Off, Local, Manual или Auto. По нему видно, почему автоматическая
    команда не управляет двигателем; это состояние, а не кнопка выбора режима.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Engine.out_bStateFault
  description: Двигатель не подтвердил работу за разрешённое время либо потерял подтверждение при активном
    пуске. По умолчанию эта причина включена в Flt; отдельный индикатор HMI можно добавить при необходимости.
  hmi: —
  flt: Да
  wrn: —
  alm: —
  trend: —
- tag: Engine.out_bFault
  description: Общий признак аварии двигателя. Удобен для цвета значка на HMI; причину уточняйте по контролю
    состояния и внешней защите.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Engine.out_bBlocked
  description: Управление заблокировано. Объясняет оператору, что обычная команда сейчас не будет выполнена;
    это не равнозначно выбранному режиму Off.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Engine.out_bState
  description: Подтверждённая работа двигателя, а не выданная команда пуска. Используйте для рабочего
    состояния на мнемосхеме. При отключённом контроле обратной связи достоверность физического подтверждения
    ограничена выбранной настройкой.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Engine.out_bEnableAutoControl
  description: Готовность принимать автоматическое управление. Подходит для индикации доступности двигателя
    и для передачи в каскад; TRUE не означает, что двигатель уже работает.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Engine.out_diWorktime
  description: Наработка в часах по состоянию работы. Во время ожидания подтверждения пуска она ещё не
    увеличивается. Сброс выполняется отдельной командой.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Engine.inout_iRemoteMode
  description: Выбор Auto/Manual с HMI при разрешённом дистанционном управлении. Аппаратный Local имеет
    приоритет; изменение этого поля не отменяет защиты.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Engine.inout_bStart
  description: Кнопка ручного пуска с HMI. Команду обрабатывает блок; не подменяйте ею индикацию фактической
    работы. Ручной пуск не ждёт автоматической задержки пуска.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Engine.inout_bStop
  description: Кнопка ручного останова с HMI. Ручное управление не использует автоматическую задержку
    останова, но также не отменяет аварийные приоритеты.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Engine.inout_bFaultReset
  description: 'Команда сброса аварии двигателя. Сначала устраните причину: активная внешняя неисправность
    не исчезает от нажатия Reset.'
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Engine.inout_bWorktimeReset
  description: Команда обнуления наработки. Это сервисное действие; не связывайте его с обычной кнопкой
    сброса аварий.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi:
- tag: Engine.out_bStart
  description: Итоговая команда на пускатель. Добавьте отдельную строку HMI, если при диагностике нужно
    сравнивать выданную команду и подтверждённую работу out_bState.
common_mistakes:
- 'Подключить только EngStartCmd и ожидать останова при снятии запроса. В Lib Engine есть отдельная команда
  EngStopCmd: задайте её явно.'
- Подать команду пуска обратно в EngState вместо контакта работы. Тогда неисправный пускатель может выглядеть
  исправным.
- 'Перепутать три разных времени: задержку до пуска, ожидание обратной связи и подтверждение устойчивого
  состояния.'
- Отключить контроль состояния, чтобы исчезала авария неподтверждённого пуска. Сначала проверьте проводку,
  полярность контакта и реальные времена.
- Ожидать задержанного останова от EStopExtra или ручной кнопки. Автоматическая задержка относится к обычной
  автоматической команде, не ко всем остановам.
- Считать, что EngLocalControlByPLC = true уже подключает местные кнопки. Текущий шаблон формирует внешние
  Start/Stop только для Auto и Manual.
