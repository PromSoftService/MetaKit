component: WDMaster
slug: wdmaster
source: yaml/LibTempls/WatchDog/WDMaster.yaml
kind: Lib
title: Ведущий WatchDog
category: Связь
summary: Контролирует двусторонний обмен с удалённым устройством со стороны ведущего.
description: WDMaster периодически изменяет контрольное WORD-слово и ожидает ответ от WDSlave на другой
  стороне связи. Если обмен перестал обновляться в допустимое время, состояние связи снимается и можно
  сформировать сообщение. Watchdog проверяет свежесть обмена, а не правильность температуры или давления.
  Сам компонент не настраивает Modbus, сеть или адреса обмена и не подключает потерю связи к технологическим
  остановам.
use_cases:
- Между двумя шкафами нужен контроль свежести обмена в обоих направлениях через пару WDMaster/WDSlave.
- Сообщение о потере связи должно быть отдельной диагностикой, не встроенной в алгоритм двигателя или
  клапана.
not_for:
- 'Создание сетевого протокола, Modbus-соединения или адресов обмена: watchdog использует уже передаваемые
  слова.'
- 'Проверка правильности технологического числа: меняющийся heartbeat не доказывает достоверность всех
  давлений и температур.'
- 'Автоматический аварийный останов механизмов при потере связи: сам этот шаблон не добавляет такую связь.'
diagram:
  lanes:
  - - WORD от K1
    - 'Контроль обновлений

      таймаут'
    - out_bConn
    - 'HMI связи

      TRUE/ FALSE'
  - - out_bConn = FALSE
    - 'Wrn = FALSE

      задать в таблице данных'
    - 'HMI предупреждений

      понятный текст'
application:
  intro: В главном шкафу MAIN добавьте WDMaster для шкафа K1. В WDMasterOut укажите передаваемое WORD-слово
    TX_K1_WD, в WDMasterIn — принимаемое RX_K1_WD. На K1 установите WDSlave и свяжите слова перекрёстно
    через уже настроенный обмен.
  result: 'При периоде 1 секунда и таймауте 5 секунд обмен должен обновляться заметно чаще таймаута. Текст
    сообщения: «MAIN. Отсутствует связь с K1». Контроль связи остаётся самостоятельным и не изменяет алгоритм
    насосов.'
parameter_groups:
- title: Назовите контроль связи
  intro: Создайте отдельный экземпляр для пары MAIN — K1. Сам сетевой обмен должен быть уже настроен независимо
    от MetaKit.
  items:
  - key: $WDMaster
    default: Ведущий WatchDog
    example: Ведущий WatchDog
    description: Подпись типа контроля связи. Она не настраивает протокол обмена и не выбирает физическое
      устройство.
  - key: WDMasterId
    default: _ID_
    example: MAIN_K1
    description: Уникальное имя этого контроля связи, например MAIN_K1. Для каждого партнёра нужен отдельный
      экземпляр.
  - key: WDMasterComment
    default: Комментарий
    example: MAIN
    description: Имя текущего шкафа или понятный контекст сообщения. В примере MAIN; к нему добавляется
      текст ConnMsg.
- title: Подключите контрольные слова
  intro: 'Свяжите направление туда и обратно: выход ведущего приходит на вход ведомого, выход ведомого
    возвращается на вход ведущего. Имена переменных в двух проектах могут различаться; важны фактические
    адреса обмена.'
  items:
  - key: WDMasterIn
    default: _WD_IN_
    example: RX_K1_WD
    description: Принимаемое WORD-слово от партнёра. Оно должно реально обновляться по настроенному обмену.
      Постоянный ноль или слово, которое записывает сам этот экземпляр, не проверяют связь.
  - key: WDMasterOut
    default: _WD_OUT_
    example: TX_K1_WD
    description: Отправляемое WORD-слово данного watchdog. Передайте его через реальный сетевой обмен
      во вход watchdog партнёра. Это другая переменная, не тот же самый вход.
- title: Выберите временные настройки
  intro: Для отдельной связи оставьте поля пустыми. Таймаут задайте с запасом относительно периода изменения
    слова и реального времени обмена, чтобы краткая задержка сети не создавала ложную потерю связи.
  items:
  - key: WDMasterConf
    default: ''
    example: ''
    description: Необязательное имя общих временных настроек watchdog. Пусто — настройки по WDMasterId.
      Общее имя допустимо для связей с одинаковыми требованиями к периоду и таймауту.
  - key: WDMasterConfComment
    default: ''
    example: ''
    description: Понятное имя совместно используемых временных настроек. Если отдельная подпись не нужна,
      оставьте пустым.
- title: Настройте сообщение именно о потере
  intro: out_bConn означает исправную связь при TRUE. Чтобы предупреждение появлялось при FALSE, задайте
    соответствующее условие Wrn в его строке данных. Одного изменения текста ниже недостаточно для создания
    сообщения.
  items:
  - key: WDMasterConnMsg
    default: Связь установлена
    example: Отсутствует связь с K1
    description: Текст состояния связи, добавляемый к Comment. Для предупреждения по потере задайте «Отсутствует
      связь с K1» и у строки out_bConn в таблице данных выберите Wrn со значением FALSE. По умолчанию
      категория сообщения у этой строки пуста.
example:
  title: MAIN контролирует K1
  scenario: В главном шкафу MAIN добавьте WDMaster для шкафа K1. В WDMasterOut укажите передаваемое WORD-слово
    TX_K1_WD, в WDMasterIn — принимаемое RX_K1_WD. На K1 установите WDSlave и свяжите слова перекрёстно
    через уже настроенный обмен.
  result: После прекращения обновления дольше таймаута out_bConn станет FALSE. При настроенном Wrn = FALSE
    появится «MAIN. Отсутствует связь с K1». До настройки категории есть только состояние HMI, не готовое
    предупреждение. Потеря связи сама по себе не меняет алгоритмы механизмов.
settings:
- key: …_WDMaster_diPeriod
  default: '1'
  description: Период изменения контрольного слова ведущего, секунды. По умолчанию 1; он должен быть заметно
    короче таймаута с учётом задержек обмена.
- key: …_WDMaster_diTimeout
  default: '5'
  description: Допустимое время без ожидаемого обновления обмена, секунды. По умолчанию 5. Выберите с запасом
    относительно частоты обновлений партнёра; значение должно соответствовать требованиям конкретной связи.
hmi:
- tag: WDMaster.out_bConn
  description: 'Состояние связи: TRUE — обмен подтверждён, FALSE — связь не подтверждена или потеряна.
    HMI включено, Flt/Wrn/Alm по умолчанию пустые. Для сообщения о потере задайте Wrn = FALSE и текст
    ConnMsg.'
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: WDMaster.out_bSync
  description: Признак выполненной синхронизации пары watchdog. Диагностика установления обмена; не заменяет
    текущее состояние out_bConn.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi:
- tag: WDMaster.out_bConn
  description: Строка уже выведена на HMI. При необходимости назначьте сообщение о FALSE, а не создавайте
    дубликат тега. Trend можно включить для истории состояния связи.
common_mistakes:
- Подать на вход собственное отправляемое слово. Такая петля может выглядеть живой даже при отсутствии
  удалённого шкафа.
- Передавать неизменяемую константу вместо слова, которое периодически меняет партнёр.
- Задать таймаут меньше нормального интервала обновления с учётом сети и получить ложные потери.
- Назвать ConnMsg «Связь установлена» и ожидать предупреждение о потере. Текст и условие сообщения должны
  соответствовать FALSE на out_bConn.
- Считать наличие HMI=1 готовым предупреждением. В исходном шаблоне Flt/Wrn/Alm у связи не заполнены.
- Использовать heartbeat как доказательство достоверности всех данных партнёра. Он контролирует свежесть
  обмена, а не их технологический смысл.
