component: Cascade
slug: cascade
source: yaml/LibTempls/Cascade/cascade.yaml
kind: Lib
title: Универсальный каскад
category: Каскады
summary: Управляет количеством подключённых агрегатов по минимальному и максимальному количеству и технологическому параметру.
description: Управляет количеством подключённых агрегатов по минимальному и максимальному количеству и технологическому параметру.
  CCascade выбирает доступные агрегаты, учитывает наработку и выдаёт каждому элементу индивидуальную команду включения.
use_cases:
- Нужен каскад N/M, каскад по технологическому параметру или их совместное применение.
- Каскад поддерживает давление, подключая насосы при падении параметра и отключая их после восстановления. В обычном режиме
  должны работать от одного до трёх насосов.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - PV + состав группы
    - 'CCascade

      выбор агрегатов'
    - 'Unit1…Unit16

      команды пуска'
  - - 'Готовность / аварии

      элементов'
    - Приоритет и наработка
    - 'HMI каскада

      состав / Master'
application:
  intro: Каскад поддерживает давление, подключая насосы при падении параметра и отключая их после восстановления. В обычном
    режиме должны работать от одного до трёх насосов. Ниже показаны параметры в том же формате ключ/значение, который используется
    в MetaPlatform.
  result: CCascade выбирает доступные агрегаты, учитывает наработку и выдаёт каждому элементу индивидуальную команду включения.
parameter_groups:
- title: Каскад
  items:
  - key: $Cas
    default: Каскад
    example: Каскад
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: CasId
    default: _ID_
    example: PGR101
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: CasComment
    default: Комментарий
    example: Группа сетевых насосов
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
  - key: CasParent
    default: CabinetController_Inst
    example: CabinetController_Inst
    description: Значение передаётся в одноимённую часть функционального блока; изменяйте его в соответствии с алгоритмом
      проекта.
  - key: CasEn
    default: 'true'
    example: 'true'
    description: Дополнительное разрешение работы соответствующего блока.
  - key: CasPV
    default: '0.0'
    example: PT101_SensFilter_Inst.out_fY
    description: Технологический параметр каскада. Можно передать датчик, вычисленное значение или константу 0.0.
  - key: CasPVErr
    default: 'false'
    example: PT101_Sensor_Inst.out_bError
    description: Объединённый признак недостоверности CasPV. При TRUE каскад отключается.
  - key: CasConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: CasConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
- title: Группа параметров 2
  items:
  - key: CasUnitId1…CasUnitId16
    default: _ID_
    example: CASCADE
    description: Id подключаемого элемента каскада. Пустая ячейка означает, что соответствующая позиция не используется. Доступно
      16 позиций.
example:
  title: Три рабочих насоса и один резервный
  scenario: Каскад поддерживает давление, подключая насосы при падении параметра и отключая их после восстановления. В обычном
    режиме должны работать от одного до трёх насосов.
  result: CCascade выбирает доступные агрегаты, учитывает наработку и выдаёт каждому элементу индивидуальную команду включения.
settings:
- key: …_Cascade_iWorkCount
  default: '1'
  description: Минимальное количество агрегатов в работе
- key: …_Cascade_iMaxWorkCount
  default: '1'
  description: Максимальное количество агрегатов в работе
- key: …_Cascade_fSP
  default: '0.0'
  description: Уставка
- key: …_Cascade_fHys
  default: '0.0'
  description: Гистерезис
- key: …_Cascade_diConnectionDelay
  default: '1'
  description: Задержка подключения
- key: …_Cascade_diDisconnectionDelay
  default: '1'
  description: Задержка отключения
- key: …_Cascade_bPowerControlEnable
  default: 'false'
  description: Включение контроля мощности
- key: …_Cascade_fPowerLoLimit
  default: '0.0'
  description: Нижний предел мощности
- key: …_Cascade_fPowerHiLimit
  default: '0.0'
  description: Верхний предел мощности
- key: …_Cascade_diSwitchPeriod
  default: '36'
  description: Период смены
hmi: []
optional_hmi: []
common_mistakes:
- Оставить служебные значения _ID_, _DI_, _DO_ или _AO_ вместо реальных тегов проекта.
- Не проверить классы сообщений и доступность настроек на HMI после генерации проекта.
