component: ControlValve
slug: controlvalve
source: yaml/LibTempls/Valve/controlvalve.yaml
kind: Lib
title: Регулирующий клапан
category: Исполнительные механизмы
summary: Добавляет режимы и разрешение работы регулирующему клапану с аналоговым позиционером.
description: 'ControlValve нужен для клапана, которому задают положение числом, например 35 %, а не двумя
  дискретными командами. Этот компонент отвечает за режим, разрешение регулирования, внешнюю аварию и
  наработку. Само положение он не рассчитывает и аналоговый выход не формирует: их нужно получить от регулятора
  или внешнего алгоритма. Сигнал out_bState означает, что регулирование включено, а не что клапан физически
  открыт. Переданные концевики не используются для контроля времени хода. В данном Lib-шаблоне выбор Manual
  сразу создаёт запрос включения: отдельное нажатие «Пуск» не требуется. Ручное положение и связь с ручным
  режимом отдельного PID нужно организовать при сборке контура. Сам по себе импорт ControlValve рядом
  с PID не делает эти связи автоматически.'
use_cases:
- Нужны режимы и запреты работы аналогового клапана, а его положение рассчитывает отдельный алгоритм или
  PID.
- Собирается собственный контур с позиционером 4–20 мА либо 0–10 В.
not_for:
- 'Отсечной клапан с контролем полного хода и концевиков: для него нужен Valve.'
- 'Готовый аналоговый контур с собственным PID, масштабированием AO и сообщениями: используйте PidCtrlValveUnit.'
- 'Ожидание, что CControlValve сам выдаст 35 % открытия: он разрешает регулирование, но не вычисляет положение.'
diagram:
  lanes:
  - - Режим и запрос
    - 'ControlValve

      разрешение регулирования'
    - 'Внешний регулятор

      не входит в шаблон'
  - - Состояние разрешения
    - out_bState
    - 'HMI клапана

      регулирование включено'
  - - Внешняя авария
    - out_bExternalFault
    - 'HMI диагностики

      причина блокировки'
application:
  intro: Для клапана подпитки CV101 импортируйте ControlValve и регулятор PID в свой компонент. Подключите
    переключатель местного/дистанционного управления и внешнюю аварию привода. Разрешение регулятора свяжите
    с состоянием ControlValve.
  result: На HMI можно выбрать режим и увидеть блокировку. Положение рассчитывает отдельный регулятор;
    для готовой связки с ним используйте PidCtrlValveUnit.
parameter_groups:
- title: Назовите регулирующий клапан
  intro: 'Импортируйте ControlValve в собственный контур. В проекте нужен CabinetController_Inst: он предоставляет
    общие питание, аварийный останов и сбросы. Положение и AO добавляются отдельной логикой.'
  items:
  - key: $CtrlVal
    default: Регулирующий клапан
    example: Регулирующий клапан
    description: Подпись типа блока в комментариях. Обычно оставляют «Регулирующий клапан»; она не задаёт
      положение привода.
  - key: CtrlValId
    default: _ID_
    example: CV101
    description: Уникальное имя клапана, например CV101. Его используют в именах экземпляра и тегов, в
      частности CV101_CtrlValve_Inst.
  - key: CtrlValComment
    default: Комментарий
    example: Клапан подпитки
    description: Название объекта для оператора, например «Клапан подпитки». Используется в комментариях
      HMI и помогает узнать оборудование.
- title: Подключите режим и запрос регулирования
  intro: В Auto нужен запрос CtrlValStartCmd. В Manual текущий шаблон разрешает регулирование сразу по
    выбранному режиму, чтобы оператор мог задать положение во внешнем регуляторе. Само ручное положение
    здесь не хранится.
  items:
  - key: CtrlValLocal
    default: 'false'
    example: DI_CV101_LOCAL
    description: Сигнал аппаратного выбора Local. Он имеет приоритет над дистанционным режимом. Этот шаблон
      не создаёт местный пост и не подключает местное аналоговое задание.
  - key: CtrlValRemote
    default: 'true'
    example: DI_CV101_REMOTE
    description: Разрешение дистанционного управления. При TRUE и отсутствии Local режим Auto/Manual выбирается
      с HMI.
  - key: CtrlValStartCmd
    default: 'false'
    example: CabinetController_Inst.out_bWorkAndPower AND bMakeupDemand
    description: Запрос включить регулирование в Auto. Например, шкаф запущен И нужна подпитка. Это разрешение,
      не положение 0–100 %. В Manual данный шаблон включает регулирование по самому выбору режима.
- title: Подключите запреты работы
  intro: Внешнюю аварию привода и дополнительный экстренный останов задают отдельно. При выключении разрешения
    внешний регулятор и аналоговый выход должны правильно отработать своё значение останова.
  items:
  - key: CtrlValExtFault
    default: 'false'
    example: DI_CV101_FAULT
    description: BOOL-сигнал внешней неисправности привода или технологической аварии. TRUE передаёт аварийную
      причину в CControlValve; после устранения причины используйте штатный сброс.
  - key: CtrlValEStopExtra
    default: 'false'
    example: 'false'
    description: Дополнительный экстренный останов. TRUE снимает разрешение вместе с общим аварийным остановом
      и отсутствием питания шкафа. Число аналогового выхода должен обрабатывать отдельный алгоритм.
- title: Укажите информационные концевики
  intro: Если привод выдаёт крайние положения, подключите их. Если не выдаёт — поставьте false. В текущем
    CControlValve эти входы не контролируют движение и не формируют аварию незавершённого хода.
  items:
  - key: CtrlValStateOpen
    default: _DI_
    example: 'false'
    description: Информационный концевик полностью открытого положения. В текущем CControlValve он не
      участвует в контроле движения, времени хода или разрешении регулирования. При отсутствии контакта
      можно передать false.
  - key: CtrlValStateClose
    default: _DI_
    example: 'false'
    description: Информационный концевик полностью закрытого положения. Он не превращает CControlValve
      в отсечной CValve с контролем полного хода. При отсутствии контакта можно передать false.
example:
  title: Собственный контур подпитки
  scenario: ControlValve CV101 задаёт режим и разрешение. Если рядом используется Lib PID, в его разрешение
    передайте CV101_CtrlValve_Inst.out_bState, а его ручной режим согласуйте с режимом клапана в собственном
    контуре. PID рассчитывает положение и масштабирует AO; ControlValve этих операций не делает.
  result: В Auto разрешение следует запросу подпитки. В Manual клапан разрешает регулирование по самому
    режиму, а оператор задаёт положение через внешний PID. При блокировке проверьте не только индикатор
    ControlValve, но и фактическое значение, поступающее на AO.
settings: []
hmi:
- tag: CtrlValve.out_iMode
  description: Действующий режим Off/Local/Manual/Auto. Это не положение клапана. Аппаратный Local имеет
    приоритет над дистанционным выбором.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CtrlValve.out_bStart
  description: Разрешено аналоговое регулирование. Передавайте это разрешение в отдельный алгоритм управления;
    оно не является числом AO и не доказывает движение привода.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CtrlValve.out_bState
  description: Регулирование включено. Не означает, что клапан физически открыт или достиг заданного процента.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CtrlValve.out_bEnableAutoControl
  description: Клапан доступен для автоматического управления. Удобно показывать как готовность; не подменяйте
    этим признак достигнутого положения.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CtrlValve.out_bExternalFault
  description: Внешняя авария привода, обработанная блоком. По умолчанию есть HMI-индикация, но категория
    Flt/Wrn/Alm для этой строки не выбрана; сообщение при необходимости настройте отдельно.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CtrlValve.out_bBlocked
  description: Управление заблокировано. Покажите его рядом с режимом, чтобы оператор понимал, почему
    регулирование не разрешено.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CtrlValve.out_diWorktime
  description: Счётчик наработки блока. Он относится к работе регулирующего механизма по логике CControlValve
    и не является измерением механического пути клапана.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CtrlValve.inout_iRemoteMode
  description: Выбор Auto/Manual с HMI. В этом шаблоне переход в Manual сам создаёт запрос включения регулирования;
    ручное положение задаётся отдельно.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CtrlValve.inout_bStart
  description: Поле ручного пуска CControlValve присутствует в HMI-наборе, но текущий Lib-шаблон включает
    Manual по выбранному режиму, а не по этому биту. Не используйте его как обещанную отдельную кнопку
    «Включить/Выключить».
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CtrlValve.inout_bFaultReset
  description: Сброс внешней аварии после устранения причины. Он не отменяет действующий экстренный останов.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CtrlValve.inout_bWorktimeReset
  description: Сервисная команда обнуления наработки. Не связывайте её с обычным квитированием сообщения.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi:
- tag: CtrlValve.out_bExternalFault
  description: Строка уже есть на HMI, но не включена в категорию сообщения. При необходимости назначьте
    Flt или Wrn и понятный текст; не создавайте второй дублирующий тег той же аварии.
common_mistakes:
- Ожидать, что out_bState означает «Клапан открыт». Это состояние включённого регулирования; фактическое
  положение требует отдельной обратной связи.
- Ожидать аналоговый сигнал от одного ControlValve. В шаблоне нет ни расчёта положения, ни физического
  AO.
- Добавить PID рядом, но не связать его разрешение и ручной режим с клапаном. Сам импорт двух Lib-компонентов
  ещё не связывает их поведение.
- Ожидать аварию времени хода по переданным концевикам. CControlValve их таким образом не использует.
- Считать inout_bStart независимой кнопкой ручного включения в этом шаблоне. Запрос Manual здесь формируется
  непосредственно от режима.
