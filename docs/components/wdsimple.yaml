component: WDSimple
slug: wdsimple
source: yaml/LibTempls/WatchDog/WDSimple.yaml
kind: Lib
title: Простой WatchDog
category: Связь
summary: CWDSimple контролирует изменение входного контрольного слова без ответного выхода.
description: CWDSimple контролирует изменение входного контрольного слова без ответного выхода. CWDSimple определяет останов
  обновления и формирует предупреждение об отсутствии связи.
use_cases:
- Достаточно проверить регулярное обновление одного сигнала от внешней системы.
- Внешняя система периодически изменяет одно контрольное значение, но не ожидает ответного слова.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - Изменяемое слово
    - 'CWDSimple

      контроль обновления'
    - 'HMI предупреждений

      нет связи'
application:
  intro: Внешняя система периодически изменяет одно контрольное значение, но не ожидает ответного слова. Ниже показаны параметры
    в том же формате ключ/значение, который используется в MetaPlatform.
  result: CWDSimple определяет останов обновления и формирует предупреждение об отсутствии связи.
parameter_groups:
- title: Простой WatchDog
  items:
  - key: $WDSimple
    default: Простой WatchDog
    example: Простой WatchDog
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: WDSimpleId
    default: _ID_
    example: SCADA_WD
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: WDSimpleComment
    default: Комментарий
    example: Связь со SCADA
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
  - key: WDSimpleIn
    default: _WD_IN_
    example: SCADA_WD_IN
    description: Входное значение или сигнал, передаваемый в функциональный блок.
  - key: WDSimpleConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: WDSimpleConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
  - key: WDSimpleConnMsg
    default: Связь установлена
    example: Связь установлена
    description: Текст нормального состояния связи; сообщение об ошибке формируется как отсутствие связи с партнёром.
example:
  title: Контроль обновления данных SCADA
  scenario: Внешняя система периодически изменяет одно контрольное значение, но не ожидает ответного слова.
  result: CWDSimple определяет останов обновления и формирует предупреждение об отсутствии связи.
settings:
- key: …_WDSimple_diTimeout
  default: '5'
  description: Таймаут связи
hmi:
- tag: WDSimple.out_bConn
  description: Настройка функционального блока
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: WDSimple.out_bInit
  description: Получено первое изменение сигнала
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi: []
common_mistakes:
- Оставить служебные значения _ID_, _DI_, _DO_ или _AO_ вместо реальных тегов проекта.
- Не проверить классы сообщений и доступность настроек на HMI после генерации проекта.
