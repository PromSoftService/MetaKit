component: PIDD
slug: pidd
source: yaml/LibTempls/Regulators/pidd.yaml
kind: Lib
title: Импульсный PID-регулятор
category: Регуляторы
summary: Превращает ошибку регулирования в импульсы «Больше» и «Меньше».
description: 'PIDD используют для привода, который не принимает аналоговое задание, но понимает две дискретные
  команды: увеличить и уменьшить. Направление зависит от знака расчётного воздействия, а длительность
  импульсов — от его величины. В отличие от простого включения на всё время отклонения, такой алгоритм
  позволяет делать короткие корректирующие движения около уставки. Шаблон создаёт только регулятор; режимы
  механизма, концевики и блокировки должны быть реализованы отдельным компонентом.'
use_cases:
- Трёхточечный клапан или привод имеет дискретные входы «Больше/Меньше» и должен корректироваться импульсами
  по измерению.
- Требуется более плавное движение около уставки, чем непрерывная команда простого трёхпозиционного регулятора.
not_for:
- 'Привод ожидает аналоговое задание 0–100 %: это задача PID.'
- 'Нужен полностью собранный контур клапана с HMI и концевиками: используйте PiddValveUnit.'
- 'Нужен одиночный импульс фиксированной длительности: PIDD рассчитывает регулирование, а не просто выдержку
  времени.'
diagram:
  lanes:
  - - 'Sensor

      измерение и ошибка'
    - 'PIDD

      ошибка относительно SP'
    - 'Up / Down

      корректирующие импульсы'
    - 'Valve

      отдельный компонент'
application:
  intro: Трёхточечный клапан отопления должен поддерживать 70 °C. Создайте Sensor TT101 и PIDD TIC101,
    укажите PIDDSensId = TT101. Выходы TIC101_PIDD_Inst.out_bUp/out_bDown передайте в команды отдельного
    Valve.
  result: При исправном датчике регулятор выдаёт импульсы открытия или закрытия. Для уже собранного контура
    с режимами и концевиками есть PiddValveUnit.
parameter_groups:
- title: Назовите импульсный регулятор
  intro: Создайте TIC101 для температуры подачи. Он формирует направления корректировки, но не создаёт
    Valve и не подключает физические выходы. CabinetController_Inst нужен для предусмотренного шаблоном
    сброса.
  items:
  - key: $PIDD
    default: Дискретный ПИД-регулятор
    example: Дискретный ПИД-регулятор
    description: Подпись блока в комментариях. Оставьте «Дискретный ПИД-регулятор», если отдельное обозначение
      не требуется.
  - key: PIDDId
    default: _ID_
    example: TIC101
    description: Уникальное имя импульсного регулятора, например TIC101. Создаёт экземпляр TIC101_PIDD_Inst
      с командами Up и Down.
  - key: PIDDComment
    default: Комментарий
    example: Температура подачи отопления
    description: Название регулируемого процесса, например «Температура подачи отопления». По нему пользователь
      узнаёт настройки контура.
- title: Подключите датчик и автоматическое разрешение
  intro: Sensor TT101 должен уже выдавать температуру в градусах. Разрешение bHeatingAuto формируется
    вашим контуром с учётом его режима; ошибку TT101 регулятор проверит дополнительно.
  items:
  - key: PIDDSensId
    default: _ID_
    example: TT101
    description: Id существующего Sensor, например TT101. От него берутся сглаженная температура и ошибка
      измерения. Укажите Id датчика, не физический вход ПЛК.
  - key: PIDDEnExtra
    default: 'true'
    example: bHeatingAuto
    description: 'Разрешение автоматической работы регулятора, например bHeatingAuto. FALSE снимает регулирующие
      импульсы. Сам PIDD не знает, выбран ли Manual у отдельного Valve: эту связь нужно задать при сборке
      контура.'
- title: Выберите набор настроек
  intro: Оставьте эти поля пустыми для собственных настроек TIC101. Затем задайте уставку 70 °C и подберите
    период и коэффициенты при наладке конкретного клапана.
  items:
  - key: PIDDConf
    default: ''
    example: ''
    description: Необязательное имя общего набора настроек PIDD. Пусто — настройки по PIDDId. Совместное
      имя используйте только если уставки и коэффициенты должны быть одинаковыми.
  - key: PIDDConfComment
    default: ''
    example: ''
    description: Название общих настроек. При пустом поле подпись берётся из PIDDComment и $PIDD.
example:
  title: Трёхточечный клапан отопления
  scenario: Sensor TT101 измеряет температуру подачи, TIC101 имеет уставку 70 °C. В автоматические команды
    отдельного Valve передайте TIC101_PIDD_Inst.out_bUp и out_bDown. Начальный период расчёта и коэффициенты
    выберите для реального времени хода; затем проверьте направление реакции на отклонение температуры.
  result: При необходимости увеличить воздействие появляются импульсы Up, при необходимости уменьшить
    — Down. Valve должен сохранить режимы, концевики, паузу реверса и аварийные ограничения. Если всё
    это нужно готовым контуром, выберите PiddValveUnit.
settings:
- key: …_PIDD_fSP
  default: '0.0'
  description: 'Уставка процесса в единицах Sensor: например 70 °C. PIDD сравнивает с ней измерение и
    выбирает направление корректирующих импульсов.'
- key: …_PIDD_fDB
  default: '0.0'
  description: Допустимое отклонение около уставки, в тех же единицах. Позволяет не двигать привод из-за
    мелких колебаний измерения.
- key: …_PIDD_fSR
  default: '3.0'
  description: 'Период расчёта и формирования импульсного управления, секунды. Согласуйте с быстродействием
    привода: слишком короткие импульсы он может не отрабатывать.'
- key: …_PIDD_fKp
  default: '1.0'
  description: Сила реакции на отклонение процесса. Влияет на заполнение импульсов; чрезмерное значение
    приводит к частым или длинным движениям.
- key: …_PIDD_fTi
  default: '0.0'
  description: Время интегральной части внутреннего расчёта, секунды. 0.0 отключает её. В PIDD используются
    импульсы по текущему воздействию, поэтому не переносите настройки аналогового PID без наладки.
- key: …_PIDD_fTd
  default: '0.0'
  description: Время дифференциальной части, секунды. 0.0 отключает её; применять следует с учётом шума
    датчика и динамики привода.
hmi: []
optional_hmi:
- tag: PIDD.out_bUp
  description: Импульс увеличения воздействия. Можно добавить строку HMI для диагностики команды; сам
    выход ФБ существует, хотя в штатной таблице данных отдельный HMI-тег не выбран.
- tag: PIDD.out_bDown
  description: Импульс уменьшения воздействия. Для HMI добавьте диагностическую строку при необходимости.
    Это не подтверждение реального движения клапана.
common_mistakes:
- Подключить Up/Down напрямую к приводу, которому нужны режимы, концевики и запрет реверса. Эти проверки
  делает отдельный блок механизма.
- 'Перепутать направление действия: откройте клапан при наладке и проверьте, действительно ли это увеличивает
  регулируемую величину.'
- Считать Manual отдельного Valve автоматическим отключением Lib PIDD. Согласуйте PIDDEnExtra и команды
  Valve в собственном контуре.
- Выбрать импульсы короче времени реакции привода. Число в регуляторе меняется, но механизм может не успевать
  двигаться.
