component: Sensor
slug: sensor
source: yaml/LibTempls/Sensor/Sensor.yaml
kind: Lib
title: Аналоговый датчик
category: Датчики
summary: CSensor и CSensorFilter с масштабированием, диагностикой канала, границами и фильтрацией значения.
description: CSensor и CSensorFilter с масштабированием, диагностикой канала, границами и фильтрацией значения. При Raw =
  6000 компонент получает EV = 12 мА и FV = 5 бар, сглаживает результат и передаёт его на HMI. Выход сигнала за 3–21 мА формирует
  предупреждение.
use_cases:
- Датчик 4–20 мА или 0–10 В подключён к аналоговому входу ПЛК.
- Аналоговый модуль возвращает число в собственной шкале, а проекту нужны бары, градусы, проценты или м³/ч.
- Нужно обнаруживать ошибку канала, обрыв или выход электрического сигнала за допустимые границы.
- Значение датчика шумит и перед отображением или регулированием его нужно усреднить.
not_for:
- Дискретные датчики и концевые выключатели — для них не требуется аналоговое масштабирование.
- Быстродействующие защиты, которым нельзя ждать усреднения; для защиты используйте исходное или отдельно обработанное значение.
- Сигналы, уже полностью преобразованные другим компонентом, если не нужны коррекция, диагностика и фильтрация Sensor.
diagram:
  lanes:
  - - 'Raw

      значение ПЛК'
    - 'CSensor

      Raw → EV → FV'
    - 'CSensorFilter

      сглаживание'
    - 'HMI значения

      out_fY'
  - - 'CSensor

      электрическая шкала'
    - 'out_fEV

      ток или напряжение'
    - 'HMI диагностики

      out_fEV'
  - - 'ChErr + EVLL/EVHH

      контроль сигнала'
    - 'out_bError

      ошибка датчика'
    - 'HMI предупреждений

      Wrn'
application:
  intro: Аналоговый вход ПЛК представляет 0–20 мА числами 0–10000. Рабочим точкам датчика 4 и 20 мА соответствуют Raw 2000
    и 10000. Ниже показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: При Raw = 6000 компонент получает EV = 12 мА и FV = 5 бар, сглаживает результат и передаёт его на HMI. Выход сигнала
    за 3–21 мА формирует предупреждение.
parameter_groups:
- title: Датчик аналоговый
  items:
  - key: $Sensor
    default: Датчик аналоговый
    example: Датчик аналоговый
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: SensId
    default: _ID_
    example: PT101
    description: Уникальный идентификатор датчика и префикс создаваемых тегов.
  - key: Raw
    default: _IN_
    example: AI_PT101
    description: REAL-переменная с текущим значением аналогового входа ПЛК.
  - key: SensComment
    default: Комментарий
    example: Давление в коллекторе
    description: Название измерения для HMI и сообщений.
  - key: SensRawMin
    default: ADC_4_IN_0_20
    example: '2000.0'
    description: Значение АЦП, соответствующее нижней точке электрического сигнала.
  - key: SensRawMax
    default: ADC_MAX_VALUE
    example: '10000.0'
    description: Значение АЦП, соответствующее верхней точке электрического сигнала.
  - key: SensEVMin
    default: '4.0'
    example: '4.0'
    description: Нижняя точка электрической шкалы, обычно 4 мА или 0 В.
  - key: SensEVMax
    default: '20.0'
    example: '20.0'
    description: Верхняя точка электрической шкалы, обычно 20 мА или 10 В.
  - key: SensEVZP
    default: '4.0'
    example: '4.0'
    description: Ниже этого электрического значения результат заменяется безопасным SensFVZP.
  - key: SensFVZP
    default: '0.0'
    example: '0.0'
    description: Безопасное физическое значение при ошибке или сигнале ниже SensEVZP.
  - key: SensFVXMin
    default: '4.0'
    example: '4.0'
    description: Электрический сигнал в нижней паспортной точке измерения.
  - key: SensFVXMax
    default: '20.0'
    example: '20.0'
    description: Электрический сигнал в верхней паспортной точке измерения.
  - key: SensFVYMin
    default: '0.0'
    example: '0.0'
    description: Физическая величина в нижней паспортной точке.
  - key: SensFVYMax
    default: '100.0'
    example: '10.0'
    description: Физическая величина в верхней паспортной точке.
  - key: SensFVLimit
    default: 'false'
    example: 'false'
    description: Ограничивать рассчитанное значение физической шкалой.
  - key: SensEnScale
    default: 'true'
    example: 'true'
    description: Включить двухступенчатое преобразование Raw → EV → FV.
  - key: SensK
    default: '1.0'
    example: '1.0'
    description: Множитель итоговой коррекции измерения.
  - key: SensAdd
    default: '0.0'
    example: '0.0'
    description: Смещение, прибавляемое после умножения на SensK.
  - key: ChErr
    default: 'FALSE'
    example: AI_PT101_ERROR
    description: Ошибка аппаратного аналогового канала. Если диагностики нет, укажите FALSE.
  - key: SensChannelBypass
    default: 'false'
    example: 'false'
    description: Игнорировать ошибку аппаратного канала ChErr.
  - key: SensEVLL
    default: '3.0'
    example: '3.0'
    description: Нижняя диагностическая граница электрического сигнала.
  - key: SensEVHH
    default: '21.0'
    example: '21.0'
    description: Верхняя диагностическая граница электрического сигнала.
  - key: SensLimitBypass
    default: 'false'
    example: 'false'
    description: Отключить контроль границ SensEVLL и SensEVHH.
  - key: SensLimitFilterTime
    default: '0'
    example: '3'
    description: Выдержка времени перед фиксацией выхода электрического сигнала за границы.
  - key: SensAutoReset
    default: 'true'
    example: 'true'
    description: Автоматически снять ошибку после восстановления сигнала.
  - key: SensFilterPeriod
    default: '1'
    example: '1'
    description: Интервал между выборками скользящего среднего, секунд.
  - key: SensFilterCount
    default: '3'
    example: '3'
    description: Количество последних выборок в среднем.
