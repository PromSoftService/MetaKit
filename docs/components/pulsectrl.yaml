component: PulseCtrl
slug: pulsectrl
source: yaml/LibTempls/Ctrl/pulsectrl.yaml
kind: Lib
title: Импульсное управление
category: Управление сигналами
summary: Шаблон CPulseCtrl для выдачи управляющих импульсов.
description: Шаблон CPulseCtrl для выдачи управляющих импульсов. На выходе формируется готовая дискретная команда с заданными
  длительностями общего цикла и импульсов.
use_cases:
- Исполнительному устройству требуются команды ограниченной длительности.
- После команды вибратор сначала работает импульсами, а затем при необходимости переходит в постоянное включение.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - Разрешение
    - 'CPulseCtrl

      импульсы → постоянно'
    - 'HMI выхода

      out_bSignal'
application:
  intro: После команды вибратор сначала работает импульсами, а затем при необходимости переходит в постоянное включение. Ниже
    показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: На выходе формируется готовая дискретная команда с заданными длительностями общего цикла и импульсов.
parameter_groups:
- title: Импульсное управление
  items:
  - key: $PulseCtrl
    default: Импульсное управление
    example: Импульсное управление
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: PulseCtrlId
    default: _ID_
    example: PULSECTRL
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: PulseCtrlComment
    default: Комментарий
    example: Пуск вибратора бункера
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
  - key: PulseCtrlEn
    default: 'true'
    example: 'true'
    description: Дополнительное разрешение работы соответствующего блока.
  - key: PulseCtrlConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: PulseCtrlConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
example:
  title: Пуск вибратора бункера
  scenario: После команды вибратор сначала работает импульсами, а затем при необходимости переходит в постоянное включение.
  result: На выходе формируется готовая дискретная команда с заданными длительностями общего цикла и импульсов.
settings:
- key: …_PulseCtrl_diTotalTime
  default: '10'
  description: Время подачи импульсов
- key: …_PulseCtrl_diPulseCycle
  default: '2'
  description: Время цикла импульса
- key: …_PulseCtrl_diPulseTime
  default: '1'
  description: Время подачи импульса
hmi:
- tag: PulseCtrl.out_bSignal
  description: Сигнал управления
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi: []
common_mistakes:
- Оставить служебные значения _ID_, _DI_, _DO_ или _AO_ вместо реальных тегов проекта.
- Не проверить классы сообщений и доступность настроек на HMI после генерации проекта.
