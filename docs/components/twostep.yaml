component: TwoStep
slug: twostep
source: yaml/LibTempls/Regulators/TwoStep.yaml
kind: Lib
title: Двухпозиционный регулятор
category: Регуляторы
summary: 'Включает одно из двух действий по нижней и верхней границам: например нагрев и охлаждение.'
description: TwoStep подходит там, где достаточно переключаться между двумя состояниями и плавный PID
  не нужен. Например, нагрев включается при низкой температуре, а при достижении верхней границы выключается.
  Между границами сохраняется предыдущее состояние — это исключает частые переключения около уставки.
  Помимо аналогового измерения есть дискретные условия Lo и Hi; они продолжают действовать и при включённой
  аналоговой ветке. Названия Heating/Cooling означают нижнее и верхнее действие и подходят также для подпитки
  или слива.
use_cases:
- Подпитка по нижнему уровню и останов по верхнему, нагрев ниже заданной температуры либо охлаждение выше
  неё.
- Нужно сохранять действие между границами, чтобы привод не переключался от каждого малого колебания.
- Два дискретных датчика задают нижнее и верхнее условия без аналогового измерения.
not_for:
- 'Нужна нейтральная зона, где обе команды выключены: посмотрите ThreeStep.'
- 'Требуется плавное аналоговое задание частоты или положения: используйте PID.'
- 'Нужен готовый контур двигателя или клапана с двухпозиционным управлением: есть TwoStepEngineUnit и
  TwoStepValveUnit.'
diagram:
  lanes:
  - - 'Sensor + SP/Hys

      или Lo/Hi'
    - 'TwoStep

      выбор действия'
    - 'Heating

      нижнее действие'
    - 'HMI нагрева

      если включить строку'
  - - 'TwoStep

      выбор действия'
    - 'Cooling

      верхнее действие'
    - 'HMI охлаждения

      если включить строку'
application:
  intro: Для ёмкости задайте TwoStepSensId = TT101, TwoStepInput = true, TwoStepLo = false и TwoStepHi
    = false. В настройках установите SP = 60 °C и Hys = 2 °C. В текстах сообщений укажите «Требуется нагрев»
    и «Требуется охлаждение».
  result: Ниже нижней границы включается Heating, выше верхней — Cooling. Между границами сохраняется
    выбранное действие. Строки обоих выходов уже есть в таблице данных; включите нужные HMI или Wrn, если
    требуются индикация или сообщение.
parameter_groups:
- title: Назовите задачу
  intro: Создайте регулятор TIC101 для ёмкости. Слово «Нагрев» в имени выхода означает нижнее действие;
    тот же блок можно использовать для подпитки, слива и других двухпозиционных задач.
  items:
  - key: $TwoStep
    default: Двухпозиционный регулятор
    example: Двухпозиционный регулятор
    description: Подпись типа блока в комментариях. Обычно «Двухпозиционный регулятор». Не выбирает действие
      Heating или Cooling.
  - key: TwoStepId
    default: _ID_
    example: TIC101
    description: Уникальное имя двухпозиционного регулятора, например TIC101. Не должно совпадать с Id
      другого такого регулятора в проекте.
  - key: TwoStepComment
    default: Комментарий
    example: Температура ёмкости
    description: Название задачи, например «Температура ёмкости». Используется для настроек; тексты включения
      Heating и Cooling задаются отдельными Msg-параметрами.
- title: Подключите аналоговое измерение
  intro: Для температуры укажите Sensor TT101 и точное значение true в TwoStepInput. Условие bTankControl
    разрешает весь регулятор. В настройках ниже задайте SP = 60 и Hys = 2.
  items:
  - key: TwoStepSensId
    default: _ID_
    example: TT101
    description: Id датчика Sensor, например TT101. Используется при TwoStepInput = true для измерения
      и проверки ошибки. При чисто дискретном управлении Sensor не требуется.
  - key: TwoStepInput
    default: 'true'
    example: 'true'
    description: Точное значение true включает аналоговую ветку от Sensor; false оставляет только дискретные
      Lo/Hi. Дискретные входы продолжают действовать и при true. Здесь не вводят само измерение.
  - key: TwoStepEnExtra
    default: 'true'
    example: bTankControl
    description: Разрешение работы всего регулятора. FALSE снимает оба выхода. При включённой аналоговой
      ветке ошибка Sensor также снимает разрешение, независимо от этого параметра.
- title: Определите роль дискретных входов
  intro: В чисто аналоговом примере оба входа false. Для двух датчиков уровня можно выключить аналоговую
    ветку и подать нижнее/верхнее условия сюда. При включённой аналоговой ветке Lo/Hi всё равно действуют.
  items:
  - key: TwoStepLo
    default: 'false'
    example: 'false'
    description: Дополнительное дискретное условие нижнего действия, например датчик низкого уровня. Участвует
      всегда. Для чисто аналогового регулирования оставьте false.
  - key: TwoStepHi
    default: 'false'
    example: 'false'
    description: Дополнительное дискретное условие верхнего действия, например верхний уровень. Участвует
      всегда. Для чисто аналогового регулирования оставьте false.
- title: Задайте понятные тексты выходов
  intro: Строки Heating и Cooling уже присутствуют в таблице данных, но категории сообщений не включены.
    Укажите понятные тексты, затем при необходимости включите HMI или нужную категорию Wrn/Flt/Alm у этих
    строк.
  items:
  - key: TwoStepHeatingMsg
    default: Нагрев
    example: Требуется нагрев
    description: Текст строки выхода Heating, например «Требуется подпитка». Если в таблице данных включить
      Wrn для этой строки, по нему формируется понятное сообщение.
  - key: TwoStepCoolingMsg
    default: Охлаждение
    example: Требуется охлаждение
    description: 'Текст строки выхода Cooling, например «Требуется охлаждение». Сам текст не включает
      сообщение: нужную категорию задайте в таблице данных.'
- title: Выберите индивидуальную или общую уставку
  intro: Пустые поля создают настройки по TwoStepId. Если несколько контуров должны переключаться по одному
    заданию, можно использовать общий набор, согласовав значения и комментарий.
  items:
  - key: TwoStepConf
    default: ''
    example: ''
    description: Имя общего набора уставки и гистерезиса. Пусто — отдельные настройки по TwoStepId; одинаковое
      имя связывает настройки нескольких регуляторов.
  - key: TwoStepConfComment
    default: ''
    example: ''
    description: Название общих настроек. При пустом поле используются TwoStepComment и $TwoStep.
example:
  title: 'Ёмкость: нагрев ниже 58 °C, охлаждение выше 62 °C'
  scenario: При SP = 60 и Hys = 2 включённая аналоговая ветка использует два порога. Ниже нижнего порога
    выбирается Heating, выше верхнего — Cooling. Между ними сохраняется предыдущее действие. Lo и Hi в
    этом примере оба false.
  result: 'Для одного нагревателя используйте только Heating: на верхней границе нагрев выключится, а
    Cooling может остаться лишь информацией. Для индикации или сообщения активируйте нужные столбцы существующих
    строк выходов. Обратную связь реального нагревателя должен проверять его механизм, не TwoStep.'
settings:
- key: …_TwoStep_fSP
  default: '0.0'
  description: Центр диапазона переключения в единицах измерения. Например, при 60 °C и гистерезисе 2
    °C нижняя и верхняя границы — 58 и 62 °C.
- key: …_TwoStep_fHys
  default: '0.0'
  description: Расстояние от уставки до границ переключения. Между ними сохраняется прежнее действие,
    поэтому механизм не переключается на каждом колебании около уставки.
hmi: []
optional_hmi:
- tag: TwoStep.out_bHeating
  description: Строка уже есть в таблице данных; по умолчанию HMI/Flt/Wrn/Alm/Trend не выбраны. Включите
    нужный вывод, текст берётся из TwoStepHeatingMsg. Это запрос нижнего действия, а не подтверждение
    работы нагревателя.
- tag: TwoStep.out_bCooling
  description: Строка верхнего действия уже есть, но выводы по умолчанию не выбраны. Для сообщения используйте
    TwoStepCoolingMsg и нужную категорию в таблице данных. Внутри гистерезиса предыдущее действие может
    сохраняться.
common_mistakes:
- Ожидать, что внутри гистерезиса оба выхода обязательно выключены. TwoStep сохраняет предыдущее действие;
  для нейтральной зоны существует ThreeStep.
- Оставить активным TwoStepLo или TwoStepHi при аналоговой работе и считать, что они игнорируются. Дискретные
  условия участвуют всегда.
- Одновременно подать противоположные условия. В реализации при совпадении условий приоритет получает
  Cooling; такую ситуацию лучше исключить в проектной логике.
- Заполнить Msg и ожидать готового предупреждения. Текст задаёт комментарий, категорию HMI/Wrn/Flt/Alm
  нужно включить в таблице данных.
- Заменить TwoStepInput выражением вместо точного true/false. Выбор обращения к Sensor выполняется при
  генерации по тексту этого параметра.
