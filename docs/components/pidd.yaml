component: PIDD
slug: pidd
source: yaml/LibTempls/Regulators/pidd.yaml
kind: Lib
title: Импульсный PID-регулятор
category: Регуляторы
summary: Индивидуальный CPIDD для трёхпозиционного исполнительного механизма.
description: Индивидуальный CPIDD для трёхпозиционного исполнительного механизма. CPIDD сравнивает требуемое и текущее положение
  и выдаёт команды изменения в нужную сторону.
use_cases:
- Регулятор должен формировать команды больше и меньше вместо непрерывного аналогового выхода.
- Положение клапана изменяется импульсами Открыть и Закрыть, поэтому непрерывный выход PID нужно преобразовать в дискретные
  команды.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - PV + SP
    - 'CPIDD

      дискретный PID'
    - 'Команды

      Больше / Меньше'
  - - Ошибка PV
    - Блокировка регулятора
    - 'HMI диагностики

      состояние'
application:
  intro: Положение клапана изменяется импульсами Открыть и Закрыть, поэтому непрерывный выход PID нужно преобразовать в дискретные
    команды. Ниже показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: CPIDD сравнивает требуемое и текущее положение и выдаёт команды изменения в нужную сторону.
parameter_groups:
- title: Дискретный ПИД-регулятор
  items:
  - key: $PIDD
    default: Дискретный ПИД-регулятор
    example: Дискретный ПИД-регулятор
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: PIDDId
    default: _ID_
    example: TIC101
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: PIDDComment
    default: Комментарий
    example: Регулятор температуры
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
  - key: PIDDEnExtra
    default: 'true'
    example: 'true'
    description: Дополнительное разрешение работы соответствующего блока.
  - key: PIDDConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: PIDDConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
- title: Группа параметров 2
  items:
  - key: PIDDSensId
    default: _ID_
    example: PIDD
    description: Id Sensor, который предоставляет PV и признак ошибки для CPIDD.
example:
  title: Регулирование температуры трёхточечным клапаном
  scenario: Положение клапана изменяется импульсами Открыть и Закрыть, поэтому непрерывный выход PID нужно преобразовать в
    дискретные команды.
  result: CPIDD сравнивает требуемое и текущее положение и выдаёт команды изменения в нужную сторону.
settings:
- key: …_PIDD_fSP
  default: '0.0'
  description: Уставка
- key: …_PIDD_fDB
  default: '0.0'
  description: Зона нечувствительности
- key: …_PIDD_fSR
  default: '3.0'
  description: Время дискретизации
- key: …_PIDD_fKp
  default: '1.0'
  description: Kp
- key: …_PIDD_fTi
  default: '0.0'
  description: Ti
- key: …_PIDD_fTd
  default: '0.0'
  description: Td
hmi: []
optional_hmi: []
common_mistakes:
- Оставить служебные значения _ID_, _DI_, _DO_ или _AO_ вместо реальных тегов проекта.
- Не проверить классы сообщений и доступность настроек на HMI после генерации проекта.
