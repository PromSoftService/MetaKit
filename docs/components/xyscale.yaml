component: xyScale
slug: xyscale
source: yaml/LibTempls/Math/xyscale.yaml
kind: Lib
title: Масштабирование XY
category: Математика
summary: Переводит инженерное задание в целочисленный код аналогового выхода.
description: 'xyScale пересчитывает число по двум соответствующим парам точек. Например, задание 0–100
  % нужно превратить в коды 2000–10000, которые модуль AO выдаёт как 4–20 мА. Функция делает линейный
  пересчёт и при необходимости ограничивает результат шкалой. Важно различать функцию MetaLib и этот MK-шаблон:
  здесь результат дополнительно преобразуется REAL_TO_INT и записывается в ScaleOut. Поэтому шаблон предназначен
  прежде всего для кода выходного канала, а не для сохранения дробного измерения. У него нет собственного
  экземпляра ФБ, настроек Conf, диагностики или сглаживания.'
use_cases:
- Нужно перевести проценты управления в целочисленный код аналогового выхода ПЛК.
- Электрическая шкала AO отличается от инженерной шкалы задания, и соответствие между ними линейное.
not_for:
- 'Нужно сохранить дробный результат как REAL: сам xyScale это умеет, но текущий MK-шаблон явно преобразует
  результат в INT.'
- 'Обработка аналогового датчика с диагностикой и сглаживанием: используйте Sensor.'
- 'Нелинейная характеристика, таблица калибровки или изменение по времени: две точки линейного масштаба
  этого не описывают.'
diagram:
  lanes:
  - - 'Задание X

      например 50 %'
    - 'Линейная шкала

      0–100 → 2000–10000'
    - 'REAL_TO_INT

      целое число'
    - 'ScaleOut

      AO = 6000'
application:
  intro: Модуль AO преобразует коды 0–10000 в 0–20 мА, а частотник принимает рабочие 4–20 мА как 0–100
    % задания. Значит, 0 % должны давать код 2000, 100 % — 10000. Подключим fPumpSpeedPercent и выход
    AO_P101.
  result: При задании 0 % получается код 2000; при 50 % — 6000; при 100 % — 10000. Преобразование в INT
    выполняется самим шаблоном. Эти коды верны только для выбранной шкалы модуля.
parameter_groups:
- title: Подключите исходное задание и выход
  intro: Нужно перевести задание насоса fPumpSpeedPercent в число AO_P101. В этом MK-шаблоне результат
    сразу преобразуется в INT; его удобно использовать для кода аналогового выхода.
  items:
  - key: ScaleX
    default: '0.0'
    example: fPumpSpeedPercent
    description: Число или REAL-переменная, которую нужно пересчитать, например 50.0 % мощности.
  - key: ScaleOut
    default: _AO_
    example: AO_P101
    description: 'Имя переменной, куда записывается результат, например AO_P101. В текущем шаблоне после
      xyScale явно выполняется REAL_TO_INT: получается целочисленный код выхода, а не дробное REAL-измерение.'
  - key: ScaleComment
    default: Комментарий
    example: Задание частоты насоса P101
    description: Что именно пересчитывается, например «Задание частоты на AO насоса P101». Помогает узнать
      назначение преобразования в проекте.
- title: Задайте две соответствующие пары
  intro: При 0 % хотим получить 4 мА, при 100 % — 20 мА. У выбранного модуля это коды 2000 и 10000. Задайте
    шкалу задания X и соответствующую ей шкалу кодов Y.
  items:
  - key: ScaleXMin
    default: '0.0'
    example: '0.0'
    description: Нижняя точка исходной шкалы, например 0.0 %. Соответствующее ей выходное число задаётся
      в ScaleYMin.
  - key: ScaleXMax
    default: '100.0'
    example: '100.0'
    description: Верхняя точка исходной шкалы, например 100.0 %. Она должна отличаться от ScaleXMin; иначе
      линейный пересчёт не определён.
  - key: ScaleYMin
    default: ADC_4_IN_0_20
    example: '2000.0'
    description: Число выходного канала, соответствующее ScaleXMin. Например, 2000 даёт 4 мА у модуля
      с полной шкалой 0–20 мА → 0–10000.
  - key: ScaleYMax
    default: ADC_MAX_VALUE
    example: '10000.0'
    description: Число выходного канала, соответствующее ScaleXMax. Для того же примера 10000 даёт 20
      мА. Здесь указывают код AO, а не 20.0 только потому, что это ток 20 мА.
- title: Ограничьте выход рабочей шкалой
  intro: Для обычного аналогового выхода оставьте ограничение true. Тогда входное задание за пределами
    0–100 % не выведет результат за заданные коды. Подпись $Scale можно не менять.
  items:
  - key: ScaleLimit
    default: 'true'
    example: 'true'
    description: true ограничивает результат целевой шкалой до преобразования в INT. false разрешает продолжение
      линейной зависимости за её краями; для AO это требует особенно внимательной проверки диапазона.
  - key: $Scale
    default: Масштабирование
    example: Масштабирование
    description: Подпись операции в комментарии кода, обычно «Масштабирование». Не создаёт отдельный функциональный
      блок или HMI-объект.
example:
  title: Проверьте три точки и ограничение
  scenario: Подайте по очереди безопасные тестовые задания 0.0, 50.0 и 100.0. Для указанных пар ожидаются
    2000, 6000 и 10000. При ScaleLimit = true отрицательное задание ограничится нижним кодом, превышение
    100 % — верхним.
  result: 'Если нужен обратный выход, например 0 % → 10000 и 100 % → 2000, поменяйте соответствующие выходные
    точки. Проверяйте направление и допустимый диапазон кодов по реальному оборудованию. Для дробного
    физического измерения используйте подходящую REAL-обработку: этот шаблон целочисленный.'
settings: []
hmi: []
optional_hmi:
- tag: ScaleX / ScaleOut
  description: Сам шаблон не создаёт HMI-тегов. При наладке можно отдельно добавить в таблицу данных проекта
    источник задания и результирующий AO. Указывайте реальные имена переменных, а не эти названия параметров.
common_mistakes:
- Путать паспортный ток 4–20 мА с числами, которые ожидает модуль AO. Пары точек берутся из реальной конфигурации
  канала.
- Задать одинаковые ScaleXMin и ScaleXMax. По одной исходной точке невозможно определить линейный масштаб.
- 'Ожидать дробный REAL-результат от текущего шаблона: после функции стоит REAL_TO_INT.'
- Выйти за диапазон INT слишком большой шкалой или отключённым ограничением. Проверяйте допустимые числа
  до приведения типа.
- Ожидать тег Conf или готовый HMI-экземпляр от xyScale. Параметры передаются напрямую, отдельного блока
  с состоянием здесь нет.
