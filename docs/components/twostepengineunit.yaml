component: TwoStepEngineUnit
slug: twostepengineunit
source: yaml/UnitsTmpls/twostepengineunit.yaml
kind: Unit
title: Двигатель с двухпозиционным регулятором
category: Готовые контуры
summary: Включает и выключает двигатель по двум границам измерения, например наполняет ёмкость между 40
  и 60 %.
description: 'TwoStepEngineUnit нужен там, где плавный PID не требуется: насос, вентилятор или другой двигатель
  должен периодически включаться и выключаться. Встроенный TwoStep сравнивает Sensor с уставкой и гистерезисом,
  CEngine выполняет пуск, контролирует работу и предоставляет режимы HMI. Для наполнения выбирают нижнее
  действие Heating, для откачки или охлаждения — верхнее Cooling. Между границами сохраняется предыдущее
  действие. В Manual двигатель подчиняется ручным кнопкам, а не TwoStep; при этом ошибка Sensor, EStopExtra
  и отсутствие питания по-прежнему запрещают двигатель.'
use_cases:
- 'Наполнение ёмкости: включить насос ниже нижнего уровня, выключить после достижения верхнего.'
- 'Откачка или охлаждение: двигатель должен включаться при слишком высоком измерении и выключаться после
  его снижения.'
not_for:
- Требуется плавное регулирование скорости ПЧ — используйте PidEngineUnit.
- 'Измерение задаётся только двумя дискретными поплавками: текущий Unit ожидает Sensor и не предоставляет
  Lo/Hi.'
- 'Требуется нейтральная зона без сохранения предыдущего действия: это не логика TwoStep.'
diagram:
  lanes:
  - - Sensor LT101
    - 'TwoStep

      границы и память'
    - Выбор Heating / Cooling
    - CEngine → DO
  - - Manual + кнопки HMI
    - CEngine
    - Ручной пуск / стоп
  - - Ошибка Sensor / EStopExtra
    - Запрет двигателя
    - HMI блокировки
  - - Обратный контакт
    - Состояние двигателя
    - HMI работы
  - - Фильтр аварий
    - HMI аварий
  - - Фильтр предупреждений
    - HMI предупреждений
application:
  intro: Насос P101 наполняет ёмкость. Sensor LT101 уже выдаёт уровень 0–100 %. При разрешённом контуре
    насос должен включаться ниже 40 % и выключаться выше 60 %. Для этого выбираем нижнее действие и задаём
    центр 50 % с гистерезисом 10 %.
  result: 'В Auto насос циклически поддерживает уровень в диапазоне. В Manual оператор может запустить или
    остановить его кнопками, но ошибка датчика и защита от сухого хода остаются действующими. Частота насоса
    не регулируется: выход только дискретный.'
parameter_groups:
- title: Назовите агрегат и выберите родителя
  intro: CabinetController_Inst уже должен быть создан отдельно или в General. Здесь задаются общие для
    внутреннего механизма и сообщений имя и комментарий.
  items:
  - key: Id
    default: _ID_
    example: P101
    description: Уникальное имя всего агрегата, например P101. По нему создаются его Engine, CascadeUnit
      и две группы сообщений. Второй компонент с таким Id создавать нельзя.
  - key: Comment
    default: Комментарий
    example: Насос наполнения ёмкости
    description: Понятное название всего агрегата, например «Насос циркуляции». Подписи внутренних блоков
      добавляются к нему автоматически.
  - key: Parent
    default: CabinetController_Inst
    example: CabinetController_Inst
    description: 'Имя существующего CabinetController или вышестоящего CascadeUnit. От родителя берутся
      питание, экстренный останов, сброс аварий и наработки. Автоматическая команда работы и выбранный режим
      родителя сюда сами не переходят: задайте StartCmd отдельно.'
- title: Подключите разрешение контура и защиту
  intro: 'StartCmd включает двухпозиционный контур, но не обязан сразу запускать насос: в Auto дополнительно
    требуется выбранное действие TwoStep. EStopExtra — независимая защита от сухого хода.'
  items:
  - key: StartCmd
    default: 'false'
    example: CabinetController_Inst.out_bWorkAndPower AND bTankFillingEnabled
    description: Общее разрешение автоматического двухпозиционного контура. TRUE включает TwoStep; двигатель
      запускается только при выбранном действии регулятора. FALSE снимает автоматический запрос насосу.
      Manual двигателя использует отдельные кнопки HMI.
  - key: EStopExtra
    default: 'false'
    example: DI_P101_DRY_RUN
    description: Дополнительное условие экстренного останова всего Unit, например DI_P101_DRY_RUN. Объединяется
      с экстренным остановом родителя до входа двигателя и не ждёт обычной задержки Stop. Само поле не создаёт
      отдельный текст аварии; причину нужно показывать в диагностике проекта.
- title: Подключите выбор режима
  intro: Аппаратный Local имеет приоритет. При разрешённом Remote оператор выбирает Auto или Manual с HMI.
    Готовый Unit не содержит отдельных входов местных кнопок.
  items:
  - key: EngLocal
    default: 'false'
    example: DI_P101_LOCAL
    description: Сигнал положения переключателя «Местное». TRUE выбирает Local, который имеет приоритет
      над дистанционным режимом. Сам этот параметр не подключает кнопки местного поста.
  - key: EngRemote
    default: 'true'
    example: DI_P101_REMOTE
    description: Сигнал разрешённого дистанционного управления. При TRUE и отсутствии Local режим Auto/Manual
      выбирается с HMI. Если оба сигнала режима FALSE, механизм находится в Off.
  - key: EngLocalControlByPLC
    default: 'false'
    example: 'false'
    description: 'Выбор поведения самого CEngine в Local. false — местной аппаратурой управляют вне ПЛК,
      блок отслеживает фактическую работу. true — допускается управление через ПЛК. В этом Unit отдельные
      местные кнопки не подключены: автоматические команды StartCmd формируются только в Auto, поэтому одного
      true недостаточно для реализации местного поста.'
- title: Подключите пускатель и подтверждение
  intro: Подключите реальные входы и выходы, проверьте полярность и соответствие команд обратной связи.
    Команда не заменяет фактический контакт состояния.
  items:
  - key: EngState
    default: 'false'
    example: DI_P101_STATE
    description: Обратная связь «двигатель работает» от пускателя или ПЧ. TRUE должно означать реальную
      работу, а не выданную команду. По этому сигналу подтверждается запуск и контролируется потеря работы.
  - key: EngStartOut
    default: _DO_
    example: DO_P101_START
    description: Имя дискретной выходной переменной команды пуска, например DO_P101_START. В неё записывается
      окончательная команда CEngine после режима, задержек и блокировок.
- title: Выберите настройки механизма
  intro: Для первого агрегата оставьте Conf-поля пустыми. Значения времён и поведения задайте в настройках
    ниже по реальному оборудованию, а не по имени шаблона.
  items:
  - key: $Eng
    default: Двигатель
    example: Двигатель
    description: Название внутреннего механизма в комментариях; обычно менять не требуется.
  - key: EngConf
    default: ''
    example: ''
    description: Необязательное имя общих настроек однотипных двигателей. Пусто — настройки по Id этого
      Unit. Общее имя допустимо только при одинаковых значениях и смысле всех объединяемых настроек.
  - key: EngConfComment
    default: ''
    example: ''
    description: 'Понятное название общего набора, если заполнен EngConf. Иначе оставьте пустым: подпись
      формируется из Comment всего Unit и $Eng.'
- title: Определите данные для верхнего каскада
  intro: Готовность, режим, состояние, аварию и наработку Unit уже получает от собственного механизма. Самостоятельно
    задаётся только Power; для простого дискретного агрегата его можно не использовать.
  items:
  - key: $CasUnit
    default: Элемент каскада
    example: Элемент каскада
    description: 'Подпись встроенного интерфейса агрегата. Второй CascadeUnit импортировать не нужно: готовый
      Unit уже содержит его.'
  - key: Power
    default: '0.0'
    example: '0.0'
    description: Мощность или производительность агрегата для верхнего каскада. Это не команда исполнительному
      механизму. Оставьте 0.0, если контроль мощности верхнего Cascade выключен; иначе передайте осмысленное
      значение в общей шкале участников.
- title: Подключите уровень и выберите наполнение или откачку
  intro: 'В примере насос P101 наполняет ёмкость, Sensor LT101 измеряет 0–100 %. Нужно нижнее действие:
    включиться при низком уровне и выключиться при высоком. Для откачки выберите противоположное действие.'
  items:
  - key: $TwoStep
    default: Двухпозиционный регулятор
    example: Двухпозиционный регулятор
    description: Подпись встроенного двухпозиционного регулятора. Он выбирает включить или выключить механизм
      по двум границам, а не задаёт его частоту.
  - key: SensId
    default: _ID_
    example: LT101
    description: Id готового Sensor, например LT101 с уровнем в процентах. От него берутся сглаженное значение
      и ошибка. В этом Unit аналоговая ветка всегда включена, а отдельных дискретных входов Lo/Hi нет.
  - key: TwoStepCoolingMode
    default: 'false'
    example: 'false'
    description: 'false выбирает нижнее действие Heating: двигатель нужен при слишком низком значении, например
      насос наполнения. true выбирает верхнее действие Cooling: двигатель нужен при слишком высоком значении,
      например насос откачки. Это выбор логики процесса, не ручной/автоматический режим.'
- title: Выберите набор границ переключения
  intro: 'В настройках задайте SP = 50.0 и Hys = 10.0: границы будут 40 и 60 %. Между ними сохраняется предыдущее
    действие, чтобы насос не переключался около каждой малой флуктуации.'
  items:
  - key: TwoStepConf
    default: ''
    example: ''
    description: Необязательное имя общих настроек SP и Hys. Пусто — настройки по Id Unit. Совместное имя
      используйте, только если несколько контуров должны иметь одинаковые границы переключения.
  - key: TwoStepConfComment
    default: ''
    example: ''
    description: Название общих уставки и гистерезиса. При пустом поле используются Comment всего Unit и
      $TwoStep. Выбранное действие Heating/Cooling задаётся отдельно параметром TwoStepCoolingMode.
- title: Подключите внешнюю аварию
  intro: Встроенный фильтр аварий уже подключён к внешней аварии механизма. Ниже канал 1; каналы 2–8 заполняются
    аналогично. Для каждого можно задать задержку и шунт в настройках.
  items:
  - key: $Flts
    default: Аварии
    example: Аварии
    description: 'Подпись группы в комментариях к коду. Категория сообщений уже задана шаблоном: Flt для
      аварий, Wrn для предупреждений.'
  - key: FltComment
    default: аварии
    example: Насос P101
    description: Общий контекст сообщений этой группы, например «Насос P101». Внешние причины используют
      это поле и текст своей строки, поэтому не оставляйте всем агрегатам безликое «аварии».
  - key: FltId1
    default: _ID_
    example: DRIVE_FAULT
    description: Короткое имя первой причины. Для других мест используются такие же поля с номерами 2–8.
      Пустой Id исключает соответствующий канал и его настройки; неиспользуемые идентификаторы нужно очистить.
  - key: FltComment1
    default: авария
    example: Неисправность привода
    description: Текст, объясняющий оператору конкретную причину, а не имя входа ПЛК. Он добавляется к общему
      комментарию группы.
  - key: FltIn1
    default: _DI_
    example: DI_P101_FAULT
    description: 'BOOL-сигнал или выражение: TRUE означает активную причину. Проверьте полярность контакта.
      Для остальных каналов задаются независимые сигналы.'
- title: Задайте контроль и сброс аварии
  intro: Для неисправности привода контроль постоянный, а снятие — после устранения причины и общего сброса
    Unit. Экстренный останов не следует заменять задержанной аварией фильтра.
  items:
  - key: FltEnable1
    default: 'true'
    example: 'true'
    description: Когда проверять именно эту причину. true — постоянно; условие процесса ограничивает контроль
      нужным этапом. Это не разрешение всего Unit.
  - key: FltAutoReset1
    default: 'false'
    example: 'false'
    description: false сохраняет сработавшую причину до устранения неисправности и сброса. true позволяет
      снять её автоматически после исчезновения входного условия.
- title: Добавьте предупреждение без останова
  intro: Встроенный фильтр предупреждений формирует сообщения, но его общий выход не включён в останов механизма.
    В примере сообщаем о необходимости обслуживания. Неиспользуемые места 2–8 исключите пустыми Id.
  items:
  - key: $Wrns
    default: Предупреждения
    example: Предупреждения
    description: 'Подпись группы в комментариях к коду. Категория сообщений уже задана шаблоном: Flt для
      аварий, Wrn для предупреждений.'
  - key: WrnComment
    default: предупреждения
    example: Насос P101
    description: Общий контекст сообщений этой группы, например «Насос P101». Внешние причины используют
      это поле и текст своей строки, поэтому не оставляйте всем агрегатам безликое «предупреждения».
  - key: WrnId1
    default: _ID_
    example: SERVICE
    description: Короткое имя первой причины. Для других мест используются такие же поля с номерами 2–8.
      Пустой Id исключает соответствующий канал и его настройки; неиспользуемые идентификаторы нужно очистить.
  - key: WrnComment1
    default: предупреждение
    example: Требуется обслуживание
    description: Текст, объясняющий оператору конкретную причину, а не имя входа ПЛК. Он добавляется к общему
      комментарию группы.
  - key: WrnIn1
    default: _DI_
    example: bP101MaintenanceDue
    description: 'BOOL-сигнал или выражение: TRUE означает активную причину. Проверьте полярность контакта.
      Для остальных каналов задаются независимые сигналы.'
- title: Задайте контроль и сброс предупреждения
  intro: Пусть сообщение об обслуживании исчезает после того, как внешняя логика снимет bMaintenanceDue.
    Для канала в примере задержка равна нулю, шунт выключен.
  items:
  - key: WrnEnable1
    default: 'true'
    example: 'true'
    description: Когда проверять именно эту причину. true — постоянно; условие процесса ограничивает контроль
      нужным этапом. Это не разрешение всего Unit.
  - key: WrnAutoReset1
    default: 'true'
    example: 'true'
    description: true снимает предупреждение после исчезновения причины. false оставляет его до сброса.
      Этот выбор не превращает предупреждение в аварийную блокировку.
example:
  title: Наполнение между 40 и 60 %
  scenario: Укажите TwoStepCoolingMode = false, SP = 50.0 и Hys = 10.0. При падении ниже 40 % выбирается
    Heating и насос получает запрос пуска. При подъёме выше 60 % выбирается Cooling и запрос насосу снимается.
    Между границами сохраняется последнее выбранное действие.
  result: 'Для насоса откачки при тех же границах установите TwoStepCoolingMode = true: включение потребуется
    выше 60 %, останов — ниже 40 %. После отключения TwoStep его выходы сброшены; не рассчитывайте на сохранение
    прежнего действия через отключение или сброс контура.'
settings:
- key: …_Engine_diStateControlTime
  default: '1'
  description: Сколько секунд допускается отсутствие подтверждения работы при активной команде пуска. После
    превышения возникает авария состояния. Выберите время с учётом реального запуска ПЧ или пускателя; это
    не задержка до выдачи команды.
- key: …_Engine_diStateConfirmTime
  default: '3'
  description: Сколько секунд фактическое состояние должно сохраняться для подтверждения. Помогает отличить
    устойчивый сигнал работы от дребезга контакта.
- key: …_Engine_diStartDelayTime
  default: '1'
  description: Выдержка перед автоматическим пуском, секунды. Позволяет разнести запуск двигателей; ручной
    пуск использует другую логику и этой задержки не ждёт.
- key: …_Engine_diStopDelayTime
  default: '1'
  description: Выдержка перед обычным автоматическим остановом, секунды. Экстренный останов её не ждёт;
    ручное управление также не использует эту задержку.
- key: …_Engine_bStateControlBypass
  default: 'true'
  description: true отключает контроль подтверждения работы; в этом Unit это исходное значение. После подключения
    достоверного EngState задайте false, чтобы обнаруживать отсутствие или потерю работы. Настройка всегда
    индивидуальная по Id, даже при общем EngConf.
- key: …_TwoStep_fSP
  default: '0.0'
  description: Центр диапазона переключения в единицах измерения. Например, при 60 °C и гистерезисе 2 °C
    нижняя и верхняя границы — 58 и 62 °C.
- key: …_TwoStep_fHys
  default: '0.0'
  description: Расстояние от уставки до границ переключения. Между ними сохраняется прежнее действие, поэтому
    механизм не переключается на каждом колебании около уставки.
- key: …_Flts_SgnlsFltr_<Id причины>_bBypass
  default: 'false'
  description: 'Шунт одной причины аварии: true исключает её из обработки. Создаётся только для непустого
    Id соответствующего канала. Общий индикатор шунта помогает не забыть отключённую проверку.'
- key: …_Flts_SgnlsFltr_<Id причины>_diDelay
  default: '0'
  description: Сколько секунд причина аварии должна оставаться активной до срабатывания. 0 — без дополнительной
    выдержки. У каждого из каналов 1–8 своя настройка; отключённый пустым Id канал её не создаёт.
- key: …_Wrns_SgnlsFltr_<Id причины>_bBypass
  default: 'false'
  description: 'Шунт одной причины предупреждения: true исключает её из обработки. Создаётся только для
    непустого Id соответствующего канала. Общий индикатор шунта помогает не забыть отключённую проверку.'
- key: …_Wrns_SgnlsFltr_<Id причины>_diDelay
  default: '0'
  description: Сколько секунд причина предупреждения должна оставаться активной до срабатывания. 0 — без
    дополнительной выдержки. У каждого из каналов 1–8 своя настройка; отключённый пустым Id канал её не
    создаёт.
hmi:
