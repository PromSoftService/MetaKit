component: Pulse
slug: pulse
source: yaml/LibTempls/Signals/pulse.yaml
kind: Lib
title: Импульс
category: Обработка сигналов
summary: Периодически включает выход на заданное время, пока разрешена работа.
description: 'Pulse формирует повторяющуюся последовательность «импульс — пауза». Период — полная длительность
  одного цикла, а время импульса — его включённая часть. Компонент подходит для продувки, периодической
  подачи, мигания или тактовой команды. Это не одиночный импульс: пока разрешение TRUE, циклы повторяются.'
use_cases:
- Нужно периодически открывать клапан, выдавать тактовую команду или мигать индикатором.
- Период удобно задавать в часах, а включённую часть — в секундах.
not_for:
- Нужен только один импульс без внешней логики останова генератора.
- 'Нужна последовательность «сначала импульсы, затем постоянно»: это PulseCtrl.'
- 'Нужно подтвердить непрерывное условие перед срабатыванием: это Delay.'
diagram:
  lanes:
  - - Разрешение продувки
    - 'Pulse

      5 секунд из 24 часов'
    - 'out_bPulse

      команда Valve'
  - - Окончание периода
    - 'out_bCircle

      короткое событие'
    - 'Внешняя логика

      учёт циклов'
application:
  intro: Клапан продувки должен открываться на 5 секунд каждые 24 часа. Оставьте период 24 с множителем
    3600000, длительность импульса 5 с множителем 1000. В PulseEn подайте разрешение продувки.
  result: out_bPulse задаёт команду продувки, out_bCircle отмечает окончание каждого периода. Для реального
    клапана команду следует передать в Valve, чтобы сохранились режимы и блокировки.
parameter_groups:
- title: Назовите операцию
  intro: Импортируйте компонент и укажите, какую задачу он выполняет. Идентификатор отличает этот экземпляр
    от остальных операций того же типа.
  items:
  - key: $Pulse
    default: Генератор импульсов
    example: Генератор импульсов
    description: Название типа операции в комментариях. Обычно оставляют исходную подпись; на времена
      и условия работы она не влияет.
  - key: PulseId
    default: _ID_
    example: BLOWDOWN
    description: Уникальное имя этой операции, например BLOWDOWN. По нему создаётся экземпляр BLOWDOWN_Pulse_Inst
      и его отдельные теги.
  - key: PulseComment
    default: Комментарий
    example: Периодическая продувка
    description: 'Понятное назначение операции: Периодическая продувка. Этот текст используется в комментариях
      настроек и доступных тегов.'
- title: Подключите условие работы
  intro: Клапан продувки должен открываться на 5 секунд каждые 24 часа. Оставьте период 24 с множителем
    3600000, длительность импульса 5 с множителем 1000. В PulseEn подайте разрешение продувки. Сам вход
    разрешения не настраивает выдержки времени — они задаются отдельно в таблице настроек ниже.
  items:
  - key: PulseEn
    default: 'true'
    example: bBlowdownAllowed
    description: Разрешение повторять импульсные циклы. Например, bBlowdownAllowed. Пока TRUE, генератор
      не остановится после первого импульса.
- title: Выберите набор настроек
  intro: Для первого экземпляра оставьте оба поля пустыми. Числа из примера задайте в соответствующих
    настройках после импорта; исходные значения шаблона перечислены ниже отдельно.
  items:
  - key: PulseConf
    default: ''
    example: ''
    description: Необязательное имя общего набора настроек. Пусто — настройки по PulseId. Общее имя задавайте
      только если все использующие его операции должны иметь одинаковые времена и правила.
  - key: PulseConfComment
    default: ''
    example: ''
    description: Название совместно используемых настроек. При пустом поле подпись строится из PulseComment
      и названия типа операции.
example:
  title: Пять секунд продувки в каждом суточном периоде
  scenario: diPeriod = 24 и diPeriodMultiplier = 3600000 задают полный цикл 24 часа. diPulse = 5 и diPulseMultiplier
    = 1000 задают включение на 5 секунд в начале периода. Включите только реальное технологическое разрешение
    продувки.
  result: В каждом разрешённом цикле первые 5 секунд out_bPulse активен, затем до конца периода идёт пауза.
    Это не календарное расписание «каждый день в 12:00». Для проверки на стенде временно используйте безопасный
    короткий период, не ожидая сутки.
settings:
- key: …_Pulse_diPeriod
  default: '24'
  description: Количество единиц в полном цикле «импульс + пауза». Единицы выбираются отдельным множителем
    периода.
- key: …_Pulse_diPeriodMultiplier
  default: '3600000'
  description: 'Миллисекунд в единице периода: 1000 — секунда, 60000 — минута, 3600000 — час.'
- key: …_Pulse_diPulse
  default: '5'
  description: Количество единиц, в течение которых выход включён в начале периода. Длительность импульса
    должна быть меньше периода, если нужна пауза.
- key: …_Pulse_diPulseMultiplier
  default: '1000'
  description: Миллисекунд в единице длительности импульса. Можно задавать период в часах, а импульс в
    секундах.
hmi: []
optional_hmi:
- tag: Pulse.out_bPulse
  description: Включённая часть цикла. Можно добавить HMI-индикатор «Команда продувки», но он не доказывает,
    что клапан физически открылся.
- tag: Pulse.out_bCircle
  description: Короткий признак завершения полного периода. Используйте в логике учёта циклов; HMI с редким
    опросом может пропустить краткое событие.
common_mistakes:
- Принять период за длительность паузы. Период включает и импульс, и паузу.
- Оставить разрешение true и ожидать одного импульса. Циклы повторяются, пока генератор разрешён.
- Задать длительность импульса не меньше периода и ожидать паузу. В таком случае выход остаётся включённым
  весь период.
- 'Путать миллисекундные множители периода и импульса: один может задавать часы, другой — секунды.'
- Использовать продувку без проверок технологических условий. Генератор не проверяет допустимость открытия
  реального клапана.
