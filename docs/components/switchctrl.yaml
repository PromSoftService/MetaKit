component: SwitchCtrl
slug: switchctrl
source: yaml/LibTempls/Ctrl/switchctrl.yaml
kind: Lib
title: Переключающее управление
category: Управление сигналами
summary: Шаблон CSwitchCtrl для стандартной логики переключения состояния.
description: Шаблон CSwitchCtrl для стандартной логики переключения состояния. Компонент формирует первую и вторую ступени
  команды с настраиваемой задержкой между ними.
use_cases:
- Нужно преобразовать команды включения и отключения в устойчивое состояние управления.
- Перед пуском насоса нужно открыть клапан и выдержать время на переключение гидравлической схемы.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - Разрешение
    - 'CSwitchCtrl

      первая ступень → задержка'
    - Вторая ступень
application:
  intro: Перед пуском насоса нужно открыть клапан и выдержать время на переключение гидравлической схемы. Ниже показаны параметры
    в том же формате ключ/значение, который используется в MetaPlatform.
  result: Компонент формирует первую и вторую ступени команды с настраиваемой задержкой между ними.
parameter_groups:
- title: Контроль переключения
  items:
  - key: $SwitchCtrl
    default: Контроль переключения
    example: Контроль переключения
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: SwitchCtrlId
    default: _ID_
    example: SWITCHCTRL
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: SwitchCtrlComment
    default: Комментарий
    example: Последовательное включение клапана и насоса
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
  - key: SwitchCtrlEn
    default: 'true'
    example: 'true'
    description: Дополнительное разрешение работы соответствующего блока.
  - key: SwitchCtrlConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: SwitchCtrlConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
example:
  title: Последовательное включение клапана и насоса
  scenario: Перед пуском насоса нужно открыть клапан и выдержать время на переключение гидравлической схемы.
  result: Компонент формирует первую и вторую ступени команды с настраиваемой задержкой между ними.
settings:
- key: …_SwitchCtrl_diDelay
  default: '1'
  description: Задержка переключения
hmi: []
optional_hmi: []
common_mistakes:
- Оставить служебные значения _ID_, _DI_, _DO_ или _AO_ вместо реальных тегов проекта.
- Не проверить классы сообщений и доступность настроек на HMI после генерации проекта.
