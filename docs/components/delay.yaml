component: Delay
slug: delay
source: yaml/LibTempls/Signals/delay.yaml
kind: Lib
title: Задержка сигнала
category: Обработка сигналов
summary: Индивидуальный CDelay для задержанного переключения логического сигнала.
description: Индивидуальный CDelay для задержанного переключения логического сигнала. CDelay подтверждает вход только после
  непрерывного сохранения сигнала в течение заданного времени.
use_cases:
- Требуется выдержка времени перед подтверждением состояния.
- Кратковременный провал давления при запуске насоса не должен сразу считаться устойчивым условием.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - Входной сигнал
    - 'CDelay

      выдержка времени'
    - Подтверждённый выход
application:
  intro: Кратковременный провал давления при запуске насоса не должен сразу считаться устойчивым условием. Ниже показаны параметры
    в том же формате ключ/значение, который используется в MetaPlatform.
  result: CDelay подтверждает вход только после непрерывного сохранения сигнала в течение заданного времени.
parameter_groups:
- title: Задержка сигнала
  items:
  - key: $Delay
    default: Задержка сигнала
    example: Задержка сигнала
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: DelayId
    default: _ID_
    example: DELAY
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: DelayComment
    default: Комментарий
    example: Задержка аварии низкого давления
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
  - key: DelayEn
    default: 'true'
    example: 'true'
    description: Дополнительное разрешение работы соответствующего блока.
  - key: DelayConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: DelayConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
example:
  title: Задержка аварии низкого давления
  scenario: Кратковременный провал давления при запуске насоса не должен сразу считаться устойчивым условием.
  result: CDelay подтверждает вход только после непрерывного сохранения сигнала в течение заданного времени.
settings:
- key: …_Delay_diTime
  default: '1'
  description: Время
- key: …_Delay_diMultiplier
  default: '1000'
  description: Множитель
hmi: []
optional_hmi: []
common_mistakes:
- Оставить служебные значения _ID_, _DI_, _DO_ или _AO_ вместо реальных тегов проекта.
- Не проверить классы сообщений и доступность настроек на HMI после генерации проекта.
