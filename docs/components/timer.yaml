component: Timer
slug: timer
source: yaml/LibTempls/Signals/timer.yaml
kind: Lib
title: Таймер
category: Обработка сигналов
summary: Отсчитывает заданное число временных периодов и повторяет цикл.
description: 'Timer удобен для напоминания или периодического события, длительность которого задаётся
  как «период × количество». По завершении он выдаёт импульс на один цикл ПЛК и начинает новый отсчёт,
  если разрешение осталось включённым. Дополнительно доступны номер текущего периода и оставшееся количество.
  Это не длительная команда для сирены: короткий выходной импульс при необходимости нужно обработать другим
  блоком.'
use_cases:
- Нужно событие раз в заданное количество периодов, например напоминание каждые пять минут.
- На HMI нужно показать номер отсчитываемого периода и сколько периодов осталось.
not_for:
- 'Нужно держать выход TRUE несколько секунд: out_bQ здесь длится один цикл ПЛК.'
- 'Нужно одноразовое завершение без повторения: при постоянном разрешении Timer запускает следующий цикл.'
- 'Нужно календарное расписание по времени суток: Timer отсчитывает интервалы, не дату и часы.'
diagram:
  lanes:
  - - Разрешение
    - 'Timer

      5 периодов по 60 секунд'
    - 'out_bQ

      один цикл ПЛК'
  - - Отсчёт периодов
    - Текущий / осталось
    - 'HMI времени

      диагностические счётчики'
application:
  intro: Во время ручной промывки напоминание нужно каждые 5 минут. В TimerEn подайте bWashManualMode,
    в настройках задайте период 60 секунд и количество 5.
  result: Каждые пять периодов out_bQ кратко становится TRUE. В выключенном состоянии диагностические
    счётчики равны −1; это не отрицательное оставшееся время.
parameter_groups:
- title: Назовите операцию
  intro: Импортируйте компонент и укажите, какую задачу он выполняет. Идентификатор отличает этот экземпляр
    от остальных операций того же типа.
  items:
  - key: $Timer
    default: Циклический таймер
    example: Циклический таймер
    description: Название типа операции в комментариях. Обычно оставляют исходную подпись; на времена
      и условия работы она не влияет.
  - key: TimerId
    default: _ID_
    example: WASH_REMINDER
    description: Уникальное имя этой операции, например WASH_REMINDER. По нему создаётся экземпляр WASH_REMINDER_Timer_Inst
      и его отдельные теги.
  - key: TimerComment
    default: Комментарий
    example: Напоминание о ручной промывке
    description: 'Понятное назначение операции: Напоминание о ручной промывке. Этот текст используется
      в комментариях настроек и доступных тегов.'
- title: Подключите условие работы
  intro: Во время ручной промывки напоминание нужно каждые 5 минут. В TimerEn подайте bWashManualMode,
    в настройках задайте период 60 секунд и количество 5. Сам вход разрешения не настраивает выдержки
    времени — они задаются отдельно в таблице настроек ниже.
  items:
  - key: TimerEn
    default: 'true'
    example: bWashManualMode
    description: Разрешение отсчёта и повторения циклов. Например, bWashManualMode. При выключении отсчёт
      прекращается, диагностические выходы показывают −1.
- title: Выберите набор настроек
  intro: Для первого экземпляра оставьте оба поля пустыми. Числа из примера задайте в соответствующих
    настройках после импорта; исходные значения шаблона перечислены ниже отдельно.
  items:
  - key: TimerConf
    default: ''
    example: ''
    description: Необязательное имя общего набора настроек. Пусто — настройки по TimerId. Общее имя задавайте
      только если все использующие его операции должны иметь одинаковые времена и правила.
  - key: TimerConfComment
    default: ''
    example: ''
    description: Название совместно используемых настроек. При пустом поле подпись строится из TimerComment
      и названия типа операции.
example:
  title: Напоминание каждые пять минут
  scenario: Установите diPeriod = 60 и diCount = 5. При непрерывном TimerEn пять минут спустя появится
    краткое out_bQ. Во время завершения диагностика показывает текущий период 5 и оставшихся 0.
  result: При сохранении разрешения Timer начинает следующий цикл. Для видимого уведомления сохраните
    событие в проектной логике или используйте подходящий механизм сообщений; не рассчитывайте, что экран
    гарантированно поймает один цикл ПЛК.
settings:
- key: …_Timer_diPeriod
  default: '60'
  description: Продолжительность одного периода, секунды. Итоговый интервал до импульса равен периоду,
    умноженному на количество.
- key: …_Timer_diCount
  default: '1'
  description: Сколько периодов отсчитать до импульса. Например, при периоде 60 секунд и количестве 5
    событие повторяется раз в пять минут.
hmi:
- tag: Timer.out_bQ
  description: Короткий импульс завершения заданного числа периодов, на один цикл ПЛК. Хотя тег выведен
    на HMI, экран с медленным опросом может не увидеть такой короткий импульс; для устойчивого сообщения
    нужна отдельная обработка события.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Timer.out_diCurPeriod
  description: Текущий номер периода. В момент завершения показывает заданное количество, затем начинается
    следующий цикл. −1 означает выключенное или сброшенное состояние, не отрицательное время.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: Timer.out_diRemainingPeriods
  description: 'Сколько периодов осталось до события. Это количество, не секунды: для интервала в секундах
    учитывайте длительность периода. При завершении показывает 0, при выключении — −1.'
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi: []
common_mistakes:
- Использовать out_bQ как сигнал сирены длительностью несколько секунд. Здесь это только один цикл ПЛК.
- Считать out_diRemainingPeriods оставшимися секундами. Он показывает число периодов.
- 'Считать −1 неисправностью таймера: так обозначено выключенное или сброшенное состояние.'
- Ожидать, что таймер остановится после первого завершения. При сохранении разрешения начинается следующий
  цикл.
