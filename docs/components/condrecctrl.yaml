component: CondRecCtrl
slug: condrecctrl
source: yaml/LibTempls/Ctrl/condrecctrl.yaml
kind: Lib
title: Управление с подтверждением
category: Управление сигналами
summary: Формирует управляющее воздействие с контролем условий и подтверждения результата.
description: Формирует управляющее воздействие с контролем условий и подтверждения результата. Компонент отделяет задержку
  обнаружения причины от задержки восстановления и формирует готовность для алгоритма.
use_cases:
- Требуется стандартная логика команды, подтверждения и сброса состояния.
- Низкое давление должно сохраняться несколько секунд до фиксации условия, а повторный пуск разрешается только после устойчивого
  восстановления давления.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - Контролируемое условие
    - 'CCondRecCtrl

      задержка фиксации'
    - 'HMI предупреждений

      out_bWarning'
  - - Восстановление
    - Задержка готовности
    - 'HMI состояния

      out_bReady'
application:
  intro: Низкое давление должно сохраняться несколько секунд до фиксации условия, а повторный пуск разрешается только после
    устойчивого восстановления давления. Ниже показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: Компонент отделяет задержку обнаружения причины от задержки восстановления и формирует готовность для алгоритма.
parameter_groups:
- title: Контроль условия
  items:
  - key: $CondRecCtrl
    default: Контроль условия
    example: Контроль условия
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: CondRecCtrlId
    default: _ID_
    example: CONDRECCTR
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: CondRecCtrlComment
    default: Комментарий
    example: Защита насосов от сухого хода
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
  - key: CondRecCtrlCond
    default: 'false'
    example: 'false'
    description: Значение передаётся в одноимённую часть функционального блока; изменяйте его в соответствии с алгоритмом
      проекта.
  - key: CondRecCtrlEn
    default: 'true'
    example: 'true'
    description: Дополнительное разрешение работы соответствующего блока.
  - key: CondRecCtrlConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: CondRecCtrlConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
example:
  title: Защита насосов от сухого хода
  scenario: Низкое давление должно сохраняться несколько секунд до фиксации условия, а повторный пуск разрешается только после
    устойчивого восстановления давления.
  result: Компонент отделяет задержку обнаружения причины от задержки восстановления и формирует готовность для алгоритма.
settings:
- key: …_CondRecCtrl_bBypass
  default: 'false'
  description: Шунт
- key: …_CondRecCtrl_diCondDelay
  default: '1'
  description: Задержка фиксации условия
- key: …_CondRecCtrl_diRecoveryDelay
  default: '1'
  description: Задержка восстановления после условия
