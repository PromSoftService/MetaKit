optional_hmi:
- tag: PIDD.out_bUp
  description: Можно добавить диагностическую строку запроса увеличения. В штатной таблице данных Unit отдельный
    тег PIDD не выведен; это запрос регулятора, а не подтверждение движения.
- tag: PIDD.out_bDown
  description: Можно добавить строку запроса уменьшения. Для сообщений назначьте понятный текст и нужную
    категорию, не считайте каждое штатное регулирующее движение аварией.
common_mistakes:
- Оставить StartCmd = false и ожидать пуска только потому, что указан Parent. В Parent передаются общие
  сигналы, а запрос работы задаётся отдельно.
- Оставить Engine_bStateControlBypass = true и считать, что отсутствие обратной связи будет обнаружено.
  В этом Unit контроль по умолчанию шунтирован.
- Передать команду пускателя вместо реального EngState и получить фиктивное подтверждение работы.
- Ожидать, что Manual обходит EStopExtra или отсутствие питания. Эти запреты переданы непосредственно в
  экстренный останов CEngine.
- Включить EngLocalControlByPLC без реализации входов местных кнопок. Параметр выбирает поведение ФБ, но
  сам не добавляет местный пост.
- Оставить шаблонные _ID_ и _DI_ в неиспользуемых каналах аварий/предупреждений. Очистите их Id, иначе это
  не готовая конфигурация.
- Ожидать автоматических импульсов PIDD в Manual двигателя. В этом режиме CPIDD отключён; при необходимости
  ручных Up/Down их нужно реализовать отдельным компонентом.
- Использовать PIDDUpOut/PIDDDownOut как кнопки ручного управления. Они каждый цикл перезаписываются автоматическими
  выходами регулятора.
- Подключить команды UP/DOWN к приводу с другим назначением дискретных входов либо перепутать направление
  влияния на процесс.
- 'Подбирать слишком короткие импульсы: ПЧ может не успевать распознать изменение или иметь собственную
  фильтрацию входов.'
- Считать ошибку Sensor только диагностическим сообщением. Она включена в экстренный останов двигателя независимо
  от режима.
