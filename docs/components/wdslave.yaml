component: WDSlave
slug: wdslave
source: yaml/LibTempls/WatchDog/WDSlave.yaml
kind: Lib
title: Ведомый WatchDog
category: Связь
summary: CWDSlave контролирует слово ведущего устройства и формирует ответное контрольное слово.
description: CWDSlave контролирует слово ведущего устройства и формирует ответное контрольное слово. Компонент одновременно
  обеспечивает ответ Master и локально контролирует состояние обмена.
use_cases:
- Две стороны используют парную схему Master/Slave, а текущая сторона является ведомой.
- Удалённый ПЛК принимает контрольное слово ведущего, отслеживает его изменение и возвращает ответное значение.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - Слово Master
    - 'CWDSlave

      проверка и ответ'
    - 'HMI предупреждений

      нет связи'
application:
  intro: Удалённый ПЛК принимает контрольное слово ведущего, отслеживает его изменение и возвращает ответное значение. Ниже
    показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: Компонент одновременно обеспечивает ответ Master и локально контролирует состояние обмена.
parameter_groups:
- title: Ведомый WatchDog
  items:
  - key: $WDSlave
    default: Ведомый WatchDog
    example: Ведомый WatchDog
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: WDSlaveId
    default: _ID_
    example: MCC_TO_LCC
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: WDSlaveComment
    default: Комментарий
    example: Связь с LCC-01
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
  - key: WDSlaveIn
    default: _WD_IN_
    example: LCC_WD_OUT
    description: Входное значение или сигнал, передаваемый в функциональный блок.
  - key: WDSlaveOut
    default: _WD_OUT_
    example: MCC_WD_OUT
    description: Выходная переменная, в которую компонент записывает результат.
  - key: WDSlaveConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: WDSlaveConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
  - key: WDSlaveConnMsg
    default: Связь установлена
    example: Связь установлена
    description: Текст нормального состояния связи; сообщение об ошибке формируется как отсутствие связи с партнёром.
example:
  title: Ответ удалённого шкафа ведущему
  scenario: Удалённый ПЛК принимает контрольное слово ведущего, отслеживает его изменение и возвращает ответное значение.
  result: Компонент одновременно обеспечивает ответ Master и локально контролирует состояние обмена.
settings:
- key: …_WDSlave_diTimeout
  default: '5'
  description: Таймаут связи
hmi:
- tag: WDSlave.out_bConn
  description: Настройка функционального блока
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: WDSlave.out_bSync
  description: Синхронизация выполнена
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi: []
common_mistakes:
- Оставить служебные значения _ID_, _DI_, _DO_ или _AO_ вместо реальных тегов проекта.
- Не проверить классы сообщений и доступность настроек на HMI после генерации проекта.
