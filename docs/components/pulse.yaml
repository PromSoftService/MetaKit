component: Pulse
slug: pulse
source: yaml/LibTempls/Signals/pulse.yaml
kind: Lib
title: Импульс
category: Обработка сигналов
summary: Индивидуальный CPulse для формирования импульса заданной длительности.
description: Индивидуальный CPulse для формирования импульса заданной длительности. CPulse формирует повторяющиеся импульсы
  с независимо настраиваемыми периодом и длительностью.
use_cases:
- Из длительного или фронтового сигнала требуется получить ограниченный по времени импульс.
- Клапан должен открываться на несколько секунд через заданный период, пока работа установки разрешена.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - Разрешение
    - 'CPulse

      период + импульс'
    - Дискретный выход
application:
  intro: Клапан должен открываться на несколько секунд через заданный период, пока работа установки разрешена. Ниже показаны
    параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: CPulse формирует повторяющиеся импульсы с независимо настраиваемыми периодом и длительностью.
parameter_groups:
- title: Генератор импульсов
  items:
  - key: $Pulse
    default: Генератор импульсов
    example: Генератор импульсов
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: PulseId
    default: _ID_
    example: PULSE
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: PulseComment
    default: Комментарий
    example: Периодическая продувка котла
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
  - key: PulseEn
    default: 'true'
    example: 'true'
    description: Дополнительное разрешение работы соответствующего блока.
  - key: PulseConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: PulseConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
example:
  title: Периодическая продувка котла
  scenario: Клапан должен открываться на несколько секунд через заданный период, пока работа установки разрешена.
  result: CPulse формирует повторяющиеся импульсы с независимо настраиваемыми периодом и длительностью.
settings:
- key: …_Pulse_diPeriod
  default: '24'
  description: Период цикла импульс/пауза
- key: …_Pulse_diPeriodMultiplier
  default: '3600000'
  description: Множитель периода
- key: …_Pulse_diPulse
  default: '5'
  description: Длительность импульса
- key: …_Pulse_diPulseMultiplier
  default: '1000'
  description: Множитель длительности импульса
hmi: []
optional_hmi: []
common_mistakes:
- Оставить служебные значения _ID_, _DI_, _DO_ или _AO_ вместо реальных тегов проекта.
- Не проверить классы сообщений и доступность настроек на HMI после генерации проекта.
