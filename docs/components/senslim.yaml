component: SensLim
slug: senslim
source: yaml/SysTmpls/SensLim.yaml
kind: Sys
title: Границы датчика
category: Системные компоненты
summary: Формирует сообщения о четырёх пределах аналогового измерения и отдельно об ошибке Sensor.
description: 'SensLim добавляет к готовому Sensor технологические границы: HH и LL для аварий, H и L для
  предупреждений. Проверяется сглаженное физическое значение, например давление в барах. Для границ есть
  разрешения, шунты, задержки и способ сброса; ошибка датчика обрабатывается отдельным каналом. При переходе
  за HH предупреждение H обычно уступает место верхней аварии, аналогично L и LL. Но текущий код подавляет
  предупреждение по числовому сравнению и шунту аварийной границы, а не по факту её срабатывания; HHEnable/LLEnable
  в этом условии не учтены. Кроме того, Sensor error не отключает проверки числовых пределов. Эти ограничения
  нужно учитывать при выборе требуемой сигнализации. Компонент сам не подключает общий результат к останову
  оборудования.'
use_cases:
- Нужно показать оператору предупредительное и аварийное отклонение давления, температуры, уровня или другого
  физического измерения.
- Для одного Sensor нужны отдельные тексты верхних/нижних пределов, задержки и фиксируемые аварии.
not_for:
- 'Нужно масштабировать или сгладить сырой аналоговый вход: это задача Sensor.'
- 'Нужны регулирующие команды механизму: SensLim формирует диагностику, не PID или TwoStep.'
- 'Нужно гарантированно подавлять все пределы при недостоверном Sensor либо учитывать Enable аварийной границы
  в подавлении предупреждения: в текущем коде такой логики нет.'
- 'Нужно аппаратно остановить установку одним фактом появления Flt: реакция на общий аварийный выход задаётся
  отдельно.'
diagram:
  lanes:
  - - Сглаженное значение
    - 'HH / LL

      аварийные сравнения'
    - Задержка / фиксация
    - HMI аварийных пределов
  - - То же значение
    - 'H / L

      с исключением HH / LL'
    - Задержка / автоснятие
    - HMI предупреждений
  - - Sensor.out_bError
    - Отдельный канал ошибки
    - HMI ошибки датчика
  - - Общий и частные шунты
    - Отключение проверок пределов
application:
  intro: Для PT101 с давлением 0–10 бар зададим LL = 1, L = 2, H = 8, HH = 9 бар. Это пример сигнализации,
    не допустимые пределы реальной установки. Числа выбираются по технологии. Снимите четыре индивидуальных
    шунта и убедитесь, что общий Sensor_EV_bLimitBypass не выключает все пределы.
  result: В нормальной области сообщений по пределам нет. При 8,5 бар после предупредительной задержки появляется
    H; при достижении 9 бар его входное условие снимается, а HH ожидает свою задержку. Ошибка датчика может
    одновременно дать отдельную аварию и числовой предел по замещённому значению.
parameter_groups:
- title: Подключите готовый датчик
  intro: Sensor PT101 уже должен выдавать давление 0–10 бар и корректный out_bError. CabinetController_Inst
    также нужен для общего сброса. SensLim проверяет сглаженное значение, не сырой AI.
  items:
  - key: $Limit
    default: Пределы датчика
    example: Пределы датчика
    description: 'Подпись компонента пределов. Он не заменяет Sensor: измерение, масштабирование и сглаживание
      уже должны быть настроены у датчика.'
  - key: SensId
    default: _ID_
    example: PT101
    description: Id существующего Sensor, например PT101. От его SensFilter берётся сглаженное физическое
      значение, от Sensor — ошибка. По тому же SensId создаются настройки и два фильтра SensLim; два таких
      компонента для одного Id дадут одинаковые имена.
  - key: Comment
    default: датчик
    example: Давление в коллекторе
    description: Название измерения в сообщениях, например «Давление в коллекторе». К нему добавляются тексты
      верхней/нижней границы или ошибки датчика. Это отдельная подпись SensLim, не автоматическое чтение
      SensComment.
- title: Выберите нужные границы
  intro: 'Для примера используем LL = 1, L = 2, H = 8 и HH = 9 бар. Числа задаются в настройках ниже. Там
    же снимите шунты нужных проверок: в исходном шаблоне все четыре шунта true, поэтому одних Enable недостаточно.'
  items:
  - key: HHEnable
    default: 'true'
    example: 'true'
    description: Разрешение верхней аварийной проверки HH. true разрешает канал, но дополнительно должен
      быть снят его шунт в настройках. В текущем коде false не учитывается при подавлении предупреждения
      H — это описанное ниже ограничение.
  - key: HEnable
    default: 'true'
    example: 'true'
    description: Разрешение верхнего предупреждения H. Проверка действует от H вверх до HH, если HH не шунтирован.
      При шунте HH верхнее предупреждение может оставаться и выше его числовой границы.
  - key: LEnable
    default: 'true'
    example: 'true'
    description: Разрешение нижнего предупреждения L. Проверка действует от L вниз до LL, если LL не шунтирован.
      При шунте LL нижнее предупреждение может оставаться и ниже его числовой границы.
  - key: LLEnable
    default: 'true'
    example: 'true'
    description: Разрешение нижней аварийной проверки LL. true само по себе не снимает исходный шунт. В
      текущем коде false не учитывается при подавлении предупреждения L.
- title: Выберите сообщение об ошибке датчика
  intro: 'Оставим ошибку измерения аварией, без дублирующего предупреждения. При этом текущий код не выключает
    числовые проверки по out_bError: замещённое значение Sensor может дополнительно вызвать пределы.'
  items:
  - key: SensErrFlt
    default: 'true'
    example: 'true'
    description: Разрешает отдельный аварийный канал по Sensor.out_bError. По умолчанию true; его дополнительная
      задержка равна нулю. Это вход Enable фильтра, а не содержимое столбца Flt в таблице данных.
  - key: SensErrWrn
    default: 'false'
    example: 'false'
    description: Разрешает отдельный предупредительный канал ошибки Sensor. По умолчанию false, то есть
      этот канал выключен. Если одновременно включить SensErrFlt и SensErrWrn, одна ошибка даст обе категории
      сообщений. Это разрешение канала, не выражение столбца Wrn.
- title: Задайте фиксацию и сброс сообщений
  intro: Аварии оставим до устранения причины и квитирования, предупреждения — до исчезновения условия.
    Изменение автосброса влияет и на поведение H/L при переходе через HH/LL.
  items:
  - key: FltAutoReset
    default: 'false'
    example: 'false'
    description: Общий способ снятия аварийных каналов HH, LL и ошибки Sensor. false сохраняет срабатывания
      до устранения причины и сброса CabinetController; true позволяет снимать их после исчезновения условия.
  - key: WrnAutoReset
    default: 'true'
    example: 'true'
    description: 'Общий способ снятия предупредительных каналов H, L и ошибки Sensor. По умолчанию true:
      сообщение снимается при исчезновении условия. При false уже зафиксированное предупреждение не обязано
      исчезнуть только от перехода через аварийную границу.'
example:
  title: Предупреждение 8 бар и авария 9 бар
  scenario: При H = 8.0, HH = 9.0, снятых шунтах и WrnAutoReset = true давление 8,5 бар формирует H после
    своей задержки. При росте до 9,0 бар H перестаёт получать входное условие, а HH начинает аварийную выдержку.
    При исходных задержках 1 с между снятием предупреждения и появлением аварии возможен промежуток.
  result: Если HHEnable = false, но шунт HH остаётся false, H всё равно пропадает при достижении 9 бар —
    это дефект текущего условия. Если авария HH уже зафиксирована с FltAutoReset = false, при возврате ниже
    9 бар H может появиться вновь до сброса HH. Для нижних L/LL логика симметрична; это не автоматическое
    правило «показывать только старшую активную тревогу».
settings:
- key: <SensId>_SensLim_fHH
  default: '0.0'
  description: Верхняя аварийная граница. HH проверяется при значении не ниже этой границы; в примере 9
    бар. После превышения нужен заданный аварийный интервал и снятые шунты.
- key: <SensId>_SensLim_fH
  default: '0.0'
  description: Верхняя предупредительная граница, в примере 8 бар. H начинается при значении не ниже H;
    при достижении нешунтированного HH его входное условие снимается независимо от HHEnable.
- key: <SensId>_SensLim_fL
  default: '0.0'
  description: Нижняя предупредительная граница, в примере 2 бар. L начинается при значении не выше L; при
    достижении нешунтированного LL его входное условие снимается независимо от LLEnable.
- key: <SensId>_SensLim_fLL
  default: '0.0'
  description: Нижняя аварийная граница. LL проверяется при значении не выше этой границы; в примере 1 бар.
    Соблюдайте осмысленный порядок LL < L < H < HH.
- key: <SensId>_SensLim_Flt_diDelay
  default: '1'
  description: 'Общая задержка HH и LL, секунды. По умолчанию 1. На канал ошибки Sensor эта настройка не
    распространяется: там в коде задан ноль.'
- key: <SensId>_SensLim_Wrn_diDelay
  default: '1'
  description: Общая задержка H и L, секунды. По умолчанию 1. Отдельный предупредительный канал Sensor error,
    если разрешён, имеет нулевую дополнительную задержку.
- key: <SensId>_SensLim_HH_bBypass
  default: 'true'
  description: Шунт верхнего аварийного предела. Исходно true — HH выключен. При true верхнее предупреждение
    H не ограничивается числовым HH; это отличается от HHEnable = false в текущем коде.
- key: <SensId>_SensLim_H_bBypass
  default: 'true'
  description: Шунт верхнего предупреждения. Исходно true — H выключен. Для рабочего контроля задайте false
    и убедитесь, что разрешение HEnable включено.
- key: <SensId>_SensLim_L_bBypass
  default: 'true'
  description: Шунт нижнего предупреждения. Исходно true — L выключен. Для рабочего контроля задайте false
    и включите LEnable.
- key: <SensId>_SensLim_LL_bBypass
  default: 'true'
  description: Шунт нижнего аварийного предела. Исходно true — LL выключен. При true предупреждение L не
    ограничивается числовым LL; отличие от LLEnable = false следует учитывать.
hmi:
- tag: SensLim_Flts.out_Signal1_bQ
  description: 'HH: верхняя аварийная граница после фильтра и выбранного способа сброса. По умолчанию сообщение
    Flt настроено, но сама проверка шунтирована до наладки.'
  hmi: Да
  flt: 'true'
  wrn: —
  alm: —
  trend: —
- tag: SensLim_Flts.out_Signal2_bQ
  description: 'LL: нижняя аварийная граница. Причина может оставаться после возврата значения в норму при
    FltAutoReset = false.'
  hmi: Да
  flt: 'true'
  wrn: —
  alm: —
  trend: —
- tag: SensLim_Flts.out_Signal3_bQ
  description: Ошибка Sensor как авария. Канал разрешён по умолчанию через SensErrFlt и не использует задержку
    пределов.
  hmi: Да
  flt: 'true'
  wrn: —
  alm: —
  trend: —
- tag: SensLim_Flts.out_bQ
  description: Общий результат аварийных каналов HH, LL и разрешённой ошибки Sensor. Может использоваться
    во внешней блокировке, но сам SensLim её не создаёт.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: SensLim_Wrns.out_Signal1_bQ
  description: 'H: верхнее предупреждение. При стандартном автосбросе снимается, когда его входное условие
    исчезло; подавление около HH следует фактическим условиям, описанным выше.'
  hmi: Да
  flt: —
  wrn: 'true'
  alm: —
  trend: —
- tag: SensLim_Wrns.out_Signal2_bQ
  description: 'L: нижнее предупреждение. Симметрично H, но подавляется при переходе к нешунтированному
    нижнему пределу LL.'
  hmi: Да
  flt: —
  wrn: 'true'
  alm: —
  trend: —
- tag: SensLim_Wrns.out_Signal3_bQ
  description: Ошибка Sensor как предупреждение. Строка HMI и категория Wrn присутствуют, но обработка канала
    по умолчанию выключена параметром SensErrWrn = false.
  hmi: Да
  flt: —
  wrn: 'true'
  alm: —
  trend: —
- tag: SensLim_Wrns.out_bQ
  description: Общий результат предупредительных каналов. В шаблоне не связан с остановом оборудования.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi:
- tag: Исходное измерение Sensor/SensFilter
  description: Показывайте рядом с сообщениями само значение и диагностику Sensor. Это теги уже существующего
    датчика, а не новые измерения SensLim.
- tag: Индивидуальные строки H/L/HH/LL
  description: При необходимости можно добавить Trend или изменить категорию в таблице данных. HMI/Conf/Trend
    используют флаги 1/0; Flt/Wrn/Alm — выражения. Разрешения SensErrFlt/SensErrWrn в параметрах управляют
    каналами фильтра, а не этими столбцами.
common_mistakes:
- Включить HHEnable/HEnable/LEnable/LLEnable и забыть шунты. Все четыре индивидуальных шунта исходно true,
  а общий Sensor_EV_bLimitBypass также может выключать пределы.
- Задать границы в кодах AI или миллиамперах, хотя Sensor выдаёт бары. Все четыре числа должны использовать
  физическую шкалу сглаженного значения.
- Считать HHEnable = false эквивалентом шунта HH при подавлении H. Текущий код учитывает шунт, но не Enable;
  для LL/L такая же проблема.
- Ожидать, что H сбрасывается только после фактического срабатывания HH. Условие определяется числом PV,
  поэтому задержки и фиксация могут давать промежутки или одновременные зафиксированные сообщения.
- Ожидать автоматического прекращения предельных проверок при Sensor error. В текущем ST такого запрета
  нет; замещённое число может породить дополнительные пределы.
- Включить одновременно SensErrFlt и SensErrWrn и удивиться двум сообщениям одной ошибки. Выберите нужную
  категорию осознанно.
- Считать сообщение Flt прямым остановом оборудования. Общий выход аварий подключается к выбранному механизму
  отдельно.
- Путать false в SensErrWrn с false в столбце Wrn. Параметр выключает канал; значение категории задаёт выражение
  сообщения.
