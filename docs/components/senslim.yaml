component: SensLim
slug: senslim
source: yaml/SysTmpls/SensLim.yaml
kind: Sys
title: Границы датчика
category: Системные компоненты
summary: Формирует аварии и предупреждения по границам LL, L, H и HH выбранного датчика.
description: Формирует аварии и предупреждения по границам LL, L, H и HH выбранного датчика. При аварийной границе соответствующее
  предупредительное сообщение снимается, чтобы оператор видел наиболее важное состояние.
use_cases:
- Техническое задание требует сообщений по предельным значениям датчика.
- Для датчика нужно сформировать аварии LL/HH и предупреждения L/H с независимыми задержками и возможностью отключить ненужные
  границы.
not_for:
- Sys-компонент предназначен для уровня проекта; не импортируйте его повторно для каждого механизма.
diagram:
  lanes:
  - - FV датчика
    - 'LL / HH

      аварийные границы'
    - 'HMI аварий

      Flt'
  - - FV датчика
    - 'L / H

      предупредительные границы'
    - 'HMI предупреждений

      Wrn'
  - - Ошибка датчика
    - 'SensLim

      диагностика'
    - 'HMI предупреждений

      Wrn'
application:
  intro: Для датчика нужно сформировать аварии LL/HH и предупреждения L/H с независимыми задержками и возможностью отключить
    ненужные границы. Ниже показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: При аварийной границе соответствующее предупредительное сообщение снимается, чтобы оператор видел наиболее важное
    состояние.
parameter_groups:
- title: Пределы датчика
  items:
  - key: $Limit
    default: Пределы датчика
    example: Пределы датчика
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
- title: Группа параметров 2
  items:
  - key: SensId
    default: _ID_
    example: SENSLIM
    description: Уникальный идентификатор датчика и префикс создаваемых тегов.
  - key: Comment
    default: датчик
    example: датчик
    description: Понятное человеку название компонента. Попадает в комментарии тегов и тексты HMI.
  - key: SensErrFlt
    default: 'true'
    example: 'true'
    description: Выбирает класс сообщения, формируемого при ошибке датчика.
  - key: SensErrWrn
    default: 'false'
    example: 'false'
    description: Выбирает класс сообщения, формируемого при ошибке датчика.
  - key: HHEnable
    default: 'true'
    example: 'true'
    description: Разрешение соответствующей технологической границы. FALSE полностью отключает её сообщение.
  - key: HEnable
    default: 'true'
    example: 'true'
    description: Разрешение соответствующей технологической границы. FALSE полностью отключает её сообщение.
  - key: LEnable
    default: 'true'
    example: 'true'
    description: Разрешение соответствующей технологической границы. FALSE полностью отключает её сообщение.
  - key: LLEnable
    default: 'true'
    example: 'true'
    description: Разрешение соответствующей технологической границы. FALSE полностью отключает её сообщение.
  - key: FltAutoReset
    default: 'false'
    example: 'false'
    description: Автоматический сброс всех аварий после исчезновения причин.
  - key: WrnAutoReset
    default: 'true'
    example: 'true'
    description: Автоматический сброс всех предупреждений после исчезновения причин.
example:
  title: Предельные значения давления
  scenario: Для датчика нужно сформировать аварии LL/HH и предупреждения L/H с независимыми задержками и возможностью отключить
    ненужные границы.
  result: При аварийной границе соответствующее предупредительное сообщение снимается, чтобы оператор видел наиболее важное
    состояние.
