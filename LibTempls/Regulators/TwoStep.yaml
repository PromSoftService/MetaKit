code:
  format: template-text
  language: st-template
  text: >
    // |TwoStepId| - |TwoStepComment|. |$TwoStep|

    |TwoStepId|_TwoStep_Inst(
        in_bEnable := true
            AND %"NOT |TwoStepSensId|_Sensor_Inst.out_bError" if "|TwoStepInput|"=="true" else "true"%
            AND |TwoStepEnExtra|,
        in_fSP := Conf.%"|TwoStepConf|" if "|TwoStepConf|"!="" else "|TwoStepId|"%_TwoStep_fSP,
        in_fHYS := Conf.%"|TwoStepConf|" if "|TwoStepConf|"!="" else "|TwoStepId|"%_TwoStep_fHys,
        in_fPV := %"|TwoStepSensId|_SensFilter_Inst.out_fY" if "|TwoStepInput|"=="true" else "0.0"%,
        in_bLo := |TwoStepLo|,
        in_bHi := |TwoStepHi|,
        in_bInput := |TwoStepInput|,
        in_bReset := CabinetController_Inst.out_bWorktimeReset
    );

    //

    //

    //

    //
