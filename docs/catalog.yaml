components:
  LibTempls/Cabinet/cabinetcontroller.yaml:
    title: Контроллер шкафа управления
    category: Инфраструктура проекта
    summary: Шаблон единственного общепроектного экземпляра CCabinetController.
    use_when: Добавляется в проект для формирования общих команд, режимов, сброса аварий и контроля питания.

  LibTempls/Cascade/cascade.yaml:
    title: Универсальный каскад
    category: Каскады
    summary: Управляет количеством подключённых агрегатов по минимальному и максимальному количеству и технологическому параметру.
    use_when: Нужен каскад N/M, каскад по технологическому параметру или их совместное применение.

  LibTempls/Cascade/cascadeunit.yaml:
    title: Интерфейс элемента каскада
    category: Каскады
    summary: Унифицированный адаптер между технологическим компонентом, родительским каскадом и CabinetController.
    use_when: Компонент должен передавать готовность, состояние, аварию, наработку и принимать команду запуска от родителя.

  LibTempls/Ctrl/condrecctrl.yaml:
    title: Управление с подтверждением
    category: Управление сигналами
    summary: Формирует управляющее воздействие с контролем условий и подтверждения результата.
    use_when: Требуется стандартная логика команды, подтверждения и сброса состояния.

  LibTempls/Ctrl/pulsectrl.yaml:
    title: Импульсное управление
    category: Управление сигналами
    summary: Шаблон CPulseCtrl для выдачи управляющих импульсов.
    use_when: Исполнительному устройству требуются команды ограниченной длительности.

  LibTempls/Ctrl/switchctrl.yaml:
    title: Переключающее управление
    category: Управление сигналами
    summary: Шаблон CSwitchCtrl для стандартной логики переключения состояния.
    use_when: Нужно преобразовать команды включения и отключения в устойчивое состояние управления.

  LibTempls/Engine/engine.yaml:
    title: Двигатель
    category: Исполнительные механизмы
    summary: Индивидуальный шаблон CEngine с режимами, командами, контролем состояния, авариями и наработкой.
    use_when: Собирается пользовательский контур с двигателем либо нужен CEngine без готового Unit.

  LibTempls/Math/xyscale.yaml:
    title: Масштабирование XY
    category: Математика
    summary: Шаблон вызова функции xyScale для линейного преобразования диапазонов.
    use_when: Требуется преобразовать инженерную шкалу в физический аналоговый диапазон или обратно.

  LibTempls/Regulators/PID.yaml:
    title: PID-регулятор
    category: Регуляторы
    summary: Индивидуальный CPID с настройками регулятора, ручным заданием и отдельной секцией аналогового выхода.
    use_when: Пользовательский контур требует непрерывного регулирования.

  LibTempls/Regulators/TwoStep.yaml:
    title: Двухпозиционный регулятор
    category: Регуляторы
    summary: Индивидуальный CTwoStep с выходами нагрева и охлаждения и настройками сообщений.
    use_when: Управление выполняется дискретным включением нагрева либо охлаждения по уставке и гистерезису.

  LibTempls/Regulators/pidd.yaml:
    title: Импульсный PID-регулятор
    category: Регуляторы
    summary: Индивидуальный CPIDD для трёхпозиционного исполнительного механизма.
    use_when: Регулятор должен формировать команды больше и меньше вместо непрерывного аналогового выхода.

  LibTempls/Regulators/threestep.yaml:
    title: Трёхпозиционный регулятор
    category: Регуляторы
    summary: Индивидуальный CThreeStep для дискретного управления открытием и закрытием.
    use_when: Исполнительный механизм управляется двумя дискретными направлениями с нейтральным состоянием.

  LibTempls/Sensor/Sensor.yaml:
    title: Аналоговый датчик
    category: Датчики
    summary: CSensor и CSensorFilter с масштабированием, диагностикой канала, границами и фильтрацией значения.
    use_when: Физический или вычисленный сигнал нужно привести к инженерной величине и проверить достоверность.

  LibTempls/Signals/delay.yaml:
    title: Задержка сигнала
    category: Обработка сигналов
    summary: Индивидуальный CDelay для задержанного переключения логического сигнала.
    use_when: Требуется выдержка времени перед подтверждением состояния.

  LibTempls/Signals/pulse.yaml:
    title: Импульс
    category: Обработка сигналов
    summary: Индивидуальный CPulse для формирования импульса заданной длительности.
    use_when: Из длительного или фронтового сигнала требуется получить ограниченный по времени импульс.

  LibTempls/Signals/signalsfilter.yaml:
    title: Фильтр сигналов
    category: Обработка сигналов
    summary: CSignalsFilter для группы аварийных, предупредительных или технологических сигналов.
    use_when: Сигналы требуют задержки, разрешения, обхода, фиксации и общего выхода.

  LibTempls/Signals/timer.yaml:
    title: Таймер
    category: Обработка сигналов
    summary: Индивидуальный CTimer с управлением временем и состоянием отсчёта.
    use_when: Алгоритму требуется самостоятельный таймер MetaLib.

  LibTempls/Valve/controlvalve.yaml:
    title: Регулирующий клапан
    category: Исполнительные механизмы
    summary: Индивидуальный CControlValve с режимами, разрешением управления и ручным включением.
    use_when: Пользовательский контур управляет регулирующим клапаном с заданием положения.

  LibTempls/Valve/valve.yaml:
    title: Дискретный клапан
    category: Исполнительные механизмы
    summary: Индивидуальный CValve с командами открытия и закрытия, контролем состояния и авариями.
    use_when: Пользовательский контур содержит двухпозиционный клапан.

  LibTempls/WatchDog/WDMaster.yaml:
    title: Ведущий WatchDog
    category: Связь
    summary: CWDMaster формирует контрольное слово и контролирует ответ ведомого устройства.
    use_when: Две стороны используют парную схему Master/Slave, а текущая сторона является ведущей.

  LibTempls/WatchDog/WDSimple.yaml:
    title: Простой WatchDog
    category: Связь
    summary: CWDSimple контролирует изменение входного контрольного слова без ответного выхода.
    use_when: Достаточно проверить регулярное обновление одного сигнала от внешней системы.

  LibTempls/WatchDog/WDSlave.yaml:
    title: Ведомый WatchDog
    category: Связь
    summary: CWDSlave контролирует слово ведущего устройства и формирует ответное контрольное слово.
    use_when: Две стороны используют парную схему Master/Slave, а текущая сторона является ведомой.

  UnitsTmpls/PidCtrlValveUnit.yaml:
    title: Регулирующий клапан с PID
    category: Готовые контуры
    summary: Готовый контур CControlValve и CPID с аналоговым выходом, CascadeUnit, авариями и предупреждениями.
    use_when: Положение регулирующего клапана определяется индивидуальным PID-регулятором.

  UnitsTmpls/PiddValveUnit.yaml:
    title: Клапан с импульсным PID
    category: Готовые контуры
    summary: Готовый контур CValve и CPIDD с CascadeUnit, авариями и предупреждениями.
    use_when: Клапан регулирует параметр дискретными командами открытия и закрытия.

  UnitsTmpls/ctrlvalveunit.yaml:
    title: Регулирующий клапан
    category: Готовые контуры
    summary: Готовый контур CControlValve с CascadeUnit, авариями и предупреждениями без собственного регулятора.
    use_when: Аналоговое задание клапана формируется внешним алгоритмом.

  UnitsTmpls/engineunit.yaml:
    title: Двигатель
    category: Готовые контуры
    summary: Готовый контур CEngine с CascadeUnit, авариями и предупреждениями.
    use_when: Требуется стандартный двигатель без собственного регулятора.

  UnitsTmpls/piddengineunit.yaml:
    title: Двигатель с импульсным PID
    category: Готовые контуры
    summary: Готовый контур CEngine и CPIDD с CascadeUnit и контролем датчика.
    use_when: Двигатель управляется дискретными командами импульсного регулятора.

  UnitsTmpls/pidengineunit.yaml:
    title: Двигатель с PID и ПЧ
    category: Готовые контуры
    summary: Готовый контур CEngine и CPID с масштабированием аналогового выхода частотного преобразователя.
    use_when: Каждый двигатель имеет собственный PID-регулятор и аналоговый выход скорости.

  UnitsTmpls/twostepengineunit.yaml:
    title: Двигатель с двухпозиционным регулятором
    category: Готовые контуры
    summary: CEngine и CTwoStep с CascadeUnit, контролем датчика, авариями и предупреждениями.
    use_when: Двигатель включается по двухпозиционному регулированию технологического параметра.

  UnitsTmpls/twostepvalveunit.yaml:
    title: Клапан с двухпозиционным регулятором
    category: Готовые контуры
    summary: CValve и CTwoStep с CascadeUnit, контролем датчика, авариями и предупреждениями.
    use_when: Клапан открывается или закрывается по двухпозиционному регулированию параметра.

  UnitsTmpls/valveunit.yaml:
    title: Дискретный клапан
    category: Готовые контуры
    summary: Готовый контур CValve с CascadeUnit, авариями и предупреждениями.
    use_when: Требуется стандартное управление открытием и закрытием клапана без собственного регулятора.

  UnitsTmpls/vfdgroupengineunit.yaml:
    title: Двигатель группового ПЧ
    category: Готовые контуры
    summary: Двигатель с ПЧ без собственного PID, получающий автоматическое задание от общего группового регулятора.
    use_when: Несколько двигателей используют один VfdGroupPidCascade и индивидуальные аналоговые выходы.

  UnitsTmpls/vfdgrouppidcascade.yaml:
    title: Каскад двигателей с общим PID
    category: Готовые контуры
    summary: Универсальный каскад и общий CPID для группы частотно-регулируемых двигателей.
    use_when: Количество работающих двигателей выбирается каскадом, а их общее задание формирует один PID.

  SysTmpls/FltsWrns.yaml:
    title: Общие аварии и предупреждения
    category: Системные компоненты
    summary: Два общепроектных CSignalsFilter для независимой обработки аварий и предупреждений.
    use_when: Проекту нужны централизованные списки внешних аварий и предупреждений.

  SysTmpls/SensLim.yaml:
    title: Границы датчика
    category: Системные компоненты
    summary: Формирует аварии и предупреждения по границам LL, L, H и HH выбранного датчика.
    use_when: Техническое задание требует сообщений по предельным значениям датчика.

  SysTmpls/general.yaml:
    title: Общая инфраструктура проекта
    category: Системные компоненты
    summary: CabinetController, общие аварии и предупреждения в правильной последовательности вызовов.
    use_when: Создаётся стандартная общепроектная часть MetaGen.
