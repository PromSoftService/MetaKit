component: ThreeStep
slug: threestep
source: yaml/LibTempls/Regulators/threestep.yaml
kind: Lib
title: Трёхпозиционный регулятор
category: Регуляторы
summary: Индивидуальный CThreeStep для дискретного управления открытием и закрытием.
description: Индивидуальный CThreeStep для дискретного управления открытием и закрытием. CThreeStep формирует команды Больше
  и Меньше с отдельной зоной нечувствительности и гистерезисом.
use_cases:
- Исполнительный механизм управляется двумя дискретными направлениями с нейтральным состоянием.
- Клапан открывается при низком давлении, закрывается при высоком и остаётся неподвижным внутри зоны нечувствительности.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - PV + SP
    - 'CThreeStep

      зона и гистерезис'
    - 'Команды

      Больше / Меньше'
application:
  intro: Клапан открывается при низком давлении, закрывается при высоком и остаётся неподвижным внутри зоны нечувствительности.
    Ниже показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: CThreeStep формирует команды Больше и Меньше с отдельной зоной нечувствительности и гистерезисом.
parameter_groups:
- title: Трёхпозиционный регулятор
  items:
  - key: $ThreeStep
    default: Трёхпозиционный регулятор
    example: Трёхпозиционный регулятор
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: ThreeStepId
    default: _ID_
    example: PIC102
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: ThreeStepComment
    default: Комментарий
    example: Регулятор давления
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
  - key: ThreeStepEnExtra
    default: 'true'
    example: 'true'
    description: Дополнительное разрешение работы соответствующего блока.
  - key: ThreeStepConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: ThreeStepConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
- title: Группа параметров 2
  items:
  - key: ThreeStepSensId
    default: _ID_
    example: THREESTEP
    description: Id датчика, ошибка которого запрещает работу регулятора.
  - key: ThreeStepInput
    default: 'true'
    example: 'true'
    description: Регулируемое значение для трёхпозиционного регулятора.
example:
  title: Трёхпозиционное регулирование давления
  scenario: Клапан открывается при низком давлении, закрывается при высоком и остаётся неподвижным внутри зоны нечувствительности.
  result: CThreeStep формирует команды Больше и Меньше с отдельной зоной нечувствительности и гистерезисом.
settings:
- key: …_ThreeStep_fSP
  default: '0.0'
  description: Уставка
- key: …_ThreeStep_fDeadband
  default: '0.0'
  description: Зона нечувствительности
- key: …_ThreeStep_fHysteresis
  default: '0.0'
  description: Гистерезис
hmi: []
optional_hmi: []
common_mistakes:
- Оставить служебные значения _ID_, _DI_, _DO_ или _AO_ вместо реальных тегов проекта.
- Не проверить классы сообщений и доступность настроек на HMI после генерации проекта.
