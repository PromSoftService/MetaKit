  alm: —
  trend: —
optional_hmi:
- tag: PID.out_fYS
  description: Можно включить Trend у существующей строки, чтобы видеть историю задания ПЧ вместе с трендом
    давления Sensor. В Unit по умолчанию Trend PID не выбран.
common_mistakes:
- Оставить StartCmd = false и ожидать пуска только потому, что указан Parent. В Parent передаются общие
  сигналы, а запрос работы задаётся отдельно.
- Оставить Engine_bStateControlBypass = true и считать, что отсутствие обратной связи будет обнаружено.
  В этом Unit контроль по умолчанию шунтирован.
- Передать команду пускателя вместо реального EngState и получить фиктивное подтверждение работы.
- Ожидать, что Manual обходит EStopExtra или отсутствие питания. Эти запреты переданы непосредственно в
  экстренный останов CEngine.
- Включить EngLocalControlByPLC без реализации входов местных кнопок. Параметр выбирает поведение ФБ, но
  сам не добавляет местный пост.
- Оставить шаблонные _ID_ и _DI_ в неиспользуемых каналах аварий/предупреждений. Очистите их Id, иначе это
  не готовая конфигурация.
- Передать сырой код AI вместо SensId или не создать Sensor с этим Id. Шаблон ожидает его физическое значение
  и диагностику.
- 'Сделать отдельный переключатель PID.inout_bYManual на HMI и ожидать независимого режима: код Unit каждый
  цикл задаёт его от Engine Manual.'
- Ожидать работы в Manual при ошибке датчика. Ошибка включена в экстренный останов двигателя независимо
  от выбранного режима.
- 'Использовать PID.out_fY как готовое задание ПЧ: аналоговый выход использует накопленный out_fYS.'
- Связать электрическую шкалу с EngConf или PIDConf. В актуальной архитектуре OUT имеет собственные OutConf/OutConfComment,
  с переходом на Id при пустом поле.
