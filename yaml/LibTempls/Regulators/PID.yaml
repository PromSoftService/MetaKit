code:
  format: template-text
  language: st-template
  text: |-
    // |PIDId| - |PIDComment|. |$PID|

    |PIDId|_PID_Inst(
        in_bEnable := true
            AND (NOT |PIDSensId|_Sensor_Inst.out_bError)
            AND |PIDEnExtra|,
        in_fSP := Conf.%"|PIDConf|" if "|PIDConf|"!="" else "|PIDId|"%_PID_fSP,
        in_fPV := |PIDSensId|_SensFilter_Inst.out_fY,
        in_fDB := Conf.%"|PIDConf|" if "|PIDConf|"!="" else "|PIDId|"%_PID_fDB,
        in_fSR := Conf.%"|PIDConf|" if "|PIDConf|"!="" else "|PIDId|"%_PID_fSR,
        in_fKp := Conf.%"|PIDConf|" if "|PIDConf|"!="" else "|PIDId|"%_PID_fKp,
        in_fTi := Conf.%"|PIDConf|" if "|PIDConf|"!="" else "|PIDId|"%_PID_fTi,
        in_fTd := Conf.%"|PIDConf|" if "|PIDConf|"!="" else "|PIDId|"%_PID_fTd,
        in_fYMin := Conf.%"|PIDConf|" if "|PIDConf|"!="" else "|PIDId|"%_PID_fYMin,
        in_fYMax := Conf.%"|PIDConf|" if "|PIDConf|"!="" else "|PIDId|"%_PID_fYMax,
        in_fYLoLimit := Conf.%"|PIDConf|" if "|PIDConf|"!="" else "|PIDId|"%_PID_fYLoLimit,
        in_fYHiLimit := Conf.%"|PIDConf|" if "|PIDConf|"!="" else "|PIDId|"%_PID_fYHiLimit,
        in_fOffValue := Conf.%"|PIDConf|" if "|PIDConf|"!="" else "|PIDId|"%_PID_fOffValue,
        in_bReset := CabinetController_Inst.out_bWorktimeReset,
        inout_bYManual := View.|PIDId|_PID_Inst_inout_bYManual,
        inout_fYManual := View.|PIDId|_PID_Inst_inout_fYManual
    );


    // |PIDId| - |PIDComment|. |$Out|

    |OutRaw| := REAL_TO_INT(xyScale(
        in_fXMin := Conf.%"|PIDConf|" if "|PIDConf|"!="" else "|PIDId|"%_PID_fYMin,
        in_fXMax := Conf.%"|PIDConf|" if "|PIDConf|"!="" else "|PIDId|"%_PID_fYMax,
        in_fYMin := Conf.%"|OutConf|" if "|OutConf|"!="" else "|PIDId|"%_OUT_fRawMin,
        in_fYMax := Conf.%"|OutConf|" if "|OutConf|"!="" else "|PIDId|"%_OUT_fRawMax,
        in_fX := |PIDId|_PID_Inst.out_fYS,
        in_bLimit := true
    ));
    //
    //
    //
    //
