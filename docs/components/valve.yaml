component: Valve
slug: valve
source: yaml/LibTempls/Valve/valve.yaml
kind: Lib
title: Дискретный клапан
category: Исполнительные механизмы
summary: Индивидуальный CValve с командами открытия и закрытия, контролем состояния и авариями.
description: Индивидуальный CValve с командами открытия и закрытия, контролем состояния и авариями. CValve управляет направлениями
  движения, выдерживает паузу перед реверсом, контролирует полный ход и формирует аварии.
use_cases:
- Пользовательский контур содержит двухпозиционный клапан.
- Клапан открывается и закрывается дискретными выходами, имеет концевики крайних положений и при аварии должен перейти в безопасное
  положение.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - 'Команды

      Открыть / Закрыть'
    - 'CValve

      режимы и реверс'
    - 'Выходы

      Open / Close'
  - - 'Концевики

      Open / Close'
    - 'Контроль хода

      и состояния'
    - 'HMI клапана

      положение / режим'
  - - 'Внешняя авария

      и E-Stop'
    - 'CValve

      out_bFault'
    - 'HMI аварий

      Flt'
application:
  intro: Клапан открывается и закрывается дискретными выходами, имеет концевики крайних положений и при аварии должен перейти
    в безопасное положение. Ниже показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: CValve управляет направлениями движения, выдерживает паузу перед реверсом, контролирует полный ход и формирует аварии.
parameter_groups:
- title: Клапан
  items:
  - key: $Val
    default: Клапан
    example: Клапан
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: ValId
    default: _ID_
    example: V101
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: ValComment
    default: Комментарий
    example: Клапан отсечной
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
  - key: ValOpenCmd
    default: 'false'
    example: 'false'
    description: Дополнительная команда открытия клапана.
  - key: ValCloseCmd
    default: 'false'
    example: 'false'
    description: Дополнительная команда закрытия клапана.
  - key: ValEnAutoCtrlExtra
    default: 'true'
    example: 'true'
    description: Значение передаётся в одноимённую часть функционального блока; изменяйте его в соответствии с алгоритмом
      проекта.
  - key: ValEStopExtra
    default: 'false'
    example: 'false'
    description: Дополнительное условие экстренного останова исполнительного механизма.
  - key: ValPowerCtrlExtra
    default: 'true'
    example: 'true'
    description: Значение передаётся в одноимённую часть функционального блока; изменяйте его в соответствии с алгоритмом
      проекта.
  - key: ValConf
    default: ''
    example: ''
    description: Необязательный общий префикс настроек. Пустое значение создаёт индивидуальные настройки по Id компонента.
  - key: ValConfComment
    default: ''
    example: ''
    description: Общий комментарий для совместно используемых настроек. Оставьте пустым при индивидуальной конфигурации.
- title: Группа параметров 2
  items:
  - key: ValLocal
    default: 'false'
    example: 'false'
    description: Признак местного режима управления исполнительным механизмом.
  - key: ValRemote
    default: 'true'
    example: 'true'
    description: Признак дистанционного режима управления исполнительным механизмом.
  - key: ValExtFault
    default: 'false'
    example: 'false'
    description: Внешняя авария или защитное условие, запрещающее работу механизма.
  - key: ValStateOpen
    default: _DI_
    example: DI_V101_OPEN
    description: Дискретный сигнал концевика полностью открытого положения.
  - key: ValStateClose
    default: _DI_
    example: DI_V101_CLOSE
    description: Дискретный сигнал концевика полностью закрытого положения.
  - key: ValOpenOut
    default: _DO_
    example: DO_V101_OPEN
    description: Физический дискретный выход открытия клапана.
  - key: ValCloseOut
    default: _DO_
    example: DO_V101_CLOSE
    description: Физический дискретный выход закрытия клапана.
example:
  title: Отсечной клапан
  scenario: Клапан открывается и закрывается дискретными выходами, имеет концевики крайних положений и при аварии должен перейти
    в безопасное положение.
  result: CValve управляет направлениями движения, выдерживает паузу перед реверсом, контролирует полный ход и формирует аварии.
