component: CascadeUnit
slug: cascadeunit
source: yaml/LibTempls/Cascade/cascadeunit.yaml
kind: Lib
title: Интерфейс элемента каскада
category: Каскады
summary: Унифицированный адаптер между технологическим компонентом, родительским каскадом и CabinetController.
description: Унифицированный адаптер между технологическим компонентом, родительским каскадом и CabinetController. Внутренняя
  логика насоса остаётся независимой от того, подключён он к CabinetController или к промежуточному CascadeUnit.
use_cases:
- Компонент должен передавать готовность, состояние, аварию, наработку и принимать команду запуска от родителя.
- Насосный Unit сообщает родительскому Cascade готовность, состояние, аварию, наработку и мощность, а получает разрешение
  и команду пуска.
not_for:
- Если нужен полностью готовый технологический контур с CascadeUnit, авариями и HMI — выберите подходящий Unit-компонент.
diagram:
  lanes:
  - - 'Parent

      Cabinet или CascadeUnit'
    - 'CCascadeUnit

      адаптер элемента'
    - 'Исполнительный блок

      Engine / Valve'
  - - 'Состояние / авария

      элемента'
    - 'CCascadeUnit

      обратная связь'
    - 'HMI элемента

      готовность / работа'
application:
  intro: Насосный Unit сообщает родительскому Cascade готовность, состояние, аварию, наработку и мощность, а получает разрешение
    и команду пуска. Ниже показаны параметры в том же формате ключ/значение, который используется в MetaPlatform.
  result: Внутренняя логика насоса остаётся независимой от того, подключён он к CabinetController или к промежуточному CascadeUnit.
parameter_groups:
- title: Элемент каскада
  items:
  - key: $CasUnit
    default: Элемент каскада
    example: Элемент каскада
    description: Человеческое обозначение функционального блока, используемое в комментариях и сообщениях.
  - key: CasUnitId
    default: _ID_
    example: CASCADEUNI
    description: Уникальный идентификатор блока и префикс создаваемых тегов.
  - key: CasUnitComment
    default: Комментарий
    example: Насос как элемент общего каскада
    description: Понятное человеку название блока или группы, используемое в комментариях и HMI.
  - key: CasUnitParent
    default: CabinetController_Inst
    example: CabinetController_Inst
    description: Родительский контроллер или каскадный элемент для обмена разрешениями и состоянием.
  - key: CasUnitStartCmd
    default: 'false'
    example: 'false'
    description: Внешняя команда запуска соответствующего механизма.
  - key: CasUnitEn
    default: 'true'
    example: 'true'
    description: Дополнительное разрешение работы соответствующего блока.
- title: Группа параметров 2
  items:
  - key: CasUnitMode
    default: 'true'
    example: 'true'
    description: Обратная связь элемента, передаваемая в родительский каскад.
  - key: CasUnitState
    default: '0'
    example: '0'
    description: Сигнал подтверждения фактического состояния исполнительного механизма.
  - key: CasUnitStateBool
    default: 'false'
    example: 'false'
    description: Обратная связь элемента, передаваемая в родительский каскад.
  - key: CasUnitFault
    default: 'false'
    example: 'false'
    description: Внешняя авария или защитное условие, запрещающее работу механизма.
  - key: CasUnitWorktime
    default: '0'
    example: '0'
    description: Обратная связь элемента, передаваемая в родительский каскад.
  - key: CasUnitPower
    default: '0.0'
    example: '0.0'
    description: Обратная связь элемента, передаваемая в родительский каскад.
example:
  title: Насос как элемент общего каскада
  scenario: Насосный Unit сообщает родительскому Cascade готовность, состояние, аварию, наработку и мощность, а получает разрешение
    и команду пуска.
  result: Внутренняя логика насоса остаётся независимой от того, подключён он к CabinetController или к промежуточному CascadeUnit.
