common_mistakes:
- Использовать шкалу всего модуля 0–10000 как SensRawMin/SensRawMax для датчика 4–20 мА. Если 0 соответствует 0 мА, нижняя
  рабочая точка 4 мА будет около 2000.
- Передавать в регулятор только значение и не учитывать out_bError. При ошибке Sensor выдаёт SensFVZP, и регулятор может принять
  это безопасное значение за реальное измерение.
- Ставить слишком большое SensFilterCount в быстром контуре. Показание станет плавным, но реакция заметно запоздает.
- Путать диагностические границы EV с технологическими пределами давления или температуры. EV контролирует исправность электрического
  сигнала, а технологические LL/L/H/HH задаются через SensLim.
- Оставлять SensLimitBypass = false при неприменимых границах 3 и 21 для сигнала другого типа. Для 0–10 В задайте соответствующие
  границы либо отключите контроль.
