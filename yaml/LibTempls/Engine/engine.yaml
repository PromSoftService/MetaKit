code:
  format: template-text
  language: st-template
  text: "// |EngId| - |EngComment|. |$Eng|\n|EngId|_Engine_Inst(\n    in_bLocalControl := |EngLocal|,\n    in_bLocalControlByPLC := |EngLocalControlByPLC|,\n    in_bRemoteControl := |EngRemote|,\n    in_bEmergencyStop := false\n        OR CabinetController_Inst.out_bEmergencyStop\n        OR NOT CabinetController_Inst.out_bPowerControl\n        OR |EngEStopExtra|,\n    in_bExternalFault := |EngExtFault|,\n    in_bStart := false\n        OR ((|EngId|_Engine_Inst.out_iMode = ENGINEMODEAUTO) AND (|EngStartCmd|))\n        OR ((|EngId|_Engine_Inst.out_iMode = ENGINEMODEMANUAL) AND (View.|EngId|_Engine_Inst_inout_bStart)),\n    in_bStop := false\n        OR ((|EngId|_Engine_Inst.out_iMode = ENGINEMODEAUTO) AND (|EngStopCmd|))\n        OR ((|EngId|_Engine_Inst.out_iMode = ENGINEMODEMANUAL) AND (View.|EngId|_Engine_Inst_inout_bStop)),\n    in_bState := |EngState|,\n    in_bStateControlBypass := Conf.%\"|EngConf|\" if \"|EngConf|\"!=\"\" else \"|EngId|\"%_Engine_bStateControlBypass,\n    in_diStateControlTime := Conf.%\"|EngConf|\" if \"|EngConf|\"!=\"\" else \"|EngId|\"%_Engine_diStateControlTime,\n    in_diStateConfirmTime := Conf.%\"|EngConf|\" if \"|EngConf|\"!=\"\" else \"|EngId|\"%_Engine_diStateConfirmTime,\n    in_diStartDelayTime := Conf.%\"|EngConf|\" if \"|EngConf|\"!=\"\" else \"|EngId|\"%_Engine_diStartDelayTime,\n    in_diStopDelayTime := Conf.%\"|EngConf|\" if \"|EngConf|\"!=\"\" else \"|EngId|\"%_Engine_diStopDelayTime,\n    in_bFaultReset := CabinetController_Inst.out_bFaultReset,\n    in_bWorktimeReset := CabinetController_Inst.out_bWorktimeReset,\n    out_bStart => |EngStartOut|,\n    inout_iRemoteMode := View.|EngId|_Engine_Inst_inout_iRemoteMode,\n    inout_bStart := View.|EngId|_Engine_Inst_inout_bStart,\n    inout_bStop := View.|EngId|_Engine_Inst_inout_bStop,\n    inout_bFaultReset := View.|EngId|_Engine_Inst_inout_bFaultReset,\n    inout_bWorktimeReset := View.|EngId|_Engine_Inst_inout_bWorktimeReset\n);\n//\n//\n//\n//"
