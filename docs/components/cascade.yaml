component: Cascade
slug: cascade
source: yaml/LibTempls/Cascade/cascade.yaml
kind: Lib
title: Универсальный каскад
category: Каскады
summary: Выбирает, какие агрегаты группы должны работать, а какие оставаться в резерве.
description: 'Cascade нужен, когда несколько насосов, котлов или других агрегатов выполняют общую задачу.
  Он поддерживает минимальное число подключённых агрегатов, при недостатке производительности добавляет
  следующие до максимума и выводит лишние при снижении нагрузки. Недоступный или аварийный агрегат не
  выбирается для работы; наработка используется для чередования. Каскад не включает пускатели напрямую:
  каждый участник предоставляет интерфейс CascadeUnit, а собственный блок механизма проверяет режим и
  защиты. В текущем шаблоне список CasUnitId подключает обратные состояния участников. Обратное направление
  — команды out_UnitN_bCmd в StartCmd каждого агрегата — пользователь задаёт явно. CasParent используется
  для сброса ротации, а разрешение CasEn задаётся отдельно.'
use_cases:
- Несколько однотипных агрегатов должны делить нагрузку и резервировать друг друга.
- Минимум участников должен работать постоянно, а дополнительные подключаются при недостаточной производительности
  до заданного максимума.
- Нужно чередовать исправные доступные агрегаты по наработке.
not_for:
- 'Нужен общий аналоговый PID для группы ПЧ: используйте VfdGroupPidCascade с соответствующими двигательными
  Unit.'
- 'Нужно управлять каждым пускателем без проверки режима и защиты: команды каскада должны идти в стандартные
  механизмы.'
- Нужно гарантировать физическую работу заданного числа устройств при нехватке исправных агрегатов. Каскад
  выбирает только доступных участников.
diagram:
  lanes:
  - - 'PV и ошибка

      либо работа по количеству'
    - 'Cascade

      минимум / максимум'
    - out_UnitN_bCmd
    - 'StartCmd участника

      подключить явно'
  - - 'CascadeUnit участников

      готовность / авария'
    - 'Выбор и ротация

      по наработке'
    - Команды каскада
  - - Статистика Cascade
    - 'HMI группы

      можно добавить'
application:
  intro: Группа BOOST содержит два насоса P101 и P102 с готовым CascadeUnit у каждого. Сначала соберите
    простой вариант «один рабочий, один резервный», затем при необходимости включите изменение состава
    по давлению.
  result: Для одного рабочего задайте минимум=максимум=1. Для двух обязательных и третьего дополнительного
    в группе из шести задайте минимум 2, максимум 3, перечислите все шесть агрегатов и включите измерение
    процесса. В обоих вариантах команды участников подключаются явно.
parameter_groups:
- title: Назовите группу и задайте разрешение
  intro: В примере группа BOOST содержит насосы P101 и P102. CasParent — источник сброса ротации, CasEn
    — отдельное разрешение самой группы. Не считайте наличие Parent автоматической связью с пуском шкафа.
  items:
  - key: $Cas
    default: Каскад
    example: Каскад
    description: Название типа блока в комментариях, обычно «Каскад». Не определяет технологический тип
      регулирования.
  - key: CasId
    default: _ID_
    example: BOOST
    description: Уникальное имя группы, например BOOST. По нему создаётся BOOST_Cascade_Inst с командами
      отдельных участников.
  - key: CasComment
    default: Комментарий
    example: Насосы повышения давления
    description: Понятное название группы, например «Насосы повышения давления». Оно подписывает настройки
      каскада.
  - key: CasParent
    default: CabinetController_Inst
    example: CabinetController_Inst
    description: Имя родительского CabinetController или CascadeUnit. В текущем шаблоне отсюда берётся
      только сброс таймера чередования out_bWorktimeReset. Само указание родителя не связывает CasEn с
      пуском или питанием шкафа.
  - key: CasEn
    default: 'true'
    example: CabinetController_Inst.out_bWorkAndPower
    description: Общее разрешение каскада. Например, CabinetController_Inst.out_bWorkAndPower. Ошибка
      CasPVErr дополнительно запрещает каскад независимо от этого разрешения.
- title: Подключите измерение и его достоверность
  intro: Sensor PT101 уже должен выдавать давление в барах. Можно передать и вычисленную величину; тогда
    CasPVErr должен объединять ошибки всех участвующих источников.
  items:
  - key: CasPV
    default: '0.0'
    example: PT101_SensFilter_Inst.out_fY
    description: Текущее измерение процесса или REAL-выражение, например PT101_SensFilter_Inst.out_fY.
      Можно передать разность двух давлений. Для режима только по числу агрегатов — 0.0 при нулевых уставке
      и гистерезисе каскада.
  - key: CasPVErr
    default: 'false'
    example: PT101_Sensor_Inst.out_bError
    description: TRUE, если измерению CasPV нельзя доверять. Для одного датчика — его out_bError; для
      разности двух — логическое OR обеих ошибок. При TRUE автоматическая работа каскада запрещена.
- title: Перечислите участников и свяжите команды
  intro: У каждого участника уже должен быть CascadeUnit. Заполните Id по порядку; места 3–16 оставьте
    пустыми. У P101 задайте StartCmd = BOOST_Cascade_Inst.out_Unit1_bCmd, у P102 — out_Unit2_bCmd. Одно
    перечисление Id подключает состояния, но не создаёт эти обратные командные связи.
  items:
  - key: CasUnitId1
    default: _ID_
    example: P101
    description: Id первого участника с уже созданным CascadeUnit, например P101. Для следующих мест используйте
      CasUnitId2…CasUnitId16. Пустой Id исключает место. Эти поля подключают обратную информацию; команду
      out_UnitN_bCmd нужно отдельно передать в StartCmd соответствующего участника.
  - key: CasUnitId2
    default: ''
    example: P102
    description: Id второго участника, например P102. Его команда берётся с out_Unit2_bCmd. Сохраняйте
      соответствие номера места и команды, иначе каскад будет видеть один агрегат, а запускать другой.
- title: Выберите настройки каскада
  intro: Оставьте поля пустыми для индивидуальных настроек BOOST. Минимум/максимум, уставка, задержки
    и чередование задаются в настройках ниже. Настройки общего PID здесь не создаются.
  items:
  - key: CasConf
    default: ''
    example: ''
    description: Необязательное имя общих настроек каскада. Пусто — отдельные настройки по CasId. Общее
      имя означает общие минимальное/максимальное количество, уставку, задержки и правила ротации.
  - key: CasConfComment
    default: ''
    example: ''
    description: Название общего набора настроек. При пустом поле используются CasComment и $Cas.
example:
  title: От резерва к изменению состава по давлению
  scenario: 'Вариант 1: два насоса, минимум = максимум = 1, CasPV = 0.0, SP = 0.0, Hys = 0.0 — выбирается один доступный
    участник, второй остаётся резервным. Вариант 2: шесть насосов, минимум 2 и максимум 3. При SP = 4.5 бар
    и Hys = 0.2 ниже 4,3 бар можно добавить третий, выше 4,7 бар снять лишний, сохранив минимум.'
  result: Задержки ограничивают обычную смену состава; быстрый первый пуск в этом шаблоне включён. При
    CasPVErr=TRUE снимается разрешение автоматического каскада и его команды. Это не аппаратный останов
    всех механизмов и не отмена ручного режима каждого насоса. Смотрите отдельно число подключённых и
    число фактически работающих.
settings:
- key: …_Cascade_iWorkCount
  default: '1'
  description: Минимальное число подключённых агрегатов при разрешённой группе и наличии исправных доступных
    участников. Это не общее количество оборудования и не гарантированное число реально вращающихся насосов.
- key: …_Cascade_iMaxWorkCount
  default: '1'
  description: Верхний предел подключённых агрегатов. Например, минимум 2 и максимум 3 дают два постоянных
    участника и возможность добавить третий по процессу.
- key: …_Cascade_fSP
  default: '0.0'
  description: Уставка изменения состава группы в единицах CasPV. Ниже SP − Hys появляется условие добавления,
    выше SP + Hys — снятия лишнего участника.
- key: …_Cascade_fHys
  default: '0.0'
  description: Разнос границ добавления и снятия агрегата относительно SP. Не даёт каскаду часто менять
    состав из-за небольших колебаний.
- key: …_Cascade_diConnectionDelay
  default: '1'
  description: Выдержка условия перед добавлением очередного агрегата, секунды. Даёт уже работающим участникам
    время повлиять на процесс.
- key: …_Cascade_diDisconnectionDelay
  default: '1'
  description: Выдержка условия перед снятием лишнего агрегата, секунды. Помогает избежать частых включений
    и отключений при переменной нагрузке.
- key: …_Cascade_bPowerControlEnable
  default: 'false'
  description: Дополнительно учитывать фактическую мощность участников при смене состава. Включайте только
    если каждый Power содержит осмысленное значение в согласованной шкале.
- key: …_Cascade_fPowerLoLimit
  default: '0.0'
  description: Нижний порог мощности текущего основного агрегата для разрешения снятия участника при включённом
    контроле мощности. Шкала должна совпадать с Power всех участников.
- key: …_Cascade_fPowerHiLimit
  default: '0.0'
  description: Верхний порог мощности текущего основного агрегата для разрешения добавления участника
    при включённом контроле мощности. Не включайте проверку с фиктивными нулевыми мощностями.
- key: …_Cascade_diSwitchPeriod
  default: '36'
  description: Период чередования по наработке, часы. По умолчанию 36 часов. Ноль или отрицательное значение
    отключает ротацию; это не выдержка подключения в секундах.
hmi: []
optional_hmi:
- tag: Cascade.out_iReadyCount
  description: Сколько участников сейчас доступно без аварии. Полезно сравнивать с требуемым минимумом.
- tag: Cascade.out_iConnectedCount
  description: Сколько участников получили команды каскада. Это не обязательно число реально работающих
    насосов.
- tag: Cascade.out_iWorkingCount
  description: Сколько участников фактически работают по State. Различие с ConnectedCount помогает выявить
    проблему запуска.
- tag: Cascade.out_iCurMaster
  description: 'Индекс текущего основного участника: 0 означает Unit1, 15 — Unit16, −1 — нет основного. Для
    номера на HMI учитывайте нулевую индексацию.'
- tag: Cascade.out_UnitN_bCmd
  description: Команда конкретного места 1–16. Можно вывести для диагностики вместе с состоянием соответствующего
    механизма.
common_mistakes:
- Заполнить CasUnitId1/2 и ожидать автоматического запуска. Команды out_Unit1_bCmd/out_Unit2_bCmd нужно
  передать в StartCmd соответствующих участников.
- Передать один и тот же Id в несколько мест или перепутать номера команд. Обратная информация и команда
  должны относиться к одному агрегату.
- Путать минимум/максимум подключённых с общим количеством установленных устройств. Резервные тоже перечисляются
  в CasUnitId.
- Считать Parent общим разрешением группы. В текущем ST Parent предоставляет только сброс ротации, CasEn
  задаётся отдельно.
- Включить контроль мощности при Power=0 у всех участников. Каскаду нужны реальные согласованные значения.
- Считать исчезновение команд каскада запретом всех ручных режимов оборудования. Ручные механизмы подчиняются
  собственным правилам и защитам.
