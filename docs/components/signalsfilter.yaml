component: SignalsFilter
slug: signalsfilter
source: yaml/LibTempls/Signals/signalsfilter.yaml
kind: Lib
title: Фильтр сигналов
category: Обработка сигналов
summary: Обрабатывает до восьми дискретных причин с отдельными задержками, шунтами и сбросом.
description: 'SignalsFilter заменяет повторяющуюся логику «проверить сигнал, выдержать время, запомнить
  срабатывание». Для каждой причины задаются вход, разрешение контроля и способ сброса. В настройках доступны
  задержка и шунт. Общий out_bQ означает, что сработала хотя бы одна причина, а отдельные выходы объясняют
  какая. Назначение Flt/Wrn/Alm выбирается отдельно: фильтрация сигнала сама по себе не определяет класс
  сообщения и не останавливает оборудование.'
use_cases:
- Несколько дискретных причин требуют отдельных задержек, шунтов и правил сброса.
- Нужны и общий признак срабатывания группы, и понятная причина отдельной строкой.
- Вы собираете собственный контур и хотите назначить аварии, предупреждения и другие сообщения самостоятельно.
not_for:
- 'Нужно преобразовать ток датчика в давление: это Sensor.'
- 'После исчезновения причины нужна отдельная выдержка восстановления: удобнее CondRecCtrl.'
- 'Нужен автоматический останов оборудования от одного факта импорта: связь общего выхода фильтра с механизмом
  задаётся отдельно.'
diagram:
  lanes:
  - - Причина и разрешение
    - 'Задержка + шунт

      отдельно для каждого канала'
    - Фиксация и сброс
    - 'HMI причины

      Flt/Wrn/Alm по настройке'
  - - Сработавшие каналы
    - 'out_bQ

      общий итог'
    - 'HMI группы

      есть срабатывание'
  - - Шунты каналов
    - 'out_bBypass

      контроль отключён'
    - 'HMI диагностики

      есть шунт'
application:
  intro: Для насосной группы заведите причину VFD_FAULT с входом DI_P101_FAULT и текстом «Авария частотного
    преобразователя». Разрешите контроль, оставьте автосброс false и задайте задержку 1 секунду. Неиспользуемые
    идентификаторы каналов 2–8 оставьте пустыми.
  result: Короткий всплеск не создаёт срабатывания; устойчивый сигнал фиксируется. После устранения причины
    нужен сброс. Если это защита, отдельно используйте out_bQ в блокировке механизма; если только уведомление
    — не включайте его в цепь останова.
parameter_groups:
- title: Назовите группу
  intro: 'В примере фильтр обслуживает причины насоса P101. CabinetController_Inst уже должен быть в проекте:
    он предоставляет общий сброс. Название «Аварии» не заменяет выбор категории сообщений.'
  items:
  - key: $SgnlsFltr
    default: Аварии
    example: Аварии
    description: Название типа группы в комментариях, например «Аварии». Эта подпись не назначает класс
      Flt и не связывает фильтр с остановом механизма.
  - key: SgnlsFltrId
    default: _ID_
    example: P101_FAULTS
    description: Уникальное имя группы, например P101_FAULTS. Каждый добавленный фильтр должен иметь свой
      Id; внутри него могут использоваться каналы 1–8.
  - key: SgnlsFltrComment
    default: аварии
    example: Насос P101
    description: Общий понятный контекст сообщений, например «Насос P101». К нему добавляется текст конкретной
      причины.
- title: Подключите первую причину
  intro: Начнём с аварии частотника. Следующие причины задаются аналогичными полями с номерами 2–8; неиспользуемые
    места оставьте пустыми. Ниже показан именно канал 1, а не значения по умолчанию для всех восьми.
  items:
  - key: SgnlsFltrSigId1
    default: _ID_
    example: VFD_FAULT
    description: Имя первой причины, например VFD_FAULT. Для каналов 2–8 используются SgnlsFltrSigId2…SgnlsFltrSigId8.
      Пустой Id исключает канал и его настройки; это штатный способ оставить место неиспользуемым.
  - key: SgnlsFltrSigComment1
    default: авария
    example: Авария частотного преобразователя
    description: Текст первой причины, например «Авария частотного преобразователя». Описывайте состояние
      словами, а не именем DI. У каждого из каналов 1–8 свой текст.
  - key: SgnlsFltrIn1
    default: _DI_
    example: DI_P101_FAULT
    description: Контролируемый BOOL-сигнал или выражение. TRUE означает активную причину. Для нормально
      замкнутого контакта задайте нужную инверсию; остальные каналы подключаются аналогично.
- title: Задайте разрешение и сброс
  intro: Авария ПЧ должна контролироваться постоянно и оставаться до устранения причины и ручного сброса.
    Задержку задайте 1 секунду в настройке этого канала; шунт оставьте false.
  items:
  - key: SgnlsFltrEn1
    default: 'true'
    example: 'true'
    description: Когда проверять эту причину. true — всегда, либо BOOL-условие этапа процесса. Например,
      низкое давление можно контролировать только при работающем насосе. Не является общим разрешением
      всех каналов.
  - key: SgnlsFltrAutoReset1
    default: 'false'
    example: 'false'
    description: true снимает срабатывание после исчезновения причины. false сохраняет его до сброса при
      уже устранённой причине. Для устойчивой аварии обычно false, для текущего предупреждения часто true.
- title: Выберите класс сообщения
  intro: Для этой причины включим Flt, а Wrn и Alm оставим пустыми. Это выражения, переносимые в таблицу
    данных, а не флаги HMI/Conf/Trend 1 или 0. Общий выход фильтра отдельно подключается к нужной блокировке,
    если требуется останов.
  items:
  - key: SgnlsFltrFlt1
    default: ''
    example: 'true'
    description: Условие аварийного сообщения Flt для выхода первого канала. В примере true означает сообщение
      при сработавшем выходе. Пустое поле — не создавать аварийное сообщение; это не настройка фильтрации
      сигнала.
  - key: SgnlsFltrWrn1
    default: ''
    example: ''
    description: 'Условие предупредительного сообщения Wrn. Если причина уже оформлена как Flt и дублирование
      не нужно, оставьте пустым. false не равно пустому полю: это выражение сообщения, не выключенная
      галочка.'
  - key: SgnlsFltrAlm1
    default: ''
    example: ''
    description: Условие сообщения категории Alm. Оставьте пустым, если этот класс не требуется. Категории
      Flt/Wrn/Alm для каждого из восьми каналов выбираются независимо.
example:
  title: Авария ПЧ с задержкой 1 секунда
  scenario: Заполнен канал 1 с Id VFD_FAULT, вход DI_P101_FAULT, разрешение true и автосброс false. В
    настройках _SgnlsFltr_VFD_FAULT_diDelay установлено 1, шунт false. Краткий импульс 0.2 секунды не
    должен фиксироваться; устойчивый сигнал дольше 1 секунды фиксирует причину.
  result: На HMI появится конкретное сообщение «Насос P101. Авария частотного преобразователя», если выбрана
    категория Flt, и включится общий out_bQ. После восстановления DI срабатывание остаётся до общего сброса.
    Если выход должен останавливать насос, передайте out_bQ в предусмотренную аварийную связь Engine —
    имя фильтра само этого не делает.
settings:
- key: …_SgnlsFltr_<SigId>_bBypass
  default: 'false'
  description: Отдельный шунт каждой заполненной причины. true отключает её контроль. Для примера имя
    заканчивается на _SgnlsFltr_VFD_FAULT_bBypass; <SigId> обозначает заданное имя причины, а не буквальный
    текст тега. При любом активном шунте общий out_bBypass сообщает об отключённом контроле.
- key: …_SgnlsFltr_<SigId>_diDelay
  default: '0'
  description: Сколько секунд причина должна непрерывно удерживаться до фиксации. В примере задайте 1.0
    секунду целым значением 1. Краткий сигнал, исчезнувший до конца выдержки, не создаёт срабатывания.
    Настройка создаётся отдельно для каждой заполненной причины; у пустых каналов её нет.
hmi:
- tag: SgnlsFltr.out_bQ
  description: Сработала хотя бы одна контролируемая причина. Это общий итог для индикатора и проектной
    логики. Flt/Wrn/Alm у этой общей строки по умолчанию пустые, чтобы сообщение могло указывать конкретную
    причину.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: SgnlsFltr.out_bBypass
  description: Включён шунт хотя бы одного канала. Оператор должен видеть, что часть диагностики отключена.
    Сам по себе общий индикатор не уточняет, какой именно шунт установлен.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: SgnlsFltr.out_Signal1_bQ … out_Signal8_bQ
  description: Отдельное срабатывание каждого заполненного канала после задержки и с выбранным правилом
    сброса. Строка существует только при непустом Id причины; HMI включено для такой строки. Категории
    задаются параметрами этого канала; изначально они пустые.
  hmi: Для заполненных
  flt: По параметру
  wrn: По параметру
  alm: По параметру
  trend: —
optional_hmi:
- tag: SgnlsFltr.out_SignalN_bQ
  description: При необходимости включите Trend для конкретного уже созданного канала. Не создавайте второй
    тег той же причины только ради другого текста — сначала проверьте выбранные категории сообщения и
    существующую строку.
common_mistakes:
- Считать false в параметре Flt/Wrn/Alm отключением категории. Эти поля содержат условия сообщения; для
  отсутствия категории поле оставляют пустым.
- Заполнить вход канала, но оставить его идентификатор пустым. Такой канал не создаётся и не участвует
  в фильтрации.
- Оставить служебный _ID_ в неиспользуемом первом канале. Если канал не нужен, очистите Id и его значения.
- Ждать сброса при всё ещё активной причине. Сначала устраните условие, затем выполните сброс, если автосброс
  выключен.
- Назвать сигнал «Авария», но не назначить Flt/Wrn/Alm и не связать общий выход с защитой. Имя и подпись
  сами не создают ни сообщение, ни останов.
- Скрыть неисправность шунтом и не показать out_bBypass оператору. Шунт означает, что часть контроля отключена.
