optional_hmi:
- tag: VFD_fManualValue
  description: При необходимости включите Trend у существующей строки, чтобы видеть ручные изменения задания.
    В Auto она отслеживает групповой PID, но не отражает ветку OffValue остановленного двигателя.
common_mistakes:
- Задать GroupId и забыть StartCmd. Общий PID выбирается по GroupId, но команда работы поступает по отдельному
  входу.
- Вместо GroupId указать CasConf или придуманный GroupConf. Настройки общего PID созданы только по Id VfdGroupPidCascade.
- Указать BOOST_Cascade_Inst как Parent. У него нет интерфейса питания и экстренного останова CabinetController/CascadeUnit.
- 'Записывать VFD_fManualValue в Auto и ожидать удержания: код каждый цикл копирует туда выход группы.'
- Считать OffValue = 0.0 электрическим нулём. При шкале 4–20 мА нулевое инженерное задание соответствует
  нижним 4 мА.
- Ожидать, что CasPVErr отключает вручную работающий двигатель. Ошибка снимает работу группы, но этот Unit
  не проверяет её напрямую.
- Считать Local автоматическим отключением расчёта AO. При работающем Engine и режиме, отличном от Manual,
  текущий выбор берёт общий PID; поведение местной аппаратуры согласуется отдельно.
- Объединить OutConf у разных электрических шкал. При общем имени должны совпадать границы и комментарий,
  хотя физический OutRaw у каждого свой.
