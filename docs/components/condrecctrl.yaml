component: CondRecCtrl
slug: condrecctrl
source: yaml/LibTempls/Ctrl/condrecctrl.yaml
kind: Lib
title: Управление с подтверждением
category: Управление сигналами
summary: Контролирует нежелательное условие и выдерживает паузу перед повторным разрешением работы.
description: 'CondRecCtrl нужен, когда после исчезновения причины останова нельзя сразу повторно пускать
  оборудование. Например, после сухого хода нужно дождаться восстановления воды и выдержать паузу. Блок
  отдельно показывает зафиксированную причину, этап восстановления и готовность. Он не управляет двигателем
  напрямую: готовность нужно связать с блокировкой вашего механизма. При отключённом контроле или включённом
  шунте готовность TRUE.'
use_cases:
- После сухого хода, низкого давления или другого запрета нужно выдержать время восстановления перед повторным
  пуском.
- Оператор должен различать активную причину и ожидание восстановления.
not_for:
- 'Достаточно только аварии с задержкой и ручным сбросом: обычно хватает SignalsFilter.'
- 'Нужен непосредственный физический останов: этот компонент выдаёт готовность, которую ещё нужно связать
  с механизмом.'
- 'При отключении контроля объект должен оставаться запрещённым: CondRecCtrl при disable или bypass выдаёт
  готовность TRUE.'
diagram:
  lanes:
  - - Нежелательное условие
    - 'Выдержка причины

      3 секунды'
    - out_bCond
    - 'HMI причины

      Wrn'
  - - Причина исчезла
    - 'Восстановление

      30 секунд'
    - out_bRecovery
    - 'HMI ожидания

      Wrn'
  - - Причина / восстановление
    - 'out_bReady

      готовность'
    - 'Блокировка двигателя

      связать в проекте'
application:
  intro: В CondRecCtrlCond подайте DI_DRY_RUN, в CondRecCtrlEn — true. Установите задержку причины 3 секунды
    и восстановления 30 секунд. В EStopExtra насоса укажите NOT DRYRUN_CondRecCtrl_Inst.out_bReady.
  result: Краткий всплеск не фиксируется. После подтверждённого сухого хода насос блокируется; когда причина
    исчезла, он остаётся заблокированным на время восстановления.
parameter_groups:
- title: Назовите операцию
  intro: Импортируйте компонент и укажите, какую задачу он выполняет. Идентификатор отличает этот экземпляр
    от остальных операций того же типа.
  items:
  - key: $CondRecCtrl
    default: Контроль условия
    example: Контроль условия
    description: Название типа операции в комментариях. Обычно оставляют исходную подпись; на времена
      и условия работы она не влияет.
  - key: CondRecCtrlId
    default: _ID_
    example: DRYRUN
    description: Уникальное имя этой операции, например DRYRUN. По нему создаётся экземпляр DRYRUN_CondRecCtrl_Inst
      и его отдельные теги.
  - key: CondRecCtrlComment
    default: Комментарий
    example: Сухой ход подпиточного насоса
    description: 'Понятное назначение операции: Сухой ход подпиточного насоса. Этот текст используется
      в комментариях настроек и доступных тегов.'
- title: Подключите условие работы
  intro: В CondRecCtrlCond подайте DI_DRY_RUN, в CondRecCtrlEn — true. Установите задержку причины 3 секунды
    и восстановления 30 секунд. В EStopExtra насоса укажите NOT DRYRUN_CondRecCtrl_Inst.out_bReady. Сам
    вход разрешения не настраивает выдержки времени — они задаются отдельно в таблице настроек ниже.
  items:
  - key: CondRecCtrlCond
    default: 'false'
    example: DI_DRY_RUN
    description: Нежелательное условие, после которого нужно восстановление, например DI_DRY_RUN. TRUE
      запускает выдержку причины; после исчезновения условия начинается выдержка восстановления.
  - key: CondRecCtrlEn
    default: 'true'
    example: 'true'
    description: Разрешение контроля. true — проверять причину и восстановление; false — считать объект
      готовым независимо от входа. Это не команда пуска двигателя.
- title: Выберите набор настроек
  intro: Для первого экземпляра оставьте оба поля пустыми. Числа из примера задайте в соответствующих
    настройках после импорта; исходные значения шаблона перечислены ниже отдельно.
  items:
  - key: CondRecCtrlConf
    default: ''
    example: ''
    description: Необязательное имя общего набора настроек. Пусто — настройки по CondRecCtrlId. Общее
      имя задавайте только если все использующие его операции должны иметь одинаковые времена и правила.
  - key: CondRecCtrlConfComment
    default: ''
    example: ''
    description: Название совместно используемых настроек. При пустом поле подпись строится из CondRecCtrlComment
      и названия типа операции.
example:
  title: Сухой ход и выдержка восстановления
  scenario: Вход DI_DRY_RUN активен при отсутствии воды. diCondDelay = 3, diRecoveryDelay = 30. В двигатель
    через предусмотренный параметр EStopExtra передаётся NOT DRYRUN_CondRecCtrl_Inst.out_bReady.
  result: Краткая причина меньше трёх секунд не фиксируется. Подтверждённый сухой ход снимает готовность.
    После исчезновения причины готовность восстановится только после предусмотренной выдержки, пока оператор
    видит предупреждение «Восстановление». Отключённый контроль или шунт обходят эту задержку, поэтому
    их применение должно быть осознанным.
settings:
- key: …_CondRecCtrl_bBypass
  default: 'false'
  description: true отключает этот контроль и выдаёт готовность. Это осознанное шунтирование условия,
    которое необходимо показывать и контролировать при наладке.
- key: …_CondRecCtrl_diCondDelay
  default: '1'
  description: Сколько секунд нежелательное условие должно держаться до фиксации. Короткая причина, исчезнувшая
    раньше, не считается подтверждённой.
- key: …_CondRecCtrl_diRecoveryDelay
  default: '1'
  description: Пауза после исчезновения подтверждённой причины, секунды. Пока она идёт, готовность FALSE
    и повторный пуск по этой готовности не разрешён.
hmi:
- tag: CondRecCtrl.out_bCond
  description: Нежелательное условие подтверждено после задержки. По умолчанию это отдельное предупреждение
    Wrn, а не выбранный отдельный HMI-индикатор.
  hmi: —
  flt: —
  wrn: Да
  alm: —
  trend: —
- tag: CondRecCtrl.out_bRecovery
  description: Причина уже исчезла, но ещё идёт выдержка восстановления. По умолчанию формирует отдельное
    предупреждение Wrn, объясняющее ожидание повторной готовности.
  hmi: —
  flt: —
  wrn: Да
  alm: —
  trend: —
- tag: CondRecCtrl.out_bWarning
  description: Общий признак «есть подтверждённая причина или идёт восстановление». Доступен на HMI для
    общего индикатора; отдельные предупреждения раскрывают этап.
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
- tag: CondRecCtrl.out_bReady
  description: 'По данному контролю работа разрешена: причина и восстановление не блокируют объект. Также
    TRUE при отключённом контроле или включённом шунте. Это не автоматическая команда запуска механизма.'
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi: []
common_mistakes:
- Подать входную причину непосредственно в разрешение пуска вместо использования out_bReady. Тогда выдержка
  восстановления не будет учитываться.
- Считать отключение CondRecCtrlEn запретом оборудования. Наоборот, при отключённом контроле out_bReady
  = TRUE.
- Включить шунт ради исчезновения предупреждения и забыть, что он также разрешает готовность.
- Ожидать останов без связи выхода с механизмом. При необходимости подключите NOT out_bReady в EStopExtra
  или другую предусмотренную проектом блокировку.
