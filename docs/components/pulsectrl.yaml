component: PulseCtrl
slug: pulsectrl
source: yaml/LibTempls/Ctrl/pulsectrl.yaml
kind: Lib
title: Импульсное управление
category: Управление сигналами
summary: Сначала включает механизм импульсами, затем переходит к непрерывной команде.
description: PulseCtrl используют, когда начальную стадию процесса нужно выполнить короткими включениями,
  а затем продолжить постоянно. Например, вибратор сначала осторожно разрыхляет материал импульсами и
  только после этого работает непрерывно. После завершения импульсной стадии TRUE на выходе — нормальное
  состояние, а не зависание. При снятии разрешения выход выключается, следующий запуск снова начинается
  с импульсов.
use_cases:
- Механизм сначала работает короткими включениями, затем должен перейти к непрерывной работе.
- При каждом новом разрешении последовательность должна начинаться с импульсной стадии.
not_for:
- 'Выход должен всегда работать импульсами: используйте Pulse.'
- 'Нужны две разные команды двум механизмам: посмотрите SwitchCtrl.'
- 'Нужно контролировать пускатель или привод: PulseCtrl задаёт последовательность, но не проверяет обратную
  связь.'
diagram:
  lanes:
  - - Разрешение выгрузки
    - 'Импульсная стадия

      1 с работы / цикл 5 с'
    - 'После 30 секунд

      постоянное включение'
  - - 'out_bSignal

      итоговая команда'
    - 'Engine

      отдельный механизм'
    - 'HMI команды

      не обратная связь'
application:
  intro: Вибратор бункера работает 1 секунду каждые 5 секунд первые 30 секунд выгрузки. Затем включается
    постоянно. В PulseCtrlEn подайте bHopperDischarge; в настройках задайте TotalTime = 30, PulseCycle
    = 5, PulseTime = 1.
  result: Выход out_bSignal содержит готовую последовательность. Передайте его в автоматическую команду
    Engine; сам PulseCtrl не контролирует исправность двигателя.
parameter_groups:
- title: Назовите операцию
  intro: Импортируйте компонент и укажите, какую задачу он выполняет. Идентификатор отличает этот экземпляр
    от остальных операций того же типа.
  items:
  - key: $PulseCtrl
    default: Импульсное управление
    example: Импульсное управление
    description: Название типа операции в комментариях. Обычно оставляют исходную подпись; на времена
      и условия работы она не влияет.
  - key: PulseCtrlId
    default: _ID_
    example: VIBRATOR
    description: Уникальное имя этой операции, например VIBRATOR. По нему создаётся экземпляр VIBRATOR_PulseCtrl_Inst
      и его отдельные теги.
  - key: PulseCtrlComment
    default: Комментарий
    example: Последовательность вибратора
    description: 'Понятное назначение операции: Последовательность вибратора. Этот текст используется
      в комментариях настроек и доступных тегов.'
- title: Подключите условие работы
  intro: Вибратор бункера работает 1 секунду каждые 5 секунд первые 30 секунд выгрузки. Затем включается
    постоянно. В PulseCtrlEn подайте bHopperDischarge; в настройках задайте TotalTime = 30, PulseCycle
    = 5, PulseTime = 1. Сам вход разрешения не настраивает выдержки времени — они задаются отдельно в
    таблице настроек ниже.
  items:
  - key: PulseCtrlEn
    default: 'true'
    example: bHopperDischarge
    description: Запрос всей последовательности, например bHopperDischarge. FALSE выключает выход и возвращает
      алгоритм к началу импульсной стадии.
- title: Выберите набор настроек
  intro: Для первого экземпляра оставьте оба поля пустыми. Числа из примера задайте в соответствующих
    настройках после импорта; исходные значения шаблона перечислены ниже отдельно.
  items:
  - key: PulseCtrlConf
    default: ''
    example: ''
    description: Необязательное имя общего набора настроек. Пусто — настройки по PulseCtrlId. Общее имя
      задавайте только если все использующие его операции должны иметь одинаковые времена и правила.
  - key: PulseCtrlConfComment
    default: ''
    example: ''
    description: Название совместно используемых настроек. При пустом поле подпись строится из PulseCtrlComment
      и названия типа операции.
example:
  title: 'Вибратор: 30 секунд импульсов, затем непрерывно'
  scenario: 'TotalTime = 30, PulseCycle = 5, PulseTime = 1: на начальной стадии команда включена одну
    секунду из каждых пяти. После 30 секунд команда держится TRUE.'
  result: Снятие PulseCtrlEn выключает выход. Новый запуск снова начинает импульсную стадию. Для двигателя
    используйте out_bSignal как запрос штатному Engine, а не как замену его режимов и проверок.
settings:
- key: …_PulseCtrl_diTotalTime
  default: '10'
  description: Сколько секунд длится начальная импульсная стадия. После неё выход становится постоянно
    TRUE, пока сохраняется разрешение.
- key: …_PulseCtrl_diPulseCycle
  default: '2'
  description: Полный цикл включения и паузы на начальной стадии, секунды. Например, 5 при импульсе 1
    даёт одну секунду работы и четыре паузы.
- key: …_PulseCtrl_diPulseTime
  default: '1'
  description: Продолжительность включения внутри импульсного цикла, секунды. Подберите вместе с PulseCycle.
hmi:
- tag: PulseCtrl.out_bSignal
  description: 'Готовая команда последовательности: сначала импульсы, затем непрерывное TRUE. Это команда,
    не обратная связь работающего двигателя. По умолчанию выведена на HMI без автоматического аварийного
    сообщения.'
  hmi: Да
  flt: —
  wrn: —
  alm: —
  trend: —
optional_hmi: []
common_mistakes:
- Считать постоянный выход после TotalTime неисправностью. Это запланированная вторая стадия.
- Путать полный PulseCycle с длительностью включения PulseTime. Пауза равна их разности при обычной настройке.
- Оставить разрешение true после завершения технологической операции. Непрерывная команда сохраняется
  до снятия разрешения.
- Ожидать аварии по отсутствию обратной связи. PulseCtrl не знает, включился ли механизм физически.
