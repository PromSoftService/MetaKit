component: ThreeStep
slug: threestep
source: yaml/LibTempls/Regulators/threestep.yaml
kind: Lib
title: Трёхпозиционный регулятор
category: Регуляторы
summary: Даёт команды «Больше», «Меньше» или «Ничего не менять» в зависимости от отклонения измерения.
description: 'ThreeStep предназначен для трёхточечных приводов: открыть, остановиться, закрыть. Если измерение
  далеко ниже уставки, включается увеличение; если далеко выше — уменьшение. В зоне нечувствительности
  обе команды сняты, и привод остаётся на месте. Гистерезис предотвращает частое включение около границы.
  Компонент не заменяет блок клапана: контроль концевиков, реверс и аварии движения нужно обеспечить отдельно.'
use_cases:
- Трёхточечный привод должен увеличивать или уменьшать воздействие при отклонении, а около уставки стоять.
- Для процесса достаточно простой зоны нечувствительности и гистерезиса без настройки PID.
not_for:
- 'Нужно сохранять предыдущее действие между нижним и верхним порогом: это TwoStep.'
- 'Нужно менять длительность импульсов в зависимости от ошибки: рассмотрите PIDD.'
- 'Нужен контроль механики привода: ThreeStep не заменяет Valve и не проверяет концевики.'
diagram:
  lanes:
  - - 'Sensor

      PV и ошибка'
    - 'ThreeStep

      SP, зона, гистерезис'
    - 'Up / Down

      или оба FALSE'
    - 'Valve

      отдельный компонент'
application:
  intro: Для поддержания 3 бар подключите Sensor PT101, задайте ThreeStepSensId = PT101 и ThreeStepInput
    = true. В настройках установите уставку 3.0, зону нечувствительности 0.1 и небольшой гистерезис 0.03
    бар.
  result: 'Вдали от уставки выдаётся команда движения, около 3 бар обе команды выключаются. Ошибка PT101
    запрещает работу регулятора. Не путайте ThreeStepInput с измерением: это переключатель использования
    Sensor, а не значение давления.'
parameter_groups:
- title: Назовите регулятор
  intro: Создайте PIC101 для давления после клапана. Это источник команд «Больше» и «Меньше», а не готовый
    блок управления приводом.
  items:
  - key: $ThreeStep
    default: Трёхпозиционный регулятор
    example: Трёхпозиционный регулятор
    description: Название типа блока в комментариях, обычно «Трёхпозиционный регулятор». Не задаёт механическое
      направление открытия.
  - key: ThreeStepId
    default: _ID_
    example: PIC101
    description: Уникальное имя регулятора, например PIC101. По нему доступны команды PIC101_ThreeStep_Inst.out_bUp
      и out_bDown.
  - key: ThreeStepComment
    default: Комментарий
    example: Давление после клапана
    description: Название регулируемого процесса для комментариев настроек, например «Давление после клапана».
- title: Подключите датчик и разрешение
  intro: Sensor PT101 выдаёт давление в барах. ThreeStepInput = true выбирает этот Sensor; bPressureAuto
    разрешает автоматическое движение. При отключении либо ошибке Sensor оба направления снимаются.
  items:
  - key: ThreeStepSensId
    default: _ID_
    example: PT101
    description: Id существующего Sensor, например PT101. Используется как источник сглаженного измерения
      и его ошибки при ThreeStepInput = true.
  - key: ThreeStepInput
    default: 'true'
    example: 'true'
    description: Точное значение true использует Sensor и проверяет его ошибку. При другом значении шаблон
      подаёт PV = 0.0 и не обращается к Sensor. Это переключатель, а не поле для давления или температуры.
  - key: ThreeStepEnExtra
    default: 'true'
    example: bPressureAuto
    description: Дополнительное разрешение выдавать команды, например bPressureAuto. FALSE снимает оба
      направления. Установите здесь реальное условие автоматического регулирования своего контура.
- title: Выберите набор настроек
  intro: Для отдельного PIC101 оставьте поля пустыми. Ниже задаются уставка 3.0 бар, зона нечувствительности
    0.1 и гистерезис 0.03 бар. Эти числа — пример, а не универсальная наладка всех клапанов.
  items:
  - key: ThreeStepConf
    default: ''
    example: ''
    description: Необязательное имя общих настроек уставки, зоны и гистерезиса. Пусто — настройки по ThreeStepId.
  - key: ThreeStepConfComment
    default: ''
    example: ''
    description: Подпись общего набора настроек. При пустом поле берётся ThreeStepComment и $ThreeStep.
example:
  title: Клапан поддержания 3 бар
  scenario: Sensor PT101 подключён при ThreeStepInput = true. Уставка 3.0 бар, зона 0.1 и гистерезис 0.03.
    При достаточно низком давлении формируется Up, при высоком — Down. Около уставки обе команды выключены,
    и клапан должен стоять.
  result: Передайте направления в отдельный Valve, который проверяет механику привода. При ошибке PT101
    либо снятом ThreeStepEnExtra команды регулятора снимаются. Проверьте, что увеличение открытия действительно
    увеличивает нужное давление — направление зависит от технологической схемы.
settings:
- key: …_ThreeStep_fSP
  default: '0.0'
  description: 'Целевое значение процесса. Например, 3.0 бар: ниже нужно увеличить воздействие, выше —
    уменьшить.'
- key: …_ThreeStep_fDeadband
  default: '0.0'
  description: Зона около уставки, в которой обе команды движения выключены. Выбирайте в единицах процесса,
    например 0.1 бар.
- key: …_ThreeStep_fHysteresis
  default: '0.0'
  description: Разнос порогов включения и снятия команды у края зоны. Уменьшает дребезг; значения должны
    быть неотрицательными и не создавать пересечения рабочих областей.
hmi: []
optional_hmi:
- tag: ThreeStep.out_bUp
  description: Команда увеличения воздействия. Её можно добавить в таблицу данных для HMI-диагностики.
    В зоне покоя она выключена.
- tag: ThreeStep.out_bDown
  description: Команда уменьшения воздействия. Можно вывести отдельно; TRUE не подтверждает, что привод
    физически движется.
common_mistakes:
- Принять ThreeStepInput за числовое измерение. Это переключатель использования Sensor; давление задаётся
  через выбранный Sensor.
- Отключить ThreeStepInput, ожидая запрета регулятора. В этом случае PV станет 0.0; для запрета используйте
  ThreeStepEnExtra = false.
- Ожидать импульсную модуляцию как у PIDD. ThreeStep выдаёт направления по зоне и гистерезису.
- Задать отрицательные или конфликтующие зону и гистерезис. Проверяйте, что области управления не перекрываются
  нежелательным образом.
- Передать команды напрямую физическому клапану без учёта концевиков и реверса. Регулятор не проверяет
  механику.
