- tag: PIDD.out_bUp
  description: Можно добавить диагностическую строку запроса увеличения. В штатной таблице данных Unit отдельный
    тег PIDD не выведен; это запрос регулятора, а не подтверждение движения.
- tag: PIDD.out_bDown
  description: Можно добавить строку запроса уменьшения. Для сообщений назначьте понятный текст и нужную
    категорию, не считайте каждое штатное регулирующее движение аварией.
common_mistakes:
- Считать StartCmd прямой командой полного открытия/закрытия. Здесь он разрешает импульсное регулирование;
  при false PIDD выключается, а не закрывает клапан до конца.
- Ожидать, что Manual сбрасывает или отключает внутренний PIDD. Manual переключает команды CValve на HMI,
  но его режим не включён в разрешение CPIDD.
- Считать ошибку Sensor экстренным остановом ручного клапана. В этом Unit она запрещает автоматическое управление,
  а Manual подчиняется отдельным защитам CValve.
- Подключить выходы PIDD напрямую к физическому приводу, минуя уже встроенный CValve. Так потеряются предусмотренные
  режимы и проверки.
- Считать CascadeUnit.out_bState концевиком полного открытия. Это готовность Auto вместе с запросом работы;
  положение показывает Valve.out_iState.
- Оставить шунт контроля полного хода включённым и ожидать аварии незавершённого движения. Сначала согласуйте
  настройки с реальным приводом.
