common_mistakes:
- Подать краткий импульс StartCmd вместо удерживаемого запроса. После снятия команды в Auto начнётся закрытие.
- Считать CascadeUnit.out_bState подтверждением полного открытия. Здесь это готовность к Auto вместе с запросом
  работы; реальное положение смотрят по Valve.out_iState и концевикам.
- Ожидать контроля времени хода с исходным bFullTimeCtrlBypass = true. Сначала задайте реальное diFullTime,
  затем включите контроль.
- Считать внешний аварийный перевод гарантией закрытия при EStop или потере питания. В этих условиях обе
  команды снимаются.
- Путать направления выходов и концевиков или подавать оба концевика одновременно.
- Оставить Id неиспользуемых аварийных каналов заполненными шаблонными значениями. Пустой Id — штатное исключение
  канала.
